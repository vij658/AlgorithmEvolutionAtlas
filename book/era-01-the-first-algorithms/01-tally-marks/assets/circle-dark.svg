<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 324" width="900" height="324" role="img" aria-label="The tally then and the log now: the same three moves" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>The tally then and the log now: the same three moves</title><line x1="380.0" y1="92.0" x2="520.0" y2="92.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="520.0,92.0 511.8,95.7 511.8,88.3" style="fill:#b9b8b2"/><rect x="413.7" y="71.0" width="72.7" height="19" rx="3" style="fill:#0d1117"/><text x="450.0" y="84.0" text-anchor="middle" style="fill:#ecebe6;font-size:12.5px;font-weight:600">same move</text><line x1="380.0" y1="182.0" x2="520.0" y2="182.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="520.0,182.0 511.8,185.7 511.8,178.3" style="fill:#b9b8b2"/><rect x="413.7" y="161.0" width="72.7" height="19" rx="3" style="fill:#0d1117"/><text x="450.0" y="174.0" text-anchor="middle" style="fill:#ecebe6;font-size:12.5px;font-weight:600">same move</text><line x1="380.0" y1="272.0" x2="520.0" y2="272.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="520.0,272.0 511.8,275.7 511.8,268.3" style="fill:#b9b8b2"/><rect x="413.7" y="251.0" width="72.7" height="19" rx="3" style="fill:#0d1117"/><text x="450.0" y="264.0" text-anchor="middle" style="fill:#ecebe6;font-size:12.5px;font-weight:600">same move</text><rect x="20" y="60" width="360" height="64" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="32.0" y="96.5" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">Cut a notch for each sheep</text><rect x="520" y="60" width="360" height="64" style="fill:#0d1117;stroke:#5b8fe0;stroke-width:3"/><text x="532.0" y="96.5" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">Append a record for each event</text><rect x="20" y="150" width="360" height="64" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="32.0" y="186.5" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">Count the notches to know how many</text><rect x="520" y="150" width="360" height="64" style="fill:#0d1117;stroke:#5b8fe0;stroke-width:3"/><text x="532.0" y="186.5" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">Replay the log to rebuild the state</text><rect x="20" y="240" width="360" height="64" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="32.0" y="276.5" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">Lay stock and foil side by side</text><rect x="520" y="240" width="360" height="64" style="fill:#0d1117;stroke:#5b8fe0;stroke-width:3"/><text x="532.0" y="276.5" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">Compare the copies two parties keep</text><text x="20.0" y="36.0" text-anchor="start" style="fill:#8f8e96;font-size:11px;font-weight:700;letter-spacing:.08em">THEN: THE TALLY</text><text x="520.0" y="36.0" text-anchor="start" style="fill:#8f8e96;font-size:11px;font-weight:700;letter-spacing:.08em">NOW: THE LOG</text></svg>
