<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" role="img" aria-label="How tally marks combined with other ideas, from pairing things off to append-only logs" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>How tally marks combined with other ideas, from pairing things off to append-only logs</title><line x1="500.0" y1="96.0" x2="500.0" y2="165.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="500.0,165.0 496.3,156.8 503.7,156.8" style="fill:#55545a"/><line x1="605.0" y1="58.0" x2="865.0" y2="165.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="865.0,165.0 856.0,165.3 858.8,158.5" style="fill:#55545a"/><line x1="500.0" y1="241.0" x2="135.0" y2="320.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="135.0,320.0 142.3,314.7 143.8,321.8" style="fill:#55545a"/><line x1="500.0" y1="241.0" x2="500.0" y2="320.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="500.0,320.0 496.3,311.8 503.7,311.8" style="fill:#55545a"/><line x1="500.0" y1="241.0" x2="865.0" y2="320.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="865.0,320.0 856.2,321.8 857.7,314.7" style="fill:#55545a"/><rect x="395" y="20" width="210" height="76" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="407.0" y="55.2" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Pairing things off</text><text x="407.0" y="72.4" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">one from each pile</text><rect x="395" y="165" width="210" height="76" style="fill:#ffffff;stroke:#d5352a;stroke-width:3"/><text x="407.0" y="191.9" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Tally marks</text><text x="407.0" y="209.2" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">⊕ a mark that lasts</text><text x="407.0" y="225.7" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">c. 44,000 years ago</text><rect x="760" y="165" width="210" height="76" style="fill:#ffffff;stroke:#1f5ba8;stroke-width:3"/><text x="772.0" y="191.9" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Sizes of infinite sets</text><text x="772.0" y="209.2" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">⊕ infinite collections</text><text x="772.0" y="225.7" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">Cantor, 1878</text><rect x="30" y="320" width="210" height="76" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="42.0" y="346.9" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Grouped numerals</text><text x="42.0" y="364.2" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">⊕ bundles of marks</text><text x="42.0" y="380.7" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">topic 2, c. 3000 BCE</text><rect x="395" y="320" width="210" height="76" style="fill:#ffffff;stroke:#1f5ba8;stroke-width:3"/><text x="407.0" y="346.9" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Split tally stick</text><text x="407.0" y="364.2" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">⊕ two halves must match</text><text x="407.0" y="380.7" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">English Exchequer, to 1826</text><rect x="760" y="320" width="210" height="76" style="fill:#ffffff;stroke:#d5352a;stroke-width:3"/><text x="772.0" y="346.9" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Append-only log</text><text x="772.0" y="364.2" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">⊕ replay to rebuild</text><text x="772.0" y="380.7" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">databases and data streams</text></svg>
