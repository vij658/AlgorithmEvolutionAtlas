<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="1000" height="340" role="img" aria-label="Four readings of the same notches; none is proven" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>Four readings of the same notches; none is proven</title><line x1="500.0" y1="104.0" x2="132.5" y2="200.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="132.5,200.0 139.5,194.4 141.4,201.5" style="fill:#55545a"/><line x1="500.0" y1="104.0" x2="377.5" y2="200.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="377.5,200.0 381.7,192.0 386.2,197.8" style="fill:#55545a"/><line x1="500.0" y1="104.0" x2="622.5" y2="200.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="622.5,200.0 613.8,197.8 618.3,192.0" style="fill:#55545a"/><line x1="500.0" y1="104.0" x2="867.5" y2="200.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="867.5,200.0 858.6,201.5 860.5,194.4" style="fill:#55545a"/><rect x="330" y="20" width="340" height="84" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="342.0" y="50.9" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">The marks</text><text x="342.0" y="68.2" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">168 notches in 3 columns: 60, 48, 60</text><text x="342.0" y="84.7" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">documented: the holding museum</text><rect x="20" y="200" width="225" height="84" style="fill:#ffffff;stroke:#1f5ba8;stroke-width:3"/><text x="32.0" y="230.9" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Just a record</text><text x="32.0" y="248.2" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">matching, no arithmetic</text><text x="32.0" y="264.6" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">Keller, 2010</text><rect x="265" y="200" width="225" height="84" style="fill:#ffffff;stroke:#1f5ba8;stroke-width:3"/><text x="277.0" y="230.9" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Arithmetic</text><text x="277.0" y="248.2" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">primes, doubling, tens</text><text x="277.0" y="264.6" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">de Heinzelin, 1962</text><rect x="510" y="200" width="225" height="84" style="fill:#ffffff;stroke:#1f5ba8;stroke-width:3"/><text x="522.0" y="230.9" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">A moon calendar</text><text x="522.0" y="248.2" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">about 5½ months of phases</text><text x="522.0" y="264.6" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">Marshack, 1972</text><rect x="755" y="200" width="225" height="84" style="fill:#ffffff;stroke:#1f5ba8;stroke-width:3"/><text x="767.0" y="230.9" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Counting in twelves</text><text x="767.0" y="248.2" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">60 and 48 are multiples of 12</text><text x="767.0" y="264.6" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">Pletser and Huylebrouck</text><text x="500.0" y="318.0" text-anchor="middle" style="fill:#7d7c84;font-size:11px;font-weight:700;letter-spacing:.08em">FOUR READINGS: EACH A CONJECTURE, TOGETHER DISPUTED</text></svg>
