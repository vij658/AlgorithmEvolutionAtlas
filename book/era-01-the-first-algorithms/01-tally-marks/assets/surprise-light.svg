e-width:1.5"/><text x="262.0" y="53.7" text-anchor="start" style="fill:#7d7c84;font-size:11px;font-weight:700;letter-spacing:.08em">THE ASSUMPTION</text><text x="262.0" y="69.8" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">Every group is equally likely to be any size from 3 to 21</text><rect x="20" y="170" width="300" height="96" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="32.0" y="214.2" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">Column G: all prime, total a multiple of 12</text><text x="32.0" y="230.8" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">403 of 130,321 columns</text><rect x="350" y="170" width="300" height="96" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="362.0" y="206.0" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">Column M: 3 doubling pairs, total a multiple</text><text x="362.0" y="222.5" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">of 12</text><text x="362.0" y="239.0" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">5,521,624 of 16,983,563,041 columns</text><rect x="680" y="170" width="300" height="96" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="692.0" y="206.0" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">Column D: all one from 10 or 20, total a</text><text x="692.0" y="222.5" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">multiple of 12</text><text x="692.0" y="239.0" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">70 of 130,321 columns</text><rect x="140" y="360" width="320" height="96" style="fill:#ffffff;stroke:#d5352a;stroke-width:3"/><text x="152.0" y="402.1" text-anchor="start" style="fill:#7d7c84;font-size:11px;font-weight:700;letter-spacing:.08em">ALL THREE AT ONCE, AS ON THE BONE</text><text x="152.0" y="420.7" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">about 1 in 926,477,557 random bones</text><rect x="540" y="360" width="320" height="96" style="fill:#ffffff;stroke:#1f5ba8;stroke-width:3"/><text x="552.0" y="402.1" text-anchor="start" style="fill:#7d7c84;font-size:11px;font-weight:700;letter-spacing:.08em">AT LEAST ONE PATTERN SOMEWHERE</text><text x="552.0" y="420.7" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">26.1% of random bones</text><text x="500.0" y="488.0" text-anchor="middle" style="fill:#7d7c84;font-size:11px;font-weight:700;letter-spacing:.08em">SOLID: ALL THREE MUST HOLD · DASHED: ANY ONE OF THE PATTERNS IS ENOUGH</text></svg>
