<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 170" width="980" height="170" role="img" aria-label="9,999 + 1: one carry ripples through four exchanges" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>9,999 + 1: one carry ripples through four exchanges</title><line x1="170.0" y1="78.0" x2="212.0" y2="78.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="212.0,78.0 203.8,81.7 203.8,74.3" style="fill:#55545a"/><line x1="362.0" y1="78.0" x2="404.0" y2="78.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="404.0,78.0 395.8,81.7 395.8,74.3" style="fill:#55545a"/><line x1="554.0" y1="78.0" x2="596.0" y2="78.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="596.0,78.0 587.8,81.7 587.8,74.3" style="fill:#55545a"/><line x1="746.0" y1="78.0" x2="788.0" y2="78.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="788.0,78.0 779.8,81.7 779.8,74.3" style="fill:#55545a"/><rect x="20" y="40" width="150" height="76" style="fill:#ffffff;stroke:#d5352a;stroke-width:3"/><text x="32.0" y="75.2" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">10 ones</text><text x="32.0" y="92.4" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">become 1 of the tens</text><rect x="212" y="40" width="150" height="76" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="224.0" y="66.9" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">10 tens</text><text x="224.0" y="84.2" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">become 1 of the</text><text x="224.0" y="100.7" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">hundreds</text><rect x="404" y="40" width="150" height="76" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="416.0" y="66.9" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">10 hundreds</text><text x="416.0" y="84.2" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">become 1 of the</text><text x="416.0" y="100.7" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">thousands</text><rect x="596" y="40" width="150" height="76" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="608.0" y="66.9" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">10 thousands</text><text x="608.0" y="84.2" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">become 1 of the</text><text x="608.0" y="100.7" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">ten-thousands</text><rect x="788" y="40" width="150" height="76" style="fill:#ffffff;stroke:#1f5ba8;stroke-width:3"/><text x="800.0" y="77.7" text-anchor="start" style="fill:#17171a;font-size:22px;font-weight:700">10,000</text><text x="800.0" y="97.0" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">one sign</text><text x="20.0" y="22.0" text-anchor="start" style="fill:#7d7c84;font-size:11px;font-weight:700;letter-spacing:.08em">9,999 + 1, POOLED: TEN ONES</text><text x="20.0" y="150.0" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">Each exchange makes the next one necessary. This is the carry that a computer&#x27;s adder must pass along too.</text></svg>
