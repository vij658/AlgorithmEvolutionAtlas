<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" role="img" aria-label="Where did written numbers come from? Two accounts" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>Where did written numbers come from? Two accounts</title><line x1="230.0" y1="76.0" x2="265.0" y2="76.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="265.0,76.0 256.8,79.7 256.8,72.3" style="fill:#55545a"/><line x1="475.0" y1="76.0" x2="510.0" y2="76.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="510.0,76.0 501.8,79.7 501.8,72.3" style="fill:#55545a"/><line x1="720.0" y1="76.0" x2="755.0" y2="76.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="755.0,76.0 746.8,79.7 746.8,72.3" style="fill:#55545a"/><line x1="320.0" y1="224.0" x2="600.0" y2="258.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="600.0,258.0 591.4,260.7 592.3,253.4" style="fill:#55545a"/><line x1="320.0" y1="292.0" x2="600.0" y2="258.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="600.0,258.0 592.3,262.6 591.4,255.3" style="fill:#55545a"/><rect x="20" y="44" width="210" height="64" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="32.0" y="80.5" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">Plain clay tokens</text><rect x="265" y="44" width="210" height="64" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="277.0" y="72.2" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">Tokens sealed in clay</text><text x="277.0" y="88.8" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">envelopes</text><rect x="510" y="44" width="210" height="64" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="522.0" y="72.2" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">Token shapes pressed into</text><text x="522.0" y="88.8" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">tablets</text><rect x="755" y="44" width="210" height="64" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="767.0" y="80.5" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">Number signs, then writing</text><rect x="20" y="196" width="300" height="56" style="fill:#ffffff;stroke:#1f5ba8;stroke-width:3"/><text x="32.0" y="228.5" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">Number signs</text><rect x="20" y="264" width="300" height="56" style="fill:#ffffff;stroke:#1f5ba8;stroke-width:3"/><text x="32.0" y="296.5" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">Proto-cuneiform word signs</text><rect x="600" y="223" width="340" height="70" style="fill:#ffffff;stroke:#d5352a;stroke-width:3"/><text x="612.0" y="254.2" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">Accounts that use both</text><text x="612.0" y="270.8" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">Uruk, c. 3200–3000 BCE</text><text x="20.0" y="30.0" text-anchor="start" style="fill:#7d7c84;font-size:11px;font-weight:700;letter-spacing:.08em">SCHMANDT-BESSERAT: ONE LINE OF DESCENT</text><text x="20.0" y="178.0" text-anchor="start" style="fill:#7d7c84;font-size:11px;font-weight:700;letter-spacing:.08em">VALERIO AND FERRARA (2022): TWO DEVELOPMENTS THAT CONVERGE</text></svg>
