<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" role="img" aria-label="How grouped numerals combined with other ideas, from tally marks to the carry inside a computer" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>How grouped numerals combined with other ideas, from tally marks to the carry inside a computer</title><line x1="234.1" y1="96.0" x2="400.9" y2="160.0" style="stroke:#55545a;stroke-width:1.5;stroke-dasharray:5 4"/><polygon points="400.9,160.0 391.9,160.5 394.6,153.6" style="fill:#55545a"/><line x1="500.0" y1="96.0" x2="500.0" y2="160.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="500.0,160.0 496.3,151.8 503.7,151.8" style="fill:#55545a"/><line x1="500.0" y1="236.0" x2="285.0" y2="300.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="285.0,300.0 291.8,294.1 293.9,301.2" style="fill:#55545a"/><line x1="500.0" y1="236.0" x2="715.0" y2="300.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="715.0,300.0 706.1,301.2 708.2,294.1" style="fill:#55545a"/><line x1="285.0" y1="376.0" x2="500.0" y2="430.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="500.0,430.0 491.1,431.6 492.9,424.4" style="fill:#55545a"/><line x1="715.0" y1="376.0" x2="500.0" y2="430.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="500.0,430.0 507.1,424.4 508.9,431.6" style="fill:#55545a"/><line x1="500.0" y1="506.0" x2="285.0" y2="550.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="285.0,550.0 292.3,544.8 293.8,551.9" style="fill:#55545a"/><line x1="390.0" y1="588.0" x2="610.0" y2="588.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="610.0,588.0 601.8,591.7 601.8,584.3" style="fill:#55545a"/><rect x="30" y="20" width="210" height="76" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="42.0" y="55.2" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Clay tokens</text><text x="42.0" y="72.4" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">from c. 7500 BCE</text><rect x="395" y="20" width="210" height="76" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="407.0" y="55.2" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Tally marks</text><text x="407.0" y="72.4" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">topic 1</text><rect x="395" y="160" width="210" height="76" style="fill:#ffffff;stroke:#d5352a;stroke-width:3"/><text x="407.0" y="186.9" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">A sign for each bundle</text><text x="407.0" y="204.2" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">⊕ bundles get names</text><text x="407.0" y="220.7" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">Egypt and Sumer, c. 3000 BCE</text><rect x="180" y="300" width="210" height="76" style="fill:#ffffff;stroke:#d5352a;stroke-width:3"/><text x="192.0" y="326.9" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Pool and exchange</text><text x="192.0" y="344.2" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">⊕ an exchange rate</text><text x="192.0" y="360.7" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">the first carry</text><rect x="610" y="300" width="210" height="76" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="622.0" y="326.9" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Place value</text><text x="622.0" y="344.2" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">⊕ position names the bundle</text><text x="622.0" y="360.7" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">topic 3</text><rect x="395" y="430" width="210" height="76" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="407.0" y="465.2" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Column addition</text><text x="407.0" y="482.4" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">⊕ carry into the next column</text><rect x="180" y="550" width="210" height="76" style="fill:#ffffff;stroke:#1f5ba8;stroke-width:3"/><text x="192.0" y="576.9" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Electronic adder</text><text x="192.0" y="594.1" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">⊕ switches</text><text x="192.0" y="610.6" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">designed 1946</text><rect x="610" y="550" width="210" height="76" style="fill:#ffffff;stroke:#1f5ba8;stroke-width:3"/><text x="622.0" y="576.9" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">How far carries run</text><text x="622.0" y="594.1" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">⊕ probability</text><text x="622.0" y="610.6" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">1946; Holte, 1997</text></svg>
