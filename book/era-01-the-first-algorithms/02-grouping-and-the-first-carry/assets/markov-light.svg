<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280" role="img" aria-label="Carries as a two-state chain: with or without a carry coming in" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>Carries as a two-state chain: with or without a carry coming in</title><line x1="320.0" y1="120.0" x2="580.0" y2="120.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="580.0,120.0 571.8,123.7 571.8,116.3" style="fill:#55545a"/><rect x="389.7" y="99.0" width="120.6" height="19" rx="3" style="fill:#ffffff"/><text x="450.0" y="112.0" text-anchor="middle" style="fill:#17171a;font-size:12.5px;font-weight:600">a carry: 45 in 100</text><line x1="580.0" y1="160.0" x2="320.0" y2="160.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="320.0,160.0 328.2,156.3 328.2,163.7" style="fill:#55545a"/><rect x="386.0" y="167.0" width="128.0" height="19" rx="3" style="fill:#ffffff"/><text x="450.0" y="180.0" text-anchor="middle" style="fill:#17171a;font-size:12.5px;font-weight:600">no carry: 45 in 100</text><rect x="60" y="90" width="260" height="100" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="72.0" y="127.5" text-anchor="start" style="fill:#7d7c84;font-size:11px;font-weight:700;letter-spacing:.08em">NO CARRY COMING IN</text><text x="72.0" y="143.5" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">45 of 100 digit pairs pass one on</text><text x="72.0" y="160.0" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">55 of 100 do not</text><rect x="580" y="90" width="260" height="100" style="fill:#ffffff;stroke:#d5352a;stroke-width:3"/><text x="592.0" y="127.5" text-anchor="start" style="fill:#7d7c84;font-size:11px;font-weight:700;letter-spacing:.08em">A CARRY COMING IN</text><text x="592.0" y="143.5" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">55 of 100 digit pairs pass one on</text><text x="592.0" y="160.0" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">45 of 100 do not</text><text x="450.0" y="40.0" text-anchor="middle" style="fill:#7d7c84;font-size:11px;font-weight:700;letter-spacing:.08em">THE NEXT COLUMN DEPENDS ONLY ON THIS ONE</text><text x="450.0" y="250.0" text-anchor="middle" style="fill:#55545a;font-size:12.5px;font-weight:400">Leaving each state is equally likely (45 in 100), so in the long run half of all columns carry.</text></svg>
