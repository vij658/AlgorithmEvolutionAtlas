<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 526" width="960" height="526" role="img" aria-label="Each fix leaves a new pain: from too many signs to the missing zero" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>Each fix leaves a new pain: from too many signs to the missing zero</title><line x1="400.0" y1="62.0" x2="560.0" y2="62.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="560.0,62.0 551.8,65.7 551.8,58.3" style="fill:#55545a"/><rect x="449.2" y="41.0" width="61.6" height="19" rx="3" style="fill:#ffffff"/><text x="480.0" y="54.0" text-anchor="middle" style="fill:#17171a;font-size:12.5px;font-weight:600">fixed by</text><line x1="750.0" y1="104.0" x2="750.0" y2="154.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="750.0,154.0 746.3,145.8 753.7,145.8" style="fill:#55545a"/><rect x="757.0" y="121.0" width="175.9" height="19" rx="3" style="fill:#ffffff"/><text x="762.0" y="134.0" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">which leaves a new problem</text><line x1="560.0" y1="196.0" x2="400.0" y2="196.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="400.0,196.0 408.2,192.3 408.2,199.7" style="fill:#55545a"/><rect x="449.2" y="175.0" width="61.6" height="19" rx="3" style="fill:#ffffff"/><text x="480.0" y="188.0" text-anchor="middle" style="fill:#17171a;font-size:12.5px;font-weight:600">fixed by</text><line x1="210.0" y1="238.0" x2="210.0" y2="288.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="210.0,288.0 206.3,279.8 213.7,279.8" style="fill:#55545a"/><line x1="400.0" y1="330.0" x2="560.0" y2="330.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="560.0,330.0 551.8,333.7 551.8,326.3" style="fill:#55545a"/><rect x="449.2" y="309.0" width="61.6" height="19" rx="3" style="fill:#ffffff"/><text x="480.0" y="322.0" text-anchor="middle" style="fill:#17171a;font-size:12.5px;font-weight:600">fixed by</text><line x1="750.0" y1="372.0" x2="750.0" y2="422.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="750.0,422.0 746.3,413.8 753.7,413.8" style="fill:#55545a"/><line x1="560.0" y1="464.0" x2="400.0" y2="464.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="400.0,464.0 408.2,460.3 408.2,467.7" style="fill:#55545a"/><rect x="449.2" y="443.0" width="61.6" height="19" rx="3" style="fill:#ffffff"/><text x="480.0" y="456.0" text-anchor="middle" style="fill:#17171a;font-size:12.5px;font-weight:600">fixed by</text><rect x="20" y="20" width="380" height="84" style="fill:#ffffff;stroke:#d5352a;stroke-width:3"/><text x="32.0" y="49.5" text-anchor="start" style="fill:#7d7c84;font-size:11px;font-weight:700;letter-spacing:.08em">WHAT HURT</text><text x="32.0" y="65.5" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">Every power needs its own sign: 9,999 takes 36 Egyptian</text><text x="32.0" y="82.0" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">signs</text><rect x="560" y="20" width="380" height="84" style="fill:#ffffff;stroke:#1f5ba8;stroke-width:3"/><text x="572.0" y="41.2" text-anchor="start" style="fill:#7d7c84;font-size:11px;font-weight:700;letter-spacing:.08em">THE FIX</text><text x="572.0" y="57.3" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">Let position name the bundle: 9,999 is 2,46,39, 24 wedges</text><text x="572.0" y="73.8" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">of two kinds</text><text x="572.0" y="90.3" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">probably c. 2100 BCE</text><rect x="560" y="154" width="380" height="84" style="fill:#ffffff;stroke:#d5352a;stroke-width:3"/><text x="572.0" y="191.7" text-anchor="start" style="fill:#7d7c84;font-size:11px;font-weight:700;letter-spacing:.08em">WHAT HURT</text><text x="572.0" y="207.8" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">Dividing piles of signs is slow and error-prone</text><rect x="20" y="154" width="380" height="84" style="fill:#ffffff;stroke:#1f5ba8;stroke-width:3"/><text x="32.0" y="183.5" text-anchor="start" style="fill:#7d7c84;font-size:11px;font-weight:700;letter-spacing:.08em">THE FIX</text><text x="32.0" y="199.5" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">Divide by multiplying with a reciprocal from a table</text><text x="32.0" y="216.0" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">school tables, c. 1800 BCE</text><rect x="20" y="288" width="380" height="84" style="fill:#ffffff;stroke:#d5352a;stroke-width:3"/><text x="32.0" y="317.5" text-anchor="start" style="fill:#7d7c84;font-size:11px;font-weight:700;letter-spacing:.08em">WHAT HURT</text><text x="32.0" y="333.5" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">Only some numbers have reciprocals that end: 1/7 =</text><text x="32.0" y="350.0" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">0;8,34,17, ... forever</text><rect x="560" y="288" width="380" height="84" style="fill:#ffffff;stroke:#1f5ba8;stroke-width:3"/><text x="572.0" y="317.5" text-anchor="start" style="fill:#7d7c84;font-size:11px;font-weight:700;letter-spacing:.08em">THE FIX</text><text x="572.0" y="333.5" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">Work with regular numbers, and approximate the rest</text><text x="572.0" y="350.0" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">topic 4</text><rect x="560" y="422" width="380" height="84" style="fill:#ffffff;stroke:#d5352a;stroke-width:3"/><text x="572.0" y="459.7" text-anchor="start" style="fill:#7d7c84;font-size:11px;font-weight:700;letter-spacing:.08em">WHAT HURT</text><text x="572.0" y="475.8" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">No zero and no point: 61 and 3,601 look the same</text><rect x="20" y="422" width="380" height="84" style="fill:#ffffff;stroke:#1f5ba8;stroke-width:3"/><text x="32.0" y="451.5" text-anchor="start" style="fill:#7d7c84;font-size:11px;font-weight:700;letter-spacing:.08em">THE FIX</text><text x="32.0" y="467.5" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">A sign for an empty place, then zero</text><text x="32.0" y="484.0" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">later Babylonian; era 2</text></svg>
