<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" role="img" aria-label="How place value combined with other ideas, from grouped signs to compilers that divide by multiplying" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>How place value combined with other ideas, from grouped signs to compilers that divide by multiplying</title><line x1="305.0" y1="96.0" x2="500.0" y2="150.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="500.0,150.0 491.1,151.3 493.1,144.3" style="fill:#b9b8b2"/><line x1="695.0" y1="96.0" x2="500.0" y2="150.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="500.0,150.0 506.9,144.3 508.9,151.3" style="fill:#b9b8b2"/><line x1="500.0" y1="226.0" x2="285.0" y2="290.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="285.0,290.0 291.8,284.1 293.9,291.2" style="fill:#b9b8b2"/><line x1="500.0" y1="226.0" x2="715.0" y2="290.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="715.0,290.0 706.1,291.2 708.2,284.1" style="fill:#b9b8b2"/><line x1="285.0" y1="366.0" x2="285.0" y2="420.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="285.0,420.0 281.3,411.8 288.7,411.8" style="fill:#b9b8b2"/><line x1="285.0" y1="496.0" x2="285.0" y2="540.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="285.0,540.0 281.3,531.8 288.7,531.8" style="fill:#b9b8b2"/><line x1="605.0" y1="188.0" x2="715.0" y2="420.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="715.0,420.0 708.2,414.1 714.8,411.0" style="fill:#b9b8b2"/><line x1="715.0" y1="496.0" x2="715.0" y2="540.0" style="stroke:#b9b8b2;stroke-width:1.5;stroke-dasharray:5 4"/><polygon points="715.0,540.0 711.3,531.8 718.7,531.8" style="fill:#b9b8b2"/><rect x="200" y="20" width="210" height="76" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="212.0" y="55.2" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Grouped signs</text><text x="212.0" y="72.4" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">topic 2</text><rect x="590" y="20" width="210" height="76" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="602.0" y="55.2" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">The 10-and-6 ladder</text><text x="602.0" y="72.4" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">Sumer, topic 2</text><rect x="395" y="150" width="210" height="76" style="fill:#0d1117;stroke:#f0584d;stroke-width:3"/><text x="407.0" y="176.9" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Place value, base 60</text><text x="407.0" y="194.2" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">⊕ position names the bundle</text><text x="407.0" y="210.7" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">probably c. 2100 BCE</text><rect x="180" y="290" width="210" height="76" style="fill:#0d1117;stroke:#f0584d;stroke-width:3"/><text x="192.0" y="316.9" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Reciprocal tables</text><text x="192.0" y="334.2" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">⊕ work out 1/n in advance</text><text x="192.0" y="350.7" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">school tablets, c. 1800 BCE</text><rect x="610" y="290" width="210" height="76" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="622.0" y="316.9" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">√2 to three places</text><text x="622.0" y="334.2" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">⊕ approximation</text><text x="622.0" y="350.7" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">topic 4</text><rect x="180" y="420" width="210" height="76" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="192.0" y="446.9" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Division as multiplication</text><text x="192.0" y="464.2" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">⊕ look up, then multiply</text><text x="192.0" y="480.7" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">a / b = a × 1/b</text><rect x="610" y="420" width="210" height="76" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="622.0" y="446.9" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">A sign for nothing</text><text x="622.0" y="464.2" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">⊕ zero in empty places</text><text x="622.0" y="480.7" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">later Babylonian; era 2</text><rect x="180" y="540" width="210" height="76" style="fill:#0d1117;stroke:#5b8fe0;stroke-width:3"/><text x="192.0" y="566.9" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Compiler division</text><text x="192.0" y="584.1" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">⊕ binary: multiply, then shift</text><text x="192.0" y="600.6" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">Granlund and Montgomery, 1994</text><rect x="610" y="540" width="210" height="76" style="fill:#0d1117;stroke:#5b8fe0;stroke-width:3"/><text x="622.0" y="575.1" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Minutes and seconds</text><text x="622.0" y="592.4" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">base 60, still on every clock</text></svg>
