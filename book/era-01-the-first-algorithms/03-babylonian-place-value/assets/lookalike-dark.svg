<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" width="1000" height="250" role="img" aria-label="Without zero or point, different numbers look the same" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>Without zero or point, different numbers look the same</title><line x1="220.0" y1="60.0" x2="380.0" y2="130.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="380.0,130.0 371.0,130.1 373.9,123.3" style="fill:#b9b8b2"/><line x1="220.0" y1="130.0" x2="380.0" y2="130.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="380.0,130.0 371.8,133.7 371.8,126.3" style="fill:#b9b8b2"/><line x1="220.0" y1="200.0" x2="380.0" y2="130.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="380.0,130.0 373.9,136.7 371.0,129.9" style="fill:#b9b8b2"/><rect x="20" y="30" width="200" height="60" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="32.0" y="59.7" text-anchor="start" style="fill:#ecebe6;font-size:22px;font-weight:700">1</text><text x="32.0" y="79.0" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">one</text><rect x="20" y="100" width="200" height="60" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="32.0" y="129.7" text-anchor="start" style="fill:#ecebe6;font-size:22px;font-weight:700">1,0</text><text x="32.0" y="149.0" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">sixty</text><rect x="20" y="170" width="200" height="60" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="32.0" y="199.7" text-anchor="start" style="fill:#ecebe6;font-size:22px;font-weight:700">1,0,0</text><text x="32.0" y="219.0" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">3,600</text><rect x="380" y="100" width="220" height="60" style="fill:#0d1117;stroke:#f0584d;stroke-width:3"/><text x="392.0" y="127.2" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">All written alike</text><text x="392.0" y="144.4" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">one vertical wedge</text><rect x="700" y="30" width="280" height="90" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="712.0" y="62.5" text-anchor="start" style="fill:#8f8e96;font-size:11px;font-weight:700;letter-spacing:.08em">NO POINT</text><text x="712.0" y="78.5" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">7,139 of the numbers below 216,000 look</text><text x="712.0" y="95.0" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">like another</text><rect x="700" y="140" width="280" height="90" style="fill:#0d1117;stroke:#f0584d;stroke-width:3"/><text x="712.0" y="180.7" text-anchor="start" style="fill:#8f8e96;font-size:11px;font-weight:700;letter-spacing:.08em">NO POINT AND NO ZERO</text><text x="712.0" y="196.8" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">10,620 of them look like another</text></svg>
