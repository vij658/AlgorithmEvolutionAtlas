<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" width="1000" height="250" role="img" aria-label="Row 1 of Plimpton 322 rebuilt from the reciprocal pair 2;24 and 0;25" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>Row 1 of Plimpton 322 rebuilt from the reciprocal pair 2;24 and 0;25</title><line x1="230.0" y1="110.0" x2="265.0" y2="110.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="265.0,110.0 256.8,113.7 256.8,106.3" style="fill:#55545a"/><line x1="475.0" y1="110.0" x2="510.0" y2="110.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="510.0,110.0 501.8,113.7 501.8,106.3" style="fill:#55545a"/><line x1="720.0" y1="110.0" x2="755.0" y2="110.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="755.0,110.0 746.8,113.7 746.8,106.3" style="fill:#55545a"/><rect x="20" y="60" width="210" height="100" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="32.0" y="98.9" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">A reciprocal pair</text><text x="32.0" y="116.1" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">x = 2;24 and 1/x = 0;25</text><text x="32.0" y="132.6" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">both from the table&#x27;s world</text><rect x="265" y="60" width="210" height="100" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="277.0" y="97.2" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Half the difference,</text><text x="277.0" y="117.0" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">half the sum</text><text x="277.0" y="134.3" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">0;59,30 and 1;24,30</text><rect x="510" y="60" width="210" height="100" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="522.0" y="89.0" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Clear common factors 2,</text><text x="522.0" y="108.8" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">3, 5</text><text x="522.0" y="126.1" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">1,59 and 2,49</text><text x="522.0" y="142.6" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">= 119 and 169</text><rect x="755" y="60" width="210" height="100" style="fill:#ffffff;stroke:#d5352a;stroke-width:3"/><text x="767.0" y="98.9" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">A right triangle</text><text x="767.0" y="116.1" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">169² − 119² = 120²</text><text x="767.0" y="132.6" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">row 1 of the tablet</text><text x="20.0" y="34.0" text-anchor="start" style="fill:#7d7c84;font-size:11px;font-weight:700;letter-spacing:.08em">ROBSON&#x27;S READING, FOLLOWING BRUINS: THE TABLET STARTS FROM RECIPROCAL PAIRS</text><text x="20.0" y="210.0" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">Other readings: Pythagorean triples (Neugebauer and Sachs, 1945); an exact trigonometric table (Mansfield and Wildberger, 2017). Disputed.</text></svg>
