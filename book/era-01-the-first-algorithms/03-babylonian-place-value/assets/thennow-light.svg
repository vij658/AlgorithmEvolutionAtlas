<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="Dividing by multiplying with a precomputed reciprocal, then and now" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>Dividing by multiplying with a precomputed reciprocal, then and now</title><line x1="230.0" y1="76.0" x2="265.0" y2="76.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="265.0,76.0 256.8,79.7 256.8,72.3" style="fill:#55545a"/><line x1="475.0" y1="76.0" x2="510.0" y2="76.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="510.0,76.0 501.8,79.7 501.8,72.3" style="fill:#55545a"/><line x1="720.0" y1="76.0" x2="755.0" y2="76.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="755.0,76.0 746.8,79.7 746.8,72.3" style="fill:#55545a"/><line x1="230.0" y1="226.0" x2="265.0" y2="226.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="265.0,226.0 256.8,229.7 256.8,222.3" style="fill:#55545a"/><line x1="475.0" y1="226.0" x2="510.0" y2="226.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="510.0,226.0 501.8,229.7 501.8,222.3" style="fill:#55545a"/><line x1="720.0" y1="226.0" x2="755.0" y2="226.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="755.0,226.0 746.8,229.7 746.8,222.3" style="fill:#55545a"/><rect x="20" y="44" width="210" height="64" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="32.0" y="80.5" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">100 ÷ 16</text><rect x="265" y="44" width="210" height="64" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="277.0" y="80.5" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">look up 1/16: 3,45</text><rect x="510" y="44" width="210" height="64" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="522.0" y="80.5" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">multiply: 1,40 × 3,45</text><rect x="75