<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 526" width="960" height="526" role="img" aria-label="Each fix leaves a new pain: from measuring to computing roots" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>Each fix leaves a new pain: from measuring to computing roots</title><line x1="400.0" y1="62.0" x2="560.0" y2="62.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="560.0,62.0 551.8,65.7 551.8,58.3" style="fill:#b9b8b2"/><rect x="449.2" y="41.0" width="61.6" height="19" rx="3" style="fill:#0d1117"/><text x="480.0" y="54.0" text-anchor="middle" style="fill:#ecebe6;font-size:12.5px;font-weight:600">fixed by</text><line x1="750.0" y1="104.0" x2="750.0" y2="154.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="750.0,154.0 746.3,145.8 753.7,145.8" style="fill:#b9b8b2"/><rect x="757.0" y="121.0" width="175.9" height="19" rx="3" style="fill:#0d1117"/><text x="762.0" y="134.0" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">which leaves a new problem</text><line x1="560.0" y1="196.0" x2="400.0" y2="196.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="400.0,196.0 408.2,192.3 408.2,199.7" style="fill:#b9b8b2"/><rect x="449.2" y="175.0" width="61.6" height="19" rx="3" style="fill:#0d1117"/><text x="480.0" y="188.0" text-anchor="middle" style="fill:#ecebe6;font-size:12.5px;font-weight:600">fixed by</text><line x1="210.0" y1="238.0" x2="210.0" y2="288.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="210.0,288.0 206.3,279.8 213.7,279.8" style="fill:#b9b8b2"/><line x1="400.0" y1="330.0" x2="560.0" y2="330.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="560.0,330.0 551.8,333.7 551.8,326.3" style="fill:#b9b8b2"/><rect x="449.2" y="309.0" width="61.6" height="19" rx="3" style="fill:#0d1117"/><text x="480.0" y="322.0" text-anchor="middle" style="fill:#ecebe6;font-size:12.5px;font-weight:600">fixed by</text><line x1="750.0" y1="372.0" x2="750.0" y2="422.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="750.0,422.0 746.3,413.8 753.7,413.8" style="fill:#b9b8b2"/><line x1="560.0" y1="464.0" x2="400.0" y2="464.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="400.0,464.0 408.2,460.3 408.2,467.7" style="fill:#b9b8b2"/><rect x="449.2" y="443.0" width="61.6" height="19" rx="3" style="fill:#0d1117"/><text x="480.0" y="456.0" text-anchor="middle" style="fill:#ecebe6;font-size:12.5px;font-weight:600">fixed by</text><rect x="20" y="20" width="380" height="84" style="fill:#0d1117;stroke:#f0584d;stroke-width:3"/><text x="32.0" y="57.7" text-anchor="start" style="fill:#8f8e96;font-size:11px;font-weight:700;letter-spacing:.08em">WHAT HURT</text><text x="32.0" y="73.8" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">The diagonal of a square cannot be measured exactly</text><rect x="560" y="20" width="380" height="84" style="fill:#0d1117;stroke:#5b8fe0;stroke-width:3"/><text x="572.0" y="41.2" text-anchor="start" style="fill:#8f8e96;font-size:11px;font-weight:700;letter-spacing:.08em">THE FIX</text><text x="572.0" y="57.3" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">Compute it: 1;24,51,10, within a millionth of the true</text><text x="572.0" y="73.8" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">value</text><text x="572.0" y="90.3" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">YBC 7289, c. 1800–1600 BCE</text><rect x="560" y="154" width="380" height="84" style="fill:#0d1117;stroke:#f0584d;stroke-width:3"/><text x="572.0" y="191.7" text-anchor="start" style="fill:#8f8e96;font-size:11px;font-weight:700;letter-spacing:.08em">WHAT HURT</text><text x="572.0" y="207.8" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">A single guess is always too big or too small</text><rect x="20" y="154" width="380" height="84" style="fill:#0d1117;stroke:#5b8fe0;stroke-width:3"/><text x="32.0" y="175.2" text-anchor="start" style="fill:#8f8e96;font-size:11px;font-weight:700;letter-spacing:.08em">THE FIX</text><text x="32.0" y="191.3" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">Average a guess g with N/g: they lie on opposite sides of</text><text x="32.0" y="207.8" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">the root</text><text x="32.0" y="224.3" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">Heron, 1st century CE</text><rect x="20" y="288" width="380" height="84" style="fill:#0d1117;stroke:#f0584d;stroke-width:3"/><text x="32.0" y="325.7" text-anchor="start" style="fill:#8f8e96;font-size:11px;font-weight:700;letter-spacing:.08em">WHAT HURT</text><text x="32.0" y="341.8" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">Every step needs a division</text><rect x="560" y="288" width="380" height="84" style="fill:#0d1117;stroke:#5b8fe0;stroke-width:3"/><text x="572.0" y="317.5" text-anchor="start" style="fill:#8f8e96;font-size:11px;font-weight:700;letter-spacing:.08em">THE FIX</text><text x="572.0" y="333.5" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">Iterate on 1/√N instead: multiplications only</text><text x="572.0" y="350.0" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">a modern variant</text><rect x="560" y="422" width="380" height="84" style="fill:#0d1117;stroke:#f0584d;stroke-width:3"/><text x="572.0" y="459.7" text-anchor="start" style="fill:#8f8e96;font-size:11px;font-weight:700;letter-spacing:.08em">WHAT HURT</text><text x="572.0" y="475.8" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">Halving the interval needs 3,322 steps for 1,000 digits</text><rect x="20" y="422" width="380" height="84" style="fill:#0d1117;stroke:#5b8fe0;stroke-width:3"/><text x="32.0" y="459.7" text-anchor="start" style="fill:#8f8e96;font-size:11px;font-weight:700;letter-spacing:.08em">THE FIX</text><text x="32.0" y="475.8" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">Averaging doubles the correct digits: 11 steps</text></svg>
