<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="1000" height="650" role="img" aria-label="How the square root of 2 combined with other ideas, from place value to the fast inverse square root" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>How the square root of 2 combined with other ideas, from place value to the fast inverse square root</title><line x1="285.0" y1="106.0" x2="285.0" y2="160.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="285.0,160.0 281.3,151.8 288.7,151.8" style="fill:#b9b8b2"/><line x1="715.0" y1="106.0" x2="715.0" y2="160.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="715.0,160.0 711.3,151.8 718.7,151.8" style="fill:#b9b8b2"/><line x1="390.0" y1="203.0" x2="610.0" y2="203.0" style="stroke:#b9b8b2;stroke-width:1.5;stroke-dasharray:5 4"/><polygon points="610.0,203.0 601.8,206.7 601.8,199.3" style="fill:#b9b8b2"/><rect x="467.3" y="182.0" width="65.3" height="19" rx="3" style="fill:#0d1117"/><text x="500.0" y="195.0" text-anchor="middle" style="fill:#ecebe6;font-size:12.5px;font-weight:600">disputed</text><line x1="285.0" y1="246.0" x2="285.0" y2="300.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="285.0,300.0 281.3,291.8 288.7,291.8" style="fill:#b9b8b2"/><line x1="715.0" y1="246.0" x2="715.0" y2="300.0" style="stroke:#b9b8b2;stroke-width:1.5;stroke-dasharray:5 4"/><polygon points="715.0,300.0 711.3,291.8 718.7,291.8" style="fill:#b9b8b2"/><line x1="715.0" y1="246.0" x2="500.0" y2="420.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="500.0,420.0 504.1,412.0 508.7,417.7" style="fill:#b9b8b2"/><line x1="500.0" y1="506.0" x2="285.0" y2="540.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="285.0,540.0 292.5,535.1 293.7,542.3" style="fill:#b9b8b2"/><line x1="500.0" y1="506.0" x2="715.0" y2="540.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="715.0,540.0 706.3,542.3 707.5,535.1" style="fill:#b9b8b2"/><rect x="180" y="20" width="210" height="86" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="192.0" y="60.2" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Base-60 place value</text><text x="192.0" y="77.4" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">topic 3</text><rect x="610" y="20" width="210" height="86" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="622.0" y="60.2" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Reciprocal tables</text><text x="622.0" y="77.4" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">topic 3</text><rect x="180" y="160" width="210" height="86" style="fill:#0d1117;stroke:#f0584d;stroke-width:3"/><text x="192.0" y="191.9" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">√2 to three places</text><text x="192.0" y="209.2" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">⊕ a value no ruler gives</text><text x="192.0" y="225.7" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">YBC 7289, c. 1800–1600 BCE</text><rect x="610" y="160" width="210" height="86" style="fill:#0d1117;stroke:#f0584d;stroke-width:3"/><text x="622.0" y="191.9" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Averaging g and N/g</text><text x="622.0" y="209.2" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">⊕ a rule to improve a guess</text><text x="622.0" y="225.7" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">Heron&#x27;s Metrica, 1st century CE</text><rect x="180" y="300" width="210" height="86" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="192.0" y="331.9" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Bounds for √3</text><text x="192.0" y="349.2" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">⊕ squeezing from both sides</text><text x="192.0" y="365.7" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">Archimedes, topic 8</text><rect x="610" y="300" width="210" height="86" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="622.0" y="331.9" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Continued fractions</text><text x="622.0" y="349.2" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">same guesses: 3/2, 17/12,</text><text x="622.0" y="365.7" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">577/408</text><rect x="395" y="420" width="210" height="86" style="fill:#0d1117;stroke:#5b8fe0;stroke-width:3"/><text x="407.0" y="451.9" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Newton&#x27;s method</text><text x="407.0" y="469.2" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">⊕ any equation f(x) = 0</text><text x="407.0" y="485.7" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">17th century</text><rect x="180" y="540" width="210" height="86" style="fill:#0d1117;stroke:#5b8fe0;stroke-width:3"/><text x="192.0" y="562.0" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Fast inverse square</text><text x="192.0" y="581.8" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">root</text><text x="192.0" y="599.0" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">⊕ a bit-trick first guess</text><text x="192.0" y="615.5" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">Quake III Arena source</text><rect x="610" y="540" width="210" height="86" style="fill:#0d1117;stroke:#5b8fe0;stroke-width:3"/><text x="622.0" y="571.9" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Millions of digits</text><text x="622.0" y="589.1" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">⊕ fast multiplication</text><text x="622.0" y="605.6" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">today&#x27;s big-number libraries</text></svg>
