<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" role="img" aria-label="How did the scribe get 1;24,51,10? Four answers" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>How did the scribe get 1;24,51,10? Four answers</title><line x1="500.0" y1="104.0" x2="132.5" y2="200.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="132.5,200.0 139.5,194.4 141.4,201.5" style="fill:#b9b8b2"/><line x1="500.0" y1="104.0" x2="377.5" y2="200.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="377.5,200.0 381.7,192.0 386.2,197.8" style="fill:#b9b8b2"/><line x1="500.0" y1="104.0" x2="622.5" y2="200.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="622.5,200.0 613.8,197.8 618.3,192.0" style="fill:#b9b8b2"/><line x1="500.0" y1="104.0" x2="867.5" y2="200.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="867.5,200.0 858.6,201.5 860.5,194.4" style="fill:#b9b8b2"/><rect x="330" y="20" width="340" height="84" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="342.0" y="50.9" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">The tablet</text><text x="342.0" y="68.2" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">side 30; diagonal 1;24,51,10 and 42;25,35</text><text x="342.0" y="84.7" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">documented: YBC 7289</text><rect x="20" y="200" width="225" height="92" style="fill:#0d1117;stroke:#5b8fe0;stroke-width:3"/><text x="32.0" y="234.9" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Copied from a list</text><text x="32.0" y="252.2" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">of standard coefficients</text><text x="32.0" y="268.6" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">Fowler and Robson, 1998</text><rect x="265" y="200" width="225" height="92" style="fill:#0d1117;stroke:#5b8fe0;stroke-width:3"/><text x="277.0" y="226.7" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Cut and paste</text><text x="277.0" y="243.9" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">a geometric step, equal to one</text><text x="277.0" y="260.4" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">averaging step</text><text x="277.0" y="276.9" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">Fowler and Robson, 1998</text><rect x="510" y="200" width="225" height="92" style="fill:#0d1117;stroke:#5b8fe0;stroke-width:3"/><text x="522.0" y="226.7" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Repeated averaging</text><text x="522.0" y="243.9" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">reaches it at the third new</text><text x="522.0" y="260.4" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">guess</text><text x="522.0" y="276.9" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">possible, not shown (Baez)</text><rect x="755" y="200" width="225" height="92" style="fill:#0d1117;stroke:#5b8fe0;stroke-width:3"/><text x="767.0" y="234.9" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Another route</text><text x="767.0" y="252.2" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">a different reconstruction</text><text x="767.0" y="268.6" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">Buckle, 2023</text><text x="500.0" y="318.0" text-anchor="middle" style="fill:#8f8e96;font-size:11px;font-weight:700;letter-spacing:.08em">THE METHOD IS DISPUTED; THE VALUE AND ITS ARITHMETIC ARE NOT</text></svg>
