<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 280" width="940" height="280" role="img" aria-label="Four guesses for the square root of 2 drawn as rectangles of area 2" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>Four guesses for the square root of 2 drawn as rectangles of area 2</title><rect x="30.0" y="102.7" width="127.3" height="127.3" rx="0" style="fill:none;stroke:#c4c3bb;stroke-width:1.5;stroke-dasharray:4 4"/><rect x="30.0" y="50.0" width="90.0" height="180.0" rx="0" style="fill:#f4f3ee;stroke:#17171a;stroke-width:2"/><text x="30.0" y="252.0" text-anchor="start" style="fill:#17171a;font-size:13px;font-weight:700">guess 1/1</text><text x="30.0" y="270.0" text-anchor="start" style="fill:#7d7c84;font-size:12px;font-weight:400">0 correct places</text><rect x="260.0" y="102.7" width="127.3" height="127.3" rx="0" style="fill:none;stroke:#c4c3bb;stroke-width:1.5;stroke-dasharray:4 4"/><rect x="260.0" y="110.0" width="135.0" height="120.0" rx="0" style="fill:#f4f3ee;stroke:#17171a;stroke-width:2"/><text x="260.0" y="252.0" text-anchor="start" style="fill:#17171a;font-size:13px;font-weight:700">guess 3/2</text><text x="260.0" y="270.0" text-anchor="start" style="fill:#7d7c84;font-size:12px;font-weight:400">1 correct places</text><rect x="490.0" y="102.7" width="127.3" height="127.3" rx="0" style="fill:none;stroke:#c4c3bb;stroke-width:1.5;stroke-dasharray:4 4"/><rect x="490.0" y="102.9" width="127.5" height="127.1" rx="0" style="fill:#f4f3ee;stroke:#17171a;stroke-width:2"/><text x="490.0" y="252.0" text-anchor="start" style="fill:#17171a;font-size:13px;font-weight:700">guess 17/12</text><text x="490.0" y="270.0" text-anchor="start" style="fill:#7d7c84;font-size:12px;font-weight:400">2 correct places</text><rect x="720.0" y="102.7" width="127.3" height="127.3" rx="0" style="fill:none;stroke:#c4c3bb;stroke-width:1.5;stroke-dasharray:4 4"/><rect x="720.0" y="102.7" width="127.3" height="127.3" rx="0" style="fill:#f4f3ee;stroke:#d5352a;stroke-width:2"/><text x="720.0" y="252.0" text-anchor="start" style="fill:#17171a;font-size:13px;font-weight:700">guess 577/408</text><text x="720.0" y="270.0" text-anchor="start" style="fill:#7d7c84;font-size:12px;font-weight:400">5 correct places</text><text x="30.0" y="22.0" text-anchor="start" style="fill:#55545a;font-size:13px;font-weight:400">Each rectangle has area 2: one side is the guess g, the other 2/g. Averaging the sides squares it up.</text></svg>
