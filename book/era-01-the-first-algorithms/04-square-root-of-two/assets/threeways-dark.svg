<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 200" width="1000" height="200" role="img" aria-label="Three ways to the digits of a square root" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>Three ways to the digits of a square root</title><line x1="310.0" y1="105.0" x2="350.0" y2="105.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="350.0,105.0 341.8,108.7 341.8,101.3" style="fill:#b9b8b2"/><line x1="640.0" y1="105.0" x2="680.0" y2="105.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="680.0,105.0 671.8,108.7 671.8,101.3" style="fill:#b9b8b2"/><rect x="20" y="50" width="290" height="110" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="32.0" y="93.9" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Halve the interval</text><text x="32.0" y="111.1" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">about 3.3 steps per decimal digit</text><text x="32.0" y="127.6" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">1,000 digits: 3,322 steps</text><rect x="350" y="50" width="290" height="110" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="362.0" y="93.9" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Digit by digit</text><text x="362.0" y="111.1" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">one digit per step, as taught in schools</text><text x="362.0" y="127.6" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">1,000 digits: 1,000 steps</text><rect x="680" y="50" width="290" height="110" style="fill:#0d1117;stroke:#f0584d;stroke-width:3"/><text x="692.0" y="93.9" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Average g and N/g</text><text x="692.0" y="111.1" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">the correct digits double each step</text><text x="692.0" y="127.6" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">1,000 digits: 11 steps</text><text x="20.0" y="30.0" text-anchor="start" style="fill:#8f8e96;font-size:11px;font-weight:700;letter-spacing:.08em">FASTER TO THE RIGHT, FOR THE SAME ANSWER</text></svg>
