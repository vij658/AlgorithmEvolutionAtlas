<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="1000" height="660" role="img" aria-label="How doubling combined with other ideas, from grouped numerals to RSA" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>How doubling combined with other ideas, from grouped numerals to RSA</title><line x1="500.0" y1="106.0" x2="500.0" y2="150.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="500.0,150.0 496.3,141.8 503.7,141.8" style="fill:#b9b8b2"/><line x1="500.0" y1="236.0" x2="135.0" y2="300.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="135.0,300.0 142.5,295.0 143.7,302.2" style="fill:#b9b8b2"/><line x1="500.0" y1="236.0" x2="500.0" y2="300.0" style="stroke:#b9b8b2;stroke-width:1.5;stroke-dasharray:5 4"/><polygon points="500.0,300.0 496.3,291.8 503.7,291.8" style="fill:#b9b8b2"/><line x1="500.0" y1="236.0" x2="865.0" y2="300.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="865.0,300.0 856.3,302.2 857.5,295.0" style="fill:#b9b8b2"/><line x1="135.0" y1="386.0" x2="135.0" y2="440.0" style="stroke:#b9b8b2;stroke-width:1.5;stroke-dasharray:5 4"/><polygon points="135.0,440.0 131.3,431.8 138.7,431.8" style="fill:#b9b8b2"/><line x1="865.0" y1="386.0" x2="865.0" y2="440.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="865.0,440.0 861.3,431.8 868.7,431.8" style="fill:#b9b8b2"/><line x1="812.5" y1="526.0" x2="635.0" y2="560.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="635.0,560.0 642.4,554.8 643.8,562.1" style="fill:#b9b8b2"/><line x1="886.0" y1="526.0" x2="875.0" y2="560.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="875.0,560.0 874.0,551.1 881.0,553.3" style="fill:#b9b8b2"/><rect x="395" y="20" width="210" height="86" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="407.0" y="60.2" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Adding grouped signs</text><text x="407.0" y="77.4" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">topic 2</text><rect x="395" y="150" width="210" height="86" style="fill:#0d1117;stroke:#f0584d;stroke-width:3"/><text x="407.0" y="181.9" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Multiply by doubling</text><text x="407.0" y="199.2" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">⊕ double, then add the rows</text><text x="407.0" y="215.7" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">Rhind papyrus, c. 1550 BCE</text><rect x="30" y="300" width="210" height="86" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="42.0" y="331.9" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Divide by doubling</text><text x="42.0" y="349.2" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">⊕ double the divisor</text><text x="42.0" y="365.7" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">Rhind papyrus</text><rect x="395" y="300" width="210" height="86" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="407.0" y="331.9" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Halving and doubling</text><text x="407.0" y="349.2" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">⊕ halve the other number</text><text x="407.0" y="365.7" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">&#x27;Russian peasant&#x27; (conjecture)</text><rect x="760" y="300" width="210" height="86" style="fill:#0d1117;stroke:#f0584d;stroke-width:3"/><text x="772.0" y="331.9" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Square and multiply</text><text x="772.0" y="349.2" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">⊕ × in place of +</text><text x="772.0" y="365.7" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">Pingala to al-Kashi</text><rect x="30" y="440" width="210" height="86" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="42.0" y="463.7" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Euclid&#x27;s division step</text><text x="42.0" y="480.9" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">same question: how many</text><text x="42.0" y="497.4" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">times?</text><text x="42.0" y="513.9" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">topic 7</text><rect x="760" y="440" width="210" height="86" style="fill:#0d1117;stroke:#5b8fe0;stroke-width:3"/><text x="772.0" y="471.9" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">The generic power</text><text x="772.0" y="489.2" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">⊕ any associative operation</text><text x="772.0" y="505.7" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">Stepanov</text><rect x="530" y="560" width="210" height="86" style="fill:#0d1117;stroke:#5b8fe0;stroke-width:3"/><text x="542.0" y="600.1" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Fast Fibonacci</text><text x="542.0" y="617.4" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">⊕ 2 × 2 matrices</text><rect x="770" y="560" width="210" height="86" style="fill:#0d1117;stroke:#5b8fe0;stroke-width:3"/><text x="782.0" y="591.9" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">RSA</text><text x="782.0" y="609.1" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">⊕ arithmetic mod n</text><text x="782.0" y="625.6" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">1977</text></svg>
