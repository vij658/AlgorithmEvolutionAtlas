<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" role="img" aria-label="One algorithm, four operations: the doubling table with a different &#x27;add&#x27;" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>One algorithm, four operations: the doubling table with a different &#x27;add&#x27;</title><line x1="500.0" y1="104.0" x2="132.5" y2="200.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="132.5,200.0 139.5,194.4 141.4,201.5" style="fill:#b9b8b2"/><line x1="500.0" y1="104.0" x2="377.5" y2="200.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="377.5,200.0 381.7,192.0 386.2,197.8" style="fill:#b9b8b2"/><line x1="500.0" y1="104.0" x2="622.5" y2="200.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="622.5,200.0 613.8,197.8 618.3,192.0" style="fill:#b9b8b2"/><line x1="500.0" y1="104.0" x2="867.5" y2="200.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="867.5,200.0 858.6,201.5 860.5,194.4" style="fill:#b9b8b2"/><rect x="300" y="20" width="400" height="84" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="312.0" y="49.5" text-anchor="start" style="fill:#8f8e96;font-size:11px;font-weight:700;letter-spacing:.08em">THE DOUBLING TABLE</text><text x="312.0" y="65.5" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">Combine x with itself again and again; combine the rows you</text><text x="312.0" y="82.0" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">need</text><rect x="20" y="200" width="225" height="100" style="fill:#0d1117;stroke:#f0584d;stroke-width:3"/><text x="32.0" y="238.9" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">+ on numbers</text><text x="32.0" y="256.1" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">multiplication</text><text x="32.0" y="272.6" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">59 × 41: 7 additions</text><rect x="265" y="200" width="225" height="100" style="fill:#0d1117;stroke:#5b8fe0;stroke-width:3"/><text x="277.0" y="238.9" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">× on numbers</text><text x="277.0" y="256.1" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">powers</text><text x="277.0" y="272.6" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">3 to the 41: 7 multiplications</text><rect x="510" y="200" width="225" height="100" style="fill:#0d1117;stroke:#5b8fe0;stroke-width:3"/><text x="522.0" y="238.9" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">× on 2 × 2 matrices</text><text x="522.0" y="256.1" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">Fibonacci numbers</text><text x="522.0" y="272.6" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">F(90): 9 matrix products</text><rect x="755" y="200" width="225" height="100" style="fill:#0d1117;stroke:#5b8fe0;stroke-width:3"/><text x="767.0" y="238.9" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">× modulo n</text><text x="767.0" y="256.1" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">RSA decryption</text><text x="767.0" y="272.6" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">2790^2753 mod 3233: 15</text></svg>
