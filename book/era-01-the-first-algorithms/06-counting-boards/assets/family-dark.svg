ext-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">Latin calculus: a pebble</text><rect x="610" y="20" width="210" height="86" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="622.0" y="60.2" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Columns and exchanges</text><text x="622.0" y="77.4" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">topics 2 and 3</text><rect x="395" y="150" width="210" height="86" style="fill:#0d1117;stroke:#f0584d;stroke-width:3"/><text x="407.0" y="181.9" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Counting board</text><text x="407.0" y="199.2" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">⊕ columns hold the place</text><text x="407.0" y="215.7" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">Salamis tablet, c. 300 BCE</text><rect x="20" y="300" width="210" height="86" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="32.0" y="331.9" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Roman hand abacus</text><text x="32.0" y="349.2" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">⊕ beads in grooves, a five</text><text x="32.0" y="365.7" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">bronze; three survive</text><rect x="270" y="300" width="210" height="86" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="282.0" y="331.9" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Exchequer table</text><text x="282.0" y="349.2" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">⊕ a chequered cloth</text><text x="282.0" y="365.7" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">first mentioned 1110</text><rect x="520" y="300" width="210" height="86" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="532.0" y="331.9" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Suanpan and soroban</text><text x="532.0" y="349.2" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">⊕ beads on rods</text><text x="532.0" y="365.7" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">suanpan pictured by 1573</text><rect x="770" y="300" width="210" height="86" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="782.0" y="322.0" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Column arithmetic on</text><text x="782.0" y="341.8" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">paper</text><text x="782.0" y="359.1" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">⊕ zero and written digits</text><text x="782.0" y="375.6" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">era 2</text><rect x="180" y="450" width="210" height="86" style="fill:#0d1117;stroke:#5b8fe0;stroke-width:3"/><text x="192.0" y="481.9" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Mechanical calculators</text><text x="192.0" y="499.2" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">⊕ gears carry by themselves</text><text x="192.0" y="515.7" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">era 3</text><rect x="610" y="450" width="210" height="86" style="fill:#0d1117;stroke:#5b8fe0;stroke-width:3"/><text x="622.0" y="481.9" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Carry-save adders</text><text x="622.0" y="499.2" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">⊕ settle the carries last</text><text x="622.0" y="515.7" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">Wallace&#x27;s multiplier, 1964</text><text x="20.0" y="610.0" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">Das