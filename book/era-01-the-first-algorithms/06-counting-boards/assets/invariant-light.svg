<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" width="1000" height="250" role="img" aria-label="However you order the exchanges, their number is the same" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>However you order the exchanges, their number is the same</title><line x1="235.0" y1="110.0" x2="265.0" y2="110.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="265.0,110.0 256.8,113.7 256.8,106.3" style="fill:#55545a"/><line x1="480.0" y1="110.0" x2="510.0" y2="110.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="510.0,110.0 501.8,113.7 501.8,106.3" style="fill:#55545a"/><line x1="725.0" y1="110.0" x2="755.0" y2="110.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="755.0,110.0 746.8,113.7 746.8,106.3" style="fill:#55545a"/><rect x="20" y="60" width="215" height="100" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="32.0" y="106.2" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">22,721 counters put down</text><text x="32.0" y="122.8" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">1,000 numbers below 100,000</text><rect x="265" y="60" width="215" height="100" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="277.0" y="106.2" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">Each exchange: 10 off, 1 on</text><text x="277.0" y="122.8" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">9 counters fewer every time</text><rect x="510" y="60" width="215" height="100" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="522.0" y="106.2" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">32 counters left</text><text x="522.0" y="122.8" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">the total, 51,335,393, settled</text><rect x="755" y="60" width="215" height="100" style="fill:#ffffff;stroke:#d5352a;stroke-width:3"/><text x="767.0" y="98.0" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">(22,721 − 32) ÷ 9 = 2,521</text><text x="767.0" y="114.5" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">settle each time: 2,521 · settle</text><text x="767.0" y="131.0" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">once: 2,521</text><text x="20.0" y="38.0" text-anchor="start" style="fill:#7d7c84;font-size:11px;font-weight:700;letter-spacing:.08em">A PLAIN BOARD, ADDING A THOUSAND NUMBERS</text><text x="20.0" y="200.0" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">Piling up first, one column held 4,634 counters before settling. Same exchanges, but one pass instead of 1,000.</text></svg>
