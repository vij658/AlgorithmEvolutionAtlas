<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" width="960" height="660" role="img" aria-label="Each fix leaves a new pain: from trying every candidate to the binary GCD" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>Each fix leaves a new pain: from trying every candidate to the binary GCD</title><line x1="400.0" y1="62.0" x2="560.0" y2="62.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="560.0,62.0 551.8,65.7 551.8,58.3" style="fill:#55545a"/><rect x="449.2" y="41.0" width="61.6" height="19" rx="3" style="fill:#ffffff"/><text x="480.0" y="54.0" text-anchor="middle" style="fill:#17171a;font-size:12.5px;font-weight:600">fixed by</text><line x1="750.0" y1="104.0" x2="750.0" y2="154.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="750.0,154.0 746.3,145.8 753.7,145.8" style="fill:#55545a"/><rect x="757.0" y="121.0" width="175.9" height="19" rx="3" style="fill:#ffffff"/><text x="762.0" y="134.0" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">which leaves a new problem</text><line x1="560.0" y1="196.0" x2="400.0" y2="196.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="400.0,196.0 408.2,192.3 408.2,199.7" style="fill:#55545a"/><rect x="449.2" y="175.0" width="61.6" height="19" rx="3" style="fill:#ffffff"/><text x="480.0" y="188.0" text-anchor="middle" style="fill:#17171a;font-size:12.5px;font-weight:600">fixed by</text><line x1="210.0" y1="238.0" x2="210.0" y2="288.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="210.0,288.0 206.3,279.8 213.7,279.8" style="fill:#55545a"/><line x1="400.0" y1="330.0" x2="560.0" y2="330.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="560.0,330.0 551.8,333.7 551.8,326.3" style="fill:#55545a"/><rect x="449.2" y="309.0" width="61.6" height="19" rx="3" style="fill:#ffffff"/><text x="480.0" y="322.0" text-anchor="middle" style="fill:#17171a;font-size:12.5px;font-weight:600">fixed by</text><line x1="750.0" y1="372.0" x2="750.0" y2="422.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="750.0,422.0 746.3,413.8 753.7,413.8" style="fill:#55545a"/><line x1="560.0" y1="464.0" x2="400.0" y2="464.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="400.0,464.0 408.2,460.3 408.2,467.7" style="fill:#55545a"/><rect x="449.2" y="443.0" width="61.6" height="19" rx="3" style="fill:#ffffff"/><text x="480.0" y="456.0" text-anchor="middle" style="fill:#17171a;font-size:12.5px;font-weight:600">fixed by</text><line x1="210.0" y1="506.0" x2="210.0" y2="556.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="210.0,556.0 206.3,547.8 213.7,547.8" style="fill:#55545a"/><line x1="400.0" y1="598.0" x2="560.0" y2="598.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="560.0,598.0 551.8,601.7 551.8,594.3" style="fill:#55545a"/><rect x="449.2" y="577.0" width="61.6" height="19" rx="3" style="fill:#ffffff"/><text x="480.0" y="590.0" text-anchor="middle" style="fill:#17171a;font-size:12.5px;font-weight:600">fixed by</text><rect x="20" y="20" width="380" height="84" style="fill:#ffffff;stroke:#d5352a;stroke-width:3"/><text x="32.0" y="57.7" text-anchor="start" style="fill:#7d7c84;font-size:11px;font-weight:700;letter-spacing:.08em">WHAT HURT</text><text x="32.0" y="73.8" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">Try every candidate until one divides both numbers</text><rect x="560" y="20" width="380" height="84" style="fill:#ffffff;stroke:#1f5ba8;stroke-width:3"/><text x="572.0" y="49.5" text-anchor="start" style="fill:#7d7c84;font-size:11px;font-weight:700;letter-spacing:.08em">THE FIX</text><text x="572.0" y="65.5" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">Take the smaller from the larger, again and again</text><text x="572.0" y="82.0" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">Elements VII, c. 300 BCE</text><rect x="560" y="154" width="380" height="84" style="fill:#ffffff;stroke:#d5352a;stroke-width:3"/><text x="572.0" y="191.7" text-anchor="start" style="fill:#7d7c84;font-size:11px;font-weight:700;letter-spacing:.08em">WHAT HURT</text><text x="572.0" y="207.8" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">1,000,000 and 1 need 1,000,000 subtractions</text><rect x="20" y="154" width="380" height="84" style="fill:#ffffff;stroke:#1f5ba8;stroke-width:3"/><text x="32.0" y="191.7" text-anchor="start" style="fill:#7d7c84;font-size:11px;font-weight:700;letter-spacing:.08em">THE FIX</text><text x="32.0" y="207.8" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">One division does a whole run of subtractions: a mod b</text><rect x="20" y="288" width="380" height="84" style="fill:#ffffff;stroke:#d5352a;stroke-width:3"/><text x="32.0" y="317.5" text-anchor="start" style="fill:#7d7c84;font-size:11px;font-weight:700;letter-spacing:.08em">WHAT HURT</text><text x="32.0" y="333.5" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">Knowing the gcd is not enough: find x, y with ax + by =</text><text x="32.0" y="350.0" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">gcd</text><rect x="560" y="288" width="380" height="84" style="fill:#ffffff;stroke:#1f5ba8;stroke-width:3"/><text x="572.0" y="317.5" text-anchor="start" style="fill:#7d7c84;font-size:11px;font-weight:700;letter-spacing:.08em">THE FIX</text><text x="572.0" y="333.5" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">Carry the steps back</text><text x="572.0" y="350.0" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">Aryabhata&#x27;s kuttaka, the pulverizer, 499 CE</text><rect x="560" y="422" width="380" height="84" style="fill:#ffffff;stroke:#d5352a;stroke-width:3"/><text x="572.0" y="459.7" text-anchor="start" style="fill:#7d7c84;font-size:11px;font-weight:700;letter-spacing:.08em">WHAT HURT</text><text x="572.0" y="475.8" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">How slow can it get?</text><rect x="20" y="422" width="380" height="84" style="fill:#ffffff;stroke:#1f5ba8;stroke-width:3"/><text x="32.0" y="451.5" text-anchor="start" style="fill:#7d7c84;font-size:11px;font-weight:700;letter-spacing:.08em">THE FIX</text><text x="32.0" y="467.5" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">Never more than 5 × the digits of the smaller number</text><text x="32.0" y="484.0" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">Lamé, 1844 (others had partial results first)</text><rect x="20" y="556" width="380" height="84" style="fill:#ffffff;stroke:#d5352a;stroke-width:3"/><text x="32.0" y="593.7" text-anchor="start" style="fill:#7d7c84;font-size:11px;font-weight:700;letter-spacing:.08em">WHAT HURT</text><text x="32.0" y="609.8" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">Division is costly in hardware</text><rect x="560" y="556" width="380" height="84" style="fill:#ffffff;stroke:#1f5ba8;stroke-width:3"/><text x="572.0" y="585.5" text-anchor="start" style="fill:#7d7c84;font-size:11px;font-weight:700;letter-spacing:.08em">THE FIX</text><text x="572.0" y="601.5" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">Halving and subtraction only</text><text x="572.0" y="618.0" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">Stein, 1967; a halving rule appears in China&#x27;s Nine Chapters</text></svg>
