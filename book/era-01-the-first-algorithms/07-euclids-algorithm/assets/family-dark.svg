e:#b9b8b2;stroke-width:1.5;stroke-dasharray:5 4"/><polygon points="800.0,300.4 791.0,300.9 793.6,294.0" style="fill:#b9b8b2"/><rect x="410" y="20" width="180" height="70" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="422.0" y="52.2" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Repeated subtraction</text><text x="422.0" y="69.4" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">anthyphairesis</text><rect x="410" y="150" width="180" height="70" style="fill:#0d1117;stroke:#f0584d;stroke-width:3"/><text x="422.0" y="173.9" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Euclid&#x27;s algorithm</text><text x="422.0" y="191.2" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">⊕ division</text><text x="422.0" y="207.7" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">c. 300 BCE</text><rect x="20" y="300" width="180" height="70" style="fill:#0d1117;stroke:#5b8fe0;stroke-width:3"/><text x="32.0" y="323.9" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Extended Euclid</text><text x="32.0" y="341.2" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">⊕ carry the steps back</text><text x="32.0" y="357.7" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">Aryabhata, 499 CE</text><rect x="215" y="300" width="180" height="70" style="fill:#0d1117;stroke:#5b8fe0;stroke-width:3"/><text x="227.0" y="323.9" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Lamé&#x27;s bound</text><text x="227.0" y="341.2" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">⊕ Fibonacci numbers</text><text x="227.0" y="357.7" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">1844</text><rect x="410" y="300" width="180" height="70" style="fill:#0d1117;stroke:#f0584d;stroke-width:3"/><text x="422.0" y="323.9" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Weak-key hunt</text><text x="422.0" y="341.2" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">⊕ millions of public keys</text><text x="422.0" y="357.7" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">2012</text><rect x="605" y="300" width="180" height="70" style="fill:#0d1117;stroke:#5b8fe0;stroke-width:3"/><text x="617.0" y="323.9" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Binary GCD</text><text x="617.0" y="341.2" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">⊕ halving</text><text x="617.0" y="357.7" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">Stein, 1967</text><rect x="800" y="300" width="180" height="70" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="812.0" y="332.2" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Continued fractions</text><text x="812.0" y="349.4" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">same quotients</text><rect x="20" y="450" width="180" height="70" style="fill:#0d1117;stroke:#5b8fe0;stroke-width:3"/><text x="32.0" y="482.2" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Modular inverse</text><text x="32.0" y="499.4" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">⊕ arithmetic mod n</text><rect x="410" y="450" width="180" height="70" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="422.0" y="482.2" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Egyptian doubling</text><text x="422.0" y="499.4" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">topic 5, c. 1550 BCE</text><rect x="410" y="590" width="180" height="70" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="422.0" y="622.1" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Square-and-multiply</text><text x="422.0" y="639.4" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">⊕ squaring</text><rect x="20" y="590" width="180" height="70" style="fill:#0d1117;stroke:#f0584d;stroke-width:3"/><text x="32.0" y="613.9" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">RSA</text><text x="32.0" y="631.1" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">⊕ fast powers</text><text x="32.0" y="647.6" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">1977</text></svg>
