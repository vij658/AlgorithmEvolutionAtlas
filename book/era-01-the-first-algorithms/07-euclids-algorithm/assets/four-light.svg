<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 588" width="800" height="588" role="img" aria-label="Four ways to find a gcd, each built from the one before, with the work each needs" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>Four ways to find a gcd, each built from the one before, with the work each needs</title><line x1="235.0" y1="124.0" x2="235.0" y2="168.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="235.0,168.0 231.3,159.8 238.7,159.8" style="fill:#55545a"/><rect x="244.0" y="138.0" width="192.0" height="19" rx="3" style="fill:#ffffff"/><text x="249.0" y="151.0" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">⊕ subtract instead of testing</text><line x1="235.0" y1="272.0" x2="235.0" y2="316.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="235.0,316.0 231.3,307.8 238.7,307.8" style="fill:#55545a"/><rect x="244.0" y="286.0" width="185.0" height="19" rx="3" style="fill:#ffffff"/><text x="249.0" y="299.0" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">⊕ do the subtractions in bulk</text><line x1="235.0" y1="420.0" x2="235.0" y2="464.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="235.0,464.0 231.3,455.8 238.7,455.8" style="fill:#55545a"/><rect x="244.0" y="434.0" width="167.5" height="19" rx="3" style="fill:#ffffff"/><text x="249.0" y="447.0" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">⊕ halve instead of dividing</text><rect x="20" y="20" width="430" height="104" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="32.0" y="60.9" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Try every candidate</text><text x="32.0" y="78.2" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">count down from the smaller number until one divides both</text><text x="32.0" y="94.7" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">1071 and 462: 442 tries · 1,000,000 and 1: 1</text><rect x="20" y="168" width="430" height="104" style="fill:#ffffff;stroke:#d5352a;stroke-width:3"/><text x="32.0" y="208.9" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Repeated subtraction (Euclid)</text><text x="32.0" y="226.2" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">take the smaller from the larger</text><text x="32.0" y="242.7" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">1071 and 462: 12 subtractions · 1,000,000 and 1: 1,000,000</text><rect x="20" y="316" width="430" height="104" style="fill:#ffffff;stroke:#1f5ba8;stroke-width:3"/><text x="32.0" y="356.9" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Division</text><text x="32.0" y="374.2" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">replace (a, b) by (b, a mod b)</text><text x="32.0" y="390.7" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">1071 and 462: 3 divisions · 1,000,000 and 1: 1</text><rect x="20" y="464" width="430" height="104" style="fill:#ffffff;stroke:#1f5ba8;stroke-width:3"/><text x="32.0" y="504.9" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Binary GCD (Stein, 1967)</text><text x="32.0" y="522.2" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">halve away factors of 2, then subtract</text><text x="32.0" y="538.7" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">1071 and 462: 5 rounds · 1,000,000 and 1: 7</text><text x="480.0" y="66.0" text-anchor="start" style="fill:#7d7c84;font-size:11px;font-weight:700;letter-spacing:.08em">WORK GROWS WITH</text><text x="480.0" y="86.0" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">the size of the numbers</text><text x="480.0" y="214.0" text-anchor="start" style="fill:#7d7c84;font-size:11px;font-weight:700;letter-spacing:.08em">WORK GROWS WITH</text><text x="480.0" y="234.0" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">the size of the quotients</text><text x="480.0" y="362.0" text-anchor="start" style="fill:#7d7c84;font-size:11px;font-weight:700;letter-spacing:.08em">WORK GROWS WITH</text><text x="480.0" y="382.0" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">the number of digits</text><text x="480.0" y="510.0" text-anchor="start" style="fill:#7d7c84;font-size:11px;font-weight:700;letter-spacing:.08em">WORK GROWS WITH</text><text x="480.0" y="530.0" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">the number of bits; no division at all</text></svg>
