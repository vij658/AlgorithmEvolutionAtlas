<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 230" width="800" height="230" role="img" aria-label="Average steps for random pairs grow by about 1.94 per extra digit: 2.2 at 1 digit, 35.0 at 18 digits" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>Average steps for random pairs grow by about 1.94 per extra digit: 2.2 at 1 digit, 35.0 at 18 digits</title><line x1="170.0" y1="118.0" x2="226.0" y2="118.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="226.0,118.0 217.8,121.7 217.8,114.3" style="fill:#55545a"/><rect x="128.5" y="49.0" width="139.1" height="19" rx="3" style="fill:#ffffff"/><text x="198.0" y="62.0" text-anchor="middle" style="fill:#17171a;font-size:12.5px;font-weight:600">+5 digits: +9.5 steps</text><line x1="376.0" y1="118.0" x2="432.0" y2="118.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="432.0,118.0 423.8,121.7 423.8,114.3" style="fill:#55545a"/><rect x="330.8" y="49.0" width="146.4" height="19" rx="3" style="fill:#ffffff"/><text x="404.0" y="62.0" text-anchor="middle" style="fill:#17171a;font-size:12.5px;font-weight:600">+6 digits: +11.7 steps</text><line x1="582.0" y1="118.0" x2="638.0" y2="118.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="638.0,118.0 629.8,121.7 629.8,114.3" style="fill:#55545a"/><rect x="536.8" y="49.0" width="146.4" height="19" rx="3" style="fill:#ffffff"/><text x="610.0" y="62.0" text-anchor="middle" style="fill:#17171a;font-size:12.5px;font-weight:600">+6 digits: +11.6 steps</text><rect x="20" y="76" width="150" height="84" style="fill:#ffffff;stroke:#1f5ba8;stroke-width:3"/><text x="32.0" y="103.8" text-anchor="start" style="fill:#7d7c84;font-size:11px;font-weight:700;letter-spacing:.08em">1-DIGIT NUMBERS</text><text x="32.0" y="122.4" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">2.2 steps</text><text x="32.0" y="139.7" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">on average</text><rect x="226" y="76" width="150" height="84" style="fill:#ffffff;stroke:#1f5ba8;stroke-width:3"/><text x="238.0" y="103.8" text-anchor="start" style="fill:#7d7c84;font-size:11px;font-weight:700;letter-spacing:.08em">6-DIGIT NUMBERS</text><text x="238.0" y="122.4" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">11.7 steps</text><text x="238.0" y="139.7" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">on average</text><rect x="432" y="76" width="150" height="84" style="fill:#ffffff;stroke:#1f5ba8;stroke-width:3"/><text x="444.0" y="103.8" text-anchor="start" style="fill:#7d7c84;font-size:11px;font-weight:700;letter-spacing:.08em">12-DIGIT NUMBERS</text><text x="444.0" y="122.4" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">23.4 steps</text><text x="444.0" y="139.7" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">on average</text><rect x="638" y="76" width="150" height="84" style="fill:#ffffff;stroke:#d5352a;stroke-width:3"/><text x="650.0" y="103.8" text-anchor="start" style="fill:#7d7c84;font-size:11px;font-weight:700;letter-spacing:.08em">18-DIGIT NUMBERS</text><text x="650.0" y="122.4" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">35.0 steps</text><text x="650.0" y="139.7" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">on average</text><text x="20.0" y="196.0" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">Measured over 100,000 random pairs at each size: +1.94 steps per extra digit.</text><text x="20.0" y="214.0" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">Heilbronn&#x27;s formula for the average, 0.843 ln n, predicts +1.94.</text></svg>
