<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 190" width="800" height="190" role="img" aria-label="The worst case against Lamé&#x27;s limit of 5 steps per digit: it reaches the limit up to 3 digits and stays just below it after that" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>The worst case against Lamé&#x27;s limit of 5 steps per digit: it reaches the limit up to 3 digits and stays just below it after that</title><rect x="20" y="20" width="100" height="110" style="fill:#ffffff;stroke:#d5352a;stroke-width:3"/><text x="32.0" y="52.6" text-anchor="start" style="fill:#7d7c84;font-size:11px;font-weight:700;letter-spacing:.08em">1 DIGIT</text><text x="32.0" y="71.2" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">5 steps</text><text x="32.0" y="88.4" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">limit 5</text><text x="32.0" y="104.9" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">at the limit</text><rect x="130" y="20" width="100" height="110" style="fill:#ffffff;stroke:#d5352a;stroke-width:3"/><text x="142.0" y="52.6" text-anchor="start" style="fill:#7d7c84;font-size:11px;font-weight:700;letter-spacing:.08em">3 DIGITS</text><text x="142.0" y="71.2" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">15 steps</text><text x="142.0" y="88.4" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">limit 15</text><text x="142.0" y="104.9" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">at the limit</text><rect x="240" y="20" width="100" height="110" style="fill:#ffffff;stroke:#1f5ba8;stroke-width:3"/><text x="252.0" y="52.6" text-anchor="start" style="fill:#7d7c84;font-size:11px;font-weight:700;letter-spacing:.08em">6 DIGITS</text><text x="252.0" y="71.2" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">29 steps</text><text x="252.0" y="88.4" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">limit 30</text><text x="252.0" y="104.9" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">1 below</text><rect x="350" y="20" width="100" height="110" style="fill:#ffffff;stroke:#1f5ba8;stroke-width:3"/><text x="362.0" y="52.6" text-anchor="start" style="fill:#7d7c84;font-size:11px;font-weight:700;letter-spacing:.08em">9 DIGITS</text><text x="362.0" y="71.2" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">43 steps</text><text x="362.0" y="88.4" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">limit 45</text><text x="362.0" y="104.9" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">2 below</text><rect x="460" y="20" width="100" height="110" style="fill:#ffffff;stroke:#1f5ba8;stroke-width:3"/><text x="472.0" y="52.6" text-anchor="start" style="fill:#7d7c84;font-size:11px;font-weight:700;letter-spacing:.08em">12 DIGITS</text><text x="472.0" y="71.2" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">58 steps</text><text x="472.0" y="88.4" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">limit 60</text><text x="472.0" y="104.9" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">2 below</text><rect x="570" y="20" width="100" height="110" style="fill:#ffffff;stroke:#1f5ba8;stroke-width:3"/><text x="582.0" y="52.6" text-anchor="start" style="fill:#7d7c84;font-size:11px;font-weight:700;letter-spacing:.08em">15 DIGITS</text><text x="582.0" y="71.2" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">72 steps</text><text x="582.0" y="88.4" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">limit 75</text><text x="582.0" y="104.9" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">3 below</text><rect x="680" y="20" width="100" height="110" style="fill:#ffffff;stroke:#1f5ba8;stroke-width:3"/><text x="692.0" y="52.6" text-anchor="start" style="fill:#7d7c84;font-size:11px;font-weight:700;letter-spacing:.08em">18 DIGITS</text><text x="692.0" y="71.2" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">86 steps</text><text x="692.0" y="88.4" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">limit 90</text><text x="692.0" y="104.9" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">4 below</text><text x="20.0" y="160.0" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">Worst case = consecutive Fibonacci numbers whose smaller one has that many digits. Red: exactly at Lamé&#x27;s limit; blue: below it.</text></svg>
