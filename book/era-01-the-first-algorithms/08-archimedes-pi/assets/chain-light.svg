<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 526" width="960" height="526" role="img" aria-label="Each fix leaves a new pain: from an inexpressible number to guaranteed bounds" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>Each fix leaves a new pain: from an inexpressible number to guaranteed bounds</title><line x1="400.0" y1="62.0" x2="560.0" y2="62.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="560.0,62.0 551.8,65.7 551.8,58.3" style="fill:#55545a"/><rect x="449.2" y="41.0" width="61.6" height="19" rx="3" style="fill:#ffffff"/><text x="480.0" y="54.0" text-anchor="middle" style="fill:#17171a;font-size:12.5px;font-weight:600">fixed by</text><line x1="750.0" y1="104.0" x2="750.0" y2="154.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="750.0,154.0 746.3,145.8 753.7,145.8" style="fill:#55545a"/><rect x="757.0" y="121.0" width="175.9" height="19" rx="3" style="fill:#ffffff"/><text x="762.0" y="134.0" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">which leaves a new problem</text><line x1="560.0" y1="196.0" x2="400.0" y2="196.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="400.0,196.0 408.2,192.3 408.2,199.7" style="fill:#55545a"/><rect x="449.2" y="175.0" width="61.6" height="19" rx="3" style="fill:#ffffff"/><text x="480.0" y="188.0" text-anchor="middle" style="fill:#17171a;font-size:12.5px;font-weight:600">fixed by</text><line x1="210.0" y1="238.0" x2="210.0" y2="288.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="210.0,288.0 206.3,279.8 213.7,279.8" style="fill:#55545a"/><line x1="400.0" y1="330.0" x2="560.0" y2="330.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="560.0,330.0 551.8,333.7 551.8,326.3" style="fill:#55545a"/><rect x="449.2" y="309.0" width="61.6" height="19" rx="3" style="fill:#ffffff"/><text x="480.0" y="322.0" text-anchor="middle" style="fill:#17171a;font-size:12.5px;font-weight:600">fixed by</text><line x1="750.0" y1="372.0" x2="750.0" y2="422.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="750.0,422.0 746.3,413.8 753.7,413.8" style="fill:#55545a"/><line x1="560.0" y1="464.0" x2="400.0" y2="464.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="400.0,464.0 408.2,460.3 408.2,467.7" style="fill:#55545a"/><rect x="449.2" y="443.0" width="61.6" height="19" rx="3" style="fill:#ffffff"/><text x="480.0" y="456.0" text-anchor="middle" style="fill:#17171a;font-size:12.5px;font-weight:600">fixed by</text><rect x="20" y="20" width="380" height="84" style="fill:#ffffff;stroke:#d5352a;stroke-width:3"/><text x="32.0" y="57.7" text-anchor="start" style="fill:#7d7c84;font-size:11px;font-weight:700;letter-spacing:.08em">WHAT HURT</text><text x="32.0" y="73.8" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">π cannot be written as a fraction</text><rect x="560" y="20" width="380" height="84" style="fill:#ffffff;stroke:#1f5ba8;stroke-width:3"/><text x="572.0" y="41.2" text-anchor="start" style="fill:#7d7c84;font-size:11px;font-weight:700;letter-spacing:.08em">THE FIX</text><text x="572.0" y="57.3" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">Trap it: a polygon inside is too short, one outside too</text><text x="572.0" y="73.8" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">long</text><text x="572.0" y="90.3" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">Measurement of a Circle</text><rect x="560" y="154" width="380" height="84" style="fill:#ffffff;stroke:#d5352a;stroke-width:3"/><text x="572.0" y="191.7" text-anchor="start" style="fill:#7d7c84;font-size:11px;font-weight:700;letter-spacing:.08em">WHAT HURT</text><text x="572.0" y="207.8" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">Hexagons only say 3 &lt; π &lt; 3.4641</text><rect x="20" y="154" width="380" height="84" style="fill:#ffffff;stroke:#1f5ba8;stroke-width:3"/><text x="32.0" y="175.2" text-anchor="start" style="fill:#7d7c84;font-size:11px;font-weight:700;letter-spacing:.08em">THE FIX</text><text x="32.0" y="191.3" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">Double the sides: each doubling cuts the gap about 4</text><text x="32.0" y="207.8" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">times</text><text x="32.0" y="224.3" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">6, 12, 24, 48, 96 sides</text><rect x="20" y="288" width="380" height="84" style="fill:#ffffff;stroke:#d5352a;stroke-width:3"/><text x="32.0" y="325.7" text-anchor="start" style="fill:#7d7c84;font-size:11px;font-weight:700;letter-spacing:.08em">WHAT HURT</text><text x="32.0" y="341.8" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">Each doubling needs a square root that cannot be exact</text><rect x="560" y="288" width="380" height="84" style="fill:#ffffff;stroke:#1f5ba8;stroke-width:3"/><text x="572.0" y="309.2" text-anchor="start" style="fill:#7d7c84;font-size:11px;font-weight:700;letter-spacing:.08em">THE FIX</text><text x="572.0" y="325.3" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">Round every bound the safe way: lower bounds down,</text><text x="572.0" y="341.8" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">upper bounds up</text><text x="572.0" y="358.3" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">265/153 &lt; √3 &lt; 1351/780</text><rect x="560" y="422" width="380" height="84" style="fill:#ffffff;stroke:#d5352a;stroke-width:3"/><text x="572.0" y="459.7" text-anchor="start" style="fill:#7d7c84;font-size:11px;font-weight:700;letter-spacing:.08em">WHAT HURT</text><text x="572.0" y="475.8" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">35 places would need 58 doublings</text><rect x="20" y="422" width="380" height="84" style="fill:#ffffff;stroke:#1f5ba8;stroke-width:3"/><text x="32.0" y="443.2" text-anchor="start" style="fill:#7d7c84;font-size:11px;font-weight:700;letter-spacing:.08em">THE FIX</text><text x="32.0" y="459.3" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">Combine the bounds to cancel the main error; later,</text><text x="32.0" y="475.8" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">infinite series</text><text x="32.0" y="492.3" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">Huygens, 1654; era 3</text></svg>
