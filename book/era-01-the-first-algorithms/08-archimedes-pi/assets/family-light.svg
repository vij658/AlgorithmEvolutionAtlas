<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" role="img" aria-label="How Archimedes&#x27; squeeze combined with other ideas, from exhaustion to interval arithmetic" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>How Archimedes&#x27; squeeze combined with other ideas, from exhaustion to interval arithmetic</title><line x1="285.0" y1="106.0" x2="500.0" y2="150.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="500.0,150.0 491.2,151.9 492.7,144.8" style="fill:#55545a"/><line x1="715.0" y1="106.0" x2="500.0" y2="150.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="500.0,150.0 507.3,144.8 508.8,151.9" style="fill:#55545a"/><line x1="500.0" y1="236.0" x2="125.0" y2="300.0" style="stroke:#55545a;stroke-width:1.5;stroke-dasharray:5 4"/><polygon points="125.0,300.0 132.5,295.0 133.7,302.2" style="fill:#55545a"/><line x1="500.0" y1="236.0" x2="375.0" y2="300.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="375.0,300.0 380.6,293.0 384.0,299.5" style="fill:#55545a"/><line x1="500.0" y1="236.0" x2="625.0" y2="300.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="625.0,300.0 616.0,299.5 619.4,293.0" style="fill:#55545a"/><line x1="500.0" y1="236.0" x2="875.0" y2="300.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="875.0,300.0 866.3,302.2 867.5,295.0" style="fill:#55545a"/><line x1="375.0" y1="386.0" x2="458.0" y2="460.0" style="stroke:#55545a;stroke-width:1.5;stroke-dasharray:5 4"/><polygon points="458.0,460.0 449.4,457.3 454.3,451.8" style="fill:#55545a"/><line x1="500.0" y1="236.0" x2="500.0" y2="460.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="500.0,460.0 496.3,451.8 503.7,451.8" style="fill:#55545a"/><rect x="180" y="20" width="210" height="86" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="192.0" y="60.2" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Exhaustion</text><text x="192.0" y="77.4" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">Euclid&#x27;s Elements, Book XII</text><rect x="610" y="20" width="210" height="86" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="622.0" y="51.9" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Safe bounds for roots</text><text x="622.0" y="69.2" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">265/153 &lt; √3 &lt; 1351/780</text><text x="622.0" y="85.7" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">topic 4&#x27;s square roots</text><rect x="395" y="150" width="210" height="86" style="fill:#ffffff;stroke:#d5352a;stroke-width:3"/><text x="407.0" y="173.7" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Squeezing π</text><text x="407.0" y="190.9" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">⊕ two polygons that close in</text><text x="407.0" y="207.4" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">Measurement of a Circle, c. 250</text><text x="407.0" y="223.9" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">BCE</text><rect x="20" y="300" width="210" height="86" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="32.0" y="340.2" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">355/113</text><text x="32.0" y="357.4" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">Zu Chongzhi (430–501)</text><rect x="270" y="300" width="210" height="86" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="282.0" y="331.9" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">35 places</text><text x="282.0" y="349.2" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">⊕ many more doublings</text><text x="282.0" y="365.7" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">van Ceulen, c. 1600</text><rect x="520" y="300" width="210" height="86" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="532.0" y="331.9" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Combine the bounds</text><text x="532.0" y="349.2" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">⊕ cancel the main error</text><text x="532.0" y="365.7" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">Huygens, 1654</text><rect x="770" y="300" width="210" height="86" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="782.0" y="331.9" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Series for π</text><text x="782.0" y="349.2" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">⊕ infinite sums</text><text x="782.0" y="365.7" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">era 3</text><rect x="395" y="460" width="210" height="86" style="fill:#ffffff;stroke:#1f5ba8;stroke-width:3"/><text x="407.0" y="491.9" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Interval arithmetic</text><text x="407.0" y="509.2" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">⊕ computers round outward</text><text x="407.0" y="525.7" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">Moore, 1966</text><text x="20.0" y="600.0" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">Dashed: the same goal or the same habit of mind, not a documented line of descent.</text></svg>
