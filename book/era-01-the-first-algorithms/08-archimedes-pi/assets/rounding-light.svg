<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="1000" height="260" role="img" aria-label="Archimedes rounded his 96-gon bounds outward, never inward" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>Archimedes rounded his 96-gon bounds outward, never inward</title><line x1="160.0" y1="116.0" x2="160.0" y2="160.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="160.0,160.0 156.3,151.8 163.7,151.8" style="fill:#55545a"/><line x1="840.0" y1="116.0" x2="840.0" y2="160.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="840.0,160.0 836.3,151.8 843.7,151.8" style="fill:#55545a"/><rect x="20" y="40" width="280" height="76" style="fill:#ffffff;stroke:#1f5ba8;stroke-width:3"/><text x="32.0" y="75.2" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Inside 96-gon (exact)</text><text x="32.0" y="92.4" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">3.1410320</text><rect x="20" y="160" width="280" height="76" style="fill:#ffffff;stroke:#1f5ba8;stroke-width:3"/><text x="32.0" y="195.2" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Rounded down: 223/71</text><text x="32.0" y="212.4" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">3.1408451, gives up 0.000187</text><rect x="360" y="100" width="280" height="76" style="fill:#ffffff;stroke:#d5352a;stroke-width:3"/><text x="372.0" y="137.7" text-anchor="start" style="fill:#17171a;font-size:22px;font-weight:700">π</text><text x="372.0" y="157.0" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">3.1415927…</text><rect x="700" y="40" width="280" height="76" style="fill:#ffffff;stroke:#1f5ba8;stroke-width:3"/><text x="712.0" y="75.2" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Outside 96-gon (exact)</text><text x="712.0" y="92.4" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">3.1427146</text><rect x="700" y="160" width="280" height="76" style="fill:#ffffff;stroke:#1f5ba8;stroke-width:3"/><text x="712.0" y="195.2" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Rounded up: 22/7</text><text x="712.0" y="212.4" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">3.1428571, gives up 0.000143</text><text x="500.0" y="30.0" text-anchor="middle" style="fill:#7d7c84;font-size:11px;font-weight:700;letter-spacing:.08em">SMALLER ←   → BIGGER</text></svg>
