<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" role="img" aria-label="How the sieve combined with other ideas, from Euclid&#x27;s primes to lazy functional programs" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>How the sieve combined with other ideas, from Euclid&#x27;s primes to lazy functional programs</title><line x1="285.0" y1="106.0" x2="500.0" y2="150.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="500.0,150.0 491.2,151.9 492.7,144.8" style="fill:#55545a"/><line x1="715.0" y1="106.0" x2="500.0" y2="150.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="500.0,150.0 507.3,144.8 508.8,151.9" style="fill:#55545a"/><line x1="500.0" y1="236.0" x2="125.0" y2="300.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="125.0,300.0 132.5,295.0 133.7,302.2" style="fill:#55545a"/><line x1="500.0" y1="236.0" x2="375.0" y2="300.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="375.0,300.0 380.6,293.0 384.0,299.5" style="fill:#55545a"/><line x1="500.0" y1="236.0" x2="875.0" y2="300.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="875.0,300.0 866.3,302.2 867.5,295.0" style="fill:#55545a"/><line x1="500.0" y1="236.0" x2="625.0" y2="300.0" style="stroke:#55545a;stroke-width:1.5;stroke-dasharray:5 4"/><polygon points="625.0,300.0 616.0,299.5 619.4,293.0" style="fill:#55545a"/><line x1="875.0" y1="386.0" x2="875.0" y2="450.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="875.0,450.0 871.3,441.8 878.7,441.8" style="fill:#55545a"/><rect x="180" y="20" width="210" height="86" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="192.0" y="60.2" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Primes defined</text><text x="192.0" y="77.4" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">Euclid&#x27;s Elements VII, topic 7</text><rect x="610" y="20" width="210" height="86" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="622.0" y="60.2" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Counting on by p</text><text x="622.0" y="77.4" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">repeated addition, topics 2 and 5</text><rect x="395" y="150" width="210" height="86" style="fill:#ffffff;stroke:#d5352a;stroke-width:3"/><text x="407.0" y="181.9" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">The sieve</text><text x="407.0" y="199.2" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">⊕ cross out multiples</text><text x="407.0" y="215.7" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">Eratosthenes, c. 240 BCE</text><rect x="20" y="300" width="210" height="86" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="32.0" y="340.2" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Segmented sieve</text><text x="32.0" y="357.4" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">⊕ one window at a time</text><rect x="270" y="300" width="210" height="86" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="282.0" y="331.9" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Linear sieve</text><text x="282.0" y="349.2" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">⊕ cross each number once</text><text x="282.0" y="365.7" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">1978 or 1987 (disputed)</text><rect x="520" y="300" width="210" height="86" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="532.0" y="331.9" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">How many primes?</text><text x="532.0" y="349.2" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">π(n) ≈ n / ln n</text><text x="532.0" y="365.7" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">proved 1896</text><rect x="770" y="300" width="210" height="86" style="fill:#ffffff;stroke:#1f5ba8;stroke-width:3"/><text x="782.0" y="331.9" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Lazy sieves</text><text x="782.0" y="349.2" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">⊕ infinite lists</text><text x="782.0" y="365.7" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">O&#x27;Neill 2009; Gibbons 2025</text><rect x="770" y="450" width="210" height="86" style="fill:#ffffff;stroke:#1f5ba8;stroke-width:3"/><text x="782.0" y="481.9" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">The &#x27;unfaithful sieve&#x27;</text><text x="782.0" y="499.2" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">trial division in disguise</text><text x="782.0" y="515.7" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">O&#x27;Neill&#x27;s warning</text><text x="20.0" y="600.0" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">Dashed: the sieve supplies the counts; the theorem came from analysis, not from sieving.</text></svg>
