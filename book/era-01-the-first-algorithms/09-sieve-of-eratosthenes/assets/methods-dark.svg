<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" width="1000" height="250" role="img" aria-label="Six ways to list the primes below 100,000, by the work they do" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>Six ways to list the primes below 100,000, by the work they do</title><line x1="165.0" y1="105.0" x2="183.0" y2="105.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="183.0,105.0 174.8,108.7 174.8,101.3" style="fill:#b9b8b2"/><line x1="328.0" y1="105.0" x2="346.0" y2="105.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="346.0,105.0 337.8,108.7 337.8,101.3" style="fill:#b9b8b2"/><line x1="491.0" y1="105.0" x2="509.0" y2="105.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="509.0,105.0 500.8,108.7 500.8,101.3" style="fill:#b9b8b2"/><line x1="654.0" y1="105.0" x2="672.0" y2="105.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="672.0,105.0 663.8,108.7 663.8,101.3" style="fill:#b9b8b2"/><line x1="817.0" y1="105.0" x2="835.0" y2="105.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="835.0,105.0 826.8,108.7 826.8,101.3" style="fill:#b9b8b2"/><rect x="20" y="60" width="145" height="90" style="fill:#0d1117;stroke:#f0584d;stroke-width:3"/><text x="32.0" y="93.9" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Unfaithful sieve</text><text x="32.0" y="111.1" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">46,314,477</text><text x="32.0" y="127.6" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">divisions</text><rect x="183" y="60" width="145" height="90" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="195.0" y="102.1" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Trial division</text><text x="195.0" y="119.4" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">744,436 divisions</text><rect x="346" y="60" width="145" height="90" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="358.0" y="102.1" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Textbook sieve</text><text x="358.0" y="119.4" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">193,078 crossings</text><rect x="509" y="60" width="145" height="90" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="521.0" y="92.2" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Every odd</text><text x="521.0" y="112.0" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">number</text><text x="521.0" y="129.3" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">113,247 crossings</text><rect x="672" y="60" width="145" height="90" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="684.0" y="102.1" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Linear sieve</text><text x="684.0" y="119.4" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">90,407 crossings</text><rect x="835" y="60" width="145" height="90" style="fill:#0d1117;stroke:#5b8fe0;stroke-width:3"/><text x="847.0" y="102.1" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Odd primes only</text><text x="847.0" y="119.4" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">71,556 crossings</text><text x="20.0" y="38.0" text-anchor="start" style="fill:#8f8e96;font-size:11px;font-weight:700;letter-spacing:.08em">LESS WORK TO THE RIGHT; ALL SIX FIND THE SAME 9,592 PRIMES</text><text x="20.0" y="190.0" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">Divisions and crossings are not the same cost, but each is one basic step of its method.</text><text x="20.0" y="212.0" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">The every-odd and odd-primes rows skip even numbers; the textbook sieve crosses them too.</text></svg>
