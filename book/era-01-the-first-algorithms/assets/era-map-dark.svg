<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 716" width="1000" height="716" role="img" aria-label="How the ideas of Era 1 combined: The First Algorithms" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>How the ideas of Era 1 combined: The First Algorithms</title><line x1="500.0" y1="96.0" x2="500.0" y2="150.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="500.0,150.0 496.3,141.8 503.7,141.8" style="fill:#b9b8b2"/><rect x="505.0" y="115.0" width="128.0" height="19" rx="3" style="fill:#0d1117"/><text x="510.0" y="128.0" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">⊕ bundle the marks</text><line x1="500.0" y1="226.0" x2="135.0" y2="300.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="135.0,300.0 142.3,294.8 143.8,302.0" style="fill:#b9b8b2"/><rect x="178.4" y="258.9" width="190.7" height="19" rx="3" style="fill:#0d1117"/><text x="273.7" y="271.9" text-anchor="middle" style="fill:#ecebe6;font-size:12.5px;font-weight:600">⊕ position carries the group</text><line x1="500.0" y1="226.0" x2="500.0" y2="300.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="500.0,300.0 496.3,291.8 503.7,291.8" style="fill:#b9b8b2"/><rect x="505.0" y="255.0" width="113.2" height="19" rx="3" style="fill:#0d1117"/><text x="510.0" y="268.0" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">⊕ double and add</text><line x1="500.0" y1="226.0" x2="865.0" y2="300.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="865.0,300.0 856.2,302.0 857.7,294.8" style="fill:#b9b8b2"/><rect x="689.6" y="266.3" width="146.4" height="19" rx="3" style="fill:#0d1117"/><text x="762.8" y="279.3" text-anchor="middle" style="fill:#ecebe6;font-size:12.5px;font-weight:600">⊕ counters in columns</text><line x1="135.0" y1="376.0" x2="135.0" y2="460.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="135.0,460.0 131.3,451.8 138.7,451.8" style="fill:#b9b8b2"/><rect x="140.0" y="410.0" width="139.1" height="19" rx="3" style="fill:#0d1117"/><text x="145.0" y="423.0" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">⊕ base-60 fractions</text><line x1="500.0" y1="376.0" x2="500.0" y2="460.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="500.0,460.0 496.3,451.8 503.7,451.8" style="fill:#b9b8b2"/><rect x="505.0" y="410.0" width="201.8" height="19" rx="3" style="fill:#0d1117"/><text x="510.0" y="423.0" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">⊕ how many times does one fit?</text><line x1="605.0" y1="498.0" x2="760.0" y2="498.0" style="stroke:#b9b8b2;stroke-width:1.5;stroke-dasharray:5 4"/><polygon points="760.0,498.0 751.8,501.7 751.8,494.3" style="fill:#b9b8b2"/><rect x="607.4" y="475.0" width="150.1" height="19" rx="3" style="fill:#0d1117"/><text x="682.5" y="488.0" text-anchor="middle" style="fill:#ecebe6;font-size:12.5px;font-weight:600">⊕ primes, Elements VII</text><line x1="135.0" y1="536.0" x2="317.0" y2="620.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="317.0,620.0 308.0,619.9 311.1,613.2" style="fill:#b9b8b2"/><rect x="43.4" y="570.0" width="179.6" height="19" rx="3" style="fill:#0d1117"/><text x="218.0" y="583.0" text-anchor="end" style="fill:#ecebe6;font-size:12.5px;font-weight:600">⊕ roots trapped both ways</text><line x1="500.0" y1="536.0" x2="317.0" y2="620.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="317.0,620.0 322.9,613.2 326.0,619.9" style="fill:#b9b8b2"/><rect x="411.5" y="570.0" width="179.6" height="19" rx="3" style="fill:#0d1117"/><text x="416.5" y="583.0" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">⊕ exhaustion, Elements XII</text><rect x="395" y="20" width="210" height="76" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="407.0" y="55.2" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">1. Tally Marks</text><text x="407.0" y="72.4" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">c. 44,000–20,000 years ago</text><rect x="395" y="150" width="210" height="76" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="407.0" y="175.2" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">2. Grouping and the</text><text x="407.0" y="195.1" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">First Carry</text><text x="407.0" y="212.3" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">c. 3000 BCE</text><rect x="30" y="300" width="210" height="76" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="42.0" y="335.2" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">3. Babylonian Place Value</text><text x="42.0" y="352.4" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">c. 1800 BCE</text><rect x="395" y="300" width="210" height="76" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="407.0" y="335.2" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">5. Egyptian Doubling</text><text x="407.0" y="352.4" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">c. 1550 BCE</text><rect x="760" y="300" width="210" height="76" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="772.0" y="335.2" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">6. Counting Boards</text><text x="772.0" y="352.4" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">c. 300 BCE</text><rect x="30" y="460" width="210" height="76" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="42.0" y="485.2" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">4. The Square Root of</text><text x="42.0" y="505.1" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Two</text><text x="42.0" y="522.3" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">c. 1800–1600 BCE</text><rect x="395" y="460" width="210" height="76" style="fill:#0d1117;stroke:#f0584d;stroke-width:3"/><text x="407.0" y="495.2" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">7. Euclid&#x27;s Algorithm</text><text x="407.0" y="512.4" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">c. 300 BCE</text><rect x="760" y="460" width="210" height="76" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="772.0" y="485.2" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">9. The Sieve of</text><text x="772.0" y="505.1" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Eratosthenes</text><text x="772.0" y="522.3" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">c. 240 BCE</text><rect x="212" y="620" width="210" height="76" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="224.0" y="645.2" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">8. Archimedes Squeezes</text><text x="224.0" y="665.0" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Pi</text><text x="224.0" y="682.3" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">c. 250 BCE</text></svg>
