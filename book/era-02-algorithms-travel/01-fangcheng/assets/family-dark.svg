<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" role="img" aria-label="How fangcheng combined with other ideas, from the counting board to the TOP500 list" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>How fangcheng combined with other ideas, from the counting board to the TOP500 list</title><line x1="285.0" y1="106.0" x2="448.0" y2="160.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="448.0,160.0 439.0,160.9 441.4,153.9" style="fill:#b9b8b2"/><line x1="715.0" y1="106.0" x2="552.0" y2="160.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="552.0,160.0 558.6,153.9 561.0,160.9" style="fill:#b9b8b2"/><line x1="409.0" y1="246.0" x2="125.0" y2="320.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="125.0,320.0 132.0,314.4 133.9,321.5" style="fill:#b9b8b2"/><line x1="461.0" y1="246.0" x2="375.0" y2="320.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="375.0,320.0 378.8,311.9 383.6,317.4" style="fill:#b9b8b2"/><line x1="539.0" y1="246.0" x2="625.0" y2="320.0" style="stroke:#b9b8b2;stroke-width:1.5;stroke-dasharray:5 4"/><polygon points="625.0,320.0 616.4,317.4 621.2,311.9" style="fill:#b9b8b2"/><line x1="591.0" y1="246.0" x2="875.0" y2="320.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="875.0,320.0 866.1,321.5 868.0,314.4" style="fill:#b9b8b2"/><line x1="625.0" y1="406.0" x2="625.0" y2="470.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="625.0,470.0 621.3,461.8 628.7,461.8" style="fill:#b9b8b2"/><line x1="625.0" y1="556.0" x2="625.0" y2="590.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="625.0,590.0 621.3,581.8 628.7,581.8" style="fill:#b9b8b2"/><rect x="180" y="20" width="210" height="86" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="192.0" y="60.2" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Rods in columns</text><text x="192.0" y="77.4" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">the counting board, Era 1 topic 6</text><rect x="610" y="20" width="210" height="86" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="622.0" y="51.9" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Subtract until it is gone</text><text x="622.0" y="69.2" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">as in Euclid&#x27;s algorithm, Era 1</text><text x="622.0" y="85.7" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">topic 7</text><rect x="370" y="160" width="260" height="86" style="fill:#0d1117;stroke:#f0584d;stroke-width:3"/><text x="382.0" y="191.9" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Fangcheng</text><text x="382.0" y="209.2" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">⊕ eliminate column against column</text><text x="382.0" y="225.7" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">Nine Chapters, c. 200 BCE – 50 CE</text><rect x="20" y="320" width="210" height="86" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="32.0" y="343.7" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Negative numbers</text><text x="32.0" y="360.9" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">⊕ red and black rods, a sign</text><text x="32.0" y="377.4" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">rule</text><text x="32.0" y="393.9" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">same chapter</text><rect x="270" y="320" width="210" height="86" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="282.0" y="343.7" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Qin Jiushao</text><text x="282.0" y="360.9" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">⊕ shift a polynomial on the</text><text x="282.0" y="377.4" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">board</text><text x="282.0" y="393.9" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">1247, topic 9</text><rect x="520" y="320" width="210" height="86" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="532.0" y="351.9" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Elimination in Europe</text><text x="532.0" y="369.2" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">found again, independently</text><text x="532.0" y="385.7" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">Newton c. 1670; Gauss 1809</text><rect x="770" y="320" width="210" height="86" style="fill:#0d1117;stroke:#5b8fe0;stroke-width:3"/><text x="782.0" y="351.9" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Bareiss</text><text x="782.0" y="369.2" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">⊕ divide exactly as you go</text><text x="782.0" y="385.7" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">1968</text><rect x="520" y="470" width="210" height="86" style="fill:#0d1117;stroke:#5b8fe0;stroke-width:3"/><text x="532.0" y="493.7" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Turing; von Neumann</text><text x="532.0" y="510.9" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">⊕ rounding error, LU,</text><text x="532.0" y="527.4" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">condition number</text><text x="532.0" y="543.9" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">1947–1948</text><rect x="520" y="590" width="210" height="86" style="fill:#0d1117;stroke:#5b8fe0;stroke-width:3"/><text x="532.0" y="613.6" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">LINPACK benchmark</text><text x="532.0" y="630.9" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">⊕ rank the fastest</text><text x="532.0" y="647.4" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">computers</text><text x="532.0" y="663.9" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">the TOP500 list</text><text x="20.0" y="690.0" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">Dashed: Europe&#x27;s elimination arose independently (Grcar). Blue: what machines needed.</text></svg>
