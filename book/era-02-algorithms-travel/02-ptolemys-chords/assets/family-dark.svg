<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" role="img" aria-label="How Ptolemy&#x27;s table combined older ideas, and where the sine came from" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>How Ptolemy&#x27;s table combined older ideas, and where the sine came from</title><line x1="125.0" y1="106.0" x2="437.0" y2="160.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="437.0,160.0 428.3,162.2 429.5,155.0" style="fill:#b9b8b2"/><line x1="375.0" y1="106.0" x2="489.5" y2="160.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="489.5,160.0 480.5,159.8 483.6,153.2" style="fill:#b9b8b2"/><line x1="625.0" y1="106.0" x2="552.5" y2="160.0" style="stroke:#b9b8b2;stroke-width:1.5;stroke-dasharray:5 4"/><polygon points="552.5,160.0 556.9,152.1 561.3,158.0" style="fill:#b9b8b2"/><line x1="437.0" y1="246.0" x2="250.0" y2="320.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="250.0,320.0 256.3,313.6 259.0,320.4" style="fill:#b9b8b2"/><line x1="250.0" y1="406.0" x2="250.0" y2="470.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="250.0,470.0 246.3,461.8 253.7,461.8" style="fill:#b9b8b2"/><line x1="542.0" y1="246.0" x2="625.0" y2="320.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="625.0,320.0 616.4,317.3 621.3,311.8" style="fill:#b9b8b2"/><line x1="594.5" y1="246.0" x2="875.0" y2="320.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="875.0,320.0 866.1,321.5 868.0,314.4" style="fill:#b9b8b2"/><rect x="20" y="20" width="210" height="86" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="32.0" y="60.2" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Base 60 and tables</text><text x="32.0" y="77.4" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">Babylon, Era 1 topic 3</text><rect x="270" y="20" width="210" height="86" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="282.0" y="51.9" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Inscribed polygons</text><text x="282.0" y="69.2" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">Euclid XIII; Archimedes, topics</text><text x="282.0" y="85.7" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">7–8</text><rect x="520" y="20" width="210" height="86" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="532.0" y="51.9" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Hipparchus&#x27;s chords</text><text x="532.0" y="69.2" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">the first table, now lost</text><text x="532.0" y="85.7" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">c. 140 BCE</text><rect x="395" y="160" width="210" height="86" style="fill:#0d1117;stroke:#f0584d;stroke-width:3"/><text x="407.0" y="183.7" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Ptolemy&#x27;s table</text><text x="407.0" y="200.9" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">⊕ a seed, growth rules,</text><text x="407.0" y="217.4" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">interpolation</text><text x="407.0" y="233.9" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">Almagest, c. 150 CE</text><rect x="145" y="320" width="210" height="86" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="157.0" y="351.9" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Half-chords: jya</text><text x="157.0" y="369.2" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">⊕ use half the chord</text><text x="157.0" y="385.7" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">Aryabhata, c. 500</text><rect x="145" y="470" width="210" height="86" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="157.0" y="501.9" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">jya → jiba → sinus</text><text x="157.0" y="519.2" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">the word travels</text><text x="157.0" y="535.7" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">Arabic, then Latin</text><rect x="520" y="320" width="210" height="86" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="532.0" y="351.9" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Regiomontanus</text><text x="532.0" y="369.2" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">De triangulis omnimodis</text><text x="532.0" y="385.7" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">written c. 1464, printed 1533</text><rect x="770" y="320" width="210" height="86" style="fill:#0d1117;stroke:#5b8fe0;stroke-width:3"/><text x="782.0" y="351.9" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">The C library&#x27;s sin(x)</text><text x="782.0" y="369.2" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">⊕ table + the sum rule</text><text x="782.0" y="385.7" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">glibc (IBM&#x27;s library)</text><text x="20.0" y="610.0" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">Dashed: Hipparchus&#x27;s table is lost, so how much Ptolemy took from it is not known.</text></svg>
