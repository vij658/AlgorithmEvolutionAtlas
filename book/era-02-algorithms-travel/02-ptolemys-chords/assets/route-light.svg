<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" role="img" aria-label="Ptolemy&#x27;s route from the seed chords to the chord of half a degree" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>Ptolemy&#x27;s route from the seed chords to the chord of half a degree</title><line x1="487.0" y1="90.0" x2="321.0" y2="150.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="321.0,150.0 327.5,143.8 330.0,150.7" style="fill:#55545a"/><line x1="291.0" y1="90.0" x2="261.0" y2="150.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="261.0,150.0 261.4,141.0 268.0,144.3" style="fill:#55545a"/><line x1="366.0" y1="185.0" x2="412.0" y2="185.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="412.0,185.0 403.8,188.7 403.8,181.3" style="fill:#55545a"/><line x1="562.0" y1="185.0" x2="608.0" y2="185.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="608.0,185.0 599.8,188.7 599.8,181.3" style="fill:#55545a"/><line x1="758.0" y1="185.0" x2="804.0" y2="185.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="804.0,185.0 795.8,188.7 795.8,181.3" style="fill:#55545a"/><line x1="879.0" y1="220.0" x2="879.0" y2="290.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="879.0,290.0 875.3,281.8 882.7,281.8" style="fill:#55545a"/><line x1="804.0" y1="325.0" x2="762.0" y2="325.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="762.0,325.0 770.2,321.3 770.2,328.7" style="fill:#55545a"/><line x1="834.0" y1="220.0" x2="719.2" y2="290.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="719.2,290.0 724.3,282.6 728.1,288.9" style="fill:#55545a"/><line x1="548.0" y1="325.0" x2="506.0" y2="325.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="506.0,325.0 514.2,321.3 514.2,328.7" style="fill:#55545a"/><line x1="316.0" y1="325.0" x2="260.0" y2="325.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="260.0,325.0 268.2,321.3 268.2,328.7" style="fill:#55545a"/><rect x="20" y="20" width="150" height="70" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="32.0" y="52.2" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">36°</text><text x="32.0" y="69.4" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">decagon</text><rect x="216" y="20" width="150" height="70" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="228.0" y="52.2" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">60°</text><text x="228.0" y="69.4" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">hexagon</text><rect x="412" y="20" width="150" height="70" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="424.0" y="52.2" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">72°</text><text x="424.0" y="69.4" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">pentagon</text><rect x="608" y="20" width="150" height="70" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="620.0" y="52.2" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">90°</text><text x="620.0" y="69.4" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">square</text><rect x="804" y="20" width="150" height="70" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="816.0" y="52.2" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">120°</text><text x="816.0" y="69.4" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">triangle</text><rect x="216" y="150" width="150" height="70" style="fill:#ffffff;stroke:#1f5ba8;stroke-width:3"/><text x="228.0" y="173.9" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">12°</text><text x="228.0" y="191.2" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">72° − 60°</text><text x="228.0" y="207.7" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">12;32,36</text><rect x="412" y="150" width="150" height="70" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="424.0" y="173.9" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">6°</text><text x="424.0" y="191.2" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">halve</text><text x="424.0" y="207.7" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">6;16,49</text><rect x="608" y="150" width="150" height="70" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="620.0" y="173.9" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">3°</text><text x="620.0" y="191.2" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">halve</text><text x="620.0" y="207.7" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">3;8,28</text><rect x="804" y="150" width="150" height="70" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="816.0" y="173.9" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">1½°</text><text x="816.0" y="191.2" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">halve</text><text x="816.0" y="207.7" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">1;34,15</text><rect x="804" y="290" width="150" height="70" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="816.0" y="313.9" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">¾°</text><text x="816.0" y="331.2" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">halve</text><text x="816.0" y="347.7" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">0;47,7</text><rect x="548" y="290" width="214" height="70" style="fill:#ffffff;stroke:#d5352a;stroke-width:3"/><text x="560.0" y="313.9" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">1°</text><text x="560.0" y="331.2" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">squeezed by ¾° and 1½°</text><text x="560.0" y="347.7" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">1;2,50</text><rect x="316" y="290" width="190" height="70" style="fill:#ffffff;stroke:#d5352a;stroke-width:3"/><text x="328.0" y="313.9" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">½°</text><text x="328.0" y="331.2" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">halve 1°</text><text x="328.0" y="347.7" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">0;31,25</text><rect x="20" y="290" width="240" height="70" style="fill:#ffffff;stroke:#1f5ba8;stroke-width:3"/><text x="32.0" y="313.9" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Every ½° to 180°</text><text x="32.0" y="331.2" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">add ½° with the sum rule</text><text x="32.0" y="347.7" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">360 entries</text><text x="20.0" y="405.0" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">Blue: the sum and difference rules (Ptolemy&#x27;s theorem). Red: where halving and differences cannot reach.</text></svg>
