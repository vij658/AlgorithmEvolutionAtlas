<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" width="960" height="700" role="img" aria-label="Each fix leaves a new pain: from Sunzi&#x27;s puzzle to RSA" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>Each fix leaves a new pain: from Sunzi&#x27;s puzzle to RSA</title><line x1="400.0" y1="66.0" x2="560.0" y2="66.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="560.0,66.0 551.8,69.7 551.8,62.3" style="fill:#55545a"/><rect x="449.2" y="45.0" width="61.6" height="19" rx="3" style="fill:#ffffff"/><text x="480.0" y="58.0" text-anchor="middle" style="fill:#17171a;font-size:12.5px;font-weight:600">fixed by</text><line x1="750.0" y1="112.0" x2="750.0" y2="162.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="750.0,162.0 746.3,153.8 753.7,153.8" style="fill:#55545a"/><rect x="757.0" y="129.0" width="175.9" height="19" rx="3" style="fill:#ffffff"/><text x="762.0" y="142.0" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">which leaves a new problem</text><line x1="560.0" y1="208.0" x2="400.0" y2="208.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="400.0,208.0 408.2,204.3 408.2,211.7" style="fill:#55545a"/><rect x="449.2" y="187.0" width="61.6" height="19" rx="3" style="fill:#ffffff"/><text x="480.0" y="200.0" text-anchor="middle" style="fill:#17171a;font-size:12.5px;font-weight:600">fixed by</text><line x1="210.0" y1="254.0" x2="210.0" y2="304.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="210.0,304.0 206.3,295.8 213.7,295.8" style="fill:#55545a"/><line x1="400.0" y1="350.0" x2="560.0" y2="350.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="560.0,350.0 551.8,353.7 551.8,346.3" style="fill:#55545a"/><rect x="449.2" y="329.0" width="61.6" height="19" rx="3" style="fill:#ffffff"/><text x="480.0" y="342.0" text-anchor="middle" style="fill:#17171a;font-size:12.5px;font-weight:600">fixed by</text><line x1="750.0" y1="396.0" x2="750.0" y2="446.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="750.0,446.0 746.3,437.8 753.7,437.8" style="fill:#55545a"/><line x1="560.0" y1="492.0" x2="400.0" y2="492.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="400.0,492.0 408.2,488.3 408.2,495.7" style="fill:#55545a"/><rect x="449.2" y="471.0" width="61.6" height="19" rx="3" style="fill:#ffffff"/><text x="480.0" y="484.0" text-anchor="middle" style="fill:#17171a;font-size:12.5px;font-weight:600">fixed by</text><line x1="210.0" y1="538.0" x2="210.0" y2="588.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="210.0,588.0 206.3,579.8 213.7,579.8" style="fill:#55545a"/><line x1="400.0" y1="634.0" x2="560.0" y2="634.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="560.0,634.0 551.8,637.7 551.8,630.3" style="fill:#55545a"/><rect x="449.2" y="613.0" width="61.6" height="19" rx="3" style="fill:#ffffff"/><text x="480.0" y="626.0" text-anchor="middle" style="fill:#17171a;font-size:12.5px;font-weight:600">fixed by</text><rect x="20" y="20" width="380" height="92" style="fill:#ffffff;stroke:#d5352a;stroke-width:3"/><text x="32.0" y="53.5" text-anchor="start" style="fill:#7d7c84;font-size:11px;font-weight:700;letter-spacing:.08em">WHAT HURT</text><text x="32.0" y="69.5" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">Find a number from its remainders: searching takes 23</text><text x="32.0" y="86.0" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">tries even for 3, 5 and 7</text><rect x="560" y="20" width="380" height="92" style="fill:#ffffff;stroke:#1f5ba8;stroke-width:3"/><text x="572.0" y="45.2" text-anchor="start" style="fill:#7d7c84;font-size:11px;font-weight:700;letter-spacing:.08em">THE FIX</text><text x="572.0" y="61.3" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">Ready-made multipliers: 70, 21, 15; multiply, add, cast out</text><text x="572.0" y="77.8" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">105</text><text x="572.0" y="94.3" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">Sunzi, 3rd–5th century</text><rect x="560" y="162" width="380" height="92" style="fill:#ffffff;stroke:#d5352a;stroke-width:3"/><text x="572.0" y="195.5" text-anchor="start" style="fill:#7d7c84;font-size:11px;font-weight:700;letter-spacing:.08em">WHAT HURT</text><text x="572.0" y="211.5" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">Those multipliers only work for 3, 5 and 7; every new set</text><text x="572.0" y="228.0" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">of cycles needs new ones</text><rect x="20" y="162" width="380" height="92" style="fill:#ffffff;stroke:#1f5ba8;stroke-width:3"/><text x="32.0" y="187.2" text-anchor="start" style="fill:#7d7c84;font-size:11px;font-weight:700;letter-spacing:.08em">THE FIX</text><text x="32.0" y="203.3" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">The dayan rule finds any multiplier on the board: Euclid&#x27;s</text><text x="32.0" y="219.8" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">divisions with a running record</text><text x="32.0" y="236.3" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">Qin Jiushao, 1247</text><rect x="20" y="304" width="380" height="92" style="fill:#ffffff;stroke:#d5352a;stroke-width:3"/><text x="32.0" y="337.5" text-anchor="start" style="fill:#7d7c84;font-size:11px;font-weight:700;letter-spacing:.08em">WHAT HURT</text><text x="32.0" y="353.5" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">Cycles can share factors, like 12 and 18, and then the</text><text x="32.0" y="370.0" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">multipliers do not exist</text><rect x="560" y="304" width="380" height="92" style="fill:#ffffff;stroke:#1f5ba8;stroke-width:3"/><text x="572.0" y="329.2" text-anchor="start" style="fill:#7d7c84;font-size:11px;font-weight:700;letter-spacing:.08em">THE FIX</text><text x="572.0" y="345.3" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">Replace them with coprime divisors that give the same</text><text x="572.0" y="361.8" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">answer, or show that none exists</text><text x="572.0" y="378.3" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">Qin Jiushao, 1247</text><rect x="560" y="446" width="380" height="92" style="fill:#ffffff;stroke:#d5352a;stroke-width:3"/><text x="572.0" y="479.5" text-anchor="start" style="fill:#7d7c84;font-size:11px;font-weight:700;letter-spacing:.08em">WHAT HURT</text><text x="572.0" y="495.5" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">Search grows with the product of the cycles: 19-digit</text><text x="572.0" y="512.0" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">repeats for 6 cycles near 1,000</text><rect x="20" y="446" width="380" height="92" style="fill:#ffffff;stroke:#1f5ba8;stroke-width:3"/><text x="32.0" y="471.2" text-anchor="start" style="fill:#7d7c84;font-size:11px;font-weight:700;letter-spacing:.08em">THE FIX</text><text x="32.0" y="487.3" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">The rule grows with the digits instead: 42 divisions for 6</text><text x="32.0" y="503.8" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">cycles</text><text x="32.0" y="520.3" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">the program&#x27;s measurement</text><rect x="20" y="588" width="380" height="92" style="fill:#ffffff;stroke:#d5352a;stroke-width:3"/><text x="32.0" y="621.5" text-anchor="start" style="fill:#7d7c84;font-size:11px;font-weight:700;letter-spacing:.08em">WHAT HURT</text><text x="32.0" y="637.5" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">RSA decryption raises a 600-digit number to a 600-digit</text><text x="32.0" y="654.0" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">power</text><rect x="560" y="588" width="380" height="92" style="fill:#ffffff;stroke:#1f5ba8;stroke-width:3"/><text x="572.0" y="613.2" text-anchor="start" style="fill:#7d7c84;font-size:11px;font-weight:700;letter-spacing:.08em">THE FIX</text><text x="572.0" y="629.3" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">Do it modulo each prime and recombine: 4.0 times fewer</text><text x="572.0" y="645.8" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">word products</text><text x="572.0" y="662.3" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">PKCS #1 (RFC 8017)</text></svg>
