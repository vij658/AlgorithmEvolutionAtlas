<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="1000" height="650" role="img" aria-label="How the remainder problem combined older ideas, from Sunzi to RSA" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>How the remainder problem combined older ideas, from Sunzi to RSA</title><line x1="125.0" y1="106.0" x2="125.0" y2="170.0" style="stroke:#b9b8b2;stroke-width:1.5;stroke-dasharray:5 4"/><polygon points="125.0,170.0 121.3,161.8 128.7,161.8" style="fill:#b9b8b2"/><line x1="230.0" y1="88.8" x2="395.0" y2="187.2" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="395.0,187.2 386.1,186.1 389.8,179.8" style="fill:#b9b8b2"/><line x1="500.0" y1="106.0" x2="500.0" y2="170.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="500.0,170.0 496.3,161.8 503.7,161.8" style="fill:#b9b8b2"/><line x1="230.0" y1="213.0" x2="395.0" y2="213.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="395.0,213.0 386.8,216.7 386.8,209.3" style="fill:#b9b8b2"/><line x1="605.0" y1="63.0" x2="875.0" y2="170.0" style="stroke:#b9b8b2;stroke-width:1.5;stroke-dasharray:5 4"/><polygon points="875.0,170.0 866.0,170.4 868.7,163.6" style="fill:#b9b8b2"/><line x1="500.0" y1="256.0" x2="500.0" y2="330.0" style="stroke:#b9b8b2;stroke-width:1.5;stroke-dasharray:5 4"/><polygon points="500.0,330.0 496.3,321.8 503.7,321.8" style="fill:#b9b8b2"/><line x1="125.0" y1="256.0" x2="125.0" y2="330.0" style="stroke:#b9b8b2;stroke-width:1.5;stroke-dasharray:5 4"/><polygon points="125.0,330.0 121.3,321.8 128.7,321.8" style="fill:#b9b8b2"/><line x1="500.0" y1="416.0" x2="500.0" y2="480.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="500.0,480.0 496.3,471.8 503.7,471.8" style="fill:#b9b8b2"/><rect x="20" y="20" width="210" height="86" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="32.0" y="60.2" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Calendar cycles</text><text x="32.0" y="77.4" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">60-day cycle, months, years</text><rect x="395" y="20" width="210" height="86" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="407.0" y="60.2" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Euclid&#x27;s algorithm</text><text x="407.0" y="77.4" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">Era 1, topic 7</text><rect x="20" y="170" width="210" height="86" style="fill:#0d1117;stroke:#f0584d;stroke-width:3"/><text x="32.0" y="193.7" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Sunzi&#x27;s rule</text><text x="32.0" y="210.9" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">⊕ ready-made multipliers 70,</text><text x="32.0" y="227.4" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">21, 15</text><text x="32.0" y="243.9" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">3rd–5th century CE</text><rect x="395" y="170" width="210" height="86" style="fill:#0d1117;stroke:#f0584d;stroke-width:3"/><text x="407.0" y="193.7" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Qin&#x27;s dayan rule</text><text x="407.0" y="210.9" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">⊕ find any multiplier on the</text><text x="407.0" y="227.4" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">board</text><text x="407.0" y="243.9" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">1247</text><rect x="770" y="170" width="210" height="86" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="782.0" y="193.7" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Aryabhata&#x27;s kuttaka</text><text x="782.0" y="210.9" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">the pulverizer, found</text><text x="782.0" y="227.4" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">separately</text><text x="782.0" y="243.9" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">India, c. 500</text><rect x="395" y="330" width="210" height="86" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="407.0" y="361.9" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Gauss</text><text x="407.0" y="379.2" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">the theorem, in congruences</text><text x="407.0" y="395.7" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">Disquisitiones, 1801</text><rect x="395" y="480" width="210" height="86" style="fill:#0d1117;stroke:#5b8fe0;stroke-width:3"/><text x="407.0" y="503.7" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">RSA by remainders</text><text x="407.0" y="520.9" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">⊕ decrypt mod p and mod q,</text><text x="407.0" y="537.4" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">recombine</text><text x="407.0" y="553.9" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">PKCS #1, RFC 8017</text><rect x="20" y="330" width="210" height="86" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="32.0" y="353.7" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Fibonacci</text><text x="32.0" y="370.9" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">solved such puzzles case by</text><text x="32.0" y="387.4" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">case</text><text x="32.0" y="403.9" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">Liber Abaci, 1202</text><text x="20.0" y="620.0" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">Dashed: a link of ideas without a documented line of transmission. Sunzi&#x27;s link to calendars is a conjecture.</text></svg>
