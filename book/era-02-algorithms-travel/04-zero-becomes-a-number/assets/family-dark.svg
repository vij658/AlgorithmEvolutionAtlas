<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" role="img" aria-label="How zero became a number, and where its rules ended up" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>How zero became a number, and where its rules ended up</title><line x1="230.0" y1="63.0" x2="270.0" y2="63.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="270.0,63.0 261.8,66.7 261.8,59.3" style="fill:#b9b8b2"/><line x1="375.0" y1="106.0" x2="292.0" y2="170.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="292.0,170.0 296.3,162.1 300.7,167.9" style="fill:#b9b8b2"/><line x1="355.0" y1="213.0" x2="520.0" y2="213.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="520.0,213.0 511.8,216.7 511.8,209.3" style="fill:#b9b8b2"/><line x1="875.0" y1="106.0" x2="688.0" y2="170.0" style="stroke:#b9b8b2;stroke-width:1.5;stroke-dasharray:5 4"/><polygon points="688.0,170.0 694.6,163.9 697.0,170.8" style="fill:#b9b8b2"/><line x1="250.0" y1="256.0" x2="250.0" y2="330.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="250.0,330.0 246.3,321.8 253.7,321.8" style="fill:#b9b8b2"/><line x1="250.0" y1="416.0" x2="250.0" y2="470.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="250.0,470.0 246.3,461.8 253.7,461.8" style="fill:#b9b8b2"/><line x1="583.0" y1="256.0" x2="625.0" y2="330.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="625.0,330.0 617.8,324.7 624.1,321.0" style="fill:#b9b8b2"/><line x1="688.0" y1="256.0" x2="833.0" y2="330.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="833.0,330.0 824.0,329.5 827.3,323.0" style="fill:#b9b8b2"/><rect x="20" y="20" width="210" height="86" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="32.0" y="60.2" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Babylonian place value</text><text x="32.0" y="77.4" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">Era 1, topic 3</text><rect x="270" y="20" width="210" height="86" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="282.0" y="51.9" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">A placeholder</text><text x="282.0" y="69.2" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">two wedges, never at the end</text><text x="282.0" y="85.7" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">c. 400 BCE</text><rect x="770" y="20" width="210" height="86" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="782.0" y="51.9" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Negative numbers</text><text x="782.0" y="69.2" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">black rods, a sign rule</text><text x="782.0" y="85.7" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">Nine Chapters, topic 1</text><rect x="145" y="170" width="210" height="86" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="157.0" y="193.7" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Zero as a digit</text><text x="157.0" y="210.9" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">⊕ a mark that can stand</text><text x="157.0" y="227.4" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">anywhere</text><text x="157.0" y="243.9" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">Gwalior, 876</text><rect x="520" y="170" width="210" height="86" style="fill:#0d1117;stroke:#f0584d;stroke-width:3"/><text x="532.0" y="193.7" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Zero as a number</text><text x="532.0" y="210.9" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">⊕ rules beside fortunes and</text><text x="532.0" y="227.4" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">debts</text><text x="532.0" y="243.9" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">Brahmagupta, 628</text><rect x="145" y="330" width="210" height="86" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="157.0" y="361.9" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Algorism</text><text x="157.0" y="379.2" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">written column arithmetic</text><text x="157.0" y="395.7" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">al-Khwarizmi, topic 6</text><rect x="145" y="470" width="210" height="86" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="157.0" y="501.9" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Liber Abaci</text><text x="157.0" y="519.2" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">the numerals reach Pisa</text><text x="157.0" y="535.7" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">1202, topic 8</text><rect x="520" y="330" width="210" height="86" style="fill:#0d1117;stroke:#5b8fe0;stroke-width:3"/><text x="532.0" y="361.9" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Floating point</text><text x="532.0" y="379.2" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">signed zero, infinity, NaN</text><text x="532.0" y="395.7" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">Java, 2026</text><rect x="770" y="330" width="210" height="86" style="fill:#0d1117;stroke:#5b8fe0;stroke-width:3"/><text x="782.0" y="361.9" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Proof assistants</text><text x="782.0" y="379.2" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">⊕ define x / 0 = 0</text><text x="782.0" y="395.7" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">Lean, Isabelle, Coq</text><text x="20.0" y="615.0" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">Dashed: negative numbers appear in China earlier, but no transmission to India is documented.</text></svg>
