<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="1000" height="660" role="img" aria-label="How the chakravala combined older ideas, and where the equation went next" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>How the chakravala combined older ideas, and where the equation went next</title><line x1="125.0" y1="106.0" x2="252.0" y2="170.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="252.0,170.0 243.0,169.6 246.3,163.0" style="fill:#b9b8b2"/><line x1="500.0" y1="106.0" x2="643.0" y2="170.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="643.0,170.0 634.0,170.0 637.0,163.3" style="fill:#b9b8b2"/><line x1="875.0" y1="106.0" x2="748.0" y2="170.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="748.0,170.0 753.7,163.0 757.0,169.6" style="fill:#b9b8b2"/><line x1="420.0" y1="213.0" x2="580.0" y2="213.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="580.0,213.0 571.8,216.7 571.8,209.3" style="fill:#b9b8b2"/><line x1="601.0" y1="256.0" x2="188.0" y2="340.0" style="stroke:#b9b8b2;stroke-width:1.5;stroke-dasharray:5 4"/><polygon points="188.0,340.0 195.3,334.8 196.8,342.0" style="fill:#b9b8b2"/><line x1="643.0" y1="256.0" x2="521.0" y2="340.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="521.0,340.0 525.7,332.3 529.8,338.4" style="fill:#b9b8b2"/><line x1="769.0" y1="256.0" x2="833.0" y2="340.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="833.0,340.0 825.1,335.7 830.9,331.2" style="fill:#b9b8b2"/><line x1="875.0" y1="426.0" x2="875.0" y2="490.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="875.0,490.0 871.3,481.8 878.7,481.8" style="fill:#b9b8b2"/><rect x="20" y="20" width="210" height="86" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="32.0" y="50.2" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Square roots as</text><text x="32.0" y="70.0" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">fractions</text><text x="32.0" y="87.3" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">the √2 tablet, Era 1 topic 4</text><rect x="395" y="20" width="210" height="86" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="407.0" y="60.2" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">The pulverizer</text><text x="407.0" y="77.4" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">Euclid&#x27;s divisions, Era 1 topic 7</text><rect x="770" y="20" width="210" height="86" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="782.0" y="60.2" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Zero and debts</text><text x="782.0" y="77.4" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">Brahmagupta, topic 4</text><rect x="210" y="170" width="210" height="86" style="fill:#0d1117;stroke:#f0584d;stroke-width:3"/><text x="222.0" y="201.9" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Composition</text><text x="222.0" y="219.2" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">⊕ multiply two near-misses</text><text x="222.0" y="235.7" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">Brahmagupta, 628</text><rect x="580" y="170" width="210" height="86" style="fill:#0d1117;stroke:#f0584d;stroke-width:3"/><text x="592.0" y="193.7" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">The chakravala</text><text x="592.0" y="210.9" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">⊕ a cycle that shrinks the</text><text x="592.0" y="227.4" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">error</text><text x="592.0" y="243.9" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">Jayadeva; Bhaskara II, 1150</text><rect x="20" y="340" width="210" height="86" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="32.0" y="371.9" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Fermat&#x27;s challenge</text><text x="32.0" y="389.2" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">N = 61, found again in Europe</text><text x="32.0" y="405.7" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">1657; Brouncker</text><rect x="395" y="340" width="210" height="86" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="407.0" y="363.7" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Lagrange&#x27;s proof</text><text x="407.0" y="380.9" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">⊕ continued fractions always</text><text x="407.0" y="397.4" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">end</text><text x="407.0" y="413.9" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">1766 or 1767</text><rect x="770" y="340" width="210" height="86" style="fill:#0d1117;stroke:#5b8fe0;stroke-width:3"/><text x="782.0" y="371.9" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Quantum algorithm</text><text x="782.0" y="389.2" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">⊕ polynomial time, if quantum</text><text x="782.0" y="405.7" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">Hallgren, 2007</text><rect x="770" y="490" width="210" height="86" style="fill:#0d1117;stroke:#5b8fe0;stroke-width:3"/><text x="782.0" y="513.6" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Factoring reduces to it</text><text x="782.0" y="530.9" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">and a key exchange built on</text><text x="782.0" y="547.4" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">its cousin</text><text x="782.0" y="563.9" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">Buchmann–Williams</text><text x="20.0" y="640.0" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">Dashed: Europe met the equation again five centuries later; no transmission is documented.</text></svg>
