<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="1000" height="650" role="img" aria-label="How al-Khwarizmi&#x27;s two books combined older ideas, and where his name went" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>How al-Khwarizmi&#x27;s two books combined older ideas, and where his name went</title><line x1="125.0" y1="106.0" x2="125.0" y2="170.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="125.0,170.0 121.3,161.8 128.7,161.8" style="fill:#55545a"/><line x1="500.0" y1="106.0" x2="643.0" y2="170.0" style="stroke:#55545a;stroke-width:1.5;stroke-dasharray:5 4"/><polygon points="643.0,170.0 634.0,170.0 637.0,163.3" style="fill:#55545a"/><line x1="875.0" y1="106.0" x2="748.0" y2="170.0" style="stroke:#55545a;stroke-width:1.5;stroke-dasharray:5 4"/><polygon points="748.0,170.0 753.7,163.0 757.0,169.6" style="fill:#55545a"/><line x1="125.0" y1="256.0" x2="125.0" y2="330.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="125.0,330.0 121.3,321.8 128.7,321.8" style="fill:#55545a"/><line x1="125.0" y1="416.0" x2="125.0" y2="480.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="125.0,480.0 121.3,471.8 128.7,471.8" style="fill:#55545a"/><line x1="230.0" y1="373.0" x2="395.0" y2="373.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="395.0,373.0 386.8,376.7 386.8,369.3" style="fill:#55545a"/><line x1="748.0" y1="256.0" x2="854.0" y2="330.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="854.0,330.0 845.2,328.3 849.4,322.3" style="fill:#55545a"/><line x1="500.0" y1="416.0" x2="500.0" y2="480.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="500.0,480.0 496.3,471.8 503.7,471.8" style="fill:#55545a"/><rect x="20" y="20" width="210" height="86" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="32.0" y="50.2" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Indian numerals with</text><text x="32.0" y="70.0" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">zero</text><text x="32.0" y="87.3" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">topic 4</text><rect x="395" y="20" width="210" height="86" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="407.0" y="51.9" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Euclid, Elements II</text><text x="407.0" y="69.2" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">areas that complete a square</text><text x="407.0" y="85.7" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">influence disputed</text><rect x="770" y="20" width="210" height="86" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="782.0" y="43.7" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Indian rules</text><text x="782.0" y="60.9" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">the rule of three, rhetorical</text><text x="782.0" y="77.4" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">style</text><text x="782.0" y="93.9" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">influence disputed</text><rect x="20" y="170" width="210" height="86" style="fill:#ffffff;stroke:#d5352a;stroke-width:3"/><text x="32.0" y="193.7" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Algorism</text><text x="32.0" y="210.9" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">⊕ written step-by-step</text><text x="32.0" y="227.4" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">arithmetic</text><text x="32.0" y="243.9" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">c. 825 (estimate)</text><rect x="580" y="170" width="210" height="86" style="fill:#ffffff;stroke:#d5352a;stroke-width:3"/><text x="592.0" y="201.9" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Al-jabr</text><text x="592.0" y="219.2" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">⊕ six types, a recipe for each</text><text x="592.0" y="235.7" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">c. 820 (estimate)</text><rect x="20" y="330" width="210" height="86" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="32.0" y="361.9" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Dixit Algorizmi</text><text x="32.0" y="379.2" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">Latin algorisms</text><text x="32.0" y="395.7" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">12th–13th century</text><rect x="20" y="480" width="210" height="86" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="32.0" y="511.9" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Liber Abaci</text><text x="32.0" y="529.1" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">the numerals reach Pisa</text><text x="32.0" y="545.6" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">1202, topic 8</text><rect x="395" y="330" width="210" height="86" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="407.0" y="370.2" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">The word algorithm</text><text x="407.0" y="387.4" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">from his name</text><rect x="770" y="330" width="210" height="86" style="fill:#ffffff;stroke:#1f5ba8;stroke-width:3"/><text x="782.0" y="353.7" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Forsythe&#x27;s pitfall</text><text x="782.0" y="370.9" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">⊕ rearrange to avoid</text><text x="782.0" y="387.4" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">cancellation</text><text x="782.0" y="403.9" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">1970</text><rect x="395" y="480" width="210" height="86" style="fill:#ffffff;stroke:#1f5ba8;stroke-width:3"/><text x="407.0" y="503.7" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Urgench symposium</text><text x="407.0" y="520.9" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">algorithms, in the land of his</text><text x="407.0" y="537.4" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">name</text><text x="407.0" y="553.9" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">1979; Ershov and Knuth</text><text x="20.0" y="625.0" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">Dashed: sources argued over by historians (Toomer and Rashed for Euclid; Gandz against; Toomer for Indian influence).</text></svg>
