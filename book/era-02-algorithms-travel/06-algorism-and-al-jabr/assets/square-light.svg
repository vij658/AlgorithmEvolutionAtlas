<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 230" width="760" height="230" role="img" aria-label="Completing the square for a square and ten roots equal to thirty-nine" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>Completing the square for a square and ten roots equal to thirty-nine</title><rect x="40.0" y="50.0" width="60.0" height="60.0" rx="0" style="fill:#ffffff;stroke:#17171a;stroke-width:2"/><text x="70.0" y="85.0" text-anchor="middle" style="fill:#17171a;font-size:15px;font-weight:700">x²</text><rect x="100.0" y="50.0" width="100.0" height="60.0" rx="0" style="fill:#f4f3ee;stroke:#1f5ba8;stroke-width:2"/><text x="150.0" y="85.0" text-anchor="middle" style="fill:#1f5ba8;font-size:14px;font-weight:700">5x</text><rect x="40.0" y="110.0" width="60.0" height="100.0" rx="0" style="fill:#f4f3ee;stroke:#1f5ba8;stroke-width:2"/><text x="70.0" y="165.0" text-anchor="middle" style="fill:#1f5ba8;font-size:14px;font-weight:700">5x</text><rect x="100.0" y="110.0" width="100.0" height="100.0" rx="0" style="fill:none;stroke:#d5352a;stroke-width:2.5style="stroke-dasharray:6 4""/><text x="150.0" y="165.0" text-anchor="middle" style="fill:#d5352a;font-size:16px;font-weight:700">25</text><text x="70.0" y="40.0" text-anchor="middle" style="fill:#7d7c84;font-size:13px;font-weight:400">x</text><text x="150.0" y="40.0" text-anchor="middle" style="fill:#7d7c84;font-size:13px;font-weight:400">5</text><text x="260.0" y="70.0" text-anchor="start" style="fill:#17171a;font-size:14px;font-weight:400">1. A square and 10 roots equal 39.</text><text x="260.0" y="100.0" text-anchor="start" style="fill:#17171a;font-size:14px;font-weight:400">2. Split the 10 roots into two strips of 5, along two sides.</text><text x="260.0" y="130.0" text-anchor="start" style="fill:#17171a;font-size:14px;font-weight:400">3. The figure lacks a corner of 5 × 5 = 25.</text><text x="260.0" y="160.0" text-anchor="start" style="fill:#17171a;font-size:14px;font-weight:400">4. 39 + 25 = 64 completes a square, so its side is 8.</text><text x="260.0" y="190.0" text-anchor="start" style="fill:#d5352a;font-size:14px;font-weight:700">5. Take away the 5: x = 3, and the square is 9.</text></svg>
