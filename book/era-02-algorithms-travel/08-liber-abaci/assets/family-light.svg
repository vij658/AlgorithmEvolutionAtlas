<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="1000" height="650" role="img" aria-label="How Liber abaci combined older ideas, and where the rabbit numbers went" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>How Liber abaci combined older ideas, and where the rabbit numbers went</title><line x1="125.0" y1="106.0" x2="416.0" y2="170.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="416.0,170.0 407.2,171.8 408.8,164.7" style="fill:#55545a"/><line x1="375.0" y1="106.0" x2="468.5" y2="170.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="468.5,170.0 459.6,168.4 463.8,162.3" style="fill:#55545a"/><line x1="625.0" y1="106.0" x2="531.5" y2="170.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="531.5,170.0 536.2,162.3 540.4,168.4" style="fill:#55545a"/><line x1="875.0" y1="106.0" x2="584.0" y2="170.0" style="stroke:#55545a;stroke-width:1.5;stroke-dasharray:5 4"/><polygon points="584.0,170.0 591.2,164.7 592.8,171.8" style="fill:#55545a"/><line x1="416.0" y1="256.0" x2="146.0" y2="330.0" style="stroke:#55545a;stroke-width:1.5;stroke-dasharray:5 4"/><polygon points="146.0,330.0 153.0,324.3 154.9,331.4" style="fill:#55545a"/><line x1="500.0" y1="256.0" x2="500.0" y2="330.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="500.0,330.0 496.3,321.8 503.7,321.8" style="fill:#55545a"/><line x1="584.0" y1="256.0" x2="854.0" y2="330.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="854.0,330.0 845.1,331.4 847.0,324.3" style="fill:#55545a"/><line x1="875.0" y1="416.0" x2="875.0" y2="480.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="875.0,480.0 871.3,471.8 878.7,471.8" style="fill:#55545a"/><rect x="20" y="20" width="210" height="86" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="32.0" y="50.2" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Indian numerals with</text><text x="32.0" y="70.0" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">zero</text><text x="32.0" y="87.3" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">topic 4</text><rect x="270" y="20" width="210" height="86" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="282.0" y="43.7" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Algorism and al-jabr</text><text x="282.0" y="60.9" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">al-Khwarizmi; Abu Kamil;</text><text x="282.0" y="77.4" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">al-Karaji</text><text x="282.0" y="93.9" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">topic 6</text><rect x="520" y="20" width="210" height="86" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="532.0" y="43.7" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Merchants&#x27; reckoning</text><text x="532.0" y="60.9" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">fingers, the abacus, Roman</text><text x="532.0" y="77.4" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">numerals</text><text x="532.0" y="93.9" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">Pisa, Bugia</text><rect x="770" y="20" width="210" height="86" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="782.0" y="51.9" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Sanskrit counts</text><text x="782.0" y="69.2" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">the same sequence</text><text x="782.0" y="85.7" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">c. 200 BCE</text><rect x="395" y="170" width="210" height="86" style="fill:#ffffff;stroke:#d5352a;stroke-width:3"/><text x="407.0" y="193.7" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Liber abaci</text><text x="407.0" y="210.9" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">⊕ written algorithms for</text><text x="407.0" y="227.4" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">trade</text><text x="407.0" y="243.9" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">Pisa, 1202; second edition 1228</text><rect x="20" y="330" width="210" height="86" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="32.0" y="361.9" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Abacus schools</text><text x="32.0" y="379.2" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">at least 600 abacus books</text><text x="32.0" y="395.7" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">direct influence a conjecture</text><rect x="395" y="330" width="210" height="86" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="407.0" y="353.7" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Euclid&#x27;s worst case</text><text x="407.0" y="370.9" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">consecutive Fibonacci</text><text x="407.0" y="387.4" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">numbers</text><text x="407.0" y="403.9" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">Lamé, 1844</text><rect x="770" y="330" width="210" height="86" style="fill:#ffffff;stroke:#1f5ba8;stroke-width:3"/><text x="782.0" y="353.7" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Fibonacci heaps</text><text x="782.0" y="370.9" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">⊕ Fibonacci numbers bound</text><text x="782.0" y="387.4" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">the trees</text><text x="782.0" y="403.9" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">Fredman and Tarjan, 1987</text><rect x="770" y="480" width="210" height="86" style="fill:#ffffff;stroke:#1f5ba8;stroke-width:3"/><text x="782.0" y="511.9" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Faster shortest paths</text><text x="782.0" y="529.1" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">O(n log n + m)</text><text x="782.0" y="545.6" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">Dijkstra with F-heaps</text><text x="20.0" y="625.0" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">Dashed: the Sanskrit sequence is older but no line to Pisa is documented; how far the book shaped the abacus schools is argued over.</text></svg>
