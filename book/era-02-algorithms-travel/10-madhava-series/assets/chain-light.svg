<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 558" width="960" height="558" role="img" aria-label="Each fix leaves a new pain: from polygons to record computations" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>Each fix leaves a new pain: from polygons to record computations</title><line x1="400.0" y1="66.0" x2="560.0" y2="66.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="560.0,66.0 551.8,69.7 551.8,62.3" style="fill:#55545a"/><rect x="449.2" y="45.0" width="61.6" height="19" rx="3" style="fill:#ffffff"/><text x="480.0" y="58.0" text-anchor="middle" style="fill:#17171a;font-size:12.5px;font-weight:600">fixed by</text><line x1="750.0" y1="112.0" x2="750.0" y2="162.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="750.0,162.0 746.3,153.8 753.7,153.8" style="fill:#55545a"/><rect x="757.0" y="129.0" width="175.9" height="19" rx="3" style="fill:#ffffff"/><text x="762.0" y="142.0" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">which leaves a new problem</text><line x1="560.0" y1="208.0" x2="400.0" y2="208.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="400.0,208.0 408.2,204.3 408.2,211.7" style="fill:#55545a"/><rect x="449.2" y="187.0" width="61.6" height="19" rx="3" style="fill:#ffffff"/><text x="480.0" y="200.0" text-anchor="middle" style="fill:#17171a;font-size:12.5px;font-weight:600">fixed by</text><line x1="210.0" y1="254.0" x2="210.0" y2="304.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="210.0,304.0 206.3,295.8 213.7,295.8" style="fill:#55545a"/><line x1="400.0" y1="350.0" x2="560.0" y2="350.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="560.0,350.0 551.8,353.7 551.8,346.3" style="fill:#55545a"/><rect x="449.2" y="329.0" width="61.6" height="19" rx="3" style="fill:#ffffff"/><text x="480.0" y="342.0" text-anchor="middle" style="fill:#17171a;font-size:12.5px;font-weight:600">fixed by</text><line x1="750.0" y1="396.0" x2="750.0" y2="446.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="750.0,446.0 746.3,437.8 753.7,437.8" style="fill:#55545a"/><line x1="560.0" y1="492.0" x2="400.0" y2="492.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="400.0,492.0 408.2,488.3 408.2,495.7" style="fill:#55545a"/><rect x="449.2" y="471.0" width="61.6" height="19" rx="3" style="fill:#ffffff"/><text x="480.0" y="484.0" text-anchor="middle" style="fill:#17171a;font-size:12.5px;font-weight:600">fixed by</text><rect x="20" y="20" width="380" height="92" style="fill:#ffffff;stroke:#d5352a;stroke-width:3"/><text x="32.0" y="53.5" text-anchor="start" style="fill:#7d7c84;font-size:11px;font-weight:700;letter-spacing:.08em">WHAT HURT</text><text x="32.0" y="69.5" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">Polygons cost a square root for every doubling: 19</text><text x="32.0" y="86.0" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">square roots for 11 decimals</text><rect x="560" y="20" width="380" height="92" style="fill:#ffffff;stroke:#1f5ba8;stroke-width:3"/><text x="572.0" y="45.2" text-anchor="start" style="fill:#7d7c84;font-size:11px;font-weight:700;letter-spacing:.08em">THE FIX</text><text x="572.0" y="61.3" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">An endless sum with no square roots: π/4 = 1 − 1/3 + 1/5</text><text x="572.0" y="77.8" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">− …</text><text x="572.0" y="94.3" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">Madhava, c. 1400</text><rect x="560" y="162" width="380" height="92" style="fill:#ffffff;stroke:#d5352a;stroke-width:3"/><text x="572.0" y="203.7" text-anchor="start" style="fill:#7d7c84;font-size:11px;font-weight:700;letter-spacing:.08em">WHAT HURT</text><text x="572.0" y="219.8" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">The sum crawls: 200,000 terms for 5 decimals</text><rect x="20" y="162" width="380" height="92" style="fill:#ffffff;stroke:#1f5ba8;stroke-width:3"/><text x="32.0" y="187.2" text-anchor="start" style="fill:#7d7c84;font-size:11px;font-weight:700;letter-spacing:.08em">THE FIX</text><text x="32.0" y="203.3" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">Stop early and estimate the rest: 20 terms and one</text><text x="32.0" y="219.8" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">correction give 9 decimals</text><text x="32.0" y="236.3" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">Madhava&#x27;s end corrections</text><rect x="20" y="304" width="380" height="92" style="fill:#ffffff;stroke:#d5352a;stroke-width:3"/><text x="32.0" y="345.7" text-anchor="start" style="fill:#7d7c84;font-size:11px;font-weight:700;letter-spacing:.08em">WHAT HURT</text><text x="32.0" y="361.8" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">Even corrected, each digit still costs more terms</text><rect x="560" y="304" width="380" height="92" style="fill:#ffffff;stroke:#1f5ba8;stroke-width:3"/><text x="572.0" y="329.2" text-anchor="start" style="fill:#7d7c84;font-size:11px;font-weight:700;letter-spacing:.08em">THE FIX</text><text x="572.0" y="345.3" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">A faster series, √12 (1 − 1/(3·3) + 1/(5·3²) − …): 21</text><text x="572.0" y="361.8" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">terms, error 5.8 × 10^-12</text><text x="572.0" y="378.3" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">Madhava</text><rect x="560" y="446" width="380" height="92" style="fill:#ffffff;stroke:#d5352a;stroke-width:3"/><text x="572.0" y="487.7" text-anchor="start" style="fill:#7d7c84;font-size:11px;font-weight:700;letter-spacing:.08em">WHAT HURT</text><text x="572.0" y="503.8" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">Records need trillions of digits</text><rect x="20" y="446" width="380" height="92" style="fill:#ffffff;stroke:#1f5ba8;stroke-width:3"/><text x="32.0" y="479.5" text-anchor="start" style="fill:#7d7c84;font-size:11px;font-weight:700;letter-spacing:.08em">THE FIX</text><text x="32.0" y="495.5" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">Series that gain about 13.8 digits per term</text><text x="32.0" y="512.0" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">the Chudnovskys, 1988</text></svg>
