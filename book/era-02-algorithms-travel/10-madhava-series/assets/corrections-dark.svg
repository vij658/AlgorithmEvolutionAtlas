<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 200" width="1000" height="200" role="img" aria-label="Twenty terms of Madhava&#x27;s series, with each of the three end corrections" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>Twenty terms of Madhava&#x27;s series, with each of the three end corrections</title><line x1="240.0" y1="98.0" x2="265.0" y2="98.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="265.0,98.0 256.8,101.7 256.8,94.3" style="fill:#b9b8b2"/><line x1="485.0" y1="98.0" x2="510.0" y2="98.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="510.0,98.0 501.8,101.7 501.8,94.3" style="fill:#b9b8b2"/><line x1="730.0" y1="98.0" x2="755.0" y2="98.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="755.0,98.0 746.8,101.7 746.8,94.3" style="fill:#b9b8b2"/><rect x="20" y="50" width="220" height="96" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="32.0" y="86.9" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">20 terms</text><text x="32.0" y="104.1" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">1 − 1/3 + … − 1/39</text><text x="32.0" y="120.6" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">1 decimal</text><rect x="265" y="50" width="220" height="96" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="277.0" y="86.9" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">+ 1/(4n)</text><text x="277.0" y="104.1" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">first correction</text><text x="277.0" y="120.6" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">4 decimals</text><rect x="510" y="50" width="220" height="96" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="522.0" y="86.9" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">+ n/(4n² + 1)</text><text x="522.0" y="104.1" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">second correction</text><text x="522.0" y="120.6" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">6 decimals</text><rect x="755" y="50" width="220" height="96" style="fill:#0d1117;stroke:#f0584d;stroke-width:3"/><text x="767.0" y="86.9" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">+ (n² + 1)/(4n³ + 5n)</text><text x="767.0" y="104.1" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">third correction</text><text x="767.0" y="120.6" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">9 decimals</text><text x="20.0" y="30.0" text-anchor="start" style="fill:#8f8e96;font-size:11px;font-weight:700;letter-spacing:.08em">THE SAME TWENTY TERMS, EACH TIME WITH A BETTER GUESS FOR EVERYTHING LEFT OUT (n = 20)</text><text x="20.0" y="180.0" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">Each correction is added with the sign of the first term left out. Decimals: correct to within half a unit in the last place.</text></svg>
