<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" role="img" aria-label="How al-Kashi&#x27;s computation combined older ideas, and what came after it" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>How al-Kashi&#x27;s computation combined older ideas, and what came after it</title><line x1="125.0" y1="106.0" x2="416.0" y2="170.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="416.0,170.0 407.2,171.8 408.8,164.7" style="fill:#b9b8b2"/><line x1="375.0" y1="106.0" x2="472.7" y2="170.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="472.7,170.0 463.8,168.6 467.8,162.4" style="fill:#b9b8b2"/><line x1="625.0" y1="106.0" x2="527.3" y2="170.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="527.3,170.0 532.2,162.4 536.2,168.6" style="fill:#b9b8b2"/><line x1="875.0" y1="106.0" x2="584.0" y2="170.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="584.0,170.0 591.2,164.7 592.8,171.8" style="fill:#b9b8b2"/><line x1="770.0" y1="213.0" x2="605.0" y2="213.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="605.0,213.0 613.2,209.3 613.2,216.7" style="fill:#b9b8b2"/><line x1="416.0" y1="256.0" x2="167.0" y2="330.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="167.0,330.0 173.8,324.1 175.9,331.2" style="fill:#b9b8b2"/><line x1="500.0" y1="256.0" x2="500.0" y2="330.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="500.0,330.0 496.3,321.8 503.7,321.8" style="fill:#b9b8b2"/><rect x="503.0" y="280.0" width="102.2" height="19" rx="3" style="fill:#0d1117"/><text x="508.0" y="293.0" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">record passed</text><line x1="584.0" y1="256.0" x2="833.0" y2="330.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="833.0,330.0 824.1,331.2 826.2,324.1" style="fill:#b9b8b2"/><line x1="875.0" y1="416.0" x2="875.0" y2="480.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="875.0,480.0 871.3,471.8 878.7,471.8" style="fill:#b9b8b2"/><line x1="500.0" y1="416.0" x2="500.0" y2="480.0" style="stroke:#b9b8b2;stroke-width:1.5;stroke-dasharray:5 4"/><polygon points="500.0,480.0 496.3,471.8 503.7,471.8" style="fill:#b9b8b2"/><rect x="20" y="20" width="210" height="86" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="32.0" y="51.9" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Polygons around a circle</text><text x="32.0" y="69.2" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">double the sides, trap π</text><text x="32.0" y="85.7" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">Archimedes, Era 1 topic 8</text><rect x="270" y="20" width="210" height="86" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="282.0" y="51.9" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Chords by halving</text><text x="282.0" y="69.2" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">a chord from the one before</text><text x="282.0" y="85.7" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">Ptolemy, topic 2</text><rect x="520" y="20" width="210" height="86" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="532.0" y="51.9" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Base 60 place value</text><text x="532.0" y="69.2" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">fractions in sixtieths</text><text x="532.0" y="85.7" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">Babylon, Era 1 topic 3</text><rect x="770" y="20" width="210" height="86" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="782.0" y="51.9" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Decimal place value</text><text x="782.0" y="69.2" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">with a zero</text><text x="782.0" y="85.7" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">topic 4</text><rect x="395" y="170" width="210" height="86" style="fill:#0d1117;stroke:#f0584d;stroke-width:3"/><text x="407.0" y="193.7" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">al-Kashi&#x27;s π</text><text x="407.0" y="210.9" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">⊕ the error fixed first;</text><text x="407.0" y="227.4" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">every root checked</text><text x="407.0" y="243.9" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">Samarkand, July 1424</text><rect x="770" y="170" width="210" height="86" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="782.0" y="201.9" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Samarkand astronomy</text><text x="782.0" y="219.2" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">tables that need precision</text><text x="782.0" y="235.7" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">Ulugh Beg&#x27;s observatory</text><rect x="20" y="330" width="210" height="86" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="32.0" y="361.9" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">sin 1° by iteration</text><text x="32.0" y="379.2" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">a cubic solved place by place</text><text x="32.0" y="395.7" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">Treatise on the Chord and Sine</text><rect x="395" y="330" width="210" height="86" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="407.0" y="361.9" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">van Ceulen</text><text x="407.0" y="379.2" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">polygons to 20 decimals</text><text x="407.0" y="395.7" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">1596</text><rect x="770" y="330" width="210" height="86" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="782.0" y="361.9" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">π as a decimal fraction</text><text x="782.0" y="379.2" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">6.2831853071795865</text><text x="782.0" y="395.7" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">decimals for real numbers</text><rect x="770" y="480" width="210" height="86" style="fill:#0d1117;stroke:#5b8fe0;stroke-width:3"/><text x="782.0" y="511.9" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">64-bit floating point</text><text x="782.0" y="529.1" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">2π off by 2.4 × 10⁻¹⁶</text><text x="782.0" y="545.6" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">the computer&#x27;s default</text><rect x="395" y="480" width="210" height="86" style="fill:#0d1117;stroke:#5b8fe0;stroke-width:3"/><text x="407.0" y="511.9" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Infinite series</text><text x="407.0" y="529.1" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">π without polygons</text><text x="407.0" y="545.6" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">Madhava, topic 10; Era 3</text><text x="20.0" y="615.0" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">Dashed: polygons gave way to series for computing π; van Ceulen himself still used polygons.</text></svg>
