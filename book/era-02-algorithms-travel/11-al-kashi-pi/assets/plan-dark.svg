<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 230" width="1000" height="230" role="img" aria-label="Al-Kashi&#x27;s plan: the error he would accept, then the polygon that meets it, then the roots" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>Al-Kashi&#x27;s plan: the error he would accept, then the polygon that meets it, then the roots</title><line x1="240.0" y1="108.0" x2="265.0" y2="108.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="265.0,108.0 256.8,111.7 256.8,104.3" style="fill:#b9b8b2"/><line x1="485.0" y1="108.0" x2="510.0" y2="108.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="510.0,108.0 501.8,111.7 501.8,104.3" style="fill:#b9b8b2"/><line x1="730.0" y1="108.0" x2="755.0" y2="108.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="755.0,108.0 746.8,111.7 746.8,104.3" style="fill:#b9b8b2"/><rect x="20" y="50" width="220" height="116" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="32.0" y="88.6" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">1. The target</text><text x="32.0" y="105.9" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">a horse&#x27;s hair on a circle</text><text x="32.0" y="122.4" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">600,000 Earths wide:</text><text x="32.0" y="138.9" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">error in π ≤ 0.5 × 10⁻¹⁷</text><rect x="265" y="50" width="220" height="116" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="277.0" y="88.6" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">2. The polygon</text><text x="277.0" y="105.9" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">3 × 2²⁸ = 805,306,368 sides</text><text x="277.0" y="122.4" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">27 doublings</text><text x="277.0" y="138.9" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">from the hexagon</text><rect x="510" y="50" width="220" height="116" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="522.0" y="88.6" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">3. The roots</text><text x="522.0" y="105.9" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">29 square roots in base 60</text><text x="522.0" y="122.4" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">each checked by squaring</text><text x="522.0" y="138.9" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">and by casting out 59</text><rect x="755" y="50" width="220" height="116" style="fill:#0d1117;stroke:#f0584d;stroke-width:3"/><text x="767.0" y="88.6" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">4. The answer</text><text x="767.0" y="105.9" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">mean of the two perimeters:</text><text x="767.0" y="122.4" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">2π = 6;16,59,28,1,34,51,46,14,50</text><text x="767.0" y="138.9" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">= 6.2831853071795865</text><text x="20.0" y="30.0" text-anchor="start" style="fill:#8f8e96;font-size:11px;font-weight:700;letter-spacing:.08em">FIXED BEFORE THE FIRST ROOT WAS TAKEN: HOW GOOD THE ANSWER MUST BE, AND SO HOW FAR TO GO</text><text x="20.0" y="210.0" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">Numbers from AlKashiPi.java, which repeats the computation; the target and the polygon are al-Kashi&#x27;s (DSB).</text></svg>
