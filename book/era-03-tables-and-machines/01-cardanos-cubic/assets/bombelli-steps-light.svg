<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" width="1000" height="220" role="img" aria-label="Bombelli&#x27;s calculation for x³ = 15x + 4: through square roots of negatives to the real root 4" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>Bombelli&#x27;s calculation for x³ = 15x + 4: through square roots of negatives to the real root 4</title><line x1="240.0" y1="105.0" x2="265.0" y2="105.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="265.0,105.0 256.8,108.7 256.8,101.3" style="fill:#55545a"/><line x1="485.0" y1="105.0" x2="510.0" y2="105.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="510.0,105.0 501.8,108.7 501.8,101.3" style="fill:#55545a"/><line x1="730.0" y1="105.0" x2="755.0" y2="105.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="755.0,105.0 746.8,108.7 746.8,101.3" style="fill:#55545a"/><rect x="20" y="50" width="220" height="110" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="32.0" y="85.6" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">The recipe</text><text x="32.0" y="102.9" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">D = (q/2)² + (p/3)³</text><text x="32.0" y="119.4" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">= 4 − 125 = -121</text><text x="32.0" y="135.9" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">√D needs √−121</text><rect x="265" y="50" width="220" height="110" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="277.0" y="85.6" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Two cubes</text><text x="277.0" y="102.9" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">u³ = 2 + 11i</text><text x="277.0" y="119.4" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">v³ = 2 - 11i</text><text x="277.0" y="135.9" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">(11i is √−121)</text><rect x="510" y="50" width="220" height="110" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="522.0" y="85.6" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Their cube roots</text><text x="522.0" y="102.9" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">(2 + i)³ = 2 + 11i</text><text x="522.0" y="119.4" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">(2 - i)³ = 2 - 11i</text><text x="522.0" y="135.9" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">found in 84 tries</text><rect x="755" y="50" width="220" height="110" style="fill:#ffffff;stroke:#d5352a;stroke-width:3"/><text x="767.0" y="85.6" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">The answer</text><text x="767.0" y="102.9" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">x = (2 + i) + (2 - i)</text><text x="767.0" y="119.4" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">= 4</text><text x="767.0" y="135.9" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">4³ = 15·4 + 4 ✓</text><text x="20.0" y="30.0" text-anchor="start" style="fill:#7d7c84;font-size:11px;font-weight:700;letter-spacing:.08em">THE IMAGINARY PARTS CANCEL: THE ROUTE PASSES THROUGH √−1, THE ANSWER DOES NOT</text><text x="20.0" y="200.0" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">The other two roots, −2 ± √3 (-0.267949 and -3.732051), are real as well. Numbers from CardanoCubic.java.</text></svg>
