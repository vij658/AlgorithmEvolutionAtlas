<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" role="img" aria-label="How Cardano&#x27;s cubic combined older ideas, and where it led" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>How Cardano&#x27;s cubic combined older ideas, and where it led</title><line x1="125.0" y1="106.0" x2="426.5" y2="170.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="426.5,170.0 417.7,171.9 419.2,164.7" style="fill:#55545a"/><line x1="500.0" y1="106.0" x2="500.0" y2="170.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="500.0,170.0 496.3,161.8 503.7,161.8" style="fill:#55545a"/><line x1="875.0" y1="106.0" x2="573.5" y2="170.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="573.5,170.0 580.8,164.7 582.3,171.9" style="fill:#55545a"/><line x1="416.0" y1="256.0" x2="167.0" y2="330.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="167.0,330.0 173.8,324.1 175.9,331.2" style="fill:#55545a"/><line x1="500.0" y1="256.0" x2="500.0" y2="330.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="500.0,330.0 496.3,321.8 503.7,321.8" style="fill:#55545a"/><line x1="584.0" y1="256.0" x2="833.0" y2="330.0" style="stroke:#55545a;stroke-width:1.5;stroke-dasharray:5 4"/><polygon points="833.0,330.0 824.1,331.2 826.2,324.1" style="fill:#55545a"/><line x1="500.0" y1="416.0" x2="500.0" y2="480.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="500.0,480.0 496.3,471.8 503.7,471.8" style="fill:#55545a"/><rect x="20" y="20" width="210" height="86" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="32.0" y="51.9" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Completing the square</text><text x="32.0" y="69.2" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">a quadratic by recipe</text><text x="32.0" y="85.7" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">al-Khwarizmi, Era 2 topic 6</text><rect x="395" y="20" width="210" height="86" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="407.0" y="51.9" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Roots digit by digit</text><text x="407.0" y="69.2" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">any degree, slowly</text><text x="407.0" y="85.7" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">Qin Jiushao, Era 2 topic 9</text><rect x="770" y="20" width="210" height="86" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="782.0" y="51.9" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Public contests</text><text x="782.0" y="69.2" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">secret methods won prizes</text><text x="782.0" y="85.7" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">Fior and Tartaglia, 1535</text><rect x="395" y="170" width="210" height="86" style="fill:#ffffff;stroke:#d5352a;stroke-width:3"/><text x="407.0" y="193.7" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Cardano&#x27;s formula</text><text x="407.0" y="210.9" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">⊕ a substitution: cubic →</text><text x="407.0" y="227.4" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">quadratic + cube roots</text><text x="407.0" y="243.9" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">Ars Magna, 1545</text><rect x="20" y="330" width="210" height="86" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="32.0" y="361.9" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Ferrari&#x27;s quartic</text><text x="32.0" y="379.2" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">reduce degree 4 to degree 3</text><text x="32.0" y="395.7" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">in Ars Magna, 1545</text><rect x="395" y="330" width="210" height="86" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="407.0" y="361.9" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Bombelli&#x27;s √−1</text><text x="407.0" y="379.2" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">rules for &#x27;plus of minus&#x27;</text><text x="407.0" y="395.7" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">Algebra, 1572</text><rect x="770" y="330" width="210" height="86" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="782.0" y="361.9" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Newton&#x27;s method</text><text x="782.0" y="379.2" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">when formulas cancel or stop</text><text x="782.0" y="395.7" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">topic 5</text><rect x="395" y="480" width="210" height="86" style="fill:#ffffff;stroke:#1f5ba8;stroke-width:3"/><text x="407.0" y="503.7" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Complex numbers at work</text><text x="407.0" y="520.9" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">the FFT runs on roots of</text><text x="407.0" y="537.4" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">unity</text><text x="407.0" y="553.9" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">topic 9; today</text><text x="20.0" y="615.0" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">Dashed: Newton&#x27;s method answers the formula&#x27;s weaknesses; it does not reuse the formula itself.</text></svg>
