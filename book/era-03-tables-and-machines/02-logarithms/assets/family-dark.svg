<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" role="img" aria-label="How logarithms combined older ideas, and where they went" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>How logarithms combined older ideas, and where they went</title><line x1="125.0" y1="106.0" x2="426.5" y2="170.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="426.5,170.0 417.7,171.9 419.2,164.7" style="fill:#b9b8b2"/><line x1="500.0" y1="106.0" x2="500.0" y2="170.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="500.0,170.0 496.3,161.8 503.7,161.8" style="fill:#b9b8b2"/><line x1="875.0" y1="106.0" x2="573.5" y2="170.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="573.5,170.0 580.8,164.7 582.3,171.9" style="fill:#b9b8b2"/><line x1="416.0" y1="256.0" x2="167.0" y2="330.0" style="stroke:#b9b8b2;stroke-width:1.5;stroke-dasharray:5 4"/><polygon points="167.0,330.0 173.8,324.1 175.9,331.2" style="fill:#b9b8b2"/><line x1="500.0" y1="256.0" x2="500.0" y2="330.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="500.0,330.0 496.3,321.8 503.7,321.8" style="fill:#b9b8b2"/><line x1="584.0" y1="256.0" x2="833.0" y2="330.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="833.0,330.0 824.1,331.2 826.2,324.1" style="fill:#b9b8b2"/><line x1="875.0" y1="416.0" x2="875.0" y2="480.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="875.0,480.0 871.3,471.8 878.7,471.8" style="fill:#b9b8b2"/><rect x="20" y="20" width="210" height="86" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="32.0" y="43.7" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Doubling</text><text x="32.0" y="60.9" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">multiply powers, add</text><text x="32.0" y="77.4" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">exponents</text><text x="32.0" y="93.9" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">Egypt, Era 1 topic 5</text><rect x="395" y="20" width="210" height="86" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="407.0" y="51.9" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Tables for astronomy</text><text x="407.0" y="69.2" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">chords and sines, looked up</text><text x="407.0" y="85.7" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">Ptolemy, Era 2 topic 2</text><rect x="770" y="20" width="210" height="86" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="782.0" y="51.9" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Decimal fractions</text><text x="782.0" y="69.2" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">places after the point</text><text x="782.0" y="85.7" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">al-Kashi, Era 2 topic 11</text><rect x="395" y="170" width="210" height="86" style="fill:#0d1117;stroke:#f0584d;stroke-width:3"/><text x="407.0" y="193.7" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Logarithms</text><text x="407.0" y="210.9" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">⊕ add partners instead of</text><text x="407.0" y="227.4" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">multiplying numbers</text><text x="407.0" y="243.9" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">Napier 1614; Briggs 1624</text><rect x="20" y="330" width="210" height="86" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="32.0" y="361.9" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Napier&#x27;s bones</text><text x="32.0" y="379.2" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">rods for multiplication</text><text x="32.0" y="395.7" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">Rabdologiae, 1617</text><rect x="395" y="330" width="210" height="86" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="407.0" y="353.7" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">The difference engine</text><text x="407.0" y="370.9" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">tables computed and printed</text><text x="407.0" y="387.4" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">by machine</text><text x="407.0" y="403.9" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">topic 10</text><rect x="770" y="330" width="210" height="86" style="fill:#0d1117;stroke:#5b8fe0;stroke-width:3"/><text x="782.0" y="353.7" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Floating point</text><text x="782.0" y="370.9" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">a number as exponent and</text><text x="782.0" y="387.4" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">fraction</text><text x="782.0" y="403.9" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">today</text><rect x="770" y="480" width="210" height="86" style="fill:#0d1117;stroke:#5b8fe0;stroke-width:3"/><text x="782.0" y="503.7" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Log-probabilities</text><text x="782.0" y="520.9" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">add logs, so products do not</text><text x="782.0" y="537.4" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">underflow</text><text x="782.0" y="553.9" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">statistics, machine learning</text><text x="20.0" y="615.0" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">Dashed: Napier&#x27;s bones are a separate invention by the same man, published three years later.</text></svg>
