<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 230" width="1000" height="230" role="img" aria-label="Briggs&#x27;s method: take the square root of ten again and again, until the number is next to 1" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>Briggs&#x27;s method: take the square root of ten again and again, until the number is next to 1</title><line x1="170.0" y1="98.0" x2="182.0" y2="98.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="182.0,98.0 173.8,101.7 173.8,94.3" style="fill:#b9b8b2"/><line x1="332.0" y1="98.0" x2="344.0" y2="98.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="344.0,98.0 335.8,101.7 335.8,94.3" style="fill:#b9b8b2"/><line x1="494.0" y1="98.0" x2="506.0" y2="98.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="506.0,98.0 497.8,101.7 497.8,94.3" style="fill:#b9b8b2"/><line x1="656.0" y1="98.0" x2="668.0" y2="98.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="668.0,98.0 659.8,101.7 659.8,94.3" style="fill:#b9b8b2"/><line x1="818.0" y1="98.0" x2="830.0" y2="98.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="830.0,98.0 821.8,101.7 821.8,94.3" style="fill:#b9b8b2"/><rect x="20" y="50" width="150" height="96" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="32.0" y="86.9" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">1 root</text><text x="32.0" y="104.1" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">3.162277660168</text><text x="32.0" y="120.6" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">379331999</text><rect x="182" y="50" width="150" height="96" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="194.0" y="86.9" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">2 roots</text><text x="194.0" y="104.1" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">1.778279410038</text><text x="194.0" y="120.6" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">922801225</text><rect x="344" y="50" width="150" height="96" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="356.0" y="86.9" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">3 roots</text><text x="356.0" y="104.1" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">1.333521432163</text><text x="356.0" y="120.6" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">324025676</text><rect x="506" y="50" width="150" height="96" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="518.0" y="86.9" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">10 roots</text><text x="518.0" y="104.1" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">1.002251148292</text><text x="518.0" y="120.6" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">912915466</text><rect x="668" y="50" width="150" height="96" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="680.0" y="86.9" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">20 roots</text><text x="680.0" y="104.1" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">1.000002195918</text><text x="680.0" y="120.6" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">675554203</text><rect x="830" y="50" width="150" height="96" style="fill:#0d1117;stroke:#f0584d;stroke-width:3"/><text x="842.0" y="86.9" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">54 roots</text><text x="842.0" y="104.1" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">1.000000000000</text><text x="842.0" y="120.6" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">000127819</text><text x="20.0" y="30.0" text-anchor="start" style="fill:#8f8e96;font-size:11px;font-weight:700;letter-spacing:.08em">EACH SQUARE ROOT HALVES THE LOGARITHM: AFTER 54 ROOTS IT IS EXACTLY 1/2⁵⁴</text><text x="20.0" y="205.0" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">After 54 roots the number exceeds 1 by 1.278191493200323 × 10⁻¹⁶; near 1 the logarithm is proportional to that excess. Numbers from Logarithms.java (40 digits).</text></svg>
