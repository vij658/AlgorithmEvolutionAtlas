ext-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">carry ←</text><rect x="340" y="60" width="128" height="90" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="352.0" y="91.3" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">wheel 4</text><text x="352.0" y="110.4" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">9 → 0</text><text x="352.0" y="127.6" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">carry ←</text><rect x="500" y="60" width="128" height="90" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="512.0" y="91.3" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">wheel 3</text><text x="512.0" y="110.4" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">9 → 0</text><text x="512.0" y="127.6" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">carry ←</text><rect x="660" y="60" width="128" height="90" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="672.0" y="91.3" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">wheel 2</text><text x="672.0" y="110.4" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">9 → 0</text><text x="672.0" y="127.6" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">carry ←</text><rect x="820" y="60" width="128" height="90" style="fill:#ffffff;stroke:#d5352a;stroke-width:3"/><text x="832.0" y="91.3" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">wheel 1</text><text x="832.0" y="110.4" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">9 → 0</text><text x="832.0" y="127.6" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">carry ←</text><text x="20.0" y="36.0" text-anchor="start" style="fill:#7d7c84;font-size:11px;font-weight:700;letter-spacing:.08em">PASCAL&#x27;S SAUTOIR DROPS EACH CARRY BY GRAVITY, ONE WHEEL AFTER ANOTHER; SCHICKARD&#x27;S GEARS HAD TO TURN THEM ALL AT ONCE</text><text x="20.0" y="190.0" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">Counting from 1 to 999,999 makes 111,105 carries, but a chain through five wheels happens only 9 times.</text><text x="20.0" y="210.0" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">Red: the units wheel, where the 1 is added. Numbers from MechanicalCarry.java.</text></svg>
