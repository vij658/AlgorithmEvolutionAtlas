<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 558" width="960" height="558" role="img" aria-label="Each fix leaves a new pain: from a merchants&#x27; rule to a table of fair shares" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>Each fix leaves a new pain: from a merchants&#x27; rule to a table of fair shares</title><line x1="400.0" y1="66.0" x2="560.0" y2="66.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="560.0,66.0 551.8,69.7 551.8,62.3" style="fill:#b9b8b2"/><rect x="449.2" y="45.0" width="61.6" height="19" rx="3" style="fill:#0d1117"/><text x="480.0" y="58.0" text-anchor="middle" style="fill:#ecebe6;font-size:12.5px;font-weight:600">fixed by</text><line x1="750.0" y1="112.0" x2="750.0" y2="162.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="750.0,162.0 746.3,153.8 753.7,153.8" style="fill:#b9b8b2"/><rect x="757.0" y="129.0" width="175.9" height="19" rx="3" style="fill:#0d1117"/><text x="762.0" y="142.0" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">which leaves a new problem</text><line x1="560.0" y1="208.0" x2="400.0" y2="208.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="400.0,208.0 408.2,204.3 408.2,211.7" style="fill:#b9b8b2"/><rect x="449.2" y="187.0" width="61.6" height="19" rx="3" style="fill:#0d1117"/><text x="480.0" y="200.0" text-anchor="middle" style="fill:#ecebe6;font-size:12.5px;font-weight:600">fixed by</text><line x1="210.0" y1="254.0" x2="210.0" y2="304.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="210.0,304.0 206.3,295.8 213.7,295.8" style="fill:#b9b8b2"/><line x1="400.0" y1="350.0" x2="560.0" y2="350.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="560.0,350.0 551.8,353.7 551.8,346.3" style="fill:#b9b8b2"/><rect x="449.2" y="329.0" width="61.6" height="19" rx="3" style="fill:#0d1117"/><text x="480.0" y="342.0" text-anchor="middle" style="fill:#ecebe6;font-size:12.5px;font-weight:600">fixed by</text><line x1="750.0" y1="396.0" x2="750.0" y2="446.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="750.0,446.0 746.3,437.8 753.7,437.8" style="fill:#b9b8b2"/><line x1="560.0" y1="492.0" x2="400.0" y2="492.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="400.0,492.0 408.2,488.3 408.2,495.7" style="fill:#b9b8b2"/><rect x="449.2" y="471.0" width="61.6" height="19" rx="3" style="fill:#0d1117"/><text x="480.0" y="484.0" text-anchor="middle" style="fill:#ecebe6;font-size:12.5px;font-weight:600">fixed by</text><rect x="20" y="20" width="380" height="92" style="fill:#0d1117;stroke:#f0584d;stroke-width:3"/><text x="32.0" y="61.7" text-anchor="start" style="fill:#8f8e96;font-size:11px;font-weight:700;letter-spacing:.08em">WHAT HURT</text><text x="32.0" y="77.8" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">A game stopped early: who gets the stakes?</text><rect x="560" y="20" width="380" height="92" style="fill:#0d1117;stroke:#5b8fe0;stroke-width:3"/><text x="572.0" y="53.5" text-anchor="start" style="fill:#8f8e96;font-size:11px;font-weight:700;letter-spacing:.08em">THE FIX</text><text x="572.0" y="69.5" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">Split in proportion to rounds won</text><text x="572.0" y="86.0" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">Pacioli, 1494</text><rect x="560" y="162" width="380" height="92" style="fill:#0d1117;stroke:#f0584d;stroke-width:3"/><text x="572.0" y="195.5" text-anchor="start" style="fill:#8f8e96;font-size:11px;font-weight:700;letter-spacing:.08em">WHAT HURT</text><text x="572.0" y="211.5" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">At 1 round to 0 that gives the leader 100.0% of the</text><text x="572.0" y="228.0" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">stakes, though the game is far from won</text><rect x="20" y="162" width="380" height="92" style="fill:#0d1117;stroke:#5b8fe0;stroke-width:3"/><text x="32.0" y="195.5" text-anchor="start" style="fill:#8f8e96;font-size:11px;font-weight:700;letter-spacing:.08em">THE FIX</text><text x="32.0" y="211.5" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">Count every way the game could still end</text><text x="32.0" y="228.0" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">Fermat, 1654</text><rect x="20" y="304" width="380" height="92" style="fill:#0d1117;stroke:#f0584d;stroke-width:3"/><text x="32.0" y="337.5" text-anchor="start" style="fill:#8f8e96;font-size:11px;font-weight:700;letter-spacing:.08em">WHAT HURT</text><text x="32.0" y="353.5" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">The cases double with every round: 549,755,813,888 for</text><text x="32.0" y="370.0" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">a game to 20</text><rect x="560" y="304" width="380" height="92" style="fill:#0d1117;stroke:#5b8fe0;stroke-width:3"/><text x="572.0" y="337.5" text-anchor="start" style="fill:#8f8e96;font-size:11px;font-weight:700;letter-spacing:.08em">THE FIX</text><text x="572.0" y="353.5" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">Work backward one round at a time: 400 averages</text><text x="572.0" y="370.0" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">Pascal, 1654</text><rect x="560" y="446" width="380" height="92" style="fill:#0d1117;stroke:#f0584d;stroke-width:3"/><text x="572.0" y="487.7" text-anchor="start" style="fill:#8f8e96;font-size:11px;font-weight:700;letter-spacing:.08em">WHAT HURT</text><text x="572.0" y="503.8" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">More players, more rounds, unequal chances</text><rect x="20" y="446" width="380" height="92" style="fill:#0d1117;stroke:#5b8fe0;stroke-width:3"/><text x="32.0" y="479.5" text-anchor="start" style="fill:#8f8e96;font-size:11px;font-weight:700;letter-spacing:.08em">THE FIX</text><text x="32.0" y="495.5" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">The same backward rule, in a bigger table</text><text x="32.0" y="512.0" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">Huygens 1657; today</text></svg>
