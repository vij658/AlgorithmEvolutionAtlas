<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1586 116" width="1586" height="116" role="img" aria-label="Era 3: Tables and Machines, from 1545 to 1890 CE" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>Era 3: Tables and Machines, from 1545 to 1890 CE</title><line x1="34" y1="34" x2="1552" y2="34" style="stroke:#17171a;stroke-width:2"/><circle cx="64.0" cy="34" r="7" style="fill:#ffffff;stroke:#17171a;stroke-width:2"/><text x="64.0" y="64" text-anchor="middle" style="fill:#7d7c84;font-size:11.5px">1545 CE</text><text x="64.0" y="84" text-anchor="middle" style="fill:#17171a;font-size:12.5px;font-weight:400">Cardano&#x27;s cubic</text><circle cx="185.5" cy="34" r="7" style="fill:#ffffff;stroke:#17171a;stroke-width:2"/><text x="185.5" y="64" text-anchor="middle" style="fill:#7d7c84;font-size:11.5px">1614–1624</text><text x="185.5" y="84" text-anchor="middle" style="fill:#17171a;font-size:12.5px;font-weight:400">Napier and Briggs&#x27;s</text><text x="185.5" y="100" text-anchor="middle" style="fill:#17171a;font-size:12.5px;font-weight:400">logarithms</text><circle cx="307.0" cy="34" r="7" style="fill:#ffffff;stroke:#17171a;stroke-width:2"/><text x="307.0" y="64" text-anchor="middle" style="fill:#7d7c84;font-size:11.5px">1623–1694</text><text x="307.0" y="84" text-anchor="middle" style="fill:#17171a;font-size:12.5px;font-weight:400">Schickard, Pascal,</text><text x="307.0" y="100" text-anchor="middle" style="fill:#17171a;font-size:12.5px;font-weight:400">Leibniz</text><circle cx="428.5" cy="34" r="7" style="fill:#ffffff;stroke:#17171a;stroke-width:2"/><text x="428.5" y="64" text-anchor="middle" style="fill:#7d7c84;font-size:11.5px">1654</text><text x="428.5" y="84" text-anchor="middle" style="fill:#17171a;font-size:12.5px;font-weight:400">Pascal and</text><text x="428.5" y="100" text-anchor="middle" style="fill:#17171a;font-size:12.5px;font-weight:400">Fermat&#x27;s points</text><circle cx="550.0" cy="34" r="9" style="fill:#d5