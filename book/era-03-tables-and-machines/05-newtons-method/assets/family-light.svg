<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" role="img" aria-label="How Newton&#x27;s method combined older ideas, and where it went" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>How Newton&#x27;s method combined older ideas, and where it went</title><line x1="125.0" y1="106.0" x2="426.5" y2="170.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="426.5,170.0 417.7,171.9 419.2,164.7" style="fill:#55545a"/><line x1="500.0" y1="106.0" x2="500.0" y2="170.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="500.0,170.0 496.3,161.8 503.7,161.8" style="fill:#55545a"/><line x1="875.0" y1="106.0" x2="573.5" y2="170.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="573.5,170.0 580.8,164.7 582.3,171.9" style="fill:#55545a"/><line x1="416.0" y1="256.0" x2="167.0" y2="330.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="167.0,330.0 173.8,324.1 175.9,331.2" style="fill:#55545a"/><line x1="500.0" y1="256.0" x2="500.0" y2="330.0" style="stroke:#55545a;stroke-width:1.5;stroke-dasharray:5 4"/><polygon points="500.0,330.0 496.3,321.8 503.7,321.8" style="fill:#55545a"/><line x1="584.0" y1="256.0" x2="833.0" y2="330.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="833.0,330.0 824.1,331.2 826.2,324.1" style="fill:#55545a"/><line x1="500.0" y1="416.0" x2="500.0" y2="480.0" style="stroke:#55545a;stroke-width:1.5;stroke-dasharray:5 4"/><polygon points="500.0,480.0 496.3,471.8 503.7,471.8" style="fill:#55545a"/><rect x="20" y="20" width="210" height="86" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="32.0" y="51.9" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Average x and a/x</text><text x="32.0" y="69.2" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">the Babylonian square root</text><text x="32.0" y="85.7" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">Era 1 topic 4</text><rect x="395" y="20" width="210" height="86" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="407.0" y="51.9" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Shift the polynomial</text><text x="407.0" y="69.2" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">root digit by digit</text><text x="407.0" y="85.7" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">Qin Jiushao, Era 2 topic 9</text><rect x="770" y="20" width="210" height="86" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="782.0" y="51.9" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Tangents and fluxions</text><text x="782.0" y="69.2" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">the slope of a curve</text><text x="782.0" y="85.7" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">the calculus, 1660s</text><rect x="395" y="170" width="210" height="86" style="fill:#ffffff;stroke:#d5352a;stroke-width:3"/><text x="407.0" y="185.4" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Newton&#x27;s method</text><text x="407.0" y="202.7" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">⊕ follow the tangent, then</text><text x="407.0" y="219.2" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">repeat</text><text x="407.0" y="235.7" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">Newton 1669; Raphson 1690;</text><text x="407.0" y="252.2" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">Simpson 1740</text><rect x="20" y="330" width="210" height="86" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="32.0" y="361.9" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Formulas that cancel</text><text x="32.0" y="379.2" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">repaired by one step</text><text x="32.0" y="395.7" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">topic 1</text><rect x="395" y="330" width="210" height="86" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="407.0" y="352.0" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Orbits and least</text><text x="407.0" y="371.8" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">squares</text><text x="407.0" y="389.1" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">iteration on real data</text><text x="407.0" y="405.6" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">topic 8</text><rect x="770" y="330" width="210" height="86" style="fill:#ffffff;stroke:#1f5ba8;stroke-width:3"/><text x="782.0" y="361.9" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Basins and fractals</text><text x="782.0" y="379.2" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">where each start ends up</text><text x="782.0" y="395.7" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">z³ = 1 in the plane</text><rect x="395" y="480" width="210" height="86" style="fill:#ffffff;stroke:#1f5ba8;stroke-width:3"/><text x="407.0" y="511.9" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Division without dividing</text><text x="407.0" y="529.1" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">x ← x(2 − ax)</text><text x="407.0" y="545.6" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">today</text><text x="20.0" y="615.0" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">Dashed: iteration as a way of working, not a documented borrowing.</text></svg>
