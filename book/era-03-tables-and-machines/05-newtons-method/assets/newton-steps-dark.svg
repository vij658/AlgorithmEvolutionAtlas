<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" width="1000" height="250" role="img" aria-label="Newton&#x27;s own steps on x³ − 2x − 5 = 0: keep the two lowest terms, solve, shift, repeat" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>Newton&#x27;s own steps on x³ − 2x − 5 = 0: keep the two lowest terms, solve, shift, repeat</title><line x1="240.0" y1="115.0" x2="265.0" y2="115.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="265.0,115.0 256.8,118.7 256.8,111.3" style="fill:#b9b8b2"/><line x1="485.0" y1="115.0" x2="510.0" y2="115.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="510.0,115.0 501.8,118.7 501.8,111.3" style="fill:#b9b8b2"/><line x1="730.0" y1="115.0" x2="755.0" y2="115.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="755.0,115.0 746.8,118.7 746.8,111.3" style="fill:#b9b8b2"/><rect x="20" y="50" width="220" height="130" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="32.0" y="103.9" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Start</text><text x="32.0" y="121.1" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">x = 2 + p</text><text x="32.0" y="137.6" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">p³ + 6p² + 10p − 1 = 0</text><rect x="265" y="50" width="220" height="130" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="277.0" y="95.6" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Step 1</text><text x="277.0" y="112.9" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">10 p − 1 = 0</text><text x="277.0" y="129.4" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">p = 0.1</text><text x="277.0" y="145.9" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">x = 2.1</text><rect x="510" y="50" width="220" height="130" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="522.0" y="95.6" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Step 2</text><text x="522.0" y="112.9" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">11.23 p + 0.061 = 0</text><text x="522.0" y="129.4" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">p = -0.0054</text><text x="522.0" y="145.9" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">x = 2.0946</text><rect x="755" y="50" width="220" height="130" style="fill:#0d1117;stroke:#f0584d;stroke-width:3"/><text x="767.0" y="95.6" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Step 3</text><text x="767.0" y="112.9" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">11.16196 p + 0.000541708 = 0</text><text x="767.0" y="129.4" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">p = -0.00004853</text><text x="767.0" y="145.9" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">x = 2.09455147</text><text x="20.0" y="30.0" text-anchor="start" style="fill:#8f8e96;font-size:11px;font-weight:700;letter-spacing:.08em">EACH STEP KEEPS TWICE AS MANY FIGURES: 1, 2, 4</text><text x="20.0" y="210.0" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">Newton&#x27;s 2.09455147 has 7 correct decimals (true root 2.0945514815423265915). The cubic term is dropped before the third step;</text><text x="20.0" y="228.0" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">keeping it ends at 2.09455148. Numbers from NewtonsMethod.java.</text></svg>
