<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="1000" height="240" role="img" aria-label="Egyptian doubling is binary multiplication: the ticked rows are the 1s of the multiplier" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>Egyptian doubling is binary multiplication: the ticked rows are the 1s of the multiplier</title><line x1="220.0" y1="96.0" x2="260.0" y2="96.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="260.0,96.0 251.8,99.7 251.8,92.3" style="fill:#55545a"/><rect x="214.7" y="83.0" width="50.6" height="19" rx="3" style="fill:#ffffff"/><text x="240.0" y="96.0" text-anchor="middle" style="fill:#17171a;font-size:12.5px;font-weight:600">double</text><line x1="460.0" y1="96.0" x2="500.0" y2="96.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="500.0,96.0 491.8,99.7 491.8,92.3" style="fill:#55545a"/><rect x="454.7" y="83.0" width="50.6" height="19" rx="3" style="fill:#ffffff"/><text x="480.0" y="96.0" text-anchor="middle" style="fill:#17171a;font-size:12.5px;font-weight:600">double</text><line x1="700.0" y1="96.0" x2="740.0" y2="96.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="740.0,96.0 731.8,99.7 731.8,92.3" style="fill:#55545a"/><rect x="694.7" y="83.0" width="50.6" height="19" rx="3" style="fill:#ffffff"/><text x="720.0" y="96.0" text-anchor="middle" style="fill:#17171a;font-size:12.5px;font-weight:600">double</text><rect x="20" y="50" width="200" height="92" style="fill:#ffffff;stroke:#d5352a;stroke-width:3"/><text x="32.0" y="84.9" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">1 × 21</text><text x="32.0" y="102.1" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">= 21</text><text x="32.0" y="118.6" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">ticked: a 1</text><rect x="260" y="50" width="200" height="92" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="272.0" y="84.9" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">2 × 21</text><text x="272.0" y="102.1" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">= 42</text><text x="272.0" y="118.6" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">not ticked: a 0</text><rect x="500" y="50" width="200" height="92" style="fill:#ffffff;stroke:#d5352a;stroke-width:3"/><text x="512.0" y="84.9" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">4 × 21</text><text x="512.0" y="102.1" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">= 84</text><text x="512.0" y="118.6" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">ticked: a 1</text><rect x="740" y="50" width="200" height="92" style="fill:#ffffff;stroke:#d5352a;stroke-width:3"/><text x="752.0" y="84.9" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">8 × 21</text><text x="752.0" y="102.1" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">= 168</text><text x="752.0" y="118.6" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">ticked: a 1</text><text x="20.0" y="30.0" text-anchor="start" style="fill:#7d7c84;font-size:11px;font-weight:700;letter-spacing:.08em">13 × 21 AS THE SCRIBES DID IT (ERA 1, TOPIC 5)</text><text x="20.0" y="200.0" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">Ticked: 21 + 84 + 168 = 273. Read from the last row to the first, the ticks spell 1101, which is 13 in binary.</text></svg>
