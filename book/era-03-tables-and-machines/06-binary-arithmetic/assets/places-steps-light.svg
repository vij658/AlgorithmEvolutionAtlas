<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" width="1000" height="220" role="img" aria-label="Harriot&#x27;s 1101101: each place is worth twice the place to its right" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>Harriot&#x27;s 1101101: each place is worth twice the place to its right</title><rect x="20" y="50" width="118" height="92" style="fill:#ffffff;stroke:#d5352a;stroke-width:3"/><text x="32.0" y="84.9" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">1</text><text x="32.0" y="102.1" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">× 64</text><text x="32.0" y="118.6" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">= 64</text><rect x="156" y="50" width="118" height="92" style="fill:#ffffff;stroke:#d5352a;stroke-width:3"/><text x="168.0" y="84.9" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">1</text><text x="168.0" y="102.1" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">× 32</text><text x="168.0" y="118.6" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">= 32</text><rect x="292" y="50" width="118" height="92" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="304.0" y="84.9" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">0</text><text x="304.0" y="102.1" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">× 16</text><text x="304.0" y="118.6" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">= 0</text><rect x="428" y="50" width="118" height="92" style="fill:#ffffff;stroke:#d5352a;stroke-width:3"/><text x="440.0" y="84.9" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">1</text><text x="440.0" y="102.1" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">× 8</text><text x="440.0" y="118.6" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">= 8</text><rect x="564" y="50" width="118" height="92" style="fill:#ffffff;stroke:#d5352a;stroke-width:3"/><text x="576.0" y="84.9" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">1</text><text x="576.0" y="102.1" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">× 4</text><text x="576.0" y="118.6" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">= 4</text><rect x="700" y="50" width="118" height="92" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="712.0" y="84.9" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">0</text><text x="712.0" y="102.1" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">× 2</text><text x="712.0" y="118.6" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">= 0</text><rect x="836" y="50" width="118" height="92" style="fill:#ffffff;stroke:#d5352a;stroke-width:3"/><text x="848.0" y="84.9" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">1</text><text x="848.0" y="102.1" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">× 1</text><text x="848.0" y="118.6" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">= 1</text><text x="20.0" y="30.0" text-anchor="start" style="fill:#7d7c84;font-size:11px;font-weight:700;letter-spacing:.08em">PLACE VALUES 64, 32, 16, 8, 4, 2, 1</text><text x="20.0" y="190.0" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">64 + 32 + 8 + 4 + 1 = 109. Harriot&#x27;s conversion of 109 survives in his unpublished papers (MacTutor, after Shirley 1951).</text></svg>
