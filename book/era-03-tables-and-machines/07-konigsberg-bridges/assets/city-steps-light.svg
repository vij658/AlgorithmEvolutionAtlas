<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 362" width="780" height="362" role="img" aria-label="Königsberg as four pieces of land joined by seven bridges" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>Königsberg as four pieces of land joined by seven bridges</title><path d="M330 160 Q290.0 100.0 330 40" style="fill:none;stroke:#1f5ba8;stroke-width:3"/><text x="302.0" y="96.0" text-anchor="end" style="fill:#7d7c84;font-size:12px;font-weight:400">a</text><path d="M330 160 Q370.0 100.0 330 40" style="fill:none;stroke:#1f5ba8;stroke-width:3"/><text x="358.0" y="96.0" text-anchor="start" style="fill:#7d7c84;font-size:12px;font-weight:400">b</text><path d="M330 160 Q370.0 220.0 330 280" style="fill:none;stroke:#1f5ba8;stroke-width:3"/><text x="358.0" y="216.0" text-anchor="start" style="fill:#7d7c84;font-size:12px;font-weight:400">c</text><path d="M330 160 Q290.0 220.0 330 280" style="fill:none;stroke:#1f5ba8;stroke-width:3"/><text x="302.0" y="216.0" text-anchor="end" style="fill:#7d7c84;font-size:12px;font-weight:400">d</text><path d="M330 160 Q470.0 160.0 610 160" style="fill:none;stroke:#1f5ba8;stroke-width:3"/><text x="478.0" y="156.0" text-anchor="start" style="fill:#7d7c84;font-size:12px;font-weight:400">e</text><path d="M330 40 Q470.0 100.0 610 160" style="fill:none;stroke:#1f5ba8;stroke-width:3"/><text x="478.0" y="96.0" text-anchor="start" style="fill:#7d7c84;font-size:12px;font-weight:400">f</text><path d="M330 280 Q470.0 220.0 610 160" style="fill:none;stroke:#1f5ba8;stroke-width:3"/><text x="478.0" y="216.0" text-anchor="start" style="fill:#7d7c84;font-size:12px;font-weight:400">g</text><circle cx="330" cy="160" r="22" style="fill:#ffffff;stroke:#d5352a;stroke-width:2.5"/><text x="330.0" y="166.0" text-anchor="middle" style="fill:#17171a;font-size:17px;font-weight:700">A</text><text x="362.0" y="146.0" text-anchor="start" style="fill:#d5352a;font-size:12.5px;font-weight:700">5 bridges</text><circle cx="330" cy="40" r="22" style="fill:#ffffff;stroke:#d5352a;stroke-width:2.5"/><text x="330.0" y="46.0" text-anchor="middle" style="fill:#17171a;font-size:17px;font-weight:700">B</text><text x="362.0" y="26.0" text-anchor="start" style="fill:#d5352a;font-size:12.5px;font-weight:700">3 bridges</text><circle cx="330" cy="280" r="22" style="fill:#ffffff;stroke:#d5352a;stroke-width:2.5"/><text x="330.0" y="286.0" text-anchor="middle" style="fill:#17171a;font-size:17px;font-weight:700">C</text><text x="362.0" y="310.0" text-anchor="start" style="fill:#d5352a;font-size:12.5px;font-weight:700">3 bridges</text><circle cx="610" cy="160" r="22" style="fill:#ffffff;stroke:#d5352a;stroke-width:2.5"/><text x="610.0" y="166.0" text-anchor="middle" style="fill:#17171a;font-size:17px;font-weight:700">D</text><text x="642.0" y="146.0" text-anchor="start" style="fill:#d5352a;font-size:12.5px;font-weight:700">3 bridges</text><text x="20.0" y="330.0" text-anchor="start" style="fill:#7d7c84;font-size:12.5px;font-weight:400">A: the island (Kneiphof). B, C: the two banks. D: the land between the two branches of the river.</text><text x="20.0" y="348.0" text-anchor="start" style="fill:#7d7c84;font-size:12.5px;font-weight:400">Every piece of land has an odd number of bridges (4 odd pieces), so no walk crosses each bridge exactly once.</text></svg>
