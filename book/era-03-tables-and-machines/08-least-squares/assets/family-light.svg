<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" role="img" aria-label="How least squares combined older ideas, and where it went" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>How least squares combined older ideas, and where it went</title><line x1="125.0" y1="106.0" x2="426.5" y2="170.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="426.5,170.0 417.7,171.9 419.2,164.7" style="fill:#55545a"/><line x1="500.0" y1="106.0" x2="500.0" y2="170.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="500.0,170.0 496.3,161.8 503.7,161.8" style="fill:#55545a"/><line x1="875.0" y1="106.0" x2="573.5" y2="170.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="573.5,170.0 580.8,164.7 582.3,171.9" style="fill:#55545a"/><line x1="416.0" y1="256.0" x2="167.0" y2="330.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="167.0,330.0 173.8,324.1 175.9,331.2" style="fill:#55545a"/><line x1="500.0" y1="256.0" x2="500.0" y2="330.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="500.0,330.0 496.3,321.8 503.7,321.8" style="fill:#55545a"/><line x1="584.0" y1="256.0" x2="833.0" y2="330.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="833.0,330.0 824.1,331.2 826.2,324.1" style="fill:#55545a"/><rect x="20" y="20" width="210" height="86" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="32.0" y="43.7" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Elimination</text><text x="32.0" y="60.9" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">solve n equations in n</text><text x="32.0" y="77.4" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">unknowns</text><text x="32.0" y="93.9" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">fangcheng, Era 2 topic 1</text><rect x="395" y="20" width="210" height="86" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="407.0" y="51.9" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Probability</text><text x="407.0" y="69.2" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">chances of errors</text><text x="407.0" y="85.7" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">topic 4</text><rect x="770" y="20" width="210" height="86" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="782.0" y="51.9" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Too many observations</text><text x="782.0" y="69.2" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">astronomy and surveying</text><text x="782.0" y="85.7" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">Ceres, 1801</text><rect x="395" y="170" width="210" height="86" style="fill:#ffffff;stroke:#d5352a;stroke-width:3"/><text x="407.0" y="193.7" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Least squares</text><text x="407.0" y="210.9" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">⊕ minimise the sum of squared</text><text x="407.0" y="227.4" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">errors</text><text x="407.0" y="243.9" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">Legendre 1805; Gauss 1809</text><rect x="20" y="330" width="210" height="86" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="32.0" y="361.9" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Fitting periodic data</text><text x="32.0" y="379.2" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">Gauss&#x27;s FFT</text><text x="32.0" y="395.7" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">topic 9</text><rect x="395" y="330" width="210" height="86" style="fill:#ffffff;stroke:#1f5ba8;stroke-width:3"/><text x="407.0" y="353.7" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Orthogonal methods</text><text x="407.0" y="370.9" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">QR, without squaring the</text><text x="407.0" y="387.4" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">problem</text><text x="407.0" y="403.9" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">Era 5</text><rect x="770" y="330" width="210" height="86" style="fill:#ffffff;stroke:#1f5ba8;stroke-width:3"/><text x="782.0" y="353.7" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Machine learning</text><text x="782.0" y="370.9" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">linear models trained on</text><text x="782.0" y="387.4" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">squared error</text><text x="782.0" y="403.9" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">today</text><text x="20.0" y="615.0" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">Gauss linked least squares to the probability of errors in 1809; Legendre justified it by the balance it sets up among the errors.</text></svg>
