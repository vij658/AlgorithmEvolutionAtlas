<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" width="1000" height="250" role="img" aria-label="Three rules for the best line, compared on the program&#x27;s data" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>Three rules for the best line, compared on the program&#x27;s data</title><rect x="20" y="50" width="300" height="130" style="fill:#ffffff;stroke:#d5352a;stroke-width:3"/><text x="32.0" y="95.6" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Least squares</text><text x="32.0" y="112.9" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">minimise the sum of squared errors</text><text x="32.0" y="129.4" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">slope error (mean square) 0.00357</text><text x="32.0" y="145.9" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">one wild point: slope 0.517 → 1.017</text><rect x="345" y="50" width="300" height="130" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="357.0" y="95.6" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Least absolute errors</text><text x="357.0" y="112.9" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">minimise the sum of |errors|</text><text x="357.0" y="129.4" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">slope error (mean square) 0.00548</text><text x="357.0" y="145.9" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">one wild point: slope 0.515 → 0.515</text><rect x="670" y="50" width="300" height="130" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="682.0" y="95.6" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Least largest error</text><text x="682.0" y="112.9" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">minimise the worst error</text><text x="682.0" y="129.4" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">slope error (mean square) 0.00772</text><text x="682.0" y="145.9" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">one wild point: slope 0.513 → 1.966</text><text x="20.0" y="30.0" text-anchor="start" style="fill:#7d7c84;font-size:11px;font-weight:700;letter-spacing:.08em">10,000 NOISY DATA SETS, AND ONE OBSERVATION COPIED WRONGLY</text><text x="20.0" y="210.0" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">With bell-shaped errors, least squares estimates the slope best; a single wild point pulls it, but less than it pulls the worst-error rule.</text><text x="20.0" y="228.0" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">Numbers from LeastSquares.java.</text></svg>
