<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 270" width="1000" height="270" role="img" aria-label="Gauss&#x27;s split of twelve observations: three interleaved groups of four, then four small combinations" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>Gauss&#x27;s split of twelve observations: three interleaved groups of four, then four small combinations</title><line x1="220.0" y1="61.0" x2="300.0" y2="130.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="300.0,130.0 291.4,127.4 296.2,121.9" style="fill:#b9b8b2"/><line x1="220.0" y1="135.0" x2="300.0" y2="130.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="300.0,130.0 292.0,134.2 291.6,126.8" style="fill:#b9b8b2"/><line x1="220.0" y1="209.0" x2="300.0" y2="130.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="300.0,130.0 296.7,138.4 291.6,133.2" style="fill:#b9b8b2"/><line x1="500.0" y1="130.0" x2="580.0" y2="130.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="580.0,130.0 571.8,133.7 571.8,126.3" style="fill:#b9b8b2"/><line x1="780.0" y1="130.0" x2="840.0" y2="130.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="840.0,130.0 831.8,133.7 831.8,126.3" style="fill:#b9b8b2"/><rect x="20" y="30" width="200" height="62" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="32.0" y="58.2" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Group 0</text><text x="32.0" y="75.4" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">observations 0, 3, 6, 9</text><rect x="20" y="104" width="200" height="62" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="32.0" y="132.2" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Group 1</text><text x="32.0" y="149.4" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">observations 1, 4, 7, 10</text><rect x="20" y="178" width="200" height="62" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="32.0" y="206.2" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Group 2</text><text x="32.0" y="223.4" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">observations 2, 5, 8, 11</text><rect x="300" y="85" width="200" height="90" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="312.0" y="118.9" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Twiddle</text><text x="312.0" y="136.1" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">turn each result by an angle</text><text x="312.0" y="152.6" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">6 products</text><rect x="580" y="85" width="200" height="90" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="592.0" y="118.9" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Combine</text><text x="592.0" y="136.1" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">four fits of three</text><text x="592.0" y="152.6" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">4 × 9 = 36 products</text><rect x="840" y="70" width="140" height="120" style="fill:#0d1117;stroke:#f0584d;stroke-width:3"/><text x="852.0" y="118.9" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">12 coefficients</text><text x="852.0" y="136.1" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">90 products</text><text x="852.0" y="152.6" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">direct: 144</text><text x="20.0" y="20.0" text-anchor="start" style="fill:#8f8e96;font-size:11px;font-weight:700;letter-spacing:.08em">THREE FITS OF FOUR: 3 × 16 = 48 PRODUCTS</text><text x="20.0" y="258.0" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">Twelve is three times four, so twelve observations become three groups of four (n = 3n₁ + n₂). Numbers from GaussFFT.java: 90 products against 144.</text></svg>
