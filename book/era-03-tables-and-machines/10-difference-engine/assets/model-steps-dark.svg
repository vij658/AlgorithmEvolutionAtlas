<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="1000" height="260" role="img" aria-label="Babbage&#x27;s model on x² + x + 41: three columns, and each turn of the handle is two additions" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>Babbage&#x27;s model on x² + x + 41: three columns, and each turn of the handle is two additions</title><line x1="540.0" y1="110.0" x2="500.0" y2="110.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="500.0,110.0 508.2,106.3 508.2,113.7" style="fill:#b9b8b2"/><rect x="503.9" y="97.0" width="32.1" height="19" rx="3" style="fill:#0d1117"/><text x="520.0" y="110.0" text-anchor="middle" style="fill:#ecebe6;font-size:12.5px;font-weight:600">add</text><line x1="280.0" y1="110.0" x2="240.0" y2="110.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="240.0,110.0 248.2,106.3 248.2,113.7" style="fill:#b9b8b2"/><rect x="243.9" y="97.0" width="32.1" height="19" rx="3" style="fill:#0d1117"/><text x="260.0" y="110.0" text-anchor="middle" style="fill:#ecebe6;font-size:12.5px;font-weight:600">add</text><line x1="240.0" y1="110.0" x2="800.0" y2="110.0" style="stroke:#b9b8b2;stroke-width:1.5;stroke-dasharray:5 4"/><polygon points="800.0,110.0 791.8,113.7 791.8,106.3" style="fill:#b9b8b2"/><rect x="20" y="50" width="220" height="120" style="fill:#0d1117;stroke:#f0584d;stroke-width:3"/><text x="32.0" y="90.6" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Value</text><text x="32.0" y="107.9" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">starts at 41</text><text x="32.0" y="124.4" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">prints the table</text><text x="32.0" y="140.9" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">+= first difference</text><rect x="280" y="50" width="220" height="120" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="292.0" y="90.6" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">First difference</text><text x="292.0" y="107.9" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">starts at 2</text><text x="292.0" y="124.4" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">2, 4, 6, 8, …</text><text x="292.0" y="140.9" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">+= second difference</text><rect x="540" y="50" width="220" height="120" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="552.0" y="90.6" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Second difference</text><text x="552.0" y="107.9" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">always 2</text><text x="552.0" y="124.4" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">constant for degree 2</text><text x="552.0" y="140.9" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">never changes</text><rect x="800" y="50" width="180" height="120" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="812.0" y="98.9" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Printed</text><text x="812.0" y="116.1" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">41, 43, 47, 53, 61</text><text x="812.0" y="132.6" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">71, 83, 97, 113, 131, …</text><text x="20.0" y="30.0" text-anchor="start" style="fill:#8f8e96;font-size:11px;font-weight:700;letter-spacing:.08em">NO MULTIPLICATION ANYWHERE: THE WHEELS ONLY ADD</text><text x="20.0" y="210.0" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">Every value is prime up to x = 39; at x = 40 the engine prints 1681 = 41 × 41. The engine does not know: it only adds.</text><text x="20.0" y="228.0" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">Numbers from DifferenceEngine.java.</text></svg>
