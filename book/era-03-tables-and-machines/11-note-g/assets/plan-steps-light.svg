<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" width="1000" height="250" role="img" aria-label="The plan of the calculation: set up, a repeated group, finish" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>The plan of the calculation: set up, a repeated group, finish</title><line x1="240.0" y1="110.0" x2="265.0" y2="110.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="265.0,110.0 256.8,113.7 256.8,106.3" style="fill:#55545a"/><line x1="485.0" y1="110.0" x2="510.0" y2="110.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="510.0,110.0 501.8,113.7 501.8,106.3" style="fill:#55545a"/><line x1="730.0" y1="110.0" x2="755.0" y2="110.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="755.0,110.0 746.8,113.7 746.8,106.3" style="fill:#55545a"/><rect x="20" y="50" width="220" height="120" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="32.0" y="90.6" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Operations 1–12</text><text x="32.0" y="107.9" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">2n, 2n − 1, 2n + 1</text><text x="32.0" y="124.4" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">A0 = −½ (2n − 1)/(2n + 1)</text><text x="32.0" y="140.9" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">A1 B1 added in</text><rect x="265" y="50" width="220" height="120" style="fill:#ffffff;stroke:#d5352a;stroke-width:3"/><text x="277.0" y="90.6" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Operations 13–23</text><text x="277.0" y="107.9" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">the next A from the last</text><text x="277.0" y="124.4" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">times the next B, added in</text><text x="277.0" y="140.9" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">repeated 2 times for B7</text><rect x="510" y="50" width="220" height="120" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="522.0" y="90.6" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Operations 24–25</text><text x="522.0" y="107.9" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">B7 = −(the sum)</text><text x="522.0" y="124.4" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">= -1/30</text><text x="522.0" y="140.9" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">n + 1, for the next run</text><rect x="755" y="50" width="220" height="120" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="767.0" y="90.6" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">In all</text><text x="767.0" y="107.9" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">36 operations</text><text x="767.0" y="124.4" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">on numbered columns</text><text x="767.0" y="140.9" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">of the store</text><text x="20.0" y="30.0" text-anchor="start" style="fill:#7d7c84;font-size:11px;font-weight:700;letter-spacing:.08em">A RECONSTRUCTION IN THE STYLE OF NOTE G: 25 OPERATION CARDS, ONE GROUP REPEATED</text><text x="20.0" y="210.0" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">Lovelace&#x27;s numbering: B1 = 1/6, B3 = −1/30, B5 = 1/42, B7 = −1/30 (today&#x27;s B2, B4, B6, B8). Numbers from NoteG.java.</text></svg>
