<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" width="1000" height="250" role="img" aria-label="A syllogism as algebra: Boole&#x27;s equations for &#x27;All M are P; all S are M; so all S are P&#x27;" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>A syllogism as algebra: Boole&#x27;s equations for &#x27;All M are P; all S are M; so all S are P&#x27;</title><line x1="485.0" y1="108.0" x2="510.0" y2="108.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="510.0,108.0 501.8,111.7 501.8,104.3" style="fill:#55545a"/><line x1="730.0" y1="108.0" x2="755.0" y2="108.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="755.0,108.0 746.8,111.7 746.8,104.3" style="fill:#55545a"/><line x1="240.0" y1="108.0" x2="265.0" y2="108.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="265.0,108.0 256.8,111.7 256.8,104.3" style="fill:#55545a"/><rect x="236.4" y="95.0" width="32.1" height="19" rx="3" style="fill:#ffffff"/><text x="252.5" y="108.0" text-anchor="middle" style="fill:#17171a;font-size:12.5px;font-weight:600">and</text><rect x="20" y="50" width="220" height="116" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="32.0" y="88.6" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">All M are P</text><text x="32.0" y="105.9" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">nothing is M without P</text><text x="32.0" y="122.4" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">m(1 − p) = 0</text><text x="32.0" y="138.9" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">so m = mp</text><rect x="265" y="50" width="220" height="116" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="277.0" y="88.6" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">All S are M</text><text x="277.0" y="105.9" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">nothing is S without M</text><text x="277.0" y="122.4" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">s(1 − m) = 0</text><text x="277.0" y="138.9" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">so s = sm</text><rect x="510" y="50" width="220" height="116" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="522.0" y="96.9" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Algebra</text><text x="522.0" y="114.1" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">s = sm = s(mp) = (sm)p</text><text x="522.0" y="130.6" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">= sp</text><rect x="755" y="50" width="220" height="116" style="fill:#ffffff;stroke:#d5352a;stroke-width:3"/><text x="767.0" y="88.6" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">So all S are P</text><text x="767.0" y="105.9" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">s = sp</text><text x="767.0" y="122.4" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">s(1 − p) = 0</text><text x="767.0" y="138.9" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">one of the 15 valid forms</text><text x="20.0" y="30.0" text-anchor="start" style="fill:#7d7c84;font-size:11px;font-weight:700;letter-spacing:.08em">WORDS BECOME EQUATIONS IN 0 AND 1; REASONING BECOMES SUBSTITUTION</text><text x="20.0" y="215.0" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">The program tested all 256 forms of the syllogism this way: 15 valid, 24 if every class has members. Numbers from BooleanAlgebra.java.</text></svg>
