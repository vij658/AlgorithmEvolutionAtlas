<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 558" width="960" height="558" role="img" aria-label="Each fix leaves a new pain: from syllogisms to circuits" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>Each fix leaves a new pain: from syllogisms to circuits</title><line x1="400.0" y1="66.0" x2="560.0" y2="66.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="560.0,66.0 551.8,69.7 551.8,62.3" style="fill:#55545a"/><rect x="449.2" y="45.0" width="61.6" height="19" rx="3" style="fill:#ffffff"/><text x="480.0" y="58.0" text-anchor="middle" style="fill:#17171a;font-size:12.5px;font-weight:600">fixed by</text><line x1="750.0" y1="112.0" x2="750.0" y2="162.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="750.0,162.0 746.3,153.8 753.7,153.8" style="fill:#55545a"/><rect x="757.0" y="129.0" width="175.9" height="19" rx="3" style="fill:#ffffff"/><text x="762.0" y="142.0" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">which leaves a new problem</text><line x1="560.0" y1="208.0" x2="400.0" y2="208.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="400.0,208.0 408.2,204.3 408.2,211.7" style="fill:#55545a"/><rect x="449.2" y="187.0" width="61.6" height="19" rx="3" style="fill:#ffffff"/><text x="480.0" y="200.0" text-anchor="middle" style="fill:#17171a;font-size:12.5px;font-weight:600">fixed by</text><line x1="210.0" y1="254.0" x2="210.0" y2="304.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="210.0,304.0 206.3,295.8 213.7,295.8" style="fill:#55545a"/><line x1="400.0" y1="350.0" x2="560.0" y2="350.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="560.0,350.0 551.8,353.7 551.8,346.3" style="fill:#55545a"/><rect x="449.2" y="329.0" width="61.6" height="19" rx="3" style="fill:#ffffff"/><text x="480.0" y="342.0" text-anchor="middle" style="fill:#17171a;font-size:12.5px;font-weight:600">fixed by</text><line x1="750.0" y1="396.0" x2="750.0" y2="446.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="750.0,446.0 746.3,437.8 753.7,437.8" style="fill:#55545a"/><line x1="560.0" y1="492.0" x2="400.0" y2="492.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="400.0,492.0 408.2,488.3 408.2,495.7" style="fill:#55545a"/><rect x="449.2" y="471.0" width="61.6" height="19" rx="3" style="fill:#ffffff"/><text x="480.0" y="484.0" text-anchor="middle" style="fill:#17171a;font-size:12.5px;font-weight:600">fixed by</text><rect x="20" y="20" width="380" height="92" style="fill:#ffffff;stroke:#d5352a;stroke-width:3"/><text x="32.0" y="53.5" text-anchor="start" style="fill:#7d7c84;font-size:11px;font-weight:700;letter-spacing:.08em">WHAT HURT</text><text x="32.0" y="69.5" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">Logic was a catalogue of argument forms, checked by</text><text x="32.0" y="86.0" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">memory</text><rect x="560" y="20" width="380" height="92" style="fill:#ffffff;stroke:#1f5ba8;stroke-width:3"/><text x="572.0" y="45.2" text-anchor="start" style="fill:#7d7c84;font-size:11px;font-weight:700;letter-spacing:.08em">THE FIX</text><text x="572.0" y="61.3" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">Write classes as symbols; reasoning becomes algebra</text><text x="572.0" y="77.8" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">with x² = x</text><text x="572.0" y="94.3" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">Boole, 1847 and 1854</text><rect x="560" y="162" width="380" height="92" style="fill:#ffffff;stroke:#d5352a;stroke-width:3"/><text x="572.0" y="203.7" text-anchor="start" style="fill:#7d7c84;font-size:11px;font-weight:700;letter-spacing:.08em">WHAT HURT</text><text x="572.0" y="219.8" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">Which of the 256 syllogism forms are valid?</text><rect x="20" y="162" width="380" height="92" style="fill:#ffffff;stroke:#1f5ba8;stroke-width:3"/><text x="32.0" y="195.5" text-anchor="start" style="fill:#7d7c84;font-size:11px;font-weight:700;letter-spacing:.08em">THE FIX</text><text x="32.0" y="211.5" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">Calculate it: 15 valid, 24 if every class has members</text><text x="32.0" y="228.0" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">algebra over 0 and 1</text><rect x="20" y="304" width="380" height="92" style="fill:#ffffff;stroke:#d5352a;stroke-width:3"/><text x="32.0" y="337.5" text-anchor="start" style="fill:#7d7c84;font-size:11px;font-weight:700;letter-spacing:.08em">WHAT HURT</text><text x="32.0" y="353.5" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">Circuits of relays grew large and were hard to reason</text><text x="32.0" y="370.0" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">about</text><rect x="560" y="304" width="380" height="92" style="fill:#ffffff;stroke:#1f5ba8;stroke-width:3"/><text x="572.0" y="329.2" text-anchor="start" style="fill:#7d7c84;font-size:11px;font-weight:700;letter-spacing:.08em">THE FIX</text><text x="572.0" y="345.3" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">Contacts in series multiply, in parallel add: Boole&#x27;s</text><text x="572.0" y="361.8" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">algebra designs circuits</text><text x="572.0" y="378.3" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">Shannon, 1937</text><rect x="560" y="446" width="380" height="92" style="fill:#ffffff;stroke:#d5352a;stroke-width:3"/><text x="572.0" y="487.7" text-anchor="start" style="fill:#7d7c84;font-size:11px;font-weight:700;letter-spacing:.08em">WHAT HURT</text><text x="572.0" y="503.8" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">Circuits as first drawn waste parts: 6 contacts</text><rect x="20" y="446" width="380" height="92" style="fill:#ffffff;stroke:#1f5ba8;stroke-width:3"/><text x="32.0" y="479.5" text-anchor="start" style="fill:#7d7c84;font-size:11px;font-weight:700;letter-spacing:.08em">THE FIX</text><text x="32.0" y="495.5" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">Simplify by the algebra: 2 contacts do the same</text><text x="32.0" y="512.0" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">Shannon</text></svg>
