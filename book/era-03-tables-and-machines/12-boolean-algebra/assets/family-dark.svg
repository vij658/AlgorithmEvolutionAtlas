<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" role="img" aria-label="How Boole&#x27;s algebra combined older ideas, and where it went" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>How Boole&#x27;s algebra combined older ideas, and where it went</title><line x1="125.0" y1="106.0" x2="426.5" y2="170.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="426.5,170.0 417.7,171.9 419.2,164.7" style="fill:#b9b8b2"/><line x1="500.0" y1="106.0" x2="500.0" y2="170.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="500.0,170.0 496.3,161.8 503.7,161.8" style="fill:#b9b8b2"/><line x1="875.0" y1="106.0" x2="573.5" y2="170.0" style="stroke:#b9b8b2;stroke-width:1.5;stroke-dasharray:5 4"/><polygon points="573.5,170.0 580.8,164.7 582.3,171.9" style="fill:#b9b8b2"/><line x1="416.0" y1="256.0" x2="167.0" y2="330.0" style="stroke:#b9b8b2;stroke-width:1.5;stroke-dasharray:5 4"/><polygon points="167.0,330.0 173.8,324.1 175.9,331.2" style="fill:#b9b8b2"/><line x1="500.0" y1="256.0" x2="500.0" y2="330.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="500.0,330.0 496.3,321.8 503.7,321.8" style="fill:#b9b8b2"/><line x1="605.0" y1="373.0" x2="770.0" y2="373.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="770.0,373.0 761.8,376.7 761.8,369.3" style="fill:#b9b8b2"/><rect x="20" y="20" width="210" height="86" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="32.0" y="43.7" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Syllogisms</text><text x="32.0" y="60.9" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">valid argument forms, learned</text><text x="32.0" y="77.4" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">by heart</text><text x="32.0" y="93.9" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">Aristotle</text><rect x="395" y="20" width="210" height="86" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="407.0" y="51.9" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Symbolic algebra</text><text x="407.0" y="69.2" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">letters obey rules</text><text x="407.0" y="85.7" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">al-jabr, Era 2 topic 6</text><rect x="770" y="20" width="210" height="86" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="782.0" y="51.9" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Two values</text><text x="782.0" y="69.2" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">binary arithmetic</text><text x="782.0" y="85.7" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">topic 6</text><rect x="395" y="170" width="210" height="86" style="fill:#0d1117;stroke:#f0584d;stroke-width:3"/><text x="407.0" y="193.7" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Boole&#x27;s algebra</text><text x="407.0" y="210.9" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">⊕ classes as symbols, with x²</text><text x="407.0" y="227.4" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">= x</text><text x="407.0" y="243.9" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">1847; 1854</text><rect x="20" y="330" width="210" height="86" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="32.0" y="353.7" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Regions of classes</text><text x="32.0" y="370.9" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">eight regions for three</text><text x="32.0" y="387.4" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">classes</text><text x="32.0" y="403.9" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">how the program checks</text><rect x="395" y="330" width="210" height="86" style="fill:#0d1117;stroke:#5b8fe0;stroke-width:3"/><text x="407.0" y="361.9" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Switching circuits</text><text x="407.0" y="379.2" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">relays obey Boole&#x27;s algebra</text><text x="407.0" y="395.7" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">Shannon, 1937</text><rect x="770" y="330" width="210" height="86" style="fill:#0d1117;stroke:#5b8fe0;stroke-width:3"/><text x="782.0" y="361.9" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Logic gates</text><text x="782.0" y="379.2" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">every digital circuit</text><text x="782.0" y="395.7" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">today</text><text x="20.0" y="615.0" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">Dashed: Boole&#x27;s 0 and 1 are &#x27;nothing&#x27; and &#x27;everything&#x27;, not binary digits; the identification came later. </text></svg>
