<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" width="1000" height="250" role="img" aria-label="One card through Hollerith&#x27;s press: a hole lets a pin reach the mercury, and a dial moves on" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>One card through Hollerith&#x27;s press: a hole lets a pin reach the mercury, and a dial moves on</title><line x1="240.0" y1="108.0" x2="265.0" y2="108.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="265.0,108.0 256.8,111.7 256.8,104.3" style="fill:#b9b8b2"/><line x1="485.0" y1="108.0" x2="510.0" y2="108.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="510.0,108.0 501.8,111.7 501.8,104.3" style="fill:#b9b8b2"/><line x1="730.0" y1="108.0" x2="755.0" y2="108.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="755.0,108.0 746.8,111.7 746.8,104.3" style="fill:#b9b8b2"/><rect x="20" y="50" width="220" height="116" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="32.0" y="88.6" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">A punched card</text><text x="32.0" y="105.9" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">one person</text><text x="32.0" y="122.4" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">a hole per answer</text><text x="32.0" y="138.9" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">e.g. male, native, 20–29</text><rect x="265" y="50" width="220" height="116" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="277.0" y="88.6" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">The press</text><text x="277.0" y="105.9" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">pins come down on the card</text><text x="277.0" y="122.4" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">a hole lets a pin through</text><text x="277.0" y="138.9" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">into a cup of mercury</text><rect x="510" y="50" width="220" height="116" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="522.0" y="88.6" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Circuits and relays</text><text x="522.0" y="105.9" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">each closed circuit</text><text x="522.0" y="122.4" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">advances a dial by one</text><text x="522.0" y="138.9" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">relays need several holes</text><rect x="755" y="50" width="220" height="116" style="fill:#0d1117;stroke:#f0584d;stroke-width:3"/><text x="767.0" y="88.6" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Dials and drawer</text><text x="767.0" y="105.9" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">40 dials counted at once</text><text x="767.0" y="122.4" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">a bell for each card</text><text x="767.0" y="138.9" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">the table names a drawer</text><text x="20.0" y="30.0" text-anchor="start" style="fill:#8f8e96;font-size:11px;font-weight:700;letter-spacing:.08em">THE CARD IS READ BY ELECTRICITY, NOT BY EYE</text><text x="20.0" y="210.0" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">After the US Census Bureau&#x27;s description of the 1890 machine and Hollerith&#x27;s own article of 1889.</text></svg>
