<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" role="img" aria-label="How the Runge–Kutta methods combined older ideas, and where they led" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>How the Runge–Kutta methods combined older ideas, and where they led</title><line x1="125.0" y1="106.0" x2="426.5" y2="170.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="426.5,170.0 417.7,171.9 419.2,164.7" style="fill:#b9b8b2"/><line x1="500.0" y1="106.0" x2="500.0" y2="170.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="500.0,170.0 496.3,161.8 503.7,161.8" style="fill:#b9b8b2"/><line x1="875.0" y1="106.0" x2="573.5" y2="170.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="573.5,170.0 580.8,164.7 582.3,171.9" style="fill:#b9b8b2"/><line x1="416.0" y1="256.0" x2="167.0" y2="330.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="167.0,330.0 173.8,324.1 175.9,331.2" style="fill:#b9b8b2"/><line x1="500.0" y1="256.0" x2="500.0" y2="330.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="500.0,330.0 496.3,321.8 503.7,321.8" style="fill:#b9b8b2"/><line x1="584.0" y1="256.0" x2="833.0" y2="330.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="833.0,330.0 824.1,331.2 826.2,324.1" style="fill:#b9b8b2"/><line x1="500.0" y1="416.0" x2="500.0" y2="480.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="500.0,480.0 496.3,471.8 503.7,471.8" style="fill:#b9b8b2"/><line x1="833.0" y1="416.0" x2="605.0" y2="523.0" style="stroke:#b9b8b2;stroke-width:1.5;stroke-dasharray:5 4"/><polygon points="605.0,523.0 610.9,516.2 614.0,522.8" style="fill:#b9b8b2"/><rect x="20" y="20" width="210" height="86" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="32.0" y="43.7" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Euler&#x27;s method</text><text x="32.0" y="60.9" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">follow the slope at the start</text><text x="32.0" y="77.4" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">of each step</text><text x="32.0" y="93.9" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">1768</text><rect x="395" y="20" width="210" height="86" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="407.0" y="33.8" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Midpoint and trapezoid</text><text x="407.0" y="53.5" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">rules</text><text x="407.0" y="70.8" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">better areas from a few</text><text x="407.0" y="87.3" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">samples</text><text x="407.0" y="103.8" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">quadrature</text><rect x="770" y="20" width="210" height="86" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="782.0" y="43.7" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Taylor series</text><text x="782.0" y="60.9" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">how a solution changes, term</text><text x="782.0" y="77.4" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">by term</text><text x="782.0" y="93.9" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">Newton, Taylor</text><rect x="395" y="170" width="210" height="86" style="fill:#0d1117;stroke:#f0584d;stroke-width:3"/><text x="407.0" y="193.7" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Runge, Heun, Kutta</text><text x="407.0" y="210.9" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">⊕ several slopes per step,</text><text x="407.0" y="227.4" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">weighted to cancel error</text><text x="407.0" y="243.9" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">1895–1901</text><rect x="20" y="330" width="210" height="86" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="32.0" y="361.9" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Nyström</text><text x="32.0" y="379.2" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">order 5 completed</text><text x="32.0" y="395.7" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">1925</text><rect x="395" y="330" width="210" height="86" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="407.0" y="352.0" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Order conditions as</text><text x="407.0" y="371.8" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">trees</text><text x="407.0" y="389.1" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">a theory for every order</text><text x="407.0" y="405.6" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">Butcher</text><rect x="770" y="330" width="210" height="86" style="fill:#0d1117;stroke:#5b8fe0;stroke-width:3"/><text x="782.0" y="353.7" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Adaptive steps</text><text x="782.0" y="370.9" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">two estimates per step; the</text><text x="782.0" y="387.4" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">step size follows the error</text><text x="782.0" y="403.9" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">later</text><rect x="395" y="480" width="210" height="86" style="fill:#0d1117;stroke:#5b8fe0;stroke-width:3"/><text x="407.0" y="503.7" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Simulation today</text><text x="407.0" y="520.9" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">orbits, circuits, chemistry,</text><text x="407.0" y="537.4" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">weather</text><text x="407.0" y="553.9" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">today</text><text x="20.0" y="615.0" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">Euler&#x27;s method is from Euler&#x27;s Institutiones calculi integralis (1768–1770); Butcher&#x27;s theory and adaptive methods are later than this era.</text></svg>
