<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-label="Euler&#x27;s method and the classical Runge–Kutta method on an oscillator" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>Euler&#x27;s method and the classical Runge–Kutta method on an oscillator</title><circle cx="200.0" cy="200.0" r="90.0" style="fill:none;stroke:#c4c3bb;stroke-width:2"/><path d="M290.0,200.0 L290.0,235.3 L276.1,270.7 L248.4,300.6 L208.9,319.6 L161.9,323.1 L113.6,308.1 L71.1,274.2 L42.0,223.6 L32.8,161.5 L47.9,95.8 L88.8,36.1" style="fill:none;stroke:#d5352a;stroke-width:2.2"/><path d="M290.0,200.0 L283.1,234.4 L263.6,263.6 L234.5,283.1 L200.0,290.0 L165.6,283.2 L136.4,263.7 L116.9,234.5 L110.0,200.1 L116.8,165.6 L136.3,136.4 L165.5,116.9 L199.9,110.0 L234.4,116.8 L263.6,136.3 L283.1,165.5 L290.0,199.9 L283.2,234.3 L263.7,263.5 L234.5,283.1 L200.1,290.0 L165.7,283.2 L136.5,263.7 L117.0,234.6 L110.1,200.2 L116.8,165.7 L136.3,136.5 L165.4,117.0 L199.8,110.1 L234.2,116.8 L263.5,136.3 L283.0,165.4 L289.9,199.8 L283.2,234.2 L263.7,263.4 L234.6,283.0 L200.2,289.9 L165.8,283.2 L136.6,263.8 L117.0,234.6 L110.1,200.3 L116.8,165.8 L136.2,136.6 L165.3,117.0 L199.7,110.1 L234.1,116.8 L263.4,136.2 L282.9,165.3 L289.9,199.7" style="fill:none;stroke:#1f5ba8;stroke-width:2.2"/><line x1="10.0" y1="200.0" x2="390.0" y2="200.0" style="stroke:#c4c3bb;stroke-width:1"/><line x1="200.0" y1="10.0" x2="200.0" y2="390.0" style="stroke:#c4c3bb;stroke-width:1"/><text x="386.0" y="194.0" text-anchor="end" style="fill:#7d7c84;font-size:12px;font-weight:400">position</text><text x="206.0" y="22.0" text-anchor="start" style="fill:#7d7c84;font-size:12px;font-weight:400">velocity</text><text x="420.0" y="80.0" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Three turns of a spring, x&#x27;&#x27; = −x, 16 steps a turn</text><text x="420.0" y="112.0" text-anchor="start" style="fill:#7d7c84;font-size:13px;font-weight:400">Grey: the true path, a circle.</text><text x="420.0" y="136.0" text-anchor="start" style="fill:#d5352a;font-size:13px;font-weight:700">Red: Euler&#x27;s method spirals outward;</text><text x="420.0" y="156.0" text-anchor="start" style="fill:#d5352a;font-size:13px;font-weight:400">each step multiplies x² + v² by 1 + h².</text><text x="420.0" y="186.0" text-anchor="start" style="fill:#1f5ba8;font-size:13px;font-weight:700">Blue: Kutta&#x27;s four-slope method</text><text x="420.0" y="206.0" text-anchor="start" style="fill:#1f5ba8;font-size:13px;font-weight:400">stays on the circle at this scale.</text><text x="420.0" y="250.0" text-anchor="start" style="fill:#7d7c84;font-size:12.5px;font-weight:400">With 32 steps a turn for 20 turns, the program finds</text><text x="420.0" y="270.0" text-anchor="start" style="fill:#7d7c84;font-size:12.5px;font-weight:400">x² + v² = 32,687,626,830 for Euler, 0.99949322 for Kutta&#x27;s.</text></svg>
