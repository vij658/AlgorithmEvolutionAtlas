<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" role="img" aria-label="How the cheapest network combined older ideas, and where it led" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>How the cheapest network combined older ideas, and where it led</title><line x1="125.0" y1="106.0" x2="426.5" y2="170.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="426.5,170.0 417.7,171.9 419.2,164.7" style="fill:#b9b8b2"/><line x1="500.0" y1="106.0" x2="500.0" y2="170.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="500.0,170.0 496.3,161.8 503.7,161.8" style="fill:#b9b8b2"/><line x1="875.0" y1="106.0" x2="573.5" y2="170.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="573.5,170.0 580.8,164.7 582.3,171.9" style="fill:#b9b8b2"/><line x1="416.0" y1="256.0" x2="167.0" y2="330.0" style="stroke:#b9b8b2;stroke-width:1.5;stroke-dasharray:5 4"/><polygon points="167.0,330.0 173.8,324.1 175.9,331.2" style="fill:#b9b8b2"/><line x1="500.0" y1="256.0" x2="500.0" y2="330.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="500.0,330.0 496.3,321.8 503.7,321.8" style="fill:#b9b8b2"/><line x1="584.0" y1="256.0" x2="833.0" y2="330.0" style="stroke:#b9b8b2;stroke-width:1.5;stroke-dasharray:5 4"/><polygon points="833.0,330.0 824.1,331.2 826.2,324.1" style="fill:#b9b8b2"/><line x1="500.0" y1="416.0" x2="500.0" y2="480.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="500.0,480.0 496.3,471.8 503.7,471.8" style="fill:#b9b8b2"/><line x1="833.0" y1="416.0" x2="605.0" y2="523.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="605.0,523.0 610.9,516.2 614.0,522.8" style="fill:#b9b8b2"/><rect x="20" y="20" width="210" height="86" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="32.0" y="43.7" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Euler&#x27;s bridges</text><text x="32.0" y="60.9" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">keep only what connects to</text><text x="32.0" y="77.4" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">what</text><text x="32.0" y="93.9" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">Era 3 topic 7</text><rect x="395" y="20" width="210" height="86" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="407.0" y="43.7" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Electrifying Moravia</text><text x="407.0" y="60.9" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">lines are expensive; towns</text><text x="407.0" y="77.4" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">are many</text><text x="407.0" y="93.9" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">1920s</text><rect x="770" y="20" width="210" height="86" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="782.0" y="43.7" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Nearest neighbour</text><text x="782.0" y="60.9" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">join each point to the</text><text x="782.0" y="77.4" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">closest</text><text x="782.0" y="93.9" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">a greedy choice</text><rect x="395" y="170" width="210" height="86" style="fill:#0d1117;stroke:#f0584d;stroke-width:3"/><text x="407.0" y="193.7" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Borůvka and Jarník</text><text x="407.0" y="210.9" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">⊕ greedy choices, proved</text><text x="407.0" y="227.4" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">optimal</text><text x="407.0" y="243.9" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">1926, 1930</text><rect x="20" y="330" width="210" height="86" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="32.0" y="353.7" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Found again</text><text x="32.0" y="370.9" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">Choquet 1938; Florek et al.</text><text x="32.0" y="387.4" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">1951; Sollin</text><text x="32.0" y="403.9" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">rediscoveries</text><rect x="395" y="330" width="210" height="86" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="407.0" y="353.7" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Kruskal and Prim</text><text x="407.0" y="370.9" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">sort the lines; grow from one</text><text x="407.0" y="387.4" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">town</text><text x="407.0" y="403.9" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">1956, 1957</text><rect x="770" y="330" width="210" height="86" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="782.0" y="353.7" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Clustering</text><text x="782.0" y="370.9" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">cut the longest lines of the</text><text x="782.0" y="387.4" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">tree</text><text x="782.0" y="403.9" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">Czekanowski&#x27;s precursor, 1909</text><rect x="395" y="480" width="210" height="86" style="fill:#0d1117;stroke:#5b8fe0;stroke-width:3"/><text x="407.0" y="503.7" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Networks today</text><text x="407.0" y="520.9" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">cables, pipes, circuits; a step</text><text x="407.0" y="537.4" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">in harder problems</text><text x="407.0" y="553.9" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">today</text><text x="20.0" y="615.0" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">Dashed: the same methods found independently, and a precursor whose method was not checked here (see the catalog).</text></svg>
