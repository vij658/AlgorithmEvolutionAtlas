<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 270" width="780" height="270" role="img" aria-label="A formula coded as a number and read back" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>A formula coded as a number and read back</title><text x="30.0" y="40.0" text-anchor="start" style="fill:#7d7c84;font-size:12.5px;font-weight:400">the formula</text><text x="30.0" y="110.0" text-anchor="start" style="fill:#7d7c84;font-size:12.5px;font-weight:400">sign numbers</text><text x="30.0" y="180.0" text-anchor="start" style="fill:#7d7c84;font-size:12.5px;font-weight:400">prime powers</text><rect x="180.0" y="18.0" width="64.0" height="34.0" rx="0" style="fill:#ffffff;stroke:#d5352a;stroke-width:2"/><text x="212.0" y="41.0" text-anchor="middle" style="fill:#17171a;font-size:18px;font-weight:700">f</text><line x1="212.0" y1="54.0" x2="212.0" y2="88.0" style="stroke:#c4c3bb;stroke-width:1.5"/><text x="212.0" y="112.0" text-anchor="middle" style="fill:#d5352a;font-size:17px;font-weight:700">3</text><line x1="212.0" y1="120.0" x2="212.0" y2="158.0" style="stroke:#c4c3bb;stroke-width:1.5"/><text x="212.0" y="184.0" text-anchor="middle" style="fill:#1f5ba8;font-size:17px;font-weight:700">2³</text><rect x="300.0" y="18.0" width="64.0" height="34.0" rx="0" style="fill:#ffffff;stroke:#d5352a;stroke-width:2"/><text x="332.0" y="41.0" text-anchor="middle" style="fill:#17171a;font-size:18px;font-weight:700">f</text><line x1="332.0" y1="54.0" x2="332.0" y2="88.0" style="stroke:#c4c3bb;stroke-width:1.5"/><text x="332.0" y="112.0" text-anchor="middle" style="fill:#d5352a;font-size:17px;font-weight:700">3</text><line x1="332.0" y1="120.0" x2="332.0" y2="158.0" style="stroke:#c4c3bb;stroke-width:1.5"/><text x="332.0" y="184.0" text-anchor="middle" style="fill:#1f5ba8;font-size:17px;font-weight:700">3³</text><rect x="420.0" y="18.0" width="64.0" height="34.0" rx="0" style="fill:#ffffff;stroke:#d5352a;stroke-width:2"/><text x="452.0" y="41.0" text-anchor="middle" style="fill:#17171a;font-size:18px;font-weight:700">0</text><line x1="452.0" y1="54.0" x2="452.0" y2="88.0" style="stroke:#c4c3bb;stroke-width:1.5"/><text x="452.0" y="112.0" text-anchor="middle" style="fill:#d5352a;font-size:17px;font-weight:700">1</text><line x1="452.0" y1="120.0" x2="452.0" y2="158.0" style="stroke:#c4c3bb;stroke-width:1.5"/><text x="452.0" y="184.0" text-anchor="middle" style="fill:#1f5ba8;font-size:17px;font-weight:700">5¹</text><text x="560.0" y="184.0" text-anchor="start" style="fill:#17171a;font-size:20px;font-weight:700">= 1080</text><text x="30.0" y="236.0" text-anchor="start" style="fill:#7d7c84;font-size:12.5px;font-weight:400">&quot;ff0&quot; is the number 2 (the successor of the successor of 0). Its Gödel number is 2³ · 3³ · 5¹ = 1080.</text><text x="30.0" y="256.0" text-anchor="start" style="fill:#7d7c84;font-size:12.5px;font-weight:400">Read it back by dividing by 2, then 3, then 5, ... and counting: 3, 3, 1, which are f, f, 0.</text></svg>
