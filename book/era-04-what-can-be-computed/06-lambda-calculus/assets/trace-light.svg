<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 340" width="860" height="340" role="img" aria-label="The reduction of PLUS 2 3 to 5 in the lambda calculus" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>The reduction of PLUS 2 3 to 5 in the lambda calculus</title><text x="20.0" y="30.0" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">PLUS 2 3, reduced step by step (leftmost, outermost redex first)</text><text x="30.0" y="66.0" text-anchor="end" style="fill:#d5352a;font-size:14px;font-weight:700">0</text><text x="44" y="66" style="fill:#17171a;font-size:14px;font-family:ui-monospace,Menlo,Consolas,monospace">(λabcd.a(c)(b(c)(d)))(λab.a(a(b)))(λab.a(a(a(b))))</text><text x="30.0" y="100.0" text-anchor="end" style="fill:#7d7c84;font-size:14px;font-weight:700">1</text><text x="44" y="100" style="fill:#17171a;font-size:14px;font-family:ui-monospace,Menlo,Consolas,monospace">(λabc.(λde.d(d(e)))(b)(a(b)(c)))(λab.a(a(a(b))))</text><text x="30.0" y="134.0" text-anchor="end" style="fill:#7d7c84;font-size:14px;font-weight:700">2</text><text x="44" y="134" style="fill:#17171a;font-size:14px;font-family:ui-monospace,Menlo,Consolas,monospace">λab.(λcd.c(c(d)))(a)((λcd.c(c(c(d))))(a)(b))</text><text x="30.0" y="168.0" text-anchor="end" style="fill:#7d7c84;font-size:14px;font-weight:700">3</text><text x="44" y="168" style="fill:#17171a;font-size:14px;font-family:ui-monospace,Menlo,Consolas,monospace">λab.(λc.a(a(c)))((λcd.c(c(c(d))))(a)(b))</text><text x="30.0" y="202.0" text-anchor="end" style="fill:#7d7c84;font-size:14px;font-weight:700">4</text><text x="44" y="202" style="fill:#17171a;font-size:14px;font-family:ui-monospace,Menlo,Consolas,monospace">λab.a(a((λcd.c(c(c(d))))(a)(b)))</text><text x="30.0" y="236.0" text-anchor="end" style="fill:#7d7c84;font-size:14px;font-weight:700">5</text><text x="44" y="236" style="fill:#17171a;font-size:14px;font-family:ui-monospace,Menlo,Consolas,monospace">λab.a(a((λc.a(a(a(c))))(b)))</text><text x="30.0" y="270.0" text-anchor="end" style="fill:#d5352a;font-size:14px;font-weight:700">6</text><text x="44" y="270" style="fill:#17171a;font-size:14px;font-family:ui-monospace,Menlo,Consolas,monospace">λab.a(a(a(a(a(b)))))</text><text x="20.0" y="308.0" text-anchor="start" style="fill:#7d7c84;font-size:12.5px;font-weight:400">Step 0 is PLUS applied to 2 and 3; step 6 is the numeral 5: λab. a applied five times to b.</text><text x="20.0" y="326.0" text-anchor="start" style="fill:#7d7c84;font-size:12.5px;font-weight:400">Variable names are given by depth, in Church&#x27;s compact style: λab.a(b) means λa.λb.a b.</text></svg>
