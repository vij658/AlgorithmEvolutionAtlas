<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" role="img" aria-label="How Turing&#x27;s machines combined older ideas, and where they led" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>How Turing&#x27;s machines combined older ideas, and where they led</title><line x1="125.0" y1="106.0" x2="426.5" y2="170.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="426.5,170.0 417.7,171.9 419.2,164.7" style="fill:#b9b8b2"/><line x1="500.0" y1="106.0" x2="500.0" y2="170.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="500.0,170.0 496.3,161.8 503.7,161.8" style="fill:#b9b8b2"/><line x1="875.0" y1="106.0" x2="573.5" y2="170.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="573.5,170.0 580.8,164.7 582.3,171.9" style="fill:#b9b8b2"/><line x1="416.0" y1="256.0" x2="167.0" y2="330.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="167.0,330.0 173.8,324.1 175.9,331.2" style="fill:#b9b8b2"/><line x1="500.0" y1="256.0" x2="500.0" y2="330.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="500.0,330.0 496.3,321.8 503.7,321.8" style="fill:#b9b8b2"/><line x1="584.0" y1="256.0" x2="833.0" y2="330.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="833.0,330.0 824.1,331.2 826.2,324.1" style="fill:#b9b8b2"/><line x1="500.0" y1="416.0" x2="500.0" y2="480.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="500.0,480.0 496.3,471.8 503.7,471.8" style="fill:#b9b8b2"/><line x1="167.0" y1="416.0" x2="395.0" y2="523.0" style="stroke:#b9b8b2;stroke-width:1.5;stroke-dasharray:5 4"/><polygon points="395.0,523.0 386.0,522.8 389.1,516.2" style="fill:#b9b8b2"/><rect x="20" y="20" width="210" height="86" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="32.0" y="43.7" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">The decision problem</text><text x="32.0" y="60.9" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">is there a process for every</text><text x="32.0" y="77.4" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">statement?</text><text x="32.0" y="93.9" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">topic 1</text><rect x="395" y="20" width="210" height="86" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="407.0" y="43.7" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">The human computer</text><text x="407.0" y="60.9" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">a clerk with pencil, paper and</text><text x="407.0" y="77.4" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">rules</text><text x="407.0" y="93.9" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">Turing&#x27;s model</text><rect x="770" y="20" width="210" height="86" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="782.0" y="43.7" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Gödel&#x27;s numbering</text><text x="782.0" y="60.9" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">objects coded as numbers;</text><text x="782.0" y="77.4" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">the diagonal</text><text x="782.0" y="93.9" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">topic 5</text><rect x="395" y="170" width="210" height="86" style="fill:#0d1117;stroke:#f0584d;stroke-width:3"/><text x="407.0" y="193.7" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Turing&#x27;s machines</text><text x="407.0" y="210.9" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">⊕ tape, head and table;</text><text x="407.0" y="227.4" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">machines as numbers</text><text x="407.0" y="243.9" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">1936</text><rect x="20" y="330" width="210" height="86" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="32.0" y="353.7" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">The universal machine</text><text x="32.0" y="370.9" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">one machine runs any table it</text><text x="32.0" y="387.4" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">is given</text><text x="32.0" y="403.9" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">1936</text><rect x="395" y="330" width="210" height="86" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="407.0" y="353.7" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">No general halting test</text><text x="407.0" y="370.9" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">the decision problem is</text><text x="407.0" y="387.4" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">unsolvable</text><text x="407.0" y="403.9" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">1936</text><rect x="770" y="330" width="210" height="86" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="782.0" y="353.7" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Busy beavers</text><text x="782.0" y="370.9" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">how long can a small machine</text><text x="782.0" y="387.4" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">run?</text><text x="782.0" y="403.9" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">Radó 1962; 2024</text><rect x="395" y="480" width="210" height="86" style="fill:#0d1117;stroke:#5b8fe0;stroke-width:3"/><text x="407.0" y="493.8" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Computers and their</text><text x="407.0" y="513.5" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">limits</text><text x="407.0" y="530.8" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">stored programs; undecidable</text><text x="407.0" y="547.3" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">questions about code</text><text x="407.0" y="563.8" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">topic 9; today</text><text x="20.0" y="615.0" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">Dashed: whether the stored-program design drew on Turing&#x27;s paper is not settled in the sources opened here.</text></svg>
