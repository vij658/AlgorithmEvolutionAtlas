ont-size:12.5px;font-weight:600">count letters to read a</text><text x="32.0" y="77.4" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">cipher</text><text x="32.0" y="93.9" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">Era 2 topic 7</text><rect x="395" y="20" width="210" height="86" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="407.0" y="43.7" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Permutations</text><text x="407.0" y="60.9" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">the algebra of</text><text x="407.0" y="77.4" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">rearrangements</text><text x="407.0" y="93.9" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">19th century</text><rect x="770" y="20" width="210" height="86" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="782.0" y="51.9" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Electrical machines</text><text x="782.0" y="69.2" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">circuits that count and sort</text><text x="782.0" y="85.7" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">Era 3 topic 13</text><rect x="395" y="170" width="210" height="86" style="fill:#ffffff;stroke:#d5352a;stroke-width:3"/><text x="407.0" y="183.8" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Rejewski, Różycki,</text><text x="407.0" y="203.6" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Zygalski</text><text x="407.0" y="220.8" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">⊕ cycle structure the</text><text x="407.0" y="237.3" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">plugboard cannot hide</text><text x="407.0" y="253.8" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">1932–1938</text><rect x="20" y="330" width="210" height="86" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="32.0" y="353.7" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">The bomba</text><text x="32.0" y="370.9" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">a machine that searches</text><text x="32.0" y="387.4" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">settings</text><text x="32.0" y="403.9" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">1938</text><rect x="395" y="330" width="210" height="86" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="407.0" y="343.8" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Turing and Welchman&#x27;s</text><text x="407.0" y="363.6" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Bombe</text><text x="407.0" y="380.8" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">test a crib; reject by</text><text x="407.0" y="397.3" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">contradiction</text><text x="407.0" y="413.8" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">1940</text><rect x="770" y="330" width="210" height="86" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="782.0" y="343.8" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Shannon&#x27;s secrecy</text><text x="782.0" y="363.6" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">theory</text><text x="782.0" y="380.8" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">ciphers judged by</text><text x="782.0" y="397.3" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">information</text><text x="782.0" y="413.8" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">1949</t