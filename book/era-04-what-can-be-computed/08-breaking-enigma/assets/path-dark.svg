<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 330" width="780" height="330" role="img" aria-label="The path of a key press through an Enigma machine" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>The path of a key press through an Enigma machine</title><rect x="20.0" y="40.0" width="60.0" height="120.0" rx="0" style="fill:#0d1117;stroke:#b9b8b2;stroke-width:2"/><text x="50.0" y="182.0" text-anchor="middle" style="fill:#8f8e96;font-size:12.5px;font-weight:400">key</text><rect x="110.0" y="40.0" width="90.0" height="120.0" rx="0" style="fill:#0d1117;stroke:#b9b8b2;stroke-width:2"/><text x="155.0" y="182.0" text-anchor="middle" style="fill:#8f8e96;font-size:12.5px;font-weight:400">plugboard</text><rect x="230.0" y="40.0" width="90.0" height="120.0" rx="0" style="fill:#0d1117;stroke:#b9b8b2;stroke-width:2"/><text x="275.0" y="182.0" text-anchor="middle" style="fill:#8f8e96;font-size:12.5px;font-weight:400">rotor III</text><rect x="330.0" y="40.0" width="90.0" height="120.0" rx="0" style="fill:#0d1117;stroke:#b9b8b2;stroke-width:2"/><text x="375.0" y="182.0" text-anchor="middle" style="fill:#8f8e96;font-size:12.5px;font-weight:400">rotor II</text><rect x="430.0" y="40.0" width="90.0" height="120.0" rx="0" style="fill:#0d1117;stroke:#b9b8b2;stroke-width:2"/><text x="475.0" y="182.0" text-anchor="middle" style="fill:#8f8e96;font-size:12.5px;font-weight:400">rotor I</text><rect x="540.0" y="40.0" width="90.0" height="120.0" rx="0" style="fill:#0d1117;stroke:#f0584d;stroke-width:2"/><text x="585.0" y="182.0" text-anchor="middle" style="fill:#8f8e96;font-size:12.5px;font-weight:400">reflector</text><path d="M50,80 L630,80" style="fill:none;stroke:#5b8fe0;stroke-width:3"/><path d="M630,80 L630,120" style="fill:none;stroke:#f0584d;stroke-width:3"/><path d="M630,120 L50,120" style="fill:none;stroke:#f0584d;stroke-width:3"/><text x="50.0" y="72.0" text-anchor="start" style="fill:#5b8fe0;font-size:12px;font-weight:700">in</text><text x="50.0" y="140.0" text-anchor="start" style="fill:#f0584d;font-size:12px;font-weight:700">out to a lamp</text><text x="20.0" y="220.0" text-anchor="start" style="fill:#ecebe6;font-size:13.5px;font-weight:400">The rightmost rotor turns before every key press, so the wiring changes with every letter.</text><text x="20.0" y="242.0" text-anchor="start" style="fill:#ecebe6;font-size:13.5px;font-weight:400">The reflector sends the current back by another route: no letter can light its own lamp.</text><text x="20.0" y="274.0" text-anchor="start" style="fill:#8f8e96;font-size:12.5px;font-weight:400">Rotors I, II, III, reflector B, start AAA: AAAAA becomes BDZGO (checked by Enigma.java).</text><text x="20.0" y="294.0" text-anchor="start" style="fill:#8f8e96;font-size:12.5px;font-weight:400">Rejewski&#x27;s catalogue: 105,456 settings, 20,882 different characteristics; a simulated day falls to 30 settings.</text><text x="20.0" y="314.0" text-anchor="start" style="fill:#8f8e96;font-size:12.5px;font-weight:400">A Bombe run on a 23-letter crib over all 105,456 positions leaves 1 stop: the true setting.</text></svg>
