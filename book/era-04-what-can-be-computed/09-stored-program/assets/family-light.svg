<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" role="img" aria-label="How the stored program and merge sort combined older ideas, and where they led" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>How the stored program and merge sort combined older ideas, and where they led</title><line x1="125.0" y1="106.0" x2="426.5" y2="170.0" style="stroke:#55545a;stroke-width:1.5;stroke-dasharray:5 4"/><polygon points="426.5,170.0 417.7,171.9 419.2,164.7" style="fill:#55545a"/><line x1="500.0" y1="106.0" x2="500.0" y2="170.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="500.0,170.0 496.3,161.8 503.7,161.8" style="fill:#55545a"/><line x1="875.0" y1="106.0" x2="605.0" y2="355.8" style="stroke:#55545a;stroke-width:1.5;stroke-dasharray:5 4"/><polygon points="605.0,355.8 608.5,347.5 613.5,352.9" style="fill:#55545a"/><line x1="416.0" y1="256.0" x2="167.0" y2="330.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="167.0,330.0 173.8,324.1 175.9,331.2" style="fill:#55545a"/><line x1="500.0" y1="256.0" x2="500.0" y2="330.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="500.0,330.0 496.3,321.8 503.7,321.8" style="fill:#55545a"/><line x1="584.0" y1="256.0" x2="833.0" y2="330.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="833.0,330.0 824.1,331.2 826.2,324.1" style="fill:#55545a"/><line x1="500.0" y1="416.0" x2="500.0" y2="480.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="500.0,480.0 496.3,471.8 503.7,471.8" style="fill:#55545a"/><line x1="833.0" y1="416.0" x2="605.0" y2="523.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="605.0,523.0 610.9,516.2 614.0,522.8" style="fill:#55545a"/><rect x="20" y="20" width="210" height="86" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="32.0" y="51.9" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">The universal machine</text><text x="32.0" y="69.2" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">a table given as data</text><text x="32.0" y="85.7" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">topic 7</text><rect x="395" y="20" width="210" height="86" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="407.0" y="43.7" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Electronic speed</text><text x="407.0" y="60.9" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">thousands of operations a</text><text x="407.0" y="77.4" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">second</text><text x="407.0" y="93.9" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">the ENIAC years</text><rect x="770" y="20" width="210" height="86" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="782.0" y="51.9" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Punched-card sorting</text><text x="782.0" y="69.2" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">one column at a time</text><text x="782.0" y="85.7" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">Era 3 topic 13</text><rect x="395" y="170" width="210" height="86" style="fill:#ffffff;stroke:#d5352a;stroke-width:3"/><text x="407.0" y="193.7" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">The stored program</text><text x="407.0" y="210.9" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">⊕ orders kept in memory as</text><text x="407.0" y="227.4" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">numbers</text><text x="407.0" y="243.9" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">EDVAC report, 1945</text><rect x="20" y="330" width="210" height="86" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="32.0" y="352.0" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Programs that change</text><text x="32.0" y="371.8" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">themselves</text><text x="32.0" y="389.1" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">adding 1 to an address</text><text x="32.0" y="405.6" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">1945–1948</text><rect x="395" y="330" width="210" height="86" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="407.0" y="361.9" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Merge sort</text><text x="407.0" y="379.2" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">merge sorted runs: n log₂ n</text><text x="407.0" y="395.7" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">von Neumann, 1945</text><rect x="770" y="330" width="210" height="86" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="782.0" y="361.9" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">The Baby runs</text><text x="782.0" y="379.2" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">the first stored program</text><text x="782.0" y="395.7" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">21 June 1948</text><rect x="395" y="480" width="210" height="86" style="fill:#ffffff;stroke:#1f5ba8;stroke-width:3"/><text x="407.0" y="503.7" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Every computer since</text><text x="407.0" y="520.9" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">programs as data; sorting</text><text x="407.0" y="537.4" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">files too big for memory</text><text x="407.0" y="553.9" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">today</text><text x="20.0" y="615.0" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">Dashed: Turing&#x27;s influence on the 1945 report is not settled in the sources opened; card sorting is the job merge sort was written to beat.</text></svg>
