<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" role="img" aria-label="How the Monte Carlo method combined older ideas, and where it led" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>How the Monte Carlo method combined older ideas, and where it led</title><line x1="125.0" y1="106.0" x2="426.5" y2="170.0" style="stroke:#55545a;stroke-width:1.5;stroke-dasharray:5 4"/><polygon points="426.5,170.0 417.7,171.9 419.2,164.7" style="fill:#55545a"/><line x1="500.0" y1="106.0" x2="500.0" y2="170.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="500.0,170.0 496.3,161.8 503.7,161.8" style="fill:#55545a"/><line x1="875.0" y1="106.0" x2="573.5" y2="170.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="573.5,170.0 580.8,164.7 582.3,171.9" style="fill:#55545a"/><line x1="416.0" y1="256.0" x2="167.0" y2="330.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="167.0,330.0 173.8,324.1 175.9,331.2" style="fill:#55545a"/><line x1="500.0" y1="256.0" x2="500.0" y2="330.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="500.0,330.0 496.3,321.8 503.7,321.8" style="fill:#55545a"/><line x1="584.0" y1="256.0" x2="833.0" y2="330.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="833.0,330.0 824.1,331.2 826.2,324.1" style="fill:#55545a"/><line x1="500.0" y1="416.0" x2="500.0" y2="480.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="500.0,480.0 496.3,471.8 503.7,471.8" style="fill:#55545a"/><line x1="833.0" y1="416.0" x2="605.0" y2="523.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="605.0,523.0 610.9,516.2 614.0,522.8" style="fill:#55545a"/><rect x="20" y="20" width="210" height="86" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="32.0" y="51.9" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Random throws</text><text x="32.0" y="69.2" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">Buffon&#x27;s needle estimates π</text><text x="32.0" y="85.7" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">an early variant</text><rect x="395" y="20" width="210" height="86" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="407.0" y="43.7" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Markov chains</text><text x="407.0" y="60.9" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">chance that depends on the</text><text x="407.0" y="77.4" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">last step</text><text x="407.0" y="93.9" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">topic 3</text><rect x="770" y="20" width="210" height="86" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="782.0" y="51.9" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Electronic computers</text><text x="782.0" y="69.2" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">millions of operations</text><text x="782.0" y="85.7" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">ENIAC; topic 9</text><rect x="395" y="170" width="210" height="86" style="fill:#ffffff;stroke:#d5352a;stroke-width:3"/><text x="407.0" y="193.7" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Monte Carlo</text><text x="407.0" y="210.9" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">⊕ simulate many random cases,</text><text x="407.0" y="227.4" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">by machine</text><text x="407.0" y="243.9" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">1946–1949</text><rect x="20" y="330" width="210" height="86" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="32.0" y="353.7" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Middle-square</text><text x="32.0" y="370.9" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">random-looking digits by</text><text x="32.0" y="387.4" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">arithmetic</text><text x="32.0" y="403.9" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">1949</text><rect x="395" y="330" width="210" height="86" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="407.0" y="353.7" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Neutron chains</text><text x="407.0" y="370.9" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">the first calculations, on the</text><text x="407.0" y="387.4" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">ENIAC</text><text x="407.0" y="403.9" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">1948</text><rect x="770" y="330" width="210" height="86" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="782.0" y="361.9" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Sampling by chains</text><text x="782.0" y="379.2" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">walk randomly to sample</text><text x="782.0" y="395.7" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">after this era</text><rect x="395" y="480" width="210" height="86" style="fill:#ffffff;stroke:#1f5ba8;stroke-width:3"/><text x="407.0" y="503.7" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Simulation today</text><text x="407.0" y="520.9" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">risk, physics, graphics,</text><text x="407.0" y="537.4" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">machine learning</text><text x="407.0" y="553.9" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">today</text><text x="20.0" y="615.0" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">Dashed: Buffon&#x27;s needle is &quot;an early variant&quot; (Wikipedia), not a documented source of the 1946 idea.</text></svg>
