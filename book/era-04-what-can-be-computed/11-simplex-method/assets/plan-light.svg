<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" role="img" aria-label="The simplex method walking the corners of a small production plan" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>The simplex method walking the corners of a small production plan</title><path d="M60.0,330.0 L220.0,330.0 L220.0,210.0 L140.0,90.0 L60.0,90.0 Z" style="fill:#f4f3ee;stroke:#55545a;stroke-width:1.5"/><line x1="60.0" y1="330.0" x2="340.0" y2="330.0" style="stroke:#c4c3bb;stroke-width:1.2"/><line x1="60.0" y1="330.0" x2="60.0" y2="30.0" style="stroke:#c4c3bb;stroke-width:1.2"/><text x="340.0" y="348.0" text-anchor="end" style="fill:#7d7c84;font-size:13px;font-weight:400">x</text><text x="50.0" y="34.0" text-anchor="end" style="fill:#7d7c84;font-size:13px;font-weight:400">y</text><line x1="60.0" y1="330.0" x2="60.0" y2="90.0" style="stroke:#d5352a;stroke-width:4"/><line x1="60.0" y1="90.0" x2="140.0" y2="90.0" style="stroke:#d5352a;stroke-width:4"/><circle cx="60.0" cy="330.0" r="6.0" style="fill:#d5352a"/><text x="70.0" y="322.0" text-anchor="start" style="fill:#17171a;font-size:13px;font-weight:700">(0, 0): 0</text><circle cx="60.0" cy="90.0" r="6.0" style="fill:#d5352a"/><text x="70.0" y="82.0" text-anchor="start" style="fill:#17171a;font-size:13px;font-weight:700">(0, 6): 30</text><circle cx="140.0" cy="90.0" r="6.0" style="fill:#d5352a"/><text x="150.0" y="82.0" text-anchor="start" style="fill:#17171a;font-size:13px;font-weight:700">(2, 6): 36</text><text x="420.0" y="60.0" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">maximize 3x + 5y</text><text x="420.0" y="86.0" text-anchor="start" style="fill:#7d7c84;font-size:13px;font-weight:400">x ≤ 4,  2y ≤ 12,  3x + 2y ≤ 18,  x, y ≥ 0</text><text x="420.0" y="126.0" text-anchor="start" style="fill:#17171a;font-size:13px;font-weight:400">The grey region holds every allowed plan.</text><text x="420.0" y="148.0" text-anchor="start" style="fill:#17171a;font-size:13px;font-weight:400">The walk starts at the corner (0, 0) and moves</text><text x="420.0" y="168.0" text-anchor="start" style="fill:#17171a;font-size:13px;font-weight:400">to a better neighbouring corner while one exists.</text><text x="420.0" y="206.0" text-anchor="start" style="fill:#d5352a;font-size:13.5px;font-weight:700">2 pivots to the best plan, earning 36.</text><text x="420.0" y="230.0" text-anchor="start" style="fill:#1f5ba8;font-size:13px;font-weight:400">Dual prices (0, 3/2, 1) certify it:</text><text x="420.0" y="250.0" text-anchor="start" style="fill:#1f5ba8;font-size:13px;font-weight:400">4·0 + 12·3/2 + 18·1 = 36.</text></svg>
