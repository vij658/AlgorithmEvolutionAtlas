dth:2"/><rect x="70.0" y="139.0" width="46.0" height="26.0" rx="0" style="fill:#0d1117;stroke:#f0584d;stroke-width:2"/><text x="93.0" y="157.0" text-anchor="middle" style="fill:#ecebe6;font-size:14px;font-weight:700">x&#x27;</text><rect x="150.0" y="139.0" width="46.0" height="26.0" rx="0" style="fill:#0d1117;stroke:#5b8fe0;stroke-width:2"/><text x="173.0" y="157.0" text-anchor="middle" style="fill:#ecebe6;font-size:14px;font-weight:700">y</text><rect x="230.0" y="139.0" width="46.0" height="26.0" rx="0" style="fill:#0d1117;stroke:#5b8fe0;stroke-width:2"/><text x="253.0" y="157.0" text-anchor="middle" style="fill:#ecebe6;font-size:14px;font-weight:700">z</text><text x="420.0" y="46.0" text-anchor="start" style="fill:#ecebe6;font-size:14px;font-weight:700">x y + z (x + y): 5 contacts</text><line x1="420.0" y1="60.0" x2="420.0" y2="106.0" style="stroke:#b9b8b2;stroke-width:2"/><line x1="720.0" y1="60.0" x2="720.0" y2="106.0" style="stroke:#b9b8b2;stroke-width:2"/><line x1="420.0" y1="60.0" x2="720.0" y2="60.0" style="stroke:#b9b8b2;stroke-width:2"/><rect x="460.0" y="47.0" width="46.0" height="26.0" rx="0" style="fill:#0d1117;stroke:#5b8fe0;stroke-width:2"/><text x="483.0" y="65.0" text-anchor="middle" style="fill:#ecebe6;font-size:14px;font-weight:700">x</text><rect x="540.0" y="47.0" width="46.0" height="26.0" rx="0" style="fill:#0d1117;stroke:#5b8fe0;stroke-width:2"/><text x="563.0" y="65.0" text-anchor="middle" style="fill:#ecebe6;font-size:14px;font-weight:700">y</text><line x1="420.0" y1="106.0" x2="720.0" y2="106.0" style="stroke:#b9b8b2;stroke-width:2"/><rect x="460.0" y="93.0" width="46.0" height="26.0" rx="0" style="fill:#0d1117;stroke:#5b8fe0;stroke-width:2"/><text x="483.0" y="111.0" text-anchor="middle" style="fill:#ecebe6;font-size:14px;font-weight:700">z</text><rect x="540.0" y="93.0" width="46.0" height="26.0" rx="0" style="fill:#0d1117;stroke:#5b8fe0;stroke-width:2"/><text x="563.0" y="111.0" text-anchor="middle" style="fill:#ecebe6;font-size:14px;font-weight:700">x or y</text><text x="30.0" y="220.0" text-anchor="start" style="fill:#8f8e96;font-size:12.5px;font-weight:400">Branches in parallel; contacts in a branch in series. Blue: closed when the switch is on; red (primed): closed when it is off.</text><text x="30.0" y="240.0" text-anchor="start" style="fill:#8f8e96;font-size:12.5px;font-weight:400">Both networks conduct for exactly the same 8 settings of x, y, z: whenever at least two are on (the carry of an adder).</text><text x="30.0" y="260.0" text-anchor="start" style="fill:#8f8e96;font-size:12.5px;font-weight:400">&quot;x or y&quot; stands for two contacts in parallel, so the second network has five.</text></svg>
