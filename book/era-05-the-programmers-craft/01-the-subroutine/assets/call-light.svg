<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 296" width="760" height="296" role="img" aria-label="The Wheeler jump: the caller loads its own word, the routine turns it into a jump back" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>The Wheeler jump: the caller loads its own word, the routine turns it into a jump back</title><text x="20.0" y="24.0" text-anchor="start" style="fill:#17171a;font-size:14px;font-weight:700">the caller</text><text x="410.0" y="24.0" text-anchor="start" style="fill:#17171a;font-size:14px;font-weight:700">the square-root routine</text><rect x="20.0" y="40.0" width="300.0" height="30.0" rx="4" style="fill:#ffffff;stroke:#d9d8d1;stroke-width:1.5"/><text x="28.0" y="60.0" text-anchor="start" style="fill:#7d7c84;font-size:12px;font-weight:400">40</text><text x="68.0" y="60.0" text-anchor="start" style="fill:#17171a;font-size:14px;font-weight:700">LDA X</text><text x="140.0" y="60.0" text-anchor="start" style="fill:#7d7c84;font-size:11px;font-weight:400">the number</text><rect x="20.0" y="78.0" width="300.0" height="30.0" rx="4" style="fill:#ffffff;stroke:#d9d8d1;stroke-width:1.5"/><text x="28.0" y="98.0" text-anchor="start" style="fill:#7d7c84;font-size:12px;font-weight:400">41</text><text x="68.0" y="98.0" text-anchor="start" style="fill:#17171a;font-size:14px;font-weight:700">STA P</text><text x="140.0" y="98.0" text-anchor="start" style="fill:#7d7c84;font-size:11px;font-weight:400">into the parameter word</text><rect x="20.0" y="116.0" width="300.0" height="30.0" rx="4" style="fill:#f4f3ee;stroke:#d5352a;stroke-width:1.5"/><text x="28.0" y="136.0" text-anchor="start" style="fill:#7d7c84;font-size:12px;font-weight:400">42</text><text x="68.0" y="136.0" text-anchor="start" style="fill:#17171a;font-size:14px;font-weight:700">LDA 42</text><text x="140.0" y="136.0" text-anchor="start" style="fill:#7d7c84;font-size:11px;font-weight:400">load my own word</text><rect x="20.0" y="154.0" width="300.0" height="30.0" rx="4" style="fill:#ffffff;stroke:#d9d8d1;stroke-width:1.5"/><text x="28.0" y="174.0" text-anchor="start" style="fill:#7d7c84;font-size:12px;font-weight:400">43</text><text x="68.0" y="174.0" text-anchor="start" style="fill:#17171a;font-size:14px;font-weight:700">JMP 200</text><text x="140.0" y="174.0" text-anchor="start" style="fill:#7d7c84;font-size:11px;font-weight:400">enter the routine</text><rect x="20.0" y="192.0" width="300.0" height="30.0" rx="4" style="fill:#ffffff;stroke:#d9d8d1;stroke-width:1.5"/><text x="28.0" y="212.0" text-anchor="start" style="fill:#7d7c84;font-size:12px;font-weight:400">44</text><text x="68.0" y="212.0" text-anchor="start" style="fill:#17171a;font-size:14px;font-weight:700">OUT R</text><text x="140.0" y="212.0" text-anchor="start" style="fill:#7d7c84;font-size:11px;font-weight:400">the answer comes back here</text><rect x="410.0" y="40.0" width="330.0" height="30.0" rx="4" style="fill:#ffffff;stroke:#d9d8d1;stroke-width:1.5"/><text x="418.0" y="60.0" text-anchor="start" style="fill:#7d7c84;font-size:12px;font-weight:400">200</text><text x="458.0" y="60.0" text-anchor="start" style="fill:#17171a;font-size:14px;font-weight:700">ADD BACK</text><text x="555.0" y="60.0" text-anchor="start" style="fill:#7d7c84;font-size:11px;font-weight:400">acc 1042 + 4002 = 5044</text><rect x="410.0" y="78.0" width="330.0" height="30.0" rx="4" style="fill:#ffffff;stroke:#d9d8d1;stroke-width:1.5"/><text x="418.0" y="98.0" text-anchor="start" style="fill:#7d7c84;font-size:12px;font-weight:400">201</text><text x="458.0" y="98.0" text-anchor="start" style="fill:#17171a;font-size:14px;font-weight:700">STA 219</text><text x="555.0" y="98.0" text-anchor="start" style="fill:#7d7c84;font-size:11px;font-weight:400">plant the way home</text><rect x="410.0" y="116.0" width="330.0" height="30.0" rx="4" style="fill:#ffffff;stroke:#d9d8d1;stroke-width:1.5"/><text x="418.0" y="136.0" text-anchor="start" style="fill:#7d7c84;font-size:12px;font-weight:400"></text><text x="458.0" y="136.0" text-anchor="start" style="fill:#17171a;font-size:14px;font-weight:700">...</text><text x="555.0" y="136.0" text-anchor="start" style="fill:#7d7c84;font-size:11px;font-weight:400">subtract 1, 3, 5, ... while possible</text><rect x="410.0" y="192.0" width="330.0" height="30.0" rx="4" style="fill:#f4f3ee;stroke:#1f5ba8;stroke-width:1.5"/><text x="418.0" y="212.0" text-anchor="start" style="fill:#7d7c84;font-size:12px;font-weight:400">219</text><text x="458.0" y="212.0" text-anchor="start" style="fill:#1f5ba8;font-size:14px;font-weight:700">JMP 44</text><text x="555.0" y="212.0" text-anchor="start" style="fill:#7d7c84;font-size:11px;font-weight:400">was empty; now 5044</text><path d="M320,169.0 C365,169.0 365,55.0 410,55.0" style="fill:none;stroke:#55545a;stroke-width:1.6"/><path d="M410,207.0 C365,207.0 365,207.0 320,207.0" style="fill:none;stroke:#1f5ba8;stroke-width:1.6;stroke-dasharray:5 4"/><text x="30.0" y="260.0" text-anchor="start" style="fill:#7d7c84;font-size:12px;font-weight:400">Each word is operation x 1000 + address: LDA 42 is 1042; JMP 44 is 5044.</text><text x="30.0" y="280.0" text-anchor="start" style="fill:#7d7c84;font-size:12px;font-weight:400">The routine adds 4002 to the caller&#x27;s own word and stores the result as its last instruction.</text></svg>
