<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 222" width="720" height="222" role="img" aria-label="Thompson&#x27;s construction: the pieces for a symbol, for either, and for repeat" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>Thompson&#x27;s construction: the pieces for a symbol, for either, and for repeat</title><text x="20.0" y="22.0" text-anchor="start" style="fill:#17171a;font-size:13px;font-weight:700">a symbol</text><circle cx="40.0" cy="60.0" r="15.0" style="fill:#ffffff;stroke:#55545a;stroke-width:1.5"/><text x="40.0" y="64.0" text-anchor="middle" style="fill:#7d7c84;font-size:10px;font-weight:400"></text><circle cx="130.0" cy="60.0" r="15.0" style="fill:#ffffff;stroke:#55545a;stroke-width:1.5"/><text x="130.0" y="64.0" text-anchor="middle" style="fill:#7d7c84;font-size:10px;font-weight:400"></text><path d="M56,60 Q85.0,60.0 114,60" style="fill:none;stroke:#55545a;stroke-width:1.4"/><path d="M114,60 L108.0,64.0 L108.0,56.0 Z" style="fill:#55545a"/><text x="85.0" y="54.0" text-anchor="middle" style="fill:#1f5ba8;font-size:13px;font-weight:700">a</text><text x="200.0" y="22.0" text-anchor="start" style="fill:#17171a;font-size:13px;font-weight:700">E | F (either)</text><circle cx="220.0" cy="75.0" r="15.0" style="fill:#ffffff;stroke:#55545a;stroke-width:1.5"/><text x="220.0" y="79.0" text-anchor="middle" style="fill:#7d7c84;font-size:10px;font-weight:400"></text><rect x="280.0" y="30.0" width="70.0" height="30.0" rx="4" style="fill:#f4f3ee;stroke:#d9d8d1;stroke-width:1"/><text x="315.0" y="50.0" text-anchor="middle" style="fill:#17171a;font-size:13px;font-weight:700">E</text><rect x="280.0" y="90.0" width="70.0" height="30.0" rx="4" style="fill:#f4f3ee;stroke:#d9d8d1;stroke-width:1"/><text x="315.0" y="110.0" text-anchor="middle" style="fill:#17171a;font-size:13px;font-weight:700">F</text><circle cx="410.0" cy="75.0" r="15.0" style="fill:#ffffff;stroke:#55545a;stroke-width:1.5"/><text x="410.0" y="79.0" text-anchor="middle" style="fill:#7d7c84;font-size:10px;font-weight:400"></text><path d="M234,68 Q256.0,51.0 278,46" style="fill:none;stroke:#55545a;stroke-width:1.4"/><path d="M278,46 L273.03568727960715,51.230258044699646 L271.26271845089536,43.42919519836797 Z" style="fill:#55545a"/><text x="256.0" y="45.0" text-anchor="middle" style="fill:#7d7c84;font-size:13px;font-weight:700">ε</text><path d="M234,82 Q256.0,99.0 278,104" style="fill:none;stroke:#55545a;stroke-width:1.4"/><path d="M278,104 L271.26271845089536,106.57080480163204 L273.03568727960715,98.76974195530035 Z" style="fill:#55545a"/><text x="256.0" y="113.0" text-anchor="middle" style="fill:#7d7c84;font-size:13px;font-weight:700">ε</text><path d="M352,46 Q374.0,51.0 396,68" style="fill:none;stroke:#55545a;stroke-width:1.4"/><path d="M396,68 L388.80649998734395,67.49645499911408 L393.69807999595,61.16617498797674 Z" style="fill:#55545a"/><text x="374.0" y="45.0" text-anchor="middle" style="fill:#7d7c84;font-size:13px;font-weight:700">ε</text><path d="M352,104 Q374.0,99.0 396,82" style="fill:none;stroke:#55545a;stroke-width:1.4"/><path d="M396,82 L393.69807999595,88.83382501202327 L388.80649998734395,82.50354500088592 Z" style="fill:#55545a"/><text x="374.0" y="113.0" text-anchor="middle" style="fill:#7d7c84;font-size:13px;font-weight:700">ε</text><text x="470.0" y="22.0" text-anchor="start" style="fill:#17171a;font-size:13px;font-weight:700">E* (repeat)</text><circle cx="490.0" cy="75.0" r="15.0" style="fill:#ffffff;stroke:#55545a;stroke-width:1.5"/><text x="490.0" y="79.0" text-anchor="middle" style="fill:#7d7c84;font-size:10px;font-weight:400"></text><rect x="545.0" y="60.0" width="70.0" height="30.0" rx="4" style="fill:#f4f3ee;stroke:#d9d8d1;stroke-width:1"/><text x="580.0" y="80.0" text-anchor="middle" style="fill:#17171a;font-size:13px;font-weight:700">E</text><circle cx="670.0" cy="75.0" r="15.0" style="fill:#ffffff;stroke:#55545a;stroke-width:1.5"/><text x="670.0" y="79.0" text-anchor="middle" style="fill:#7d7c84;font-size:10px;font-weight:400"></text><path d="M506,75 Q524.5,75.0 543,75" style="fill:none;stroke:#55545a;stroke-width:1.4"/><path d="M543,75 L537.0,79.0 L537.0,71.0 Z" style="fill:#55545a"/><text x="524.5" y="69.0" text-anchor="middle" style="fill:#7d7c84;font-size:13px;font-weight:700">ε</text><path d="M617,75 Q635.5,75.0 654,75" style="fill:none;stroke:#55545a;stroke-width:1.4"/><path d="M654,75 L648.0,79.0 L648.0,71.0 Z" style="fill:#55545a"/><text x="635.5" y="69.0" text-anchor="middle" style="fill:#7d7c84;font-size:13px;font-weight:700">ε</text><path d="M615,62 Q581.0,36.0 547,62" style="fill:none;stroke:#55545a;stroke-width:1.4"/><path d="M547,62 L549.33634656758,55.17786802266643 L554.1959474281464,61.532730686484 Z" style="fill:#55545a"/><text x="581.0" y="30.0" text-anchor="middle" style="fill:#7d7c84;font-size:13px;font-weight:700">ε</text><path d="M494,90 Q580.0,130.0 666,90" style="fill:none;stroke:#55545a;stroke-width:1.4"/><path d="M666,90 L662.2465963275313,96.15726894584755 L658.8727503298066,88.90350005073948 Z" style="fill:#55545a"/><text x="580.0" y="144.0" text-anchor="middle" style="fill:#7d7c84;font-size:13px;font-weight:700">ε</text><text x="20.0" y="168.0" text-anchor="start" style="fill:#7d7c84;font-size:12px;font-weight:400">Then (EF): the end of E becomes the start of F, so each join removes one state.</text><text x="20.0" y="188.0" text-anchor="start" style="fill:#7d7c84;font-size:12px;font-weight:400">Two states per symbol, |, or *, minus one per join: for (a|b)*abb, s = 7 and c = 3, so 2s - c = 11 states.</text><text x="20.0" y="208.0" text-anchor="start" style="fill:#7d7c84;font-size:12px;font-weight:400">ε marks an arrow the machine may follow without reading a letter.</text></svg>
