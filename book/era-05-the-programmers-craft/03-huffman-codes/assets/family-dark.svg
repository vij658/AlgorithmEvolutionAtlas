<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" role="img" aria-label="How Huffman&#x27;s codes combined older ideas, and where they led" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>How Huffman&#x27;s codes combined older ideas, and where they led</title><line x1="125.0" y1="106.0" x2="426.5" y2="170.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="426.5,170.0 417.7,171.9 419.2,164.7" style="fill:#b9b8b2"/><line x1="500.0" y1="106.0" x2="500.0" y2="170.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="500.0,170.0 496.3,161.8 503.7,161.8" style="fill:#b9b8b2"/><line x1="875.0" y1="106.0" x2="573.5" y2="170.0" style="stroke:#b9b8b2;stroke-width:1.5;stroke-dasharray:5 4"/><polygon points="573.5,170.0 580.8,164.7 582.3,171.9" style="fill:#b9b8b2"/><line x1="416.0" y1="256.0" x2="167.0" y2="330.0" style="stroke:#b9b8b2;stroke-width:1.5;stroke-dasharray:5 4"/><polygon points="167.0,330.0 173.8,324.1 175.9,331.2" style="fill:#b9b8b2"/><line x1="500.0" y1="256.0" x2="500.0" y2="330.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="500.0,330.0 496.3,321.8 503.7,321.8" style="fill:#b9b8b2"/><line x1="584.0" y1="256.0" x2="833.0" y2="330.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="833.0,330.0 824.1,331.2 826.2,324.1" style="fill:#b9b8b2"/><line x1="500.0" y1="416.0" x2="500.0" y2="480.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="500.0,480.0 496.3,471.8 503.7,471.8" style="fill:#b9b8b2"/><line x1="833.0" y1="416.0" x2="605.0" y2="523.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="605.0,523.0 610.9,516.2 614.0,522.8" style="fill:#b9b8b2"/><rect x="20" y="20" width="210" height="86" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="32.0" y="51.9" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Shannon&#x27;s entropy</text><text x="32.0" y="69.2" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">the floor: H bits per symbol</text><text x="32.0" y="85.7" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">Era 4 topic 12</text><rect x="395" y="20" width="210" height="86" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="407.0" y="43.7" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Fano&#x27;s splitting</text><text x="407.0" y="60.9" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">halve the probabilities, from</text><text x="407.0" y="77.4" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">the top</text><text x="407.0" y="93.9" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">MIT, 1949</text><rect x="770" y="20" width="210" height="86" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="782.0" y="51.9" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Trees</text><text x="782.0" y="69.2" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">a prefix code is a path from</text><text x="782.0" y="85.7" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">the root</text><rect x="395" y="170" width="210" height="86" style="fill:#0d1117;stroke:#f0584d;stroke-width:3"/><text x="407.0" y="193.7" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Huffman&#x27;s code</text><text x="407.0" y="210.9" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">⊕ merge the two rarest, from</text><text x="407.0" y="227.4" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">the bottom</text><text x="407.0" y="243.9" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">MIT, 1951–1952</text><rect x="20" y="330" width="210" height="86" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="32.0" y="353.7" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Priority queues</text><text x="32.0" y="370.9" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">take the smallest, again and</text><text x="32.0" y="387.4" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">again</text><text x="32.0" y="403.9" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">the heap, topic 12</text><rect x="395" y="330" width="210" height="86" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="407.0" y="361.9" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">DEFLATE</text><text x="407.0" y="379.2" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">the back end of zip files</text><text x="407.0" y="395.7" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">later</text><rect x="770" y="330" width="210" height="86" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="782.0" y="361.9" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">JPEG and MP3</text><text x="782.0" y="379.2" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">a model, then prefix codes</text><text x="782.0" y="395.7" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">later</text><rect x="395" y="480" width="210" height="86" style="fill:#0d1117;stroke:#5b8fe0;stroke-width:3"/><text x="407.0" y="511.9" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Compression today</text><text x="407.0" y="529.1" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">files, pictures, sound, fax</text><text x="407.0" y="545.6" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">today</text><text x="20.0" y="615.0" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">Dashed: a likeness of ideas. The heap (1964) later made the repeated &#x27;take the two smallest&#x27; fast.</text></svg>
