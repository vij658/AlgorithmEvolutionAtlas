<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="600" height="320" role="img" aria-label="A linked list of cells, and inserting a new cell by changing two addresses" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>A linked list of cells, and inserting a new cell by changing two addresses</title><text x="20.0" y="22.0" text-anchor="start" style="fill:#17171a;font-size:13px;font-weight:700">A list is a chain of cells: an item (car) and the address of the next cell (cdr).</text><text x="20.0" y="66.0" text-anchor="start" style="fill:#7d7c84;font-size:12px;font-weight:400">head</text><line x1="52.0" y1="62.0" x2="52.0" y2="62.0" style="stroke:#55545a;stroke-width:1.6"/><path d="M60.0,62.0 L52.0,66.0 L52.0,58.0 Z" style="fill:#55545a"/><rect x="60.0" y="46.0" width="44.0" height="32.0" rx="3" style="fill:#ffffff;stroke:#55545a;stroke-width:1.5"/><rect x="104.0" y="46.0" width="30.0" height="32.0" rx="3" style="fill:#ffffff;stroke:#55545a;stroke-width:1.5"/><text x="82.0" y="67.0" text-anchor="middle" style="fill:#17171a;font-size:15px;font-weight:700">A</text><circle cx="119.0" cy="62.0" r="3.0" style="fill:#55545a"/><line x1="119.0" y1="62.0" x2="182.0" y2="62.0" style="stroke:#55545a;stroke-width:1.6"/><path d="M190.0,62.0 L182.0,66.0 L182.0,58.0 Z" style="fill:#55545a"/><rect x="190.0" y="46.0" width="44.0" height="32.0" rx="3" style="fill:#ffffff;stroke:#55545a;stroke-width:1.5"/><rect x="234.0" y="46.0" width="30.0" height="32.0" rx="3" style="fill:#ffffff;stroke:#55545a;stroke-width:1.5"/><text x="212.0" y="67.0" text-anchor="middle" style="fill:#17171a;font-size:15px;font-weight:700">B</text><circle cx="249.0" cy="62.0" r="3.0" style="fill:#55545a"/><line x1="249.0" y1="62.0" x2="312.0" y2="62.0" style="stroke:#55545a;stroke-width:1.6"/><path d="M320.0,62.0 L312.0,66.0 L312.0,58.0 Z" style="fill:#55545a"/><rect x="320.0" y="46.0" width="44.0" height="32.0" rx="3" style="fill:#ffffff;stroke:#55545a;stroke-width:1.5"/><rect x="364.0" y="46.0" width="30.0" height="32.0" rx="3" style="fill:#ffffff;stroke:#55545a;stroke-width:1.5"/><text x="342.0" y="67.0" text-anchor="middle" style="fill:#17171a;font-size:15px;font-weight:700">C</text><circle cx="379.0" cy="62.0" r="3.0" style="fill:#55545a"/><line x1="379.0" y1="62.0" x2="442.0" y2="62.0" style="stroke:#55545a;stroke-width:1.6"/><path d="M450.0,62.0 L442.0,66.0 L442.0,58.0 Z" style="fill:#55545a"/><rect x="450.0" y="46.0" width="44.0" height="32.0" rx="3" style="fill:#ffffff;stroke:#55545a;stroke-width:1.5"/><rect x="494.0" y="46.0" width="30.0" height="32.0" rx="3" style="fill:#ffffff;stroke:#55545a;stroke-width:1.5"/><text x="472.0" y="67.0" text-anchor="middle" style="fill:#17171a;font-size:15px;font-weight:700">D</text><text x="509.0" y="67.0" text-anchor="middle" style="fill:#7d7c84;font-size:15px;font-weight:700">/</text><text x="20.0" y="116.0" text-anchor="start" style="fill:#17171a;font-size:13px;font-weight:700">To insert X after B: take a free cell, point it at C, point B at it.</text><text x="20.0" y="134.0" text-anchor="start" style="fill:#17171a;font-size:13px;font-weight:700">Two addresses change; nothing moves.</text><rect x="60.0" y="160.0" width="44.0" height="32.0" rx="3" style="fill:#ffffff;stroke:#55545a;stroke-width:1.5"/><rect x="104.0" y="160.0" width="30.0" height="32.0" rx="3" style="fill:#ffffff;stroke:#55545a;stroke-width:1.5"/><text x="82.0" y="181.0" text-anchor="middle" style="fill:#17171a;font-size:15px;font-weight:700">A</text><rect x="190.0" y="160.0" width="44.0" height="32.0" rx="3" style="fill:#ffffff;stroke:#55545a;stroke-width:1.5"/><rect x="234.0" y="160.0" width="30.0" height="32.0" rx="3" style="fill:#ffffff;stroke:#55545a;stroke-width:1.5"/><text x="212.0" y="181.0" text-anchor="middle" style="fill:#17171a;font-size:15px;font-weight:700">B</text><rect x="320.0" y="160.0" width="44.0" height="32.0" rx="3" style="fill:#ffffff;stroke:#55545a;stroke-width:1.5"/><rect x="364.0" y="160.0" width="30.0" height="32.0" rx="3" style="fill:#ffffff;stroke:#55545a;stroke-width:1.5"/><text x="342.0" y="181.0" text-anchor="middle" style="fill:#17171a;font-size:15px;font-weight:700">C</text><rect x="450.0" y="160.0" width="44.0" height="32.0" rx="3" style="fill:#ffffff;stroke:#55545a;stroke-width:1.5"/><rect x="494.0" y="160.0" width="30.0" height="32.0" rx="3" style="fill:#ffffff;stroke:#55545a;stroke-width:1.5"/><text x="472.0" y="181.0" text-anchor="middle" style="fill:#17171a;font-size:15px;font-weight:700">D</text><rect x="255.0" y="222.0" width="44.0" height="32.0" rx="3" style="fill:#f4f3ee;stroke:#d5352a;stroke-width:1.5"/><rect x="299.0" y="222.0" width="30.0" height="32.0" rx="3" style="fill:#ffffff;stroke:#d5352a;stroke-width:1.5"/><text x="277.0" y="243.0" text-anchor="middle" style="fill:#17171a;font-size:15px;font-weight:700">X</text><line x1="119.0" y1="176.0" x2="182.0" y2="176.0" style="stroke:#55545a;stroke-width:1.6"/><path d="M190.0,176.0 L182.0,180.0 L182.0,172.0 Z" style="fill:#55545a"/><circle cx="249.0" cy="176.0" r="3.0" style="fill:#d5352a"/><line x1="249.0" y1="176.0" x2="254.2" y2="226.0" style="stroke:#d5352a;stroke-width:1.8"/><path d="M255.0,234.0 L250.2,226.5 L258.2,225.6 Z" style="fill:#d5352a"/><circle cx="314.0" cy="238.0" r="3.0" style="fill:#d5352a"/><line x1="314.0" y1="238.0" x2="319.1" y2="192.0" style="stroke:#d5352a;stroke-width:1.8"/><path d="M320.0,184.0 L323.1,192.4 L315.1,191.5 Z" style="fill:#d5352a"/><text x="357.0" y="152.0" text-anchor="middle" style="fill:#7d7c84;font-size:11px;font-weight:400">C now reached through X</text><line x1="379.0" y1="176.0" x2="442.0" y2="176.0" style="stroke:#55545a;stroke-width:1.6"/><path d="M450.0,176.0 L442.0,180.0 L442.0,172.0 Z" style="fill:#55545a"/><text x="509.0" y="181.0" text-anchor="middle" style="fill:#7d7c84;font-size:15px;font-weight:700">/</text><text x="20.0" y="290.0" text-anchor="start" style="fill:#7d7c84;font-size:12px;font-weight:400">When nothing points to a cell any more, it is garbage:</text><text x="20.0" y="307.0" text-anchor="start" style="fill:#7d7c84;font-size:12px;font-weight:400">a collector marks every cell it can reach from the program&#x27;s roots and frees the rest.</text></svg>
