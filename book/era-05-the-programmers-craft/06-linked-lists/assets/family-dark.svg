<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" role="img" aria-label="How linked lists and garbage collection combined older ideas, and where they led" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>How linked lists and garbage collection combined older ideas, and where they led</title><line x1="125.0" y1="106.0" x2="426.5" y2="170.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="426.5,170.0 417.7,171.9 419.2,164.7" style="fill:#b9b8b2"/><line x1="500.0" y1="106.0" x2="500.0" y2="170.0" style="stroke:#b9b8b2;stroke-width:1.5;stroke-dasharray:5 4"/><polygon points="500.0,170.0 496.3,161.8 503.7,161.8" style="fill:#b9b8b2"/><line x1="875.0" y1="106.0" x2="573.5" y2="170.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="573.5,170.0 580.8,164.7 582.3,171.9" style="fill:#b9b8b2"/><line x1="416.0" y1="256.0" x2="167.0" y2="330.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="167.0,330.0 173.8,324.1 175.9,331.2" style="fill:#b9b8b2"/><line x1="500.0" y1="256.0" x2="500.0" y2="330.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="500.0,330.0 496.3,321.8 503.7,321.8" style="fill:#b9b8b2"/><line x1="605.0" y1="373.0" x2="770.0" y2="373.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="770.0,373.0 761.8,376.7 761.8,369.3" style="fill:#b9b8b2"/><line x1="146.0" y1="416.0" x2="395.0" y2="523.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="395.0,523.0 386.0,523.1 388.9,516.4" style="fill:#b9b8b2"/><line x1="833.0" y1="416.0" x2="605.0" y2="523.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="605.0,523.0 610.9,516.2 614.0,522.8" style="fill:#b9b8b2"/><rect x="20" y="20" width="210" height="86" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="32.0" y="43.7" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Addresses in memory</text><text x="32.0" y="60.9" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">a number can say where</text><text x="32.0" y="77.4" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">another lives</text><text x="32.0" y="93.9" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">Era 4 topic 9</text><rect x="395" y="20" width="210" height="86" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="407.0" y="43.7" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Luhn&#x27;s chains</text><text x="407.0" y="60.9" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">records in a bucket, one</text><text x="407.0" y="77.4" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">after another</text><text x="407.0" y="93.9" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">topic 4, 1953</text><rect x="770" y="20" width="210" height="86" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="782.0" y="43.7" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Programs that reason</text><text x="782.0" y="60.9" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">goals and formulas that</text><text x="782.0" y="77.4" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">change shape</text><text x="782.0" y="93.9" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">Logic Theorist, 1956</text><rect x="395" y="170" width="210" height="86" style="fill:#0d1117;stroke:#f0584d;stroke-width:3"/><text x="407.0" y="193.7" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Linked lists</text><text x="407.0" y="210.9" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">⊕ each cell holds the address</text><text x="407.0" y="227.4" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">of the next</text><text x="407.0" y="243.9" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">IPL, about 1956</text><rect x="20" y="330" width="210" height="86" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="32.0" y="353.7" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">A free list</text><text x="32.0" y="370.9" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">unused cells chained</text><text x="32.0" y="387.4" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">together</text><text x="32.0" y="403.9" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">IPL&#x27;s H2</text><rect x="395" y="330" width="210" height="86" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="407.0" y="353.7" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Lisp</text><text x="407.0" y="370.9" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">two-address cells; formulas</text><text x="407.0" y="387.4" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">as lists</text><text x="407.0" y="403.9" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">McCarthy, 1958–1960</text><rect x="770" y="330" width="210" height="86" style="fill:#0d1117;stroke:#f0584d;stroke-width:3"/><text x="782.0" y="353.7" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Garbage collection</text><text x="782.0" y="370.9" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">⊕ mark what is reachable,</text><text x="782.0" y="387.4" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">free the rest</text><text x="782.0" y="403.9" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">about 1959</text><rect x="395" y="480" width="210" height="86" style="fill:#0d1117;stroke:#5b8fe0;stroke-width:3"/><text x="407.0" y="511.9" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Today</text><text x="407.0" y="529.1" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">automatic memory in Java,</text><text x="407.0" y="545.6" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">Python and more</text><text x="20.0" y="615.0" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">Dashed: Luhn&#x27;s 1953 memorandum suggested linked lists for chained hash tables; whether the RAND group knew of it is not recorded in the sources opened.</text></svg>
