<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" width="720" height="200" role="img" aria-label="A road of negative length breaks Dijkstra&#x27;s argument" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>A road of negative length breaks Dijkstra&#x27;s argument</title><line x1="79.2" y1="104.3" x2="232.2" y2="58.3" style="stroke:#b9b8b2;stroke-width:1.8"/><path d="M240.8,55.7 L233.7,63.1 L230.8,53.5 Z" style="fill:#b9b8b2"/><text x="160.0" y="72.0" text-anchor="middle" style="fill:#b9b8b2;font-size:14px;font-weight:700">2</text><line x1="79.2" y1="115.7" x2="232.2" y2="161.7" style="stroke:#b9b8b2;stroke-width:1.8"/><path d="M240.8,164.3 L230.8,166.5 L233.7,156.9 Z" style="fill:#b9b8b2"/><text x="160.0" y="132.0" text-anchor="middle" style="fill:#b9b8b2;font-size:14px;font-weight:700">5</text><line x1="260.0" y1="150.0" x2="260.0" y2="79.0" style="stroke:#f0584d;stroke-width:1.8"/><path d="M260.0,70.0 L265.0,79.0 L255.0,79.0 Z" style="fill:#f0584d"/><text x="274.0" y="102.0" text-anchor="middle" style="fill:#f0584d;font-size:14px;font-weight:700">-4</text><line x1="280.0" y1="50.0" x2="431.0" y2="50.0" style="stroke:#b9b8b2;stroke-width:1.8"/><path d="M440.0,50.0 L431.0,55.0 L431.0,45.0 Z" style="fill:#b9b8b2"/><text x="360.0" y="42.0" text-anchor="middle" style="fill:#b9b8b2;font-size:14px;font-weight:700">2</text><circle cx="60.0" cy="110.0" r="18.0" style="fill:#0d1117;stroke:#b9b8b2;stroke-width:1.6"/><text x="60.0" y="115.0" text-anchor="middle" style="fill:#ecebe6;font-size:15px;font-weight:700">0</text><circle cx="260.0" cy="50.0" r="18.0" style="fill:#0d1117;stroke:#b9b8b2;stroke-width:1.6"/><text x="260.0" y="55.0" text-anchor="middle" style="fill:#ecebe6;font-size:15px;font-weight:700">1</text><circle cx="260.0" cy="170.0" r="18.0" style="fill:#0d1117;stroke:#b9b8b2;stroke-width:1.6"/><text x="260.0" y="175.0" text-anchor="middle" style="fill:#ecebe6;font-size:15px;font-weight:700">2</text><circle cx="460.0" cy="50.0" r="18.0" style="fill:#0d1117;stroke:#b9b8b2;stroke-width:1.6"/><text x="460.0" y="55.0" text-anchor="middle" style="fill:#ecebe6;font-size:15px;font-weight:700">3</text><text x="520.0" y="40.0" text-anchor="start" style="fill:#8f8e96;font-size:12px;font-weight:400">Dijkstra: town 1 settled at 2,</text><text x="520.0" y="58.0" text-anchor="start" style="fill:#8f8e96;font-size:12px;font-weight:400">so town 3 gets 4.</text><text x="520.0" y="90.0" text-anchor="start" style="fill:#8f8e96;font-size:12px;font-weight:400">True shortest: 3,</text><text x="520.0" y="108.0" text-anchor="start" style="fill:#8f8e96;font-size:12px;font-weight:400">by 0 → 2 → 1 → 3.</text></svg>
