<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="1000" height="680" role="img" aria-label="How the compiler and BNF combined older ideas, and where they led" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>How the compiler and BNF combined older ideas, and where they led</title><line x1="125.0" y1="106.0" x2="426.5" y2="170.0" style="stroke:#55545a;stroke-width:1.5;stroke-dasharray:5 4"/><polygon points="426.5,170.0 417.7,171.9 419.2,164.7" style="fill:#55545a"/><line x1="500.0" y1="106.0" x2="500.0" y2="170.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="500.0,170.0 496.3,161.8 503.7,161.8" style="fill:#55545a"/><line x1="875.0" y1="106.0" x2="875.0" y2="220.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="875.0,220.0 871.3,211.8 878.7,211.8" style="fill:#55545a"/><line x1="605.0" y1="213.0" x2="770.0" y2="263.0" style="stroke:#55545a;stroke-width:1.5;stroke-dasharray:5 4"/><polygon points="770.0,263.0 761.1,264.1 763.2,257.1" style="fill:#55545a"/><line x1="416.0" y1="256.0" x2="167.0" y2="330.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="167.0,330.0 173.8,324.1 175.9,331.2" style="fill:#55545a"/><line x1="833.0" y1="306.0" x2="605.0" y2="443.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="605.0,443.0 610.2,435.6 613.9,441.9" style="fill:#55545a"/><line x1="500.0" y1="256.0" x2="500.0" y2="400.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="500.0,400.0 496.3,391.8 503.7,391.8" style="fill:#55545a"/><line x1="146.0" y1="416.0" x2="395.0" y2="573.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="395.0,573.0 386.1,571.7 390.0,565.5" style="fill:#55545a"/><line x1="500.0" y1="486.0" x2="500.0" y2="530.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="500.0,530.0 496.3,521.8 503.7,521.8" style="fill:#55545a"/><rect x="20" y="20" width="210" height="86" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="32.0" y="51.9" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Subroutine libraries</text><text x="32.0" y="69.2" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">routines called by name</text><text x="32.0" y="85.7" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">topic 1</text><rect x="395" y="20" width="210" height="86" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="407.0" y="43.7" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Speedcoding</text><text x="407.0" y="60.9" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">floating point written</text><text x="407.0" y="77.4" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">symbolically</text><text x="407.0" y="93.9" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">Backus, 1953</text><rect x="770" y="20" width="210" height="86" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="782.0" y="43.7" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Rewriting rules</text><text x="782.0" y="60.9" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">Post&#x27;s systems, Chomsky&#x27;s</text><text x="782.0" y="77.4" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">grammars</text><text x="782.0" y="93.9" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">1920s–1956</text><rect x="395" y="170" width="210" height="86" style="fill:#ffffff;stroke:#d5352a;stroke-width:3"/><text x="407.0" y="193.7" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">FORTRAN</text><text x="407.0" y="210.9" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">⊕ formulas translated into</text><text x="407.0" y="227.4" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">code as good as a coder&#x27;s</text><text x="407.0" y="243.9" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">IBM, 1954–1957</text><rect x="770" y="220" width="210" height="86" style="fill:#ffffff;stroke:#d5352a;stroke-width:3"/><text x="782.0" y="243.7" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">BNF</text><text x="782.0" y="260.9" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">⊕ recursive rules that define</text><text x="782.0" y="277.4" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">a language</text><text x="782.0" y="293.9" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">Backus 1959; ALGOL 60, 1960</text><rect x="20" y="330" width="210" height="86" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="32.0" y="353.7" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Optimization</text><text x="32.0" y="370.9" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">fewer stores, better loops,</text><text x="32.0" y="387.4" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">index registers</text><text x="32.0" y="403.9" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">the 1957 paper, sections 2 to 6</text><rect x="395" y="400" width="210" height="86" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="407.0" y="440.2" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Parsers from grammars</text><text x="407.0" y="457.4" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">one procedure per rule</text><rect x="395" y="530" width="210" height="86" style="fill:#ffffff;stroke:#1f5ba8;stroke-width:3"/><text x="407.0" y="561.9" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Compilers today</text><text x="407.0" y="579.1" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">every language, every</text><text x="407.0" y="595.6" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">machine</text><text x="20.0" y="660.0" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">Dashed: Backus links the two, and library routines are what compiled programs call; a likeness, not a documented line of descent.</text></svg>
