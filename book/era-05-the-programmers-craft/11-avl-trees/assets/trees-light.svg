<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img" aria-label="Keys 1 to 7 in order: a chain of height 7, or an AVL tree of height 3" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>Keys 1 to 7 in order: a chain of height 7, or an AVL tree of height 3</title><text x="20.0" y="22.0" text-anchor="start" style="fill:#17171a;font-size:13px;font-weight:700">The keys 1 to 7, inserted in order</text><text x="20.0" y="46.0" text-anchor="start" style="fill:#7d7c84;font-size:12px;font-weight:400">plain search tree</text><line x1="40.0" y1="70.0" x2="74.0" y2="100.0" style="stroke:#c4c3bb;stroke-width:1.5"/><line x1="74.0" y1="100.0" x2="108.0" y2="130.0" style="stroke:#c4c3bb;stroke-width:1.5"/><line x1="108.0" y1="130.0" x2="142.0" y2="160.0" style="stroke:#c4c3bb;stroke-width:1.5"/><line x1="142.0" y1="160.0" x2="176.0" y2="190.0" style="stroke:#c4c3bb;stroke-width:1.5"/><line x1="176.0" y1="190.0" x2="210.0" y2="220.0" style="stroke:#c4c3bb;stroke-width:1.5"/><line x1="210.0" y1="220.0" x2="244.0" y2="250.0" style="stroke:#c4c3bb;stroke-width:1.5"/><circle cx="40.0" cy="70.0" r="14.0" style="fill:#ffffff;stroke:#55545a;stroke-width:1.5"/><text x="40.0" y="75.0" text-anchor="middle" style="fill:#17171a;font-size:13px;font-weight:700">1</text><circle cx="74.0" cy="100.0" r="14.0" style="fill:#ffffff;stroke:#55545a;stroke-width:1.5"/><text x="74.0" y="105.0" text-anchor="middle" style="fill:#17171a;font-size:13px;font-weight:700">2</text><circle cx="108.0" cy="130.0" r="14.0" style="fill:#ffffff;stroke:#55545a;stroke-width:1.5"/><text x="108.0" y="135.0" text-anchor="middle" style="fill:#17171a;font-size:13px;font-weight:700">3</text><circle cx="142.0" cy="160.0" r="14.0" style="fill:#ffffff;stroke:#55545a;stroke-width:1.5"/><text x="142.0" y="165.0" text-anchor="middle" style="fill:#17171a;font-size:13px;font-weight:700">4</text><circle cx="176.0" cy="190.0" r="14.0" style="fill:#ffffff;stroke:#55545a;stroke-width:1.5"/><text x="176.0" y="195.0" text-anchor="middle" style="fill:#17171a;font-size:13px;font-weight:700">5</text><circle cx="210.0" cy="220.0" r="14.0" style="fill:#ffffff;stroke:#55545a;stroke-width:1.5"/><text x="210.0" y="225.0" text-anchor="middle" style="fill:#17171a;font-size:13px;font-weight:700">6</text><circle cx="244.0" cy="250.0" r="14.0" style="fill:#ffffff;stroke:#55545a;stroke-width:1.5"/><text x="244.0" y="255.0" text-anchor="middle" style="fill:#17171a;font-size:13px;font-weight:700">7</text><text x="40.0" y="286.0" text-anchor="start" style="fill:#7d7c84;font-size:12px;font-weight:400">height 7: a search may take 7 steps</text><text x="360.0" y="46.0" text-anchor="start" style="fill:#7d7c84;font-size:12px;font-weight:400">AVL tree</text><line x1="530.0" y1="80.0" x2="445.0" y2="150.0" style="stroke:#c4c3bb;stroke-width:1.5"/><line x1="445.0" y1="150.0" x2="402.5" y2="220.0" style="stroke:#c4c3bb;stroke-width:1.5"/><line x1="445.0" y1="150.0" x2="487.5" y2="220.0" style="stroke:#c4c3bb;stroke-width:1.5"/><line x1="530.0" y1="80.0" x2="615.0" y2="150.0" style="stroke:#c4c3bb;stroke-width:1.5"/><line x1="615.0" y1="150.0" x2="572.5" y2="220.0" style="stroke:#c4c3bb;stroke-width:1.5"/><line x1="615.0" y1="150.0" x2="657.5" y2="220.0" style="stroke:#c4c3bb;stroke-width:1.5"/><circle cx="530.0" cy="80.0" r="16.0" style="fill:#f4f3ee;stroke:#d5352a;stroke-width:1.8"/><text x="530.0" y="85.0" text-anchor="middle" style="fill:#17171a;font-size:14px;font-weight:700">4</text><circle cx="445.0" cy="150.0" r="16.0" style="fill:#f4f3ee;stroke:#d5352a;stroke-width:1.8"/><text x="445.0" y="155.0" text-anchor="middle" style="fill:#17171a;font-size:14px;font-weight:700">2</text><circle cx="402.5" cy="220.0" r="16.0" style="fill:#f4f3ee;stroke:#d5352a;stroke-width:1.8"/><text x="402.5" y="225.0" text-anchor="middle" style="fill:#17171a;font-size:14px;font-weight:700">1</text><circle cx="487.5" cy="220.0" r="16.0" style="fill:#f4f3ee;stroke:#d53