<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" role="img" aria-label="How Edmonds&#x27;s matching combined older ideas, and where it led" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>How Edmonds&#x27;s matching combined older ideas, and where it led</title><line x1="125.0" y1="106.0" x2="426.5" y2="170.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="426.5,170.0 417.7,171.9 419.2,164.7" style="fill:#b9b8b2"/><line x1="500.0" y1="106.0" x2="500.0" y2="170.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="500.0,170.0 496.3,161.8 503.7,161.8" style="fill:#b9b8b2"/><line x1="770.0" y1="63.0" x2="188.0" y2="330.0" style="stroke:#b9b8b2;stroke-width:1.5;stroke-dasharray:5 4"/><polygon points="188.0,330.0 193.9,323.2 197.0,329.9" style="fill:#b9b8b2"/><line x1="416.0" y1="256.0" x2="167.0" y2="330.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="167.0,330.0 173.8,324.1 175.9,331.2" style="fill:#b9b8b2"/><line x1="500.0" y1="256.0" x2="500.0" y2="330.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="500.0,330.0 496.3,321.8 503.7,321.8" style="fill:#b9b8b2"/><line x1="584.0" y1="256.0" x2="833.0" y2="330.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="833.0,330.0 824.1,331.2 826.2,324.1" style="fill:#b9b8b2"/><line x1="146.0" y1="416.0" x2="395.0" y2="523.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="395.0,523.0 386.0,523.1 388.9,516.4" style="fill:#b9b8b2"/><line x1="833.0" y1="416.0" x2="605.0" y2="523.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="605.0,523.0 610.9,516.2 614.0,522.8" style="fill:#b9b8b2"/><rect x="20" y="20" width="210" height="86" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="32.0" y="43.7" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Berge&#x27;s theorem</text><text x="32.0" y="60.9" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">maximum exactly when no</text><text x="32.0" y="77.4" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">augmenting path</text><text x="32.0" y="93.9" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">1957</text><rect x="395" y="20" width="210" height="86" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="407.0" y="43.7" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Searching a graph</text><text x="407.0" y="60.9" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">grow a tree from a root, level</text><text x="407.0" y="77.4" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">by level</text><text x="407.0" y="93.9" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">topic 7</text><rect x="770" y="20" width="210" height="86" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="782.0" y="51.9" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Trying everything</text><text x="782.0" y="69.2" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">finite, but grows faster than</text><text x="782.0" y="85.7" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">any power</text><rect x="395" y="170" width="210" height="86" style="fill:#0d1117;stroke:#f0584d;stroke-width:3"/><text x="407.0" y="193.7" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Edmonds&#x27;s blossoms</text><text x="407.0" y="210.9" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">⊕ shrink each odd cycle to</text><text x="407.0" y="227.4" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">one vertex</text><text x="407.0" y="243.9" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">1961; published 1965</text><rect x="20" y="330" width="210" height="86" style="fill:#0d1117;stroke:#f0584d;stroke-width:3"/><text x="32.0" y="353.7" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">&quot;Good&quot; algorithms</text><text x="32.0" y="370.9" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">work bounded by a power of</text><text x="32.0" y="387.4" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">the size</text><text x="32.0" y="403.9" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">Edmonds 1965; Cobham 1965</text><rect x="395" y="330" width="210" height="86" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="407.0" y="353.7" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">The matching polytope</text><text x="407.0" y="370.9" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">a linear-programming</text><text x="407.0" y="387.4" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">description</text><text x="407.0" y="403.9" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">Edmonds</text><rect x="770" y="330" width="210" height="86" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="782.0" y="353.7" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">P and NP</text><text x="782.0" y="370.9" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">which problems have good</text><text x="782.0" y="387.4" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">algorithms?</text><text x="782.0" y="403.9" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">Edmonds&#x27;s conjectures, 1966</text><rect x="395" y="480" width="210" height="86" style="fill:#0d1117;stroke:#5b8fe0;stroke-width:3"/><text x="407.0" y="503.7" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Complexity theory</text><text x="407.0" y="520.9" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">the dividing line of the next</text><text x="407.0" y="537.4" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">era</text><text x="407.0" y="553.9" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">Era 6</text><text x="20.0" y="615.0" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">Dashed: the contrast that gave &quot;good&quot; its meaning. Both nodes in red are Edmonds&#x27;s: an algorithm, and a way of judging algorithms.</text></svg>
