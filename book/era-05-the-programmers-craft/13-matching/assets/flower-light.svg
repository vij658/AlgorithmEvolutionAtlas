<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 282" width="780" height="282" role="img" aria-label="The flower: an augmenting path that only Edmonds&#x27;s shrinking finds" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>The flower: an augmenting path that only Edmonds&#x27;s shrinking finds</title><line x1="40.0" y1="160.0" x2="140.0" y2="160.0" style="stroke:#c4c3bb;stroke-width:1.6"/><line x1="40.0" y1="160.0" x2="140.0" y2="160.0" style="stroke:#d5352a;stroke-width:2.2;stroke-dasharray:6 4"/><line x1="140.0" y1="160.0" x2="250.0" y2="160.0" style="stroke:#1f5ba8;stroke-width:6"/><line x1="140.0" y1="160.0" x2="250.0" y2="160.0" style="stroke:#d5352a;stroke-width:2.2;stroke-dasharray:6 4"/><line x1="250.0" y1="160.0" x2="340.0" y2="90.0" style="stroke:#c4c3bb;stroke-width:1.6"/><line x1="340.0" y1="90.0" x2="450.0" y2="110.0" style="stroke:#1f5ba8;stroke-width:6"/><line x1="340.0" y1="90.0" x2="450.0" y2="110.0" style="stroke:#d5352a;stroke-width:2.2;stroke-dasharray:6 4"/><line x1="450.0" y1="110.0" x2="450.0" y2="210.0" style="stroke:#c4c3bb;stroke-width:1.6"/><line x1="450.0" y1="110.0" x2="450.0" y2="210.0" style="stroke:#d5352a;stroke-width:2.2;stroke-dasharray:6 4"/><line x1="450.0" y1="210.0" x2="340.0" y2="230.0" style="stroke:#1f5ba8;stroke-width:6"/><line x1="450.0" y1="210.0" x2="340.0" y2="230.0" style="stroke:#d5352a;stroke-width:2.2;stroke-dasharray:6 4"/><line x1="340.0" y1="230.0" x2="250.0" y2="160.0" style="stroke:#c4c3bb;stroke-width:1.6"/><line x1="340.0" y1="230.0" x2="250.0" y2="160.0" style="stroke:#d5352a;stroke-width:2.2;stroke-dasharray:6 4"/><line x1="340.0" y1="90.0" x2="420.0" y2="40.0" style="stroke:#c4c3bb;stroke-width:1.6"/><line x1="340.0" y1="90.0" x2="420.0" y2="40.0" style="stroke:#d5352a;stroke-width:2.2;stroke-dasharray:6 4"/><circle cx="40.0" cy="160.0" r="16.0" style="fill:#f4f3ee;stroke:#d5352a;stroke-width:1.8"/><text x="40.0" y="165.0" text-anchor="middle" style="fill:#17171a;font-size:14px;font-weight:700">0</text><circle cx="140.0" cy="160.0" r="16.0" style="fill:#ffffff;stroke:#55545a;stroke-width:1.8"/><text x="140.0" y="165.0" text-anchor="middle" style="fill:#17171a;font-size:14px;font-weight:700">1</text><circle cx="250.0" cy="160.0" r="16.0" style="fill:#ffffff;stroke:#55545a;stroke-width:1.8"/><text x="250.0" y="165.0" text-anchor="middle" style="fill:#17171a;font-size:14px;font-weight:700">2</text><circle cx="340.0" cy="90.0" r="16.0" style="fill:#ffffff;stroke:#55545a;stroke-width:1.8"/><text x="340.0" y="95.0" text-anchor="middle" style="fill:#17171a;font-size:14px;font-weight:700">3</text><circle cx="450.0" cy="110.0" r="16.0" style="fill:#ffffff;stroke:#55545a;stroke-width:1.8"/><text x="450.0" y="115.0" text-anchor="middle" style="fill:#17171a;font-size:14px;font-weight:700">4</text><circle cx="450.0" cy="210.0" r="16.0" style="fill:#ffffff;stroke:#55545a;stroke-width:1.8"/><text x="450.0" y="215.0" text-anchor="middle" style="fill:#17171a;font-size:14px;font-weight:700">5</text><circle cx="340.0" cy="230.0" r="16.0" style="fill:#ffffff;stroke:#55545a;stroke-width:1.8"/><text x="340.0" y="235.0" text-anchor="middle" style="fill:#17171a;font-size:14px;font-weight:700">6</text><circle cx="420.0" cy="40.0" r="16.0" style="fill:#f4f3ee;stroke:#d5352a;stroke-width:1.8"/><text x="420.0" y="45.0" text-anchor="middle" style="fill:#17171a;font-size:14px;font-weight:700">7</text><text x="530.0" y="60.0" text-anchor="start" style="fill:#7d7c84;font-size:12px;font-weight:400">thick blue: the pairs to start with</text><text x="530.0" y="80.0" text-anchor="start" style="fill:#7d7c84;font-size:12px;font-weight:400">red rings: unpaired vertices</text><text x="530.0" y="100.0" text-anchor="start" style="fill:#7d7c84;font-size:12px;font-weight:400">dashed red: the augmenting path</text><text x="530.0" y="120.0" text-anchor="start" style="fill:#d5352a;font-size:13px;font-weight:700">0 1 2 6 5 4 3 7</text><text x="530.0" y="150.0" text-anchor="start" style="fill:#7d7c84;font-size:12px;font-weight:400">Without blossoms: 3 pairs.</text><text x="530.0" y="170.0" text-anchor="start" style="fill:#7d7c84;font-size:12px;font-weight:400">With Edmonds&#x27;s shrinking: 4 pairs.</text><text x="20.0" y="268.0" text-anchor="start" style="fill:#7d7c84;font-size:12px;font-weight:400">2 3 4 5 6 is an odd cycle, a blossom. A search that reaches 3 the short way, from 2, calls it inner and never looks past it.</text></svg>
