<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 840" width="1000" height="840" role="img" aria-label="How the ideas of Era 5 combined: The Programmer&#x27;s Craft" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>How the ideas of Era 5 combined: The Programmer&#x27;s Craft</title><line x1="135.0" y1="96.0" x2="135.0" y2="200.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="135.0,200.0 131.3,191.8 138.7,191.8" style="fill:#55545a"/><rect x="138.0" y="135.0" width="168.6" height="19" rx="3" style="fill:#ffffff"/><text x="143.0" y="148.0" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">⊕ routines called by name</text><line x1="500.0" y1="96.0" x2="500.0" y2="200.0" style="stroke:#55545a;stroke-width:1.5;stroke-dasharray:5 4"/><polygon points="500.0,200.0 496.3,191.8 503.7,191.8" style="fill:#55545a"/><rect x="503.0" y="135.0" width="198.1" height="19" rx="3" style="fill:#ffffff"/><text x="508.0" y="148.0" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">both from McCulloch and Pitts</text><line x1="865.0" y1="276.0" x2="865.0" y2="380.0" style="stroke:#55545a;stroke-width:1.5;stroke-dasharray:5 4"/><polygon points="865.0,380.0 861.3,371.8 868.7,371.8" style="fill:#55545a"/><rect x="868.0" y="315.0" width="94.8" height="19" rx="3" style="fill:#ffffff"/><text x="873.0" y="328.0" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">Luhn&#x27;s chains</text><line x1="135.0" y1="456.0" x2="135.0" y2="560.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="135.0,560.0 131.3,551.8 138.7,551.8" style="fill:#55545a"/><rect x="138.0" y="495.0" width="187.0" height="19" rx="3" style="fill:#ffffff"/><text x="143.0" y="508.0" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">⊕ the principle of optimality</text><line x1="500.0" y1="456.0" x2="500.0" y2="560.0" style="stroke:#55545a;stroke-width:1.5;stroke-dasharray:5 4"/><polygon points="500.0,560.0 496.3,551.8 503.7,551.8" style="fill:#55545a"/><rect x="503.0" y="495.0" width="161.2" height="19" rx="3" style="fill:#ffffff"/><text x="508.0" y="508.0" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">same task, no bad cases</text><line x1="240.0" y1="598.0" x2="395.0" y2="598.0" style="stroke:#55545a;stroke-width:1.5;stroke-dasharray:5 4"/><polygon points="395.0,598.0 386.8,601.7 386.8,594.3" style="fill:#55545a"/><rect x="255.3" y="575.0" width="124.3" height="19" rx="3" style="fill:#ffffff"/><text x="317.5" y="588.0" text-anchor="middle" style="fill:#17171a;font-size:12.5px;font-weight:600">a heap holds set B</text><line x1="865.0" y1="456.0" x2="865.0" y2="560.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="865.0,560.0 861.3,551.8 868.7,551.8" style="fill:#55545a"/><rect x="715.6" y="495.0" width="146.4" height="19" rx="3" style="fill:#ffffff"/><text x="857.0" y="508.0" text-anchor="end" style="fill:#17171a;font-size:12.5px;font-weight:600">⊕ nodes with two links</text><line x1="135.0" y1="636.0" x2="395.0" y2="778.0" style="stroke:#55545a;stroke-width:1.5;stroke-dasharray:5 4"/><polygon points="395.0,778.0 386.0,777.3 389.5,770.8" style="fill:#55545a"/><rect x="58.1" y="672.7" width="164.9" height="19" rx="3" style="fill:#ffffff"/><text x="218.0" y="685.7" text-anchor="end" style="fill:#17171a;font-size:12.5px;font-weight:600">both grow a search tree</text><rect x="30" y="20" width="210" height="76" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="42.0" y="55.2" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">1. The Subroutine</text><text x="42.0" y="72.4" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">1949–1952</text><rect x="395" y="20" width="210" height="76" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="407.0" y="55.2" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">2. Regular Expressions</text><text x="407.0" y="72.4" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">1951</text><rect x="760" y="20" width="210" height="76" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="772.0" y="55.2" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">3. Huffman&#x27;s Codes</text><text x="772.0" y="72.4" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">1951–1952</text><rect x="30" y="200" width="210" height="76" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="42.0" y="225.2" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">8. The Compiler, and a</text><text x="42.0" y="245.1" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Grammar for Languages</text><text x="42.0" y="262.3" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">1954–1960</text><rect x="395" y="200" width="210" height="76" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="407.0" y="225.2" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">9. Rosenblatt&#x27;s</text><text x="407.0" y="245.1" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Perceptron</text><text x="407.0" y="262.3" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">1957–1958</text><rect x="760" y="200" width="210" height="76" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="772.0" y="235.2" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">4. Hashing</text><text x="772.0" y="252.4" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">1953–1957</text><rect x="30" y="380" width="210" height="76" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="42.0" y="415.2" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">5. Dynamic Programming</text><text x="42.0" y="432.4" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">1952–1957</text><rect x="395" y="380" width="210" height="76" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="407.0" y="415.2" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">10. Hoare&#x27;s Quicksort</text><text x="407.0" y="432.4" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">1959–1962</text><rect x="760" y="380" width="210" height="76" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="772.0" y="405.2" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">6. Linked Lists and</text><text x="772.0" y="425.1" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Garbage Collection</text><text x="772.0" y="442.3" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">1956–1960</text><rect x="30" y="560" width="210" height="76" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="42.0" y="585.2" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">7. Dijkstra&#x27;s Shortest</text><text x="42.0" y="605.0" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Paths</text><text x="42.0" y="622.3" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">1956–1959</text><rect x="395" y="560" width="210" height="76" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="407.0" y="585.2" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">12. Heapsort and the</text><text x="407.0" y="605.0" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Heap</text><text x="407.0" y="622.3" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">1964</text><rect x="760" y="560" width="210" height="76" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="772.0" y="595.1" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">11. AVL Trees</text><text x="772.0" y="612.4" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">1962</text><rect x="395" y="740" width="210" height="76" style="fill:#ffffff;stroke:#d5352a;stroke-width:3"/><text x="407.0" y="775.1" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">13. Edmonds&#x27;s Matching</text><text x="407.0" y="792.4" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">1965</text></svg>
