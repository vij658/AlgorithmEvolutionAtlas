<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" role="img" aria-label="How the fast Fourier transform combined older ideas, and where it led" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>How the fast Fourier transform combined older ideas, and where it led</title><line x1="125.0" y1="106.0" x2="426.5" y2="180.0" style="stroke:#b9b8b2;stroke-width:1.5;stroke-dasharray:5 4"/><polygon points="426.5,180.0 417.6,181.6 419.4,174.5" style="fill:#b9b8b2"/><line x1="500.0" y1="106.0" x2="500.0" y2="180.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="500.0,180.0 496.3,171.8 503.7,171.8" style="fill:#b9b8b2"/><line x1="875.0" y1="106.0" x2="573.5" y2="180.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="573.5,180.0 580.6,174.5 582.4,181.6" style="fill:#b9b8b2"/><line x1="125.0" y1="340.0" x2="395.0" y2="223.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="395.0,223.0 388.9,229.6 386.0,222.9" style="fill:#b9b8b2"/><rect x="263.0" y="268.5" width="65.3" height="19" rx="3" style="fill:#0d1117"/><text x="268.0" y="281.5" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">the need</text><line x1="500.0" y1="266.0" x2="500.0" y2="340.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="500.0,340.0 496.3,331.8 503.7,331.8" style="fill:#b9b8b2"/><line x1="605.0" y1="223.0" x2="875.0" y2="340.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="875.0,340.0 866.0,340.1 868.9,333.4" style="fill:#b9b8b2"/><line x1="500.0" y1="426.0" x2="500.0" y2="490.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="500.0,490.0 496.3,481.8 503.7,481.8" style="fill:#b9b8b2"/><rect x="20" y="20" width="210" height="86" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="32.0" y="43.7" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Gauss&#x27;s method</text><text x="32.0" y="60.9" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">split, transform the halves,</text><text x="32.0" y="77.4" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">combine</text><text x="32.0" y="93.9" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">about 1805 (Era 3)</text><rect x="395" y="20" width="210" height="86" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="407.0" y="51.9" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Fourier series</text><text x="407.0" y="69.2" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">a signal as a sum of waves</text><text x="407.0" y="85.7" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">N² multiplications</text><rect x="770" y="20" width="210" height="86" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="782.0" y="43.7" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Earlier versions</text><text x="782.0" y="60.9" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">Runge, Danielson and Lanczos,</text><text x="782.0" y="77.4" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">Good</text><text x="782.0" y="93.9" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">1903–1958</text><rect x="395" y="180" width="210" height="86" style="fill:#0d1117;stroke:#f0584d;stroke-width:3"/><text x="407.0" y="203.7" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">The FFT</text><text x="407.0" y="220.9" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">⊕ halving, again and again,</text><text x="407.0" y="237.4" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">programmed for a computer</text><text x="407.0" y="253.9" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">Cooley and Tukey, 1965</text><rect x="20" y="340" width="210" height="86" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="32.0" y="363.7" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Seismograms</text><text x="32.0" y="380.9" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">telling earthquakes from</text><text x="32.0" y="397.4" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">bomb tests</text><text x="32.0" y="413.9" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">1963 committee</text><rect x="395" y="340" width="210" height="86" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="407.0" y="371.9" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Fast multiplication</text><text x="407.0" y="389.2" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">a product of numbers is a</text><text x="407.0" y="405.7" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">convolution of digits</text><rect x="770" y="340" width="210" height="86" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="782.0" y="380.2" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Signal processing</text><text x="782.0" y="397.4" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">filters, spectra, in real time</text><rect x="395" y="490" width="210" height="86" style="fill:#0d1117;stroke:#5b8fe0;stroke-width:3"/><text x="407.0" y="513.6" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Today</text><text x="407.0" y="530.9" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">sound and video compression,</text><text x="407.0" y="547.4" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">scanners that see inside a</text><text x="407.0" y="563.9" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">body</text><text x="20.0" y="615.0" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">Dashed: Gauss&#x27;s notes were not known to Cooley and Tukey; the method was found again. The IEEE Milestone lists uses from tomography to compression.</text></svg>
