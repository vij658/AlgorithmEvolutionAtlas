<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" role="img" aria-label="How mutual exclusion and the semaphore combined older ideas, and where they led" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>How mutual exclusion and the semaphore combined older ideas, and where they led</title><line x1="125.0" y1="106.0" x2="125.0" y2="180.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="125.0,180.0 121.3,171.8 128.7,171.8" style="fill:#b9b8b2"/><line x1="500.0" y1="106.0" x2="500.0" y2="180.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="500.0,180.0 496.3,171.8 503.7,171.8" style="fill:#b9b8b2"/><line x1="875.0" y1="106.0" x2="573.5" y2="180.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="573.5,180.0 580.6,174.5 582.4,181.6" style="fill:#b9b8b2"/><line x1="230.0" y1="223.0" x2="395.0" y2="223.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="395.0,223.0 386.8,226.7 386.8,219.3" style="fill:#b9b8b2"/><rect x="285.4" y="202.0" width="54.2" height="19" rx="3" style="fill:#0d1117"/><text x="312.5" y="215.0" text-anchor="middle" style="fill:#ecebe6;font-size:12.5px;font-weight:600">simpler</text><line x1="605.0" y1="223.0" x2="770.0" y2="223.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="770.0,223.0 761.8,226.7 761.8,219.3" style="fill:#b9b8b2"/><line x1="437.0" y1="266.0" x2="188.0" y2="340.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="188.0,340.0 194.8,334.1 196.9,341.2" style="fill:#b9b8b2"/><line x1="500.0" y1="266.0" x2="500.0" y2="340.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="500.0,340.0 496.3,331.8 503.7,331.8" style="fill:#b9b8b2"/><line x1="563.0" y1="266.0" x2="812.0" y2="340.0" style="stroke:#b9b8b2;stroke-width:1.5;stroke-dasharray:5 4"/><polygon points="812.0,340.0 803.1,341.2 805.2,334.1" style="fill:#b9b8b2"/><line x1="500.0" y1="426.0" x2="500.0" y2="490.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="500.0,490.0 496.3,481.8 503.7,481.8" style="fill:#b9b8b2"/><rect x="20" y="20" width="210" height="86" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="32.0" y="51.9" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Multiprogramming</text><text x="32.0" y="69.2" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">several programs share one</text><text x="32.0" y="85.7" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">machine</text><rect x="395" y="20" width="210" height="86" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="407.0" y="51.9" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Shared memory</text><text x="407.0" y="69.2" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">both read and write the same</text><text x="407.0" y="85.7" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">words</text><rect x="770" y="20" width="210" height="86" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="782.0" y="51.9" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Indivisible steps</text><text x="782.0" y="69.2" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">a load or a store happens</text><text x="782.0" y="85.7" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">whole</text><rect x="20" y="180" width="210" height="86" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="32.0" y="203.7" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Dekker&#x27;s algorithm</text><text x="32.0" y="220.9" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">⊕ flags and a turn: the first</text><text x="32.0" y="237.4" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">correct solution</text><text x="32.0" y="253.9" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">about 1962</text><rect x="395" y="180" width="210" height="86" style="fill:#0d1117;stroke:#f0584d;stroke-width:3"/><text x="407.0" y="203.7" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">The semaphore</text><text x="407.0" y="220.9" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">⊕ P waits and lowers, V raises,</text><text x="407.0" y="237.4" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">indivisibly</text><text x="407.0" y="253.9" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">Dijkstra, 1962–1965</text><rect x="770" y="180" width="210" height="86" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="782.0" y="203.7" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">The deadly embrace</text><text x="782.0" y="220.9" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">two processes, each holding</text><text x="782.0" y="237.4" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">what the other needs</text><text x="782.0" y="253.9" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">named in EWD 123</text><rect x="20" y="340" width="210" height="86" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="32.0" y="371.9" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Producer and consumer</text><text x="32.0" y="389.2" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">a buffer guarded by two</text><text x="32.0" y="405.7" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">semaphores</text><rect x="395" y="340" width="210" height="86" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="407.0" y="380.2" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Operating systems</text><text x="407.0" y="397.4" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">locks, queues, schedulers</text><rect x="770" y="340" width="210" height="86" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="782.0" y="371.9" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Exclusion by messages</text><text x="782.0" y="389.2" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">no shared memory at all</text><text x="782.0" y="405.7" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">Lamport, topic 13</text><rect x="395" y="490" width="210" height="86" style="fill:#0d1117;stroke:#5b8fe0;stroke-width:3"/><text x="407.0" y="513.6" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Today</text><text x="407.0" y="530.9" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">locks and semaphores in</text><text x="407.0" y="547.4" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">operating systems and</text><text x="407.0" y="563.9" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">language libraries</text><text x="20.0" y="615.0" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">Dashed: Lamport&#x27;s mutual exclusion (topic 13) solves the same problem with messages instead of shared memory.</text></svg>
