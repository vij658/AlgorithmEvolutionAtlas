<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 262" width="720" height="262" role="img" aria-label="Two processes interleaving and losing an update" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>Two processes interleaving and losing an update</title><text x="20.0" y="24.0" text-anchor="start" style="fill:#ecebe6;font-size:13px;font-weight:700">One interleaving that loses an update (counter starts at 0)</text><rect x="44.0" y="52.0" width="104.0" height="48.0" rx="4" style="fill:#0d1117;stroke:#5b8fe0;stroke-width:1.6"/><text x="96.0" y="72.0" text-anchor="middle" style="fill:#5b8fe0;font-size:13px;font-weight:700">P</text><text x="96.0" y="90.0" text-anchor="middle" style="fill:#ecebe6;font-size:11px;font-weight:400">load r = 0</text><rect x="154.0" y="122.0" width="104.0" height="48.0" rx="4" style="fill:#0d1117;stroke:#b9b8b2;stroke-width:1.6"/><text x="206.0" y="142.0" text-anchor="middle" style="fill:#b9b8b2;font-size:13px;font-weight:700">Q</text><text x="206.0" y="160.0" text-anchor="middle" style="fill:#ecebe6;font-size:11px;font-weight:400">load r = 0</text><rect x="264.0" y="52.0" width="104.0" height="48.0" rx="4" style="fill:#0d1117;stroke:#5b8fe0;stroke-width:1.6"/><text x="316.0" y="72.0" text-anchor="middle" style="fill:#5b8fe0;font-size:13px;font-weight:700">P</text><text x="316.0" y="90.0" text-anchor="middle" style="fill:#ecebe6;font-size:11px;font-weight:400">r = r + 1 (1)</text><rect x="374.0" y="122.0" width="104.0" height="48.0" rx="4" style="fill:#0d1117;stroke:#b9b8b2;stroke-width:1.6"/><text x="426.0" y="142.0" text-anchor="middle" style="fill:#b9b8b2;font-size:13px;font-weight:700">Q</text><text x="426.0" y="160.0" text-anchor="middle" style="fill:#ecebe6;font-size:11px;font-weight:400">r = r + 1 (1)</text><rect x="484.0" y="52.0" width="104.0" height="48.0" rx="4" style="fill:#0d1117;stroke:#5b8fe0;stroke-width:1.6"/><text x="536.0" y="72.0" text-anchor="middle" style="fill:#5b8fe0;font-size:13px;font-weight:700">P</text><text x="536.0" y="90.0" text-anchor="middle" style="fill:#ecebe6;font-size:11px;font-weight:400">store: counter = 1</text><rect x="594.0" y="122.0" width="104.0" height="48.0" rx="4" style="fill:#0d1117;stroke:#f0584d;stroke-width:1.6"/><text x="646.0" y="142.0" text-anchor="middle" style="fill:#f0584d;font-size:13px;font-weight:700">Q</text><text x="646.0" y="160.0" text-anchor="middle" style="fill:#ecebe6;font-size:11px;font-weight:400">store: counter = 1</text><text x="14.0" y="80.0" text-anchor="start" style="fill:#5b8fe0;font-size:13px;font-weight:700">P</text><text x="14.0" y="150.0" text-anchor="start" style="fill:#b9b8b2;font-size:13px;font-weight:700">Q</text><line x1="44.0" y1="190.0" x2="698.0" y2="190.0" style="stroke:#41444b;stroke-width:1.5"/><text x="44.0" y="208.0" text-anchor="start" style="fill:#8f8e96;font-size:11px;font-weight:400">time →</text><text x="20.0" y="232.0" text-anchor="start" style="fill:#8f8e96;font-size:12px;font-weight:400">Two additions, but the counter ends at 1. Of all 20 interleavings, 18 lose an update;</text><text x="20.0" y="250.0" text-anchor="start" style="fill:#8f8e96;font-size:12px;font-weight:400">with P(s) before the steps and V(s) after them, none do.</text></svg>
