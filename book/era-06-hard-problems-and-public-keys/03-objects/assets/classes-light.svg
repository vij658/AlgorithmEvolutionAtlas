<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" width="760" height="350" role="img" aria-label="Class Customer and its subclasses Letter and Parcel" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>Class Customer and its subclasses Letter and Parcel</title><rect x="270.0" y="20.0" width="220.0" height="94.0" rx="4" style="fill:#ffffff;stroke:#17171a;stroke-width:1.8"/><text x="282.0" y="41.0" text-anchor="start" style="fill:#17171a;font-size:14px;font-weight:700">class Customer</text><line x1="270.0" y1="50.0" x2="490.0" y2="50.0" style="stroke:#17171a;stroke-width:1"/><text x="282.0" y="68.0" text-anchor="start" style="fill:#17171a;font-size:12px;font-weight:400">arrived (a time)</text><text x="282.0" y="86.0" text-anchor="start" style="fill:#17171a;font-size:12px;font-weight:400">serviceTime(): about 1 minute</text><text x="282.0" y="104.0" text-anchor="start" style="fill:#17171a;font-size:12px;font-weight:400">kind()</text><rect x="60.0" y="180.0" width="230.0" height="76.0" rx="4" style="fill:#ffffff;stroke:#1f5ba8;stroke-width:1.8"/><text x="72.0" y="201.0" text-anchor="start" style="fill:#1f5ba8;font-size:14px;font-weight:700">class Letter extends Customer</text><line x1="60.0" y1="210.0" x2="290.0" y2="210.0" style="stroke:#1f5ba8;stroke-width:1"/><text x="72.0" y="228.0" text-anchor="start" style="fill:#17171a;font-size:12px;font-weight:400">serviceTime(): about 0.5 minute</text><text x="72.0" y="246.0" text-anchor="start" style="fill:#17171a;font-size:12px;font-weight:400">everything else inherited</text><rect x="470.0" y="180.0" width="230.0" height="76.0" rx="4" style="fill:#ffffff;stroke:#d5352a;stroke-width:1.8"/><text x="482.0" y="201.0" text-anchor="start" style="fill:#d5352a;font-size:14px;font-weight:700">class Parcel extends Customer</text><line x1="470.0" y1="210.0" x2="700.0" y2="210.0" style="stroke:#d5352a;stroke-width:1"/><text x="482.0" y="228.0" text-anchor="start" style="fill:#17171a;font-size:12px;font-weight:400">serviceTime(): about 2 minutes</text><text x="482.0" y="246.0" text-anchor="start" style="fill:#17171a;font-size:12px;font-weight:400">everything else inherited</text><line x1="175.0" y1="180.0" x2="380.0" y2="124.0" style="stroke:#55545a;stroke-width:1.5"/><line x1="585.0" y1="180.0" x2="380.0" y2="124.0" style="stroke:#55545a;stroke-width:1.5"/><path d="M371,124 L380,114 L389,124 Z" style="fill:#ffffff;stroke:#55545a;stroke-width:1.5"/><text x="20.0" y="288.0" text-anchor="start" style="fill:#7d7c84;font-size:12px;font-weight:400">The simulator holds a Customer c and calls c.serviceTime(). Which procedure runs is decided by the object&#x27;s own class:</text><text x="20.0" y="310.0" text-anchor="start" style="fill:#17171a;font-size:12px;font-weight:700">Customer.serviceTime: mean 0.996  ·  Letter.serviceTime: mean 0.502  ·  Parcel.serviceTime: mean 1.991  (100,000 calls each)</text><text x="20.0" y="336.0" text-anchor="start" style="fill:#7d7c84;font-size:12px;font-weight:400">Adding a third kind of customer means one new subclass; the simulator does not change.</text></svg>
