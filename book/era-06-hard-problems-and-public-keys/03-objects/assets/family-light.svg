<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" role="img" aria-label="How Simula&#x27;s objects combined older ideas, and where they led" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>How Simula&#x27;s objects combined older ideas, and where they led</title><line x1="125.0" y1="106.0" x2="426.5" y2="180.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="426.5,180.0 417.6,181.6 419.4,174.5" style="fill:#55545a"/><line x1="500.0" y1="106.0" x2="500.0" y2="180.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="500.0,180.0 496.3,171.8 503.7,171.8" style="fill:#55545a"/><line x1="875.0" y1="106.0" x2="573.5" y2="180.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="573.5,180.0 580.6,174.5 582.4,181.6" style="fill:#55545a"/><line x1="426.5" y1="266.0" x2="125.0" y2="340.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="125.0,340.0 132.1,334.5 133.9,341.6" style="fill:#55545a"/><line x1="500.0" y1="266.0" x2="500.0" y2="340.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="500.0,340.0 496.3,331.8 503.7,331.8" style="fill:#55545a"/><line x1="573.5" y1="266.0" x2="875.0" y2="340.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="875.0,340.0 866.1,341.6 867.9,334.5" style="fill:#55545a"/><line x1="500.0" y1="426.0" x2="500.0" y2="490.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="500.0,490.0 496.3,481.8 503.7,481.8" style="fill:#55545a"/><rect x="20" y="20" width="210" height="86" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="32.0" y="51.9" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Algol 60 blocks</text><text x="32.0" y="69.2" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">local data with its own</text><text x="32.0" y="85.7" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">procedures</text><rect x="395" y="20" width="210" height="86" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="407.0" y="43.7" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Simulation models</text><text x="407.0" y="60.9" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">many things acting on their</text><text x="407.0" y="77.4" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">own</text><text x="407.0" y="93.9" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">Nygaard&#x27;s simulation projects</text><rect x="770" y="20" width="210" height="86" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="782.0" y="43.7" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">The subroutine</text><text x="782.0" y="60.9" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">code written once, called</text><text x="782.0" y="77.4" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">from anywhere</text><text x="782.0" y="93.9" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">Era 5, topic 1</text><rect x="395" y="180" width="210" height="86" style="fill:#ffffff;stroke:#d5352a;stroke-width:3"/><text x="407.0" y="203.7" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Simula 67</text><text x="407.0" y="220.9" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">⊕ classes, objects and</text><text x="407.0" y="237.4" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">subclasses</text><text x="407.0" y="253.9" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">Dahl and Nygaard, 1967</text><rect x="20" y="340" width="210" height="86" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="32.0" y="363.7" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Smalltalk</text><text x="32.0" y="380.9" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">Kay took classes, objects</text><text x="32.0" y="397.4" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">and references; inheritance</text><text x="32.0" y="413.9" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">from 1976</text><rect x="395" y="340" width="210" height="86" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="407.0" y="371.9" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">C++</text><text x="407.0" y="389.2" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">Simula&#x27;s classes added to C</text><text x="407.0" y="405.7" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">Stroustrup</text><rect x="770" y="340" width="210" height="86" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="782.0" y="363.7" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Java</text><text x="782.0" y="380.9" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">the language of this book&#x27;s</text><text x="782.0" y="397.4" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">programs</text><text x="782.0" y="413.9" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">Gosling</text><rect x="395" y="490" width="210" height="86" style="fill:#ffffff;stroke:#1f5ba8;stroke-width:3"/><text x="407.0" y="513.6" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Today</text><text x="407.0" y="530.9" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">object-oriented</text><text x="407.0" y="547.4" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">programming, &quot;dominant in</text><text x="407.0" y="563.9" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">systems development&quot;</text><text x="20.0" y="615.0" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">Black: the class is &quot;the generalisation and liberalisation of the Algol 60 block&quot;. The IEEE Milestone names Smalltalk, C++ and Java among Simula&#x27;s heirs.</text></svg>
