<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" role="img" aria-label="How Strassen&#x27;s method combined older ideas, and where it led" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>How Strassen&#x27;s method combined older ideas, and where it led</title><line x1="125.0" y1="106.0" x2="426.5" y2="180.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="426.5,180.0 417.6,181.6 419.4,174.5" style="fill:#b9b8b2"/><line x1="500.0" y1="106.0" x2="500.0" y2="180.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="500.0,180.0 496.3,171.8 503.7,171.8" style="fill:#b9b8b2"/><rect x="503.0" y="130.0" width="94.8" height="19" rx="3" style="fill:#0d1117"/><text x="508.0" y="143.0" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">&quot;not optimal&quot;</text><line x1="875.0" y1="106.0" x2="573.5" y2="180.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="573.5,180.0 580.6,174.5 582.4,181.6" style="fill:#b9b8b2"/><line x1="426.5" y1="266.0" x2="125.0" y2="340.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="125.0,340.0 132.1,334.5 133.9,341.6" style="fill:#b9b8b2"/><line x1="500.0" y1="266.0" x2="500.0" y2="340.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="500.0,340.0 496.3,331.8 503.7,331.8" style="fill:#b9b8b2"/><line x1="605.0" y1="383.0" x2="770.0" y2="383.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="770.0,383.0 761.8,386.7 761.8,379.3" style="fill:#b9b8b2"/><line x1="500.0" y1="426.0" x2="500.0" y2="490.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="500.0,490.0 496.3,481.8 503.7,481.8" style="fill:#b9b8b2"/><rect x="20" y="20" width="210" height="86" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="32.0" y="51.9" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">The school rule</text><text x="32.0" y="69.2" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">every row against every</text><text x="32.0" y="85.7" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">column: n³</text><rect x="395" y="20" width="210" height="86" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="407.0" y="51.9" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Elimination</text><text x="407.0" y="69.2" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">solve, invert: also about n³</text><text x="407.0" y="85.7" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">Era 2, topic 1; Gauss</text><rect x="770" y="20" width="210" height="86" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="782.0" y="51.9" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Divide and conquer</text><text x="782.0" y="69.2" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">split in halves, recurse</text><text x="782.0" y="85.7" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">the FFT, topic 1</text><rect x="395" y="180" width="210" height="86" style="fill:#0d1117;stroke:#f0584d;stroke-width:3"/><text x="407.0" y="203.7" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Strassen&#x27;s products</text><text x="407.0" y="220.9" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">⊕ seven products for 2 × 2</text><text x="407.0" y="237.4" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">blocks: n^2.807</text><text x="407.0" y="253.9" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">Zürich, 1969</text><rect x="20" y="340" width="210" height="86" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="32.0" y="371.9" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Faster inversion</text><text x="32.0" y="389.2" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">blocks, with fast products</text><text x="32.0" y="405.7" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">inside</text><rect x="395" y="340" width="210" height="86" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="407.0" y="371.9" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">The exponent race</text><text x="407.0" y="389.2" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">2.796 (1978) … 2.3755 (1990)</text><text x="407.0" y="405.7" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">galactic algorithms</text><rect x="770" y="340" width="210" height="86" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="782.0" y="371.9" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Found with AI</text><text x="782.0" y="389.2" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">ω &lt; 2.371177</text><text x="782.0" y="405.7" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">AlphaEvolve, 2026</text><rect x="395" y="490" width="210" height="86" style="fill:#0d1117;stroke:#5b8fe0;stroke-width:3"/><text x="407.0" y="513.6" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Today</text><text x="407.0" y="530.9" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">Strassen&#x27;s method in</text><text x="407.0" y="547.4" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">practice; the record far</text><text x="407.0" y="563.9" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">below it</text><text x="20.0" y="615.0" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">Bounds from Wikipedia&#x27;s table and the 2026 arXiv paper. Galactic: faster only for matrices far too large for present-day computers.</text></svg>
