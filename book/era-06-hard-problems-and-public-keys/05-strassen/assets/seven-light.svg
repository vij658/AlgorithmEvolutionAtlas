<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-label="Strassen&#x27;s seven products and how they combine" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>Strassen&#x27;s seven products and how they combine</title><text x="20.0" y="30.0" text-anchor="start" style="fill:#17171a;font-size:13px;font-weight:700">A = [a b; c d], B = [e f; g h]: seven products, then additions and subtractions only</text><rect x="20.0" y="54.0" width="220.0" height="32.0" rx="4" style="fill:#ffffff;stroke:#1f5ba8;stroke-width:1.6"/><text x="32.0" y="75.0" text-anchor="start" style="fill:#17171a;font-size:13px;font-weight:700">m1 = (a+d)(e+h)</text><rect x="20.0" y="100.0" width="220.0" height="32.0" rx="4" style="fill:#ffffff;stroke:#1f5ba8;stroke-width:1.6"/><text x="32.0" y="121.0" text-anchor="start" style="fill:#17171a;font-size:13px;font-weight:700">m2 = (c+d)e</text><rect x="20.0" y="146.0" width="220.0" height="32.0" rx="4" style="fill:#ffffff;stroke:#1f5ba8;stroke-width:1.6"/><text x="32.0" y="167.0" text-anchor="start" style="fill:#17171a;font-size:13px;font-weight:700">m3 = a(f-h)</text><rect x="20.0" y="192.0" width="220.0" height="32.0" rx="4" style="fill:#ffffff;stroke:#1f5ba8;stroke-width:1.6"/><text x="32.0" y="213.0" text-anchor="start" style="fill:#17171a;font-size:13px;font-weight:700">m4 = d(g-e)</text><rect x="20.0" y="238.0" width="220.0" height="32.0" rx="4" style="fill:#ffffff;stroke:#1f5ba8;stroke-width:1.6"/><text x="32.0" y="259.0" text-anchor="start" style="fill:#17171a;font-size:13px;font-weight:700">m5 = (a+b)h</text><rect x="20.0" y="284.0" width="220.0" height="32.0" rx="4" style="fill:#ffffff;stroke:#1f5ba8;stroke-width:1.6"/><text x="32.0" y="305.0" text-anchor="start" style="fill:#17171a;font-size:13px;font-weight:700">m6 = (c-a)(e+f)</text><rect x="20.0" y="330.0" width="220.0" height="32.0" rx="4" style="fill:#ffffff;stroke:#1f5ba8;stroke-width:1.6"/><text x="32.0" y="351.0" text-anchor="start" style="fill:#17171a;font-size:13px;font-weight:700">m7 = (b-d)(g+h)</text><rect x="520.0" y="78.0" width="220.0" height="44.0" rx="4" style="fill:#ffffff;stroke:#d5352a;stroke-width:1.6"/><text x="532.0" y="97.0" text-anchor="start" style="fill:#17171a;font-size:12px;font-weight:700">top left: ae+bg</text><text x="532.0" y="114.0" text-anchor="start" style="fill:#17171a;font-size:12px;font-weight:400">= m1+m4-m5+m7</text><line x1="240.0" y1="70.0" x2="520.0" y2="100.0" style="stroke:#c4c3bb;stroke-width:1.4"/><line x1="240.0" y1="208.0" x2="520.0" y2="100.0" style="stroke:#c4c3bb;stroke-width:1.4"/><line x1="240.0" y1="254.0" x2="520.0" y2="100.0" style="stroke:#d5352a;stroke-width:1.4;stroke-dasharray:5 4"/><line x1="240.0" y1="346.0" x2="520.0" y2="100.0" style="stroke:#c4c3bb;stroke-width:1.4"/><rect x="520.0" y="160.0" width="220.0" height="44.0" rx="4" style="fill:#ffffff;stroke:#d5352a;stroke-width:1.6"/><text x="532.0" y="179.0" text-anchor="start" style="fill:#17171a;font-size:12px;font-weight:700">top right: af+bh</text><text x="532.0" y="196.0" text-anchor="start" style="fill:#17171a;font-size:12px;font-weight:400">= m3+m5</text><line x1="240.0" y1="162.0" x2="520.0" y2="182.0" style="stroke:#c4c3bb;stroke-width:1.4"/><line x1="240.0" y1="254.0" x2="520.0" y2="182.0" style="stroke:#c4c3bb;stroke-width:1.4"/><rect x="520.0" y="242.0" width="220.0" height="44.0" rx="4" style="fill:#ffffff;stroke:#d5352a;stroke-width:1.6"/><text x="532.0" y="261.0" text-anchor="start" style="fill:#17171a;font-size:12px;font-weight:700">bottom left: ce+dg</text><text x="532.0" y="278.0" text-anchor="start" style="fill:#17171a;font-size:12px;font-weight:400">= m2+m4</text><line x1="240.0" y1="116.0" x2="520.0" y2="264.0" style="stroke:#c4c3bb;stroke-width:1.4"/><line x1="240.0" y1="208.0" x2="520.0" y2="264.0" style="stroke:#c4c3bb;stroke-width:1.4"/><rect x="520.0" y="324.0" width="220.0" height="44.0" rx="4" style="fill:#ffffff;stroke:#d5352a;stroke-width:1.6"/><text x="532.0" y="343.0" text-anchor="start" style="fill:#17171a;font-size:12px;font-weight:700">bottom right: cf+dh</text><text x="532.0" y="360.0" text-anchor="start" style="fill:#17171a;font-size:12px;font-weight:400">= m1-m2+m3+m6</text><line x1="240.0" y1="70.0" x2="520.0" y2="346.0" style="stroke:#c4c3bb;stroke-width:1.4"/><line x1="240.0" y1="116.0" x2="520.0" y2="346.0" style="stroke:#d5352a;stroke-width:1.4;stroke-dasharray:5 4"/><line x1="240.0" y1="162.0" x2="520.0" y2="346.0" style="stroke:#c4c3bb;stroke-width:1.4"/><line x1="240.0" y1="300.0" x2="520.0" y2="346.0" style="stroke:#c4c3bb;stroke-width:1.4"/><text x="20.0" y="410.0" text-anchor="start" style="fill:#7d7c84;font-size:12px;font-weight:400">Grey lines add a product, red dashed lines subtract it. No step uses ab = ba, so the letters may be blocks of a larger matrix.</text></svg>
