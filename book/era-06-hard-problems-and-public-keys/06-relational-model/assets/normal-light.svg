x27;s key (man#, and for salaries also jobdate) is copied into its children.</text><text x="20.0" y="334.0" text-anchor="start" style="fill:#7d7c84;font-size:12px;font-weight:400">The program flattened 60 employees this way and rebuilt all 60 exactly from the four tables.</text></svg>
