<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" role="img" aria-label="How B-trees combined older ideas, and where they led" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>How B-trees combined older ideas, and where they led</title><line x1="125.0" y1="106.0" x2="426.5" y2="180.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="426.5,180.0 417.6,181.6 419.4,174.5" style="fill:#55545a"/><line x1="500.0" y1="106.0" x2="500.0" y2="180.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="500.0,180.0 496.3,171.8 503.7,171.8" style="fill:#55545a"/><line x1="875.0" y1="106.0" x2="573.5" y2="180.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="573.5,180.0 580.6,174.5 582.4,181.6" style="fill:#55545a"/><rect x="727.2" y="130.0" width="65.3" height="19" rx="3" style="fill:#ffffff"/><text x="732.2" y="143.0" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">the need</text><line x1="426.5" y1="266.0" x2="125.0" y2="340.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="125.0,340.0 132.1,334.5 133.9,341.6" style="fill:#55545a"/><line x1="500.0" y1="266.0" x2="500.0" y2="340.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="500.0,340.0 496.3,331.8 503.7,331.8" style="fill:#55545a"/><line x1="573.5" y1="266.0" x2="875.0" y2="340.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="875.0,340.0 866.1,341.6 867.9,334.5" style="fill:#55545a"/><line x1="125.0" y1="426.0" x2="458.0" y2="490.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="458.0,490.0 449.2,492.1 450.6,484.8" style="fill:#55545a"/><rect x="20" y="20" width="210" height="86" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="32.0" y="43.7" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Balanced search trees</text><text x="32.0" y="60.9" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">about log₂ n steps per</text><text x="32.0" y="77.4" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">search</text><text x="32.0" y="93.9" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">AVL, Era 5, topic 11</text><rect x="395" y="20" width="210" height="86" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="407.0" y="51.9" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Disks</text><text x="407.0" y="69.2" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">one access brings a whole</text><text x="407.0" y="85.7" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">page</text><rect x="770" y="20" width="210" height="86" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="782.0" y="51.9" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Indexes of large files</text><text x="782.0" y="69.2" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">too big for main memory</text><text x="782.0" y="85.7" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">Boeing&#x27;s &quot;Jumbo&quot; parts data</text><rect x="395" y="180" width="210" height="86" style="fill:#ffffff;stroke:#d5352a;stroke-width:3"/><text x="407.0" y="203.7" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">The B-tree</text><text x="407.0" y="220.9" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">⊕ pages of k to 2k keys; split,</text><text x="407.0" y="237.4" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">borrow, merge</text><text x="407.0" y="253.9" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">Bayer and McCreight, 1970–72</text><rect x="20" y="340" width="210" height="86" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="32.0" y="371.9" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Relational databases</text><text x="32.0" y="389.2" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">the index under the tables</text><text x="32.0" y="405.7" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">topic 6</text><rect x="395" y="340" width="210" height="86" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="407.0" y="380.2" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">File systems</text><text x="407.0" y="397.4" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">HFS+, APFS, NTFS, ext4</text><rect x="770" y="340" width="210" height="86" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="782.0" y="370.2" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Non-relational</text><text x="782.0" y="390.1" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">databases</text><text x="782.0" y="407.3" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">many use it too</text><rect x="395" y="490" width="210" height="86" style="fill:#ffffff;stroke:#1f5ba8;stroke-width:3"/><text x="407.0" y="513.6" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Today</text><text x="407.0" y="530.9" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">&quot;the standard index</text><text x="407.0" y="547.4" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">implementation in almost all</text><text x="407.0" y="563.9" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">relational databases&quot;</text><text x="20.0" y="615.0" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">Uses as listed by Wikipedia (B-tree). The memoir&#x27;s &quot;Jumbo&quot; is Bayer&#x27;s own word for the Boeing programme whose parts data overwhelmed the computers.</text></svg>
