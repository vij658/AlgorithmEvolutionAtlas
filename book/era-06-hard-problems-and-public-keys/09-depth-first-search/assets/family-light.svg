<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" role="img" aria-label="How depth-first search combined older ideas, and where it led" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>How depth-first search combined older ideas, and where it led</title><line x1="125.0" y1="106.0" x2="426.5" y2="180.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="426.5,180.0 417.6,181.6 419.4,174.5" style="fill:#55545a"/><line x1="500.0" y1="106.0" x2="500.0" y2="180.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="500.0,180.0 496.3,171.8 503.7,171.8" style="fill:#55545a"/><line x1="875.0" y1="106.0" x2="573.5" y2="180.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="573.5,180.0 580.6,174.5 582.4,181.6" style="fill:#55545a"/><rect x="727.2" y="130.0" width="65.3" height="19" rx="3" style="fill:#ffffff"/><text x="732.2" y="143.0" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">the need</text><line x1="426.5" y1="266.0" x2="125.0" y2="340.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="125.0,340.0 132.1,334.5 133.9,341.6" style="fill:#55545a"/><line x1="500.0" y1="266.0" x2="500.0" y2="340.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="500.0,340.0 496.3,331.8 503.7,331.8" style="fill:#55545a"/><line x1="573.5" y1="266.0" x2="875.0" y2="340.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="875.0,340.0 866.1,341.6 867.9,334.5" style="fill:#55545a"/><line x1="500.0" y1="426.0" x2="500.0" y2="490.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="500.0,490.0 496.3,481.8 503.7,481.8" style="fill:#55545a"/><rect x="20" y="20" width="210" height="86" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="32.0" y="51.9" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Trémaux&#x27;s mazes</text><text x="32.0" y="69.2" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">go deep, back up at dead ends</text><text x="32.0" y="85.7" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">19th century</text><rect x="395" y="20" width="210" height="86" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="407.0" y="43.7" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Graph search</text><text x="407.0" y="60.9" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">Euler&#x27;s bridges to Dijkstra&#x27;s</text><text x="407.0" y="77.4" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">paths</text><text x="407.0" y="93.9" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">Eras 3 and 5</text><rect x="770" y="20" width="210" height="86" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="782.0" y="43.7" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Planarity</text><text x="782.0" y="60.9" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">can this network be drawn</text><text x="782.0" y="77.4" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">without crossings?</text><text x="782.0" y="93.9" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">the problem that started it</text><rect x="395" y="180" width="210" height="86" style="fill:#ffffff;stroke:#d5352a;stroke-width:3"/><text x="407.0" y="203.7" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Depth-first search</text><text x="407.0" y="220.9" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">⊕ numbers, fronds and</text><text x="407.0" y="237.4" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">lowpoints</text><text x="407.0" y="253.9" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">Tarjan, Hopcroft, 1972</text><rect x="20" y="340" width="210" height="86" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="32.0" y="362.0" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Cut vertices,</text><text x="32.0" y="381.8" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">components</text><text x="32.0" y="399.1" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">in one pass, time V + E</text><text x="32.0" y="415.6" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">1972</text><rect x="395" y="340" width="210" height="86" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="407.0" y="371.9" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Strong components</text><text x="407.0" y="389.2" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">who can reach whom, one-way</text><text x="407.0" y="405.7" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">1972</text><rect x="770" y="340" width="210" height="86" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="782.0" y="371.9" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Linear-time planarity</text><text x="782.0" y="389.2" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">the first such test</text><text x="782.0" y="405.7" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">Hopcroft and Tarjan, 1974</text><rect x="395" y="490" width="210" height="86" style="fill:#ffffff;stroke:#1f5ba8;stroke-width:3"/><text x="407.0" y="521.9" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Today</text><text x="407.0" y="539.1" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">components, planarity tests,</text><text x="407.0" y="555.6" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">topological sorting</text><text x="20.0" y="615.0" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">Uses after Wikipedia (Depth-first search), which lists components, planarity testing and topological sorting among them.</text></svg>
