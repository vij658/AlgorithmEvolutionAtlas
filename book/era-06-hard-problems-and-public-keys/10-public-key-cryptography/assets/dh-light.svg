<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 330" width="780" height="330" role="img" aria-label="Diffie and Hellman&#x27;s key exchange" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>Diffie and Hellman&#x27;s key exchange</title><text x="20.0" y="24.0" text-anchor="start" style="fill:#17171a;font-size:13px;font-weight:700">Agreeing on a secret key with everyone listening (Diffie and Hellman)</text><rect x="20.0" y="50.0" width="220.0" height="210.0" rx="6" style="fill:#ffffff;stroke:#1f5ba8;stroke-width:1.8"/><rect x="540.0" y="50.0" width="220.0" height="210.0" rx="6" style="fill:#ffffff;stroke:#1f5ba8;stroke-width:1.8"/><rect x="290.0" y="50.0" width="200.0" height="210.0" rx="6" style="fill:#f4f3ee;stroke:#c4c3bb;stroke-width:1.2"/><text x="130.0" y="74.0" text-anchor="middle" style="fill:#1f5ba8;font-size:14px;font-weight:700">Alice</text><text x="650.0" y="74.0" text-anchor="middle" style="fill:#1f5ba8;font-size:14px;font-weight:700">Bob</text><text x="390.0" y="74.0" text-anchor="middle" style="fill:#7d7c84;font-size:12px;font-weight:700">Public: everyone sees</text><text x="130.0" y="110.0" text-anchor="middle" style="fill:#17171a;font-size:12px;font-weight:400">picks a secret a</text><text x="390.0" y="110.0" text-anchor="middle" style="fill:#17171a;font-size:13px;font-weight:700">p and g</text><text x="650.0" y="110.0" text-anchor="middle" style="fill:#17171a;font-size:12px;font-weight:400">picks a secret b</text><text x="130.0" y="150.0" text-anchor="middle" style="fill:#17171a;font-size:12px;font-weight:400">computes A = g^a mod p</text><text x="390.0" y="150.0" text-anchor="middle" style="fill:#17171a;font-size:13px;font-weight:700">A  →</text><text x="650.0" y="150.0" text-anchor="middle" style="fill:#17171a;font-size:12px;font-weight:400">computes B = g^b mod p</text><text x="130.0" y="190.0" text-anchor="middle" style="fill:#17171a;font-size:12px;font-weight:400"></text><text x="390.0" y="190.0" text-anchor="middle" style="fill:#17171a;font-size:13px;font-weight:700">←  B</text><text x="650.0" y="190.0" text-anchor="middle" style="fill:#17171a;font-size:12px;font-weight:400"></text><text x="130.0" y="230.0" text-anchor="middle" style="fill:#17171a;font-size:12px;font-weight:400">key = B^a mod p</text><text x="390.0" y="230.0" text-anchor="middle" style="fill:#17171a;font-size:13px;font-weight:700"></text><text x="650.0" y="230.0" text-anchor="middle" style="fill:#17171a;font-size:12px;font-weight:400">key = A^b mod p</text><text x="390.0" y="250.0" text-anchor="middle" style="fill:#d5352a;font-size:12px;font-weight:700">an eavesdropper sees p, g, A, B; not a or b</text><text x="20.0" y="290.0" text-anchor="start" style="fill:#7d7c84;font-size:12px;font-weight:400">Both keys equal g^(ab) mod p. In the program: a 256-bit prime p, g = 2; both sides got the same 256-bit key,</text><text x="20.0" y="310.0" text-anchor="start" style="fill:#7d7c84;font-size:12px;font-weight:400">beginning 925b2a6187676e35…; each power took 385 multiplications. Finding a from A means a discrete logarithm.</text></svg>
