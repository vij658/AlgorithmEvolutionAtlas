<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" role="img" aria-label="How public-key cryptography combined older ideas, and where it led" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>How public-key cryptography combined older ideas, and where it led</title><line x1="188.0" y1="106.0" x2="426.5" y2="180.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="426.5,180.0 417.6,181.1 419.7,174.1" style="fill:#55545a"/><line x1="437.0" y1="106.0" x2="125.0" y2="180.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="125.0,180.0 132.1,174.5 133.8,181.7" style="fill:#55545a"/><line x1="500.0" y1="106.0" x2="500.0" y2="180.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="500.0,180.0 496.3,171.8 503.7,171.8" style="fill:#55545a"/><line x1="812.0" y1="106.0" x2="573.5" y2="180.0" style="stroke:#55545a;stroke-width:1.5;stroke-dasharray:5 4"/><polygon points="573.5,180.0 580.3,174.1 582.4,181.1" style="fill:#55545a"/><line x1="770.0" y1="223.0" x2="605.0" y2="223.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="605.0,223.0 613.2,219.3 613.2,226.7" style="fill:#55545a"/><line x1="230.0" y1="223.0" x2="395.0" y2="223.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="395.0,223.0 386.8,226.7 386.8,219.3" style="fill:#55545a"/><rect x="281.7" y="202.0" width="61.6" height="19" rx="3" style="fill:#ffffff"/><text x="312.5" y="215.0" text-anchor="middle" style="fill:#17171a;font-size:12.5px;font-weight:600">the idea</text><line x1="500.0" y1="266.0" x2="500.0" y2="340.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="500.0,340.0 496.3,331.8 503.7,331.8" style="fill:#55545a"/><line x1="230.0" y1="383.0" x2="395.0" y2="383.0" style="stroke:#55545a;stroke-width:1.5;stroke-dasharray:5 4"/><polygon points="395.0,383.0 386.8,386.7 386.8,379.3" style="fill:#55545a"/><rect x="255.9" y="362.0" width="113.2" height="19" rx="3" style="fill:#ffffff"/><text x="312.5" y="375.0" text-anchor="middle" style="fill:#17171a;font-size:12.5px;font-weight:600">unknown to them</text><line x1="500.0" y1="426.0" x2="500.0" y2="490.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="500.0,490.0 496.3,481.8 503.7,481.8" style="fill:#55545a"/><rect x="20" y="20" width="210" height="86" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="32.0" y="43.7" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Euclid&#x27;s algorithm</text><text x="32.0" y="60.9" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">the inverse d of e, modulo</text><text x="32.0" y="77.4" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">(p−1)(q−1)</text><text x="32.0" y="93.9" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">Era 1, topic 7</text><rect x="395" y="20" width="210" height="86" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="407.0" y="51.9" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Powers modulo a prime</text><text x="407.0" y="69.2" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">fast to compute, hard to</text><text x="407.0" y="85.7" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">undo</text><rect x="770" y="20" width="210" height="86" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="782.0" y="43.7" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Problems believed hard</text><text x="782.0" y="60.9" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">factoring, discrete</text><text x="782.0" y="77.4" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">logarithms</text><text x="782.0" y="93.9" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">topic 8, in spirit</text><rect x="20" y="180" width="210" height="86" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="32.0" y="203.7" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Key exchange in public</text><text x="32.0" y="220.9" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">⊕ g^a, g^b, and g^(ab) for</text><text x="32.0" y="237.4" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">both</text><text x="32.0" y="253.9" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">Diffie and Hellman, 1976</text><rect x="395" y="180" width="210" height="86" style="fill:#ffffff;stroke:#d5352a;stroke-width:3"/><text x="407.0" y="203.7" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">RSA</text><text x="407.0" y="220.9" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">⊕ a public key to encrypt, a</text><text x="407.0" y="237.4" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">private one to decrypt</text><text x="407.0" y="253.9" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">Rivest, Shamir, Adleman, 1977</text><rect x="770" y="180" width="210" height="86" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="782.0" y="211.9" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Probabilistic primality</text><text x="782.0" y="229.2" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">random bases that rarely lie</text><text x="782.0" y="245.7" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">Solovay and Strassen</text><rect x="395" y="340" width="210" height="86" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="407.0" y="371.9" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Digital signatures</text><text x="407.0" y="389.2" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">anyone can check, one person</text><text x="407.0" y="405.7" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">can make</text><rect x="20" y="340" width="210" height="86" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="32.0" y="371.9" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Found first, in secret</text><text x="32.0" y="389.2" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">Ellis, Cocks, Williamson</text><text x="32.0" y="405.7" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">GCHQ, 1970–1974; revealed 1997</text><rect x="395" y="490" width="210" height="86" style="fill:#ffffff;stroke:#1f5ba8;stroke-width:3"/><text x="407.0" y="521.9" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Today</text><text x="407.0" y="539.1" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">keys agreed in public;</text><text x="407.0" y="555.6" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">signatures anyone can check</text><text x="20.0" y="615.0" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">Dashed: RSA rests on factoring being hard, which is believed, not proved; the GCHQ work stayed secret until 1997.</text></svg>
