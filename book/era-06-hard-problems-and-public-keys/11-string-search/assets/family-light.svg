<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" role="img" aria-label="How fast string searching combined older ideas, and where it led" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>How fast string searching combined older ideas, and where it led</title><line x1="125.0" y1="106.0" x2="125.0" y2="180.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="125.0,180.0 121.3,171.8 128.7,171.8" style="fill:#55545a"/><line x1="437.0" y1="106.0" x2="188.0" y2="180.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="188.0,180.0 194.8,174.1 196.9,181.2" style="fill:#55545a"/><line x1="812.0" y1="106.0" x2="230.0" y2="223.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="230.0,223.0 237.3,217.8 238.8,225.0" style="fill:#55545a"/><rect x="423.8" y="143.5" width="194.4" height="19" rx="3" style="fill:#ffffff"/><text x="521.0" y="156.5" text-anchor="middle" style="fill:#17171a;font-size:12.5px;font-weight:600">the same method, found twice</text><line x1="875.0" y1="106.0" x2="875.0" y2="180.0" style="stroke:#55545a;stroke-width:1.5;stroke-dasharray:5 4"/><polygon points="875.0,180.0 871.3,171.8 878.7,171.8" style="fill:#55545a"/><line x1="812.0" y1="266.0" x2="563.0" y2="340.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="563.0,340.0 569.8,334.1 571.9,341.2" style="fill:#55545a"/><line x1="188.0" y1="266.0" x2="437.0" y2="340.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="437.0,340.0 428.1,341.2 430.2,334.1" style="fill:#55545a"/><line x1="875.0" y1="266.0" x2="875.0" y2="340.0" style="stroke:#55545a;stroke-width:1.5;stroke-dasharray:5 4"/><polygon points="875.0,340.0 871.3,331.8 878.7,331.8" style="fill:#55545a"/><line x1="500.0" y1="426.0" x2="500.0" y2="490.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="500.0,490.0 496.3,481.8 503.7,481.8" style="fill:#55545a"/><rect x="20" y="20" width="210" height="86" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="32.0" y="43.7" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Finite automata</text><text x="32.0" y="60.9" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">a machine reads each letter</text><text x="32.0" y="77.4" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">once</text><text x="32.0" y="93.9" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">Era 5, topic 2</text><rect x="395" y="20" width="210" height="86" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="407.0" y="43.7" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Cook&#x27;s theorem</text><text x="407.0" y="60.9" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">on pushdown automata:</text><text x="407.0" y="77.4" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">Knuth&#x27;s route in</text><text x="407.0" y="93.9" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">early 1970</text><rect x="770" y="20" width="210" height="86" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="782.0" y="43.7" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Text editors</text><text x="782.0" y="60.9" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">Morris&#x27;s editor for the CDC</text><text x="782.0" y="77.4" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">6400</text><text x="782.0" y="93.9" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">1969</text><rect x="20" y="180" width="210" height="86" style="fill:#ffffff;stroke:#d5352a;stroke-width:3"/><text x="32.0" y="203.7" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Knuth–Morris–Pratt</text><text x="32.0" y="220.9" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">⊕ the next table: never back</text><text x="32.0" y="237.4" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">up</text><text x="32.0" y="253.9" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">1977</text><rect x="770" y="180" width="210" height="86" style="fill:#ffffff;stroke:#d5352a;stroke-width:3"/><text x="782.0" y="203.7" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Boyer–Moore</text><text x="782.0" y="220.9" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">⊕ compare from the right;</text><text x="782.0" y="237.4" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">jump</text><text x="782.0" y="253.9" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">1977; Gosper too</text><rect x="395" y="340" width="210" height="86" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="407.0" y="371.9" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Worst-case proofs</text><text x="407.0" y="389.2" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">Knuth 1976; Guibas and</text><text x="407.0" y="405.7" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">Odlyzko; Cole, 3n</text><rect x="770" y="340" width="210" height="86" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="782.0" y="371.9" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Longest-match search</text><text x="782.0" y="389.2" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">the heart of LZ77</text><text x="782.0" y="405.7" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">topic 12</text><rect x="395" y="490" width="210" height="86" style="fill:#ffffff;stroke:#1f5ba8;stroke-width:3"/><text x="407.0" y="513.6" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Today</text><text x="407.0" y="530.9" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">Boyer–Moore, &quot;the standard</text><text x="407.0" y="547.4" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">benchmark&quot; for practical</text><text x="407.0" y="563.9" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">string search</text><text x="20.0" y="615.0" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">Dashed: related, not derived. Wikipedia calls Boyer–Moore &quot;the standard benchmark for practical string-search literature&quot;.</text></svg>
