nt-size:15px;font-weight:700">b</text><text x="325.0" y="92.0" text-anchor="middle" style="fill:#f0584d;font-size:14px;font-weight:700">2</text><rect x="350.0" y="40.0" width="42.0" height="30.0" rx="3" style="fill:#0d1117;stroke:#5b8fe0;stroke-width:1.4"/><text x="371.0" y="61.0" text-anchor="middle" style="fill:#ecebe6;font-size:15px;font-weight:700">c</text><text x="371.0" y="92.0" text-anchor="middle" style="fill:#f0584d;font-size:14px;font-weight:700">3</text><rect x="396.0" y="40.0" width="42.0" height="30.0" rx="3" style="fill:#0d1117;stroke:#5b8fe0;stroke-width:1.4"/><text x="417.0" y="61.0" text-anchor="middle" style="fill:#ecebe6;font-size:15px;font-weight:700">a</text><text x="417.0" y="92.0" text-anchor="middle" style="fill:#f0584d;font-size:14px;font-weight:700">4</text><rect x="442.0" y="40.0" width="42.0" height="30.0" rx="3" style="fill:#0d1117;stroke:#5b8fe0;stroke-width:1.4"/><text x="463.0" y="61.0" text-anchor="middle" style="fill:#ecebe6;font-size:15px;font-weight:700">c</text><text x="463.0" y="92.0" text-anchor="middle" style="fill:#f0584d;font-size:14px;font-weight:700">0</text><rect x="488.0" y="40.0" width="42.0" height="30.0" rx="3" style="fill:#0d1117;stroke:#5b8fe0;stroke-width:1.4"/><text x="509.0" y="61.0" text-anchor="middle" style="fill:#ecebe6;font-size:15px;font-weight:700">a</text><text x="509.0" y="92.0" text-anchor="middle" style="fill:#f0584d;font-size:14px;font-weight:700">1</text><rect x="534.0" y="40.0" width="42.0" height="30.0" rx="3" style="fill:#0d1117;stroke:#5b8fe0;stroke-width:1.4"/><text x="555.0" y="61.0" text-anchor="middle" style="fill:#ecebe6;font-size:15px;font-weight:700">b</text><text x="555.0" y="92.0" text-anchor="middle" style="fill:#f0584d;font-size:14px;font-weight:700">2</text><text x="20.0" y="61.0" text-anchor="start" style="fill:#8f8e96;font-size:12px;font-weight:400">pattern</text><text x="20.0" y="92.0" text-anchor="start" style="fill:#8f8e96;font-size:12px;font-weight:400">j letters →</text><text x="20.0" y="116.0" text-anchor="start" style="fill:#8f8e96;font-size:11px;font-weight:400">Under each letter: for j = 1, 2, … letters matched, the longest ending of them that is also a beginning of the pattern.</text><text x="20.0" y="160.0" text-anchor="start" style="fill:#ecebe6;font-size:13px;font-weight:700">Boyer and Moore: compare from the right end; shift by a table</text><rect x="120.0" y="176.0" width="42.0" height="30.0" rx="3" style="fill:#0d1117;stroke:#f0584d;stroke-width:1.4"/><text x="141.0" y="197.0" text-anchor="middle" style="fill:#ecebe6;font-size:15px;font-weight:700">A</text><text x="141.0" y="228.0" text-anchor="middle" style="fill:#5b8fe0;font-size:14px;font-weight:700">11</text><rect x="166.0" y="176.0" width="42.0" height="30.0" rx="3" style="fill:#0d1117;stroke:#f0584d;stroke-width:1.4"/><text x="187.0" y="197.0" text-anchor="middle" style="fill:#ecebe6;font-size:15px;font-weight:700">T</text><text x="187.0" y="228.0" text-anchor="middle" style="fill:#5b8fe0;font-size:14px;font-weight:700">10</text><rect x="212.0" y="176.0" width="42.0" height="30.0" rx="3" style="fill:#0d1117;stroke:#f0584d;stroke-width:1.4"/><text x="233.0" y="197.0" text-anchor="middle" style="fill:#ecebe6;font-size:15px;font-weight:700">-</text><text x="233.0" y="228.0" text-anchor="middle" style="fill:#5b8fe0;font-size:14px;font-weight:700">9</text><rect x="258.0" y="176.0" width="42.0" height="30.0" rx="3" style="fill:#0d1117;stroke:#f0584d;stroke-width:1.4"/><text x="279.0" y="197.0" text-anchor="middle" style="fill:#ecebe6;font-size:15px;font-weight:700">T</text><text x="279.0" y="228.0" text-anchor="middle" style="fill:#5b8fe0;font-size:14px;font-weight:700">8</text><rect x="304.0" y="176.0" width="42.0" height="30.0" rx="3" style="fill:#0d1117;stroke:#f0584d;stroke-width:1.4"/><text x="325.0" y="197.0" text-anchor="middle" style="fill:#ecebe6;font-size:15px;font-weight:700">H</text><text x="325.0" y="228.0" text-anchor="middle" style="fill:#5b8fe0;font-size:14px;font-weight:700">7</text><rect x="350.0" y="176.0" width="42.0" height="30.0" rx="3" style="fill:#0d1117;stroke:#f0584d;stroke-width:1.4"/><text x="371.0" y="197.0" text-anchor="middle" style="fill:#ecebe6;font-size:15px;font-weight:700">A</text><text x="371.0" y="228.0" text-anchor="middle" style="fill:#5b8fe0;font-size:14px;font-weight:700">4</text><rect x="396.0" y="176.0" width="42.0" height="30.0" rx="3" style="fill:#0d1117;stroke:#f0584d;stroke-width:1.4"/><text x="417.0" y="197.0" text-anchor="middle" style="fill:#ecebe6;font-size:15px;font-weight:700">T</text><text x="417.0" y="228.0" text-anchor="middle" style="fill:#5b8fe0;font-size:14px;font-weight:700">1</text><text x="20.0" y="197.0" text-anchor="start" style="fill:#8f8e96;font-size:12px;font-weight:400">pattern</text><text x="20.0" y="228.0" text-anchor="start" style="fill:#8f8e96;font-size:12px;font-weight:400">delta2 →</text><text x="20.0" y="258.0" text-anchor="start" style="fill:#8f8e96;font-size:12px;font-weight:400">delta1, by the text&#x27;s letter at a mismatch: A 1, T 3, H 2, - 4, any other letter 7.</text><text x="20.0" y="280.0" text-anchor="start" style="fill:#8f8e96;font-size:12px;font-weight:400">delta2: how far to advance after a mismatch at each position, given the ending already matched.</text></svg>
