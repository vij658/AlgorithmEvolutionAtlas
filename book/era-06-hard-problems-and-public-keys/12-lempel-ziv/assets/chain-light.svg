<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 416" width="960" height="416" role="img" aria-label="Each fix leaves a new pain: from known odds to no odds at all" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>Each fix leaves a new pain: from known odds to no odds at all</title><line x1="400.0" y1="66.0" x2="560.0" y2="66.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="560.0,66.0 551.8,69.7 551.8,62.3" style="fill:#55545a"/><rect x="449.2" y="45.0" width="61.6" height="19" rx="3" style="fill:#ffffff"/><text x="480.0" y="58.0" text-anchor="middle" style="fill:#17171a;font-size:12.5px;font-weight:600">fixed by</text><line x1="750.0" y1="112.0" x2="750.0" y2="162.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="750.0,162.0 746.3,153.8 753.7,153.8" style="fill:#55545a"/><rect x="757.0" y="129.0" width="175.9" height="19" rx="3" style="fill:#ffffff"/><text x="762.0" y="142.0" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">which leaves a new problem</text><line x1="560.0" y1="208.0" x2="400.0" y2="208.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="400.0,208.0 408.2,204.3 408.2,211.7" style="fill:#55545a"/><rect x="449.2" y="187.0" width="61.6" height="19" rx="3" style="fill:#ffffff"/><text x="480.0" y="200.0" text-anchor="middle" style="fill:#17171a;font-size:12.5px;font-weight:600">fixed by</text><line x1="210.0" y1="254.0" x2="210.0" y2="304.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="210.0,304.0 206.3,295.8 213.7,295.8" style="fill:#55545a"/><line x1="400.0" y1="350.0" x2="560.0" y2="350.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="560.0,350.0 551.8,353.7 551.8,346.3" style="fill:#55545a"/><rect x="463.9" y="329.0" width="32.1" height="19" rx="3" style="fill:#ffffff"/><text x="480.0" y="342.0" text-anchor="middle" style="fill:#17171a;font-size:12.5px;font-weight:600">and</text><rect x="20" y="20" width="380" height="92" style="fill:#ffffff;stroke:#d5352a;stroke-width:3"/><text x="32.0" y="53.5" text-anchor="start" style="fill:#7d7c84;font-size:11px;font-weight:700;letter-spacing:.08em">WHAT HURT</text><text x="32.0" y="69.5" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">A text that repeats itself: Huffman&#x27;s code still needs</text><text x="32.0" y="86.0" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">4.32 bits per byte, letter by letter</text><rect x="560" y="20" width="380" height="92" style="fill:#ffffff;stroke:#1f5ba8;stroke-width:3"/><text x="572.0" y="45.2" text-anchor="start" style="fill:#7d7c84;font-size:11px;font-weight:700;letter-spacing:.08em">THE FIX</text><text x="572.0" y="61.3" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">LZ77 sends pointers to earlier copies: 0.27 bits per</text><text x="572.0" y="77.8" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">byte</text><text x="572.0" y="94.3" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">Ziv and Lempel, 1977</text><rect x="560" y="162" width="380" height="92" style="fill:#ffffff;stroke:#d5352a;stroke-width:3"/><text x="572.0" y="195.5" text-anchor="start" style="fill:#7d7c84;font-size:11px;font-weight:700;letter-spacing:.08em">WHAT HURT</text><text x="572.0" y="211.5" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">Codes need the source&#x27;s odds; coded symbol by symbol,</text><text x="572.0" y="228.0" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">this source cannot beat 1.000 bits</text><rect x="20" y="162" width="380" height="92" style="fill:#ffffff;stroke:#1f5ba8;stroke-width:3"/><text x="32.0" y="187.2" text-anchor="start" style="fill:#7d7c84;font-size:11px;font-weight:700;letter-spacing:.08em">THE FIX</text><text x="32.0" y="203.3" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">LZ78, told nothing, approaches the source&#x27;s rate</text><text x="32.0" y="219.8" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">(0.469): 0.561 at 10,000,000 symbols</text><text x="32.0" y="236.3" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">1978: universal</text><rect x="20" y="304" width="380" height="92" style="fill:#ffffff;stroke:#d5352a;stroke-width:3"/><text x="32.0" y="337.5" text-anchor="start" style="fill:#7d7c84;font-size:11px;font-weight:700;letter-spacing:.08em">WHAT HURT</text><text x="32.0" y="353.5" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">On a short text, the field notes, LZ77 (4.95) and LZ78</text><text x="32.0" y="370.0" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">(5.04) lose to Huffman (4.48)</text><rect x="560" y="304" width="380" height="92" style="fill:#ffffff;stroke:#1f5ba8;stroke-width:3"/><text x="572.0" y="329.2" text-anchor="start" style="fill:#7d7c84;font-size:11px;font-weight:700;letter-spacing:.08em">WHAT IT SHOWED</text><text x="572.0" y="345.3" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">The promise is for long inputs: the phrases must have</text><text x="572.0" y="361.8" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">time to grow</text><text x="572.0" y="378.3" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">measured here</text></svg>
