<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" role="img" aria-label="How Lempel and Ziv&#x27;s compression combined older ideas, and where it led" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>How Lempel and Ziv&#x27;s compression combined older ideas, and where it led</title><line x1="125.0" y1="106.0" x2="125.0" y2="180.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="125.0,180.0 121.3,171.8 128.7,171.8" style="fill:#b9b8b2"/><rect x="41.9" y="130.0" width="80.1" height="19" rx="3" style="fill:#0d1117"/><text x="117.0" y="143.0" text-anchor="end" style="fill:#ecebe6;font-size:12.5px;font-weight:600">the target</text><line x1="437.0" y1="106.0" x2="188.0" y2="180.0" style="stroke:#b9b8b2;stroke-width:1.5;stroke-dasharray:5 4"/><polygon points="188.0,180.0 194.8,174.1 196.9,181.2" style="fill:#b9b8b2"/><line x1="812.0" y1="106.0" x2="230.0" y2="223.0" style="stroke:#b9b8b2;stroke-width:1.5;stroke-dasharray:5 4"/><polygon points="230.0,223.0 237.3,217.8 238.8,225.0" style="fill:#b9b8b2"/><line x1="230.0" y1="223.0" x2="770.0" y2="223.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="770.0,223.0 761.8,226.7 761.8,219.3" style="fill:#b9b8b2"/><rect x="456.3" y="202.0" width="87.4" height="19" rx="3" style="fill:#0d1117"/><text x="500.0" y="215.0" text-anchor="middle" style="fill:#ecebe6;font-size:12.5px;font-weight:600">a year later</text><line x1="875.0" y1="266.0" x2="875.0" y2="340.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="875.0,340.0 871.3,331.8 878.7,331.8" style="fill:#b9b8b2"/><line x1="125.0" y1="266.0" x2="125.0" y2="340.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="125.0,340.0 121.3,331.8 128.7,331.8" style="fill:#b9b8b2"/><line x1="770.0" y1="383.0" x2="605.0" y2="383.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="605.0,383.0 613.2,379.3 613.2,386.7" style="fill:#b9b8b2"/><line x1="500.0" y1="426.0" x2="500.0" y2="490.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="500.0,490.0 496.3,481.8 503.7,481.8" style="fill:#b9b8b2"/><line x1="125.0" y1="426.0" x2="395.0" y2="533.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="395.0,533.0 386.0,533.4 388.7,526.6" style="fill:#b9b8b2"/><rect x="20" y="20" width="210" height="86" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="32.0" y="43.7" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Entropy</text><text x="32.0" y="60.9" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">the best average for a known</text><text x="32.0" y="77.4" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">source</text><text x="32.0" y="93.9" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">Shannon, Era 4</text><rect x="395" y="20" width="210" height="86" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="407.0" y="43.7" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Huffman&#x27;s code</text><text x="407.0" y="60.9" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">optimal, letter by letter, if</text><text x="407.0" y="77.4" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">told the odds</text><text x="407.0" y="93.9" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">Era 5, topic 3</text><rect x="770" y="20" width="210" height="86" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="782.0" y="51.9" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Finding repeats</text><text x="782.0" y="69.2" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">the longest match in a window</text><text x="782.0" y="85.7" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">topic 11</text><rect x="20" y="180" width="210" height="86" style="fill:#0d1117;stroke:#f0584d;stroke-width:3"/><text x="32.0" y="203.7" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">LZ77</text><text x="32.0" y="220.9" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">⊕ a pointer into what was</text><text x="32.0" y="237.4" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">already sent</text><text x="32.0" y="253.9" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">Ziv and Lempel, 1977</text><rect x="770" y="180" width="210" height="86" style="fill:#0d1117;stroke:#f0584d;stroke-width:3"/><text x="782.0" y="203.7" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">LZ78</text><text x="782.0" y="220.9" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">⊕ a dictionary of phrases,</text><text x="782.0" y="237.4" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">grown as it goes</text><text x="782.0" y="253.9" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">1978</text><rect x="770" y="340" width="210" height="86" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="782.0" y="363.7" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">LZW</text><text x="782.0" y="380.9" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">a faster form of the</text><text x="782.0" y="397.4" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">dictionary method</text><text x="782.0" y="413.9" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">Welch, 1984</text><rect x="20" y="340" width="210" height="86" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="32.0" y="371.9" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Compression programs</text><text x="32.0" y="389.2" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">Unix compress; WinZip, gzip</text><text x="32.0" y="405.7" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">1980s and 1990s</text><rect x="395" y="340" width="210" height="86" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="407.0" y="380.2" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Image formats</text><text x="407.0" y="397.4" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">GIF, TIFF and others</text><rect x="395" y="490" width="210" height="86" style="fill:#0d1117;stroke:#5b8fe0;stroke-width:3"/><text x="407.0" y="521.9" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Today</text><text x="407.0" y="539.1" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">compressed files, images and</text><text x="407.0" y="555.6" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">Internet traffic</text><text x="20.0" y="615.0" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">Uses as given by IEEE Spectrum (2023) and the IEEE Milestone. Dashed: related ideas, not sources the papers name.</text></svg>
