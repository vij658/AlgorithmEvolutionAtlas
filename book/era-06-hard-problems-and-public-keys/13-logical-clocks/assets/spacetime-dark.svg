<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 300" width="780" height="300" role="img" aria-label="A space-time diagram with logical clocks" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>A space-time diagram with logical clocks</title><text x="20.0" y="26.0" text-anchor="start" style="fill:#ecebe6;font-size:13px;font-weight:700">Three processes; time runs to the right; arrows are messages; each event shows its clock</text><text x="30.0" y="75.0" text-anchor="start" style="fill:#ecebe6;font-size:14px;font-weight:700">P</text><line x1="60.0" y1="70.0" x2="750.0" y2="70.0" style="stroke:#41444b;stroke-width:2"/><text x="30.0" y="155.0" text-anchor="start" style="fill:#ecebe6;font-size:14px;font-weight:700">Q</text><line x1="60.0" y1="150.0" x2="750.0" y2="150.0" style="stroke:#41444b;stroke-width:2"/><text x="30.0" y="235.0" text-anchor="start" style="fill:#ecebe6;font-size:14px;font-weight:700">R</text><line x1="60.0" y1="230.0" x2="750.0" y2="230.0" style="stroke:#41444b;stroke-width:2"/><line x1="238.0" y1="70.0" x2="302.0" y2="150.0" style="stroke:#5b8fe0;stroke-width:1.8"/><path d="M296.4,143.0 L287.2,138.8 L294.3,133.1 Z" style="fill:#5b8fe0"/><line x1="366.0" y1="150.0" x2="494.0" y2="230.0" style="stroke:#5b8fe0;stroke-width:1.8"/><path d="M486.4,225.2 L476.4,224.3 L481.1,216.6 Z" style="fill:#5b8fe0"/><line x1="622.0" y1="230.0" x2="686.0" y2="70.0" style="stroke:#5b8fe0;stroke-width:1.8"/><path d="M682.7,78.4 L683.5,88.4 L675.1,85.0 Z" style="fill:#5b8fe0"/><circle cx="110.0" cy="70.0" r="8.0" style="fill:#0d1117;stroke:#ecebe6;stroke-width:2"/><text x="98.0" y="58.0" text-anchor="end" style="fill:#ecebe6;font-size:12px;font-weight:700">p1</text><text x="122.0" y="92.0" text-anchor="start" style="fill:#5b8fe0;font-size:13px;font-weight:700">1</text><circle cx="174.0" cy="150.0" r="8.0" style="fill:#0d1117;stroke:#ecebe6;stroke-width:2"/><text x="162.0" y="138.0" text-anchor="end" style="fill:#ecebe6;font-size:12px;font-weight:700">q1</text><text x="186.0" y="172.0" text-anchor="start" style="fill:#5b8fe0;font-size:13px;font-weight:700">1</text><circle cx="238.0" cy="70.0" r="8.0" style="fill:#0d1117;stroke:#ecebe6;stroke-width:2"/><text x="226.0" y="58.0" text-anchor="end" style="fill:#ecebe6;font-size:12px;font-weight:700">p2</text><text x="226.0" y="92.0" text-anchor="end" style="fill:#5b8fe0;font-size:13px;font-weight:700">2</text><circle cx="302.0" cy="150.0" r="8.0" style="fill:#0d1117;stroke:#ecebe6;stroke-width:2"/><text x="314.0" y="138.0" text-anchor="start" style="fill:#ecebe6;font-size:12px;font-weight:700">q2</text><text x="314.0" y="172.0" text-anchor="start" style="fill:#5b8fe0;font-size:13px;font-weight:700">3</text><circle cx="366.0" cy="150.0" r="8.0" style="fill:#0d1117;stroke:#ecebe6;stroke-width:2"/><text x="354.0" y="138.0" text-anchor="end" style="fill:#ecebe6;font-size:12px;font-weight:700">q3</text><text x="354.0" y="172.0" text-anchor="end" style="fill:#5b8fe0;font-size:13px;font-weight:700">4</text><circle cx="430.0" cy="230.0" r="8.0" style="fill:#0d1117;stroke:#ecebe6;stroke-width:2"/><text x="418.0" y="218.0" text-anchor="end" style="fill:#ecebe6;font-size:12px;font-weight:700">r1</text><text x="442.0" y="252.0" text-anchor="start" style="fill:#5b8fe0;font-size:13px;font-weight:700">1</text><circle cx="494.0" cy="230.0" r="8.0" style="fill:#0d1117;stroke:#ecebe6;stroke-width:2"/><text x="506.0" y="218.0" text-anchor="start" style="fill:#ecebe6;font-size:12px;font-weight:700">r2</text><text x="506.0" y="252.0" text-anchor="start" style="fill:#5b8fe0;font-size:13px;font-weight:700">5</text><circle cx="558.0" cy="70.0" r="8.0" style="fill:#0d1117;stroke:#f0584d;stroke-width:2"/><text x="546.0" y="58.0" text-anchor="end" style="fill:#f0584d;font-size:12px;font-weight:700">p3</text><text x="570.0" y="92.0" text-anchor="start" style="fill:#5b8fe0;font-size:13px;font-weight:700">3</text><circle cx="622.0" cy="230.0" r="8.0" style="fill:#0d1117;stroke:#f0584d;stroke-width:2"/><text x="610.0" y="218.0" text-anchor="end" style="fill:#f0584d;font-size:12px;font-weight:700">r3</text><text x="634.0" y="252.0" text-anchor="start" style="fill:#5b8fe0;font-size:13px;font-weight:700">6</text><circle cx="686.0" cy="70.0" r="8.0" style="fill:#0d1117;stroke:#ecebe6;stroke-width:2"/><text x="674.0" y="58.0" text-anchor="end" style="fill:#ecebe6;font-size:12px;font-weight:700">p4</text><text x="698.0" y="92.0" text-anchor="start" style="fill:#5b8fe0;font-size:13px;font-weight:700">7</text><text x="20.0" y="270.0" text-anchor="start" style="fill:#8f8e96;font-size:12px;font-weight:400">p1 → r2 through p2 → q2 → q3 → r2: so C(p1) = 1 &lt; C(r2) = 5.</text><text x="20.0" y="290.0" text-anchor="start" style="fill:#8f8e96;font-size:12px;font-weight:400">Red: p3 (clock 3) and r3 (clock 6) are concurrent: no chain of messages joins them, though their clocks differ.</text></svg>
