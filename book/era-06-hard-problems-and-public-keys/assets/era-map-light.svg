<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 840" width="1000" height="840" role="img" aria-label="How the ideas of Era 6 combined: Hard Problems and Public Keys" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>How the ideas of Era 6 combined: Hard Problems and Public Keys</title><line x1="135.0" y1="96.0" x2="135.0" y2="200.0" style="stroke:#55545a;stroke-width:1.5;stroke-dasharray:5 4"/><polygon points="135.0,200.0 131.3,191.8 138.7,191.8" style="fill:#55545a"/><rect x="138.0" y="135.0" width="190.7" height="19" rx="3" style="fill:#ffffff"/><text x="143.0" y="148.0" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">both beat the obvious count</text><line x1="500.0" y1="96.0" x2="500.0" y2="200.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="500.0,200.0 496.3,191.8 503.7,191.8" style="fill:#55545a"/><rect x="503.0" y="135.0" width="205.4" height="19" rx="3" style="fill:#ffffff"/><text x="508.0" y="148.0" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">⊕ mutual exclusion by messages</text><line x1="865.0" y1="276.0" x2="865.0" y2="380.0" style="stroke:#55545a;stroke-width:1.5;stroke-dasharray:5 4"/><polygon points="865.0,380.0 861.3,371.8 868.7,371.8" style="fill:#55545a"/><rect x="722.9" y="315.0" width="139.1" height="19" rx="3" style="fill:#ffffff"/><text x="857.0" y="328.0" text-anchor="end" style="fill:#17171a;font-size:12.5px;font-weight:600">both search a graph</text><line x1="135.0" y1="276.0" x2="135.0" y2="380.0" style="stroke:#55545a;stroke-width:1.5;stroke-dasharray:5 4"/><polygon points="135.0,380.0 131.3,371.8 138.7,371.8" style="fill:#55545a"/><rect x="138.0" y="315.0" width="223.9" height="19" rx="3" style="fill:#ffffff"/><text x="143.0" y="328.0" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">Strassen&#x27;s prime test makes keys</text><line x1="395.0" y1="418.0" x2="240.0" y2="418.0" style="stroke:#55545a;stroke-width:1.5;stroke-dasharray:5 4"/><polygon points="240.0,418.0 248.2,414.3 248.2,421.7" style="fill:#55545a"/><rect x="244.3" y="395.0" width="146.4" height="19" rx="3" style="fill:#ffffff"/><text x="317.5" y="408.0" text-anchor="middle" style="fill:#17171a;font-size:12.5px;font-weight:600">hardness as security</text><line x1="395.0" y1="598.0" x2="240.0" y2="598.0" style="stroke:#55545a;stroke-width:1.5;stroke-dasharray:5 4"/><polygon points="240.0,598.0 248.2,594.3 248.2,601.7" style="fill:#55545a"/><rect x="233.2" y="575.0" width="168.6" height="19" rx="3" style="fill:#ffffff"/><text x="317.5" y="588.0" text-anchor="middle" style="fill:#17171a;font-size:12.5px;font-weight:600">B-trees index the tables</text><line x1="865.0" y1="636.0" x2="865.0" y2="740.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="865.0,740.0 861.3,731.8 868.7,731.8" style="fill:#55545a"/><rect x="652.9" y="675.0" width="209.1" height="19" rx="3" style="fill:#ffffff"/><text x="857.0" y="688.0" text-anchor="end" style="fill:#17171a;font-size:12.5px;font-weight:600">⊕ search for the longest match</text><rect x="30" y="20" width="210" height="76" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="42.0" y="45.2" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">1. The Fast Fourier</text><text x="42.0" y="65.0" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Transform</text><text x="42.0" y="82.3" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">1964–1965</text><rect x="395" y="20" width="210" height="76" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="407.0" y="45.2" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">2. Mutual Exclusion and</text><text x="407.0" y="65.0" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">the Semaphore</text><text x="407.0" y="82.3" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">1962–1965</text><rect x="760" y="20" width="210" height="76" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="772.0" y="45.2" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">3. Objects, Classes and</text><text x="772.0" y="65.0" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Subclasses</text><text x="772.0" y="82.3" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">1961–1967</text><rect x="30" y="200" width="210" height="76" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="42.0" y="225.2" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">5. Fast Matrix</text><text x="42.0" y="245.1" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Multiplication</text><text x="42.0" y="262.3" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">1969</text><rect x="395" y="200" width="210" height="76" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="407.0" y="235.2" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">13. Logical Clocks</text><text x="407.0" y="252.4" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">1978</text><rect x="760" y="200" width="210" height="76" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="772.0" y="225.2" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">4. A*: Search Guided by</text><text x="772.0" y="245.1" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">an Estimate</text><text x="772.0" y="262.3" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">1968</text><rect x="30" y="380" width="210" height="76" style="fill:#ffffff;stroke:#d5352a;stroke-width:3"/><text x="42.0" y="405.2" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">10. Public-Key</text><text x="42.0" y="425.1" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Cryptography</text><text x="42.0" y="442.3" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">1976–1977</text><rect x="395" y="380" width="210" height="76" style="fill:#ffffff;stroke:#d5352a;stroke-width:3"/><text x="407.0" y="415.2" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">8. NP-Completeness</text><text x="407.0" y="432.4" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">1971–1973</text><rect x="760" y="380" width="210" height="76" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="772.0" y="415.2" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">9. Depth-First Search</text><text x="772.0" y="432.4" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">1970–1974</text><rect x="30" y="560" width="210" height="76" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="42.0" y="585.2" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">6. The Relational Model</text><text x="42.0" y="605.0" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">of Data</text><text x="42.0" y="622.3" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">1970</text><rect x="395" y="560" width="210" height="76" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="407.0" y="595.1" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">7. B-Trees</text><text x="407.0" y="612.4" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">1969–1972</text><rect x="760" y="560" width="210" height="76" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="772.0" y="585.2" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">11. Fast String</text><text x="772.0" y="605.0" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Searching</text><text x="772.0" y="622.3" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">1969–1977</text><rect x="760" y="740" width="210" height="76" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="772.0" y="765.2" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">12. Universal</text><text x="772.0" y="785.0" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Compression</text><text x="772.0" y="802.3" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">1977–1978</text></svg>
