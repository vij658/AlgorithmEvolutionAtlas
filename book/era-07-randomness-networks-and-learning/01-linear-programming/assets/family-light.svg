<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" role="img" aria-label="How polynomial-time linear programming combined older ideas, and where it led" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>How polynomial-time linear programming combined older ideas, and where it led</title><line x1="230.0" y1="63.0" x2="395.0" y2="63.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="395.0,63.0 386.8,66.7 386.8,59.3" style="fill:#55545a"/><rect x="265.1" y="42.0" width="94.8" height="19" rx="3" style="fill:#ffffff"/><text x="312.5" y="55.0" text-anchor="middle" style="fill:#17171a;font-size:12.5px;font-weight:600">no guarantee</text><line x1="500.0" y1="106.0" x2="500.0" y2="180.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="500.0,180.0 496.3,171.8 503.7,171.8" style="fill:#55545a"/><line x1="875.0" y1="106.0" x2="573.5" y2="180.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="573.5,180.0 580.6,174.5 582.4,181.6" style="fill:#55545a"/><line x1="500.0" y1="266.0" x2="500.0" y2="340.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="500.0,340.0 496.3,331.8 503.7,331.8" style="fill:#55545a"/><rect x="503.0" y="290.0" width="131.7" height="19" rx="3" style="fill:#ffffff"/><text x="508.0" y="303.0" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">polynomial, but slow</text><line x1="230.0" y1="383.0" x2="395.0" y2="383.0" style="stroke:#55545a;stroke-width:1.5;stroke-dasharray:5 4"/><polygon points="395.0,383.0 386.8,386.7 386.8,379.3" style="fill:#55545a"/><line x1="605.0" y1="383.0" x2="770.0" y2="383.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="770.0,383.0 761.8,386.7 761.8,379.3" style="fill:#55545a"/><line x1="500.0" y1="426.0" x2="500.0" y2="490.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="500.0,490.0 496.3,481.8 503.7,481.8" style="fill:#55545a"/><line x1="875.0" y1="426.0" x2="573.5" y2="490.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="573.5,490.0 580.8,484.7 582.3,491.9" style="fill:#55545a"/><rect x="20" y="20" width="210" height="86" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="32.0" y="43.7" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">The simplex method</text><text x="32.0" y="60.9" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">walk along edges from corner</text><text x="32.0" y="77.4" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">to corner</text><text x="32.0" y="93.9" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">Era 4, topic 11</text><rect x="395" y="20" width="210" height="86" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="407.0" y="43.7" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Klee and Minty&#x27;s cube</text><text x="407.0" y="60.9" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">a squashed cube where every</text><text x="407.0" y="77.4" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">corner is visited</text><text x="407.0" y="93.9" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">1972</text><rect x="770" y="20" width="210" height="86" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="782.0" y="51.9" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">The ellipsoid method</text><text x="782.0" y="69.2" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">Shor; Nemirovski and Yudin</text><text x="782.0" y="85.7" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">1970s, for convex problems</text><rect x="395" y="180" width="210" height="86" style="fill:#ffffff;stroke:#d5352a;stroke-width:3"/><text x="407.0" y="203.7" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Khachiyan&#x27;s algorithm</text><text x="407.0" y="220.9" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">⊕ ellipsoids applied to linear</text><text x="407.0" y="237.4" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">programs: polynomial</text><text x="407.0" y="253.9" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">Moscow, 1979</text><rect x="20" y="340" width="210" height="86" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="32.0" y="363.7" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Dikin&#x27;s affine scaling</text><text x="32.0" y="380.9" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">steps inside, scaled by the</text><text x="32.0" y="397.4" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">distance to each wall</text><text x="32.0" y="413.9" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">1967; rediscovered 1985</text><rect x="395" y="340" width="210" height="86" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="407.0" y="363.7" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Karmarkar&#x27;s method</text><text x="407.0" y="380.9" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">⊕ through the interior:</text><text x="407.0" y="397.4" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">polynomial and fast</text><text x="407.0" y="413.9" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">Bell Labs, 1984</text><rect x="770" y="340" width="210" height="86" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="782.0" y="363.7" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Primal-dual methods</text><text x="782.0" y="380.9" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">⊕ solve the program and its</text><text x="782.0" y="397.4" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">dual together</text><text x="782.0" y="413.9" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">Mehrotra&#x27;s predictor-corrector</text><rect x="395" y="490" width="210" height="86" style="fill:#ffffff;stroke:#1f5ba8;stroke-width:3"/><text x="407.0" y="521.9" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Today</text><text x="407.0" y="539.1" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">&quot;competitive with, and often</text><text x="407.0" y="555.6" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">superior to&quot; simplex codes</text><text x="20.0" y="615.0" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">Today: in the NEOS Guide&#x27;s words. Dashed: Karmarkar&#x27;s later simplification turned out to repeat Dikin&#x27;s 1967 method.</text></svg>
