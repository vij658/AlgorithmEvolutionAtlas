<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 558" width="960" height="558" role="img" aria-label="Each fix leaves a new pain: from one signature to a tree that vouches for anything" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>Each fix leaves a new pain: from one signature to a tree that vouches for anything</title><line x1="400.0" y1="66.0" x2="560.0" y2="66.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="560.0,66.0 551.8,69.7 551.8,62.3" style="fill:#b9b8b2"/><rect x="449.2" y="45.0" width="61.6" height="19" rx="3" style="fill:#0d1117"/><text x="480.0" y="58.0" text-anchor="middle" style="fill:#ecebe6;font-size:12.5px;font-weight:600">fixed by</text><line x1="750.0" y1="112.0" x2="750.0" y2="162.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="750.0,162.0 746.3,153.8 753.7,153.8" style="fill:#b9b8b2"/><rect x="757.0" y="129.0" width="175.9" height="19" rx="3" style="fill:#0d1117"/><text x="762.0" y="142.0" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">which leaves a new problem</text><line x1="560.0" y1="208.0" x2="400.0" y2="208.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="400.0,208.0 408.2,204.3 408.2,211.7" style="fill:#b9b8b2"/><rect x="449.2" y="187.0" width="61.6" height="19" rx="3" style="fill:#0d1117"/><text x="480.0" y="200.0" text-anchor="middle" style="fill:#ecebe6;font-size:12.5px;font-weight:600">fixed by</text><line x1="210.0" y1="254.0" x2="210.0" y2="304.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="210.0,304.0 206.3,295.8 213.7,295.8" style="fill:#b9b8b2"/><line x1="400.0" y1="350.0" x2="560.0" y2="350.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="560.0,350.0 551.8,353.7 551.8,346.3" style="fill:#b9b8b2"/><rect x="449.2" y="329.0" width="61.6" height="19" rx="3" style="fill:#0d1117"/><text x="480.0" y="342.0" text-anchor="middle" style="fill:#ecebe6;font-size:12.5px;font-weight:600">fixed by</text><line x1="750.0" y1="396.0" x2="750.0" y2="446.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="750.0,446.0 746.3,437.8 753.7,437.8" style="fill:#b9b8b2"/><line x1="560.0" y1="492.0" x2="400.0" y2="492.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="400.0,492.0 408.2,488.3 408.2,495.7" style="fill:#b9b8b2"/><rect x="449.2" y="471.0" width="61.6" height="19" rx="3" style="fill:#0d1117"/><text x="480.0" y="484.0" text-anchor="middle" style="fill:#ecebe6;font-size:12.5px;font-weight:600">fixed by</text><rect x="20" y="20" width="380" height="92" style="fill:#0d1117;stroke:#f0584d;stroke-width:3"/><text x="32.0" y="61.7" text-anchor="start" style="fill:#8f8e96;font-size:11px;font-weight:700;letter-spacing:.08em">WHAT HURT</text><text x="32.0" y="77.8" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">A hash-based one-time key signs only one message</text><rect x="560" y="20" width="380" height="92" style="fill:#0d1117;stroke:#5b8fe0;stroke-width:3"/><text x="572.0" y="45.2" text-anchor="start" style="fill:#8f8e96;font-size:11px;font-weight:700;letter-spacing:.08em">THE FIX</text><text x="572.0" y="61.3" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">Merkle: put 2^h one-time public keys under one root;</text><text x="572.0" y="77.8" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">here 64 messages under one 32-byte key</text><text x="572.0" y="94.3" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">Merkle, 1979</text><rect x="560" y="162" width="380" height="92" style="fill:#0d1117;stroke:#f0584d;stroke-width:3"/><text x="572.0" y="195.5" text-anchor="start" style="fill:#8f8e96;font-size:11px;font-weight:700;letter-spacing:.08em">WHAT HURT</text><text x="572.0" y="211.5" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">Checking one block of a big collection needs a</text><text x="572.0" y="228.0" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">fingerprint for every block</text><rect x="20" y="162" width="380" height="92" style="fill:#0d1117;stroke:#5b8fe0;stroke-width:3"/><text x="32.0" y="187.2" text-anchor="start" style="fill:#8f8e96;font-size:11px;font-weight:700;letter-spacing:.08em">THE FIX</text><text x="32.0" y="203.3" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">A proof of log₂ n hashes: 20 for a million blocks, instead</text><text x="32.0" y="219.8" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">of 1,000,000</text><text x="32.0" y="236.3" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">the same tree</text><rect x="20" y="304" width="380" height="92" style="fill:#0d1117;stroke:#f0584d;stroke-width:3"/><text x="32.0" y="345.7" text-anchor="start" style="fill:#8f8e96;font-size:11px;font-weight:700;letter-spacing:.08em">WHAT HURT</text><text x="32.0" y="361.8" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">Two copies of a collection: where do they differ?</text><rect x="560" y="304" width="380" height="92" style="fill:#0d1117;stroke:#5b8fe0;stroke-width:3"/><text x="572.0" y="321.0" text-anchor="start" style="fill:#8f8e96;font-size:11px;font-weight:700;letter-spacing:.08em">THE FIX</text><text x="572.0" y="337.0" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">Compare the roots, then walk down only the halves that</text><text x="572.0" y="353.5" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">differ: 41 comparisons for one change in 1,048,576</text><text x="572.0" y="370.0" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">blocks</text><text x="572.0" y="386.5" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">replicas and file systems</text><rect x="560" y="446" width="380" height="92" style="fill:#0d1117;stroke:#f0584d;stroke-width:3"/><text x="572.0" y="479.5" text-anchor="start" style="fill:#8f8e96;font-size:11px;font-weight:700;letter-spacing:.08em">WHAT HURT</text><text x="572.0" y="495.5" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">Without markers, a different list of leaves can give the</text><text x="572.0" y="512.0" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">same root</text><rect x="20" y="446" width="380" height="92" style="fill:#0d1117;stroke:#5b8fe0;stroke-width:3"/><text x="32.0" y="471.2" text-anchor="start" style="fill:#8f8e96;font-size:11px;font-weight:700;letter-spacing:.08em">THE FIX</text><text x="32.0" y="487.3" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">Prefix 0x00 to leaves and 0x01 to pairs, so a pair can</text><text x="32.0" y="503.8" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">never pass for a leaf</text><text x="32.0" y="520.3" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">Certificate Transparency, 2013</text></svg>
