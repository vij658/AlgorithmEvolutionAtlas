<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 330" width="780" height="330" role="img" aria-label="Two situations that look the same to lieutenant 1" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>Two situations that look the same to lieutenant 1</title><text x="20.0" y="26.0" text-anchor="start" style="fill:#ecebe6;font-size:13px;font-weight:700">Three generals, one traitor: lieutenant 1 sees the same thing in both situations</text><text x="190.0" y="54.0" text-anchor="middle" style="fill:#ecebe6;font-size:13px;font-weight:700">A: the commander is loyal</text><circle cx="190.0" cy="100.0" r="22.0" style="fill:#0d1117;stroke:#ecebe6;stroke-width:2"/><text x="190.0" y="105.0" text-anchor="middle" style="fill:#ecebe6;font-size:13px;font-weight:700">C</text><circle cx="80.0" cy="240.0" r="22.0" style="fill:#0d1117;stroke:#ecebe6;stroke-width:2"/><text x="80.0" y="245.0" text-anchor="middle" style="fill:#ecebe6;font-size:13px;font-weight:700">L1</text><circle cx="300.0" cy="240.0" r="22.0" style="fill:#ecebe6;stroke:#ecebe6;stroke-width:2"/><text x="300.0" y="245.0" text-anchor="middle" style="fill:#0d1117;font-size:13px;font-weight:700">L2</text><text x="300.0" y="280.0" text-anchor="middle" style="fill:#f0584d;font-size:12px;font-weight:700">traitor</text><line x1="173.9" y1="120.4" x2="96.1" y2="219.6" style="stroke:#f0584d;stroke-width:2"/><path d="M96.1,219.6 L98.3,208.6 L106.2,214.8 Z" style="fill:#f0584d"/><text x="110.0" y="160.0" text-anchor="end" style="fill:#f0584d;font-size:12px;font-weight:700">&quot;ATTACK&quot;</text><line x1="206.1" y1="120.4" x2="283.9" y2="219.6" style="stroke:#f0584d;stroke-width:2"/><path d="M283.9,219.6 L273.8,214.8 L281.7,208.6 Z" style="fill:#f0584d"/><text x="270.0" y="160.0" text-anchor="start" style="fill:#f0584d;font-size:12px;font-weight:700">&quot;ATTACK&quot;</text><line x1="274.0" y1="240.0" x2="106.0" y2="240.0" style="stroke:#5b8fe0;stroke-width:2"/><path d="M106.0,240.0 L116.0,235.0 L116.0,245.0 Z" style="fill:#5b8fe0"/><text x="190.0" y="228.0" text-anchor="middle" style="fill:#5b8fe0;font-size:12px;font-weight:700">&quot;he said RETREAT&quot;</text><text x="580.0" y="54.0" text-anchor="middle" style="fill:#ecebe6;font-size:13px;font-weight:700">B: the commander is a traitor</text><circle cx="580.0" cy="100.0" r="22.0" style="fill:#ecebe6;stroke:#ecebe6;stroke-width:2"/><text x="580.0" y="105.0" text-anchor="middle" style="fill:#0d1117;font-size:13px;font-weight:700">C</text><text x="610.0" y="86.0" text-anchor="start" style="fill:#f0584d;font-size:12px;font-weight:700">traitor</text><circle cx="470.0" cy="240.0" r="22.0" style="fill:#0d1117;stroke:#ecebe6;stroke-width:2"/><text x="470.0" y="245.0" text-anchor="middle" style="fill:#ecebe6;font-size:13px;font-weight:700">L1</text><circle cx="690.0" cy="240.0" r="22.0" style="fill:#0d1117;stroke:#ecebe6;stroke-width:2"/><text x="690.0" y="245.0" text-anchor="middle" style="fill:#ecebe6;font-size:13px;font-weight:700">L2</text><line x1="563.9" y1="120.4" x2="486.1" y2="219.6" style="stroke:#f0584d;stroke-width:2"/><path d="M486.1,219.6 L488.3,208.6 L496.2,214.8 Z" style="fill:#f0584d"/><text x="500.0" y="160.0" text-anchor="end" style="fill:#f0584d;font-size:12px;font-weight:700">&quot;ATTACK&quot;</text><line x1="596.1" y1="120.4" x2="673.9" y2="219.6" style="stroke:#5b8fe0;stroke-width:2"/><path d="M673.9,219.6 L663.8,214.8 L671.7,208.6 Z" style="fill:#5b8fe0"/><text x="660.0" y="160.0" text-anchor="start" style="fill:#5b8fe0;font-size:12px;font-weight:700">&quot;RETREAT&quot;</text><line x1="664.0" y1="240.0" x2="496.0" y2="240.0" style="stroke:#5b8fe0;stroke-width:2"/><path d="M496.0,240.0 L506.0,235.0 L506.0,245.0 Z" style="fill:#5b8fe0"/><text x="580.0" y="228.0" text-anchor="middle" style="fill:#5b8fe0;font-size:12px;font-weight:700">&quot;he said RETREAT&quot;</text><line x1="390.0" y1="50.0" x2="390.0" y2="280.0" style="stroke:#41444b;stroke-width:1.2"/><text x="20.0" y="302.0" text-anchor="start" style="fill:#8f8e96;font-size:12px;font-weight:400">In both, L1 hears ATTACK from the commander and &quot;he said RETREAT&quot; from L2. In A it must attack (it must obey a loyal commander),</text><text x="20.0" y="320.0" text-anchor="start" style="fill:#8f8e96;font-size:12px;font-weight:400">so it attacks in B too; by the same reasoning L2 must retreat in B, and the two loyal lieutenants disagree.</text></svg>
