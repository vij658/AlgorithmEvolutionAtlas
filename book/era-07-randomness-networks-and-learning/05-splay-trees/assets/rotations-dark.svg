<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 330" width="780" height="330" role="img" aria-label="Zig-zig and zig-zag rotations" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>Zig-zig and zig-zag rotations</title><text x="20.0" y="26.0" text-anchor="start" style="fill:#ecebe6;font-size:13px;font-weight:700">The two double steps of splaying: x climbs two levels at a time</text><text x="20.0" y="56.0" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:700">Zig-zig: x and its parent p lean the same way</text><line x1="120.0" y1="102.0" x2="80.0" y2="128.0" style="stroke:#41444b;stroke-width:1.4"/><line x1="120.0" y1="102.0" x2="160.0" y2="128.0" style="stroke:#41444b;stroke-width:1.4"/><line x1="80.0" y1="152.0" x2="50.0" y2="178.0" style="stroke:#41444b;stroke-width:1.4"/><line x1="80.0" y1="152.0" x2="110.0" y2="178.0" style="stroke:#41444b;stroke-width:1.4"/><line x1="50.0" y1="202.0" x2="25.0" y2="228.0" style="stroke:#41444b;stroke-width:1.4"/><line x1="50.0" y1="202.0" x2="75.0" y2="228.0" style="stroke:#41444b;stroke-width:1.4"/><circle cx="120.0" cy="90.0" r="13.0" style="fill:#0d1117;stroke:#ecebe6;stroke-width:2"/><text x="120.0" y="95.0" text-anchor="middle" style="fill:#ecebe6;font-size:13px;font-weight:700">g</text><circle cx="80.0" cy="140.0" r="13.0" style="fill:#0d1117;stroke:#ecebe6;stroke-width:2"/><text x="80.0" y="145.0" text-anchor="middle" style="fill:#ecebe6;font-size:13px;font-weight:700">p</text><path d="M160.0,128.0 L147.0,152.0 L173.0,152.0 Z" style="fill:#161b22;stroke:#41444b;stroke-width:1.2"/><text x="160.0" y="148.0" text-anchor="middle" style="fill:#8f8e96;font-size:11px;font-weight:700">D</text><circle cx="50.0" cy="190.0" r="13.0" style="fill:#0d1117;stroke:#f0584d;stroke-width:2"/><text x="50.0" y="195.0" text-anchor="middle" style="fill:#f0584d;font-size:13px;font-weight:700">x</text><path d="M110.0,178.0 L97.0,202.0 L123.0,202.0 Z" style="fill:#161b22;stroke:#41444b;stroke-width:1.2"/><text x="110.0" y="198.0" text-anchor="middle" style="fill:#8f8e96;font-size:11px;font-weight:700">C</text><path d="M25.0,228.0 L12.0,252.0 L38.0,252.0 Z" style="fill:#161b22;stroke:#41444b;stroke-width:1.2"/><text x="25.0" y="248.0" text-anchor="middle" style="fill:#8f8e96;font-size:11px;font-weight:700">A</text><path d="M75.0,228.0 L62.0,252.0 L88.0,252.0 Z" style="fill:#161b22;stroke:#41444b;stroke-width:1.2"/><text x="75.0" y="248.0" text-anchor="middle" style="fill:#8f8e96;font-size:11px;font-weight:700">B</text><text x="205.0" y="175.0" text-anchor="middle" style="fill:#ecebe6;font-size:24px;font-weight:700">→</text><text x="205.0" y="198.0" text-anchor="middle" style="fill:#8f8e96;font-size:11px;font-weight:400">p up, then x up</text><line x1="290.0" y1="102.0" x2="255.0" y2="128.0" style="stroke:#41444b;stroke-width:1.4"/><line x1="290.0" y1="102.0" x2="330.0" y2="128.0" style="stroke:#41444b;stroke-width:1.4"/><line x1="330.0" y1="152.0" x2="300.0" y2="178.0" style="stroke:#41444b;stroke-width:1.4"/><line x1="330.0" y1="152.0" x2="360.0" y2="178.0" style="stroke:#41444b;stroke-width:1.4"/><line x1="360.0" y1="202.0" x2="335.0" y2="228.0" style="stroke:#41444b;stroke-width:1.4"/><line x1="360.0" y1="202.0" x2="385.0" y2="228.0" style="stroke:#41444b;stroke-width:1.4"/><circle cx="290.0" cy="90.0" r="13.0" style="fill:#0d1117;stroke:#f0584d;stroke-width:2"/><text x="290.0" y="95.0" text-anchor="middle" style="fill:#f0584d;font-size:13px;font-weight:700">x</text><path d="M255.0,128.0 L242.0,152.0 L268.0,152.0 Z" style="fill:#161b22;stroke:#41444b;stroke-width:1.2"/><text x="255.0" y="148.0" text-anchor="middle" style="fill:#8f8e96;font-size:11px;font-weight:700">A</text><circle cx="330.0" cy="140.0" r="13.0" style="fill:#0d1117;stroke:#ecebe6;stroke-width:2"/><text x="330.0" y="145.0" text-anchor="middle" style="fill:#ecebe6;font-size:13px;font-weight:700">p</text><path d="M300.0,178.0 L287.0,202.0 L313.0,202.0 Z" style="fill:#161b22;stroke:#41444b;stroke-width:1.2"/><text x="300.0" y="198.0" text-anchor="middle" style="fill:#8f8e96;font-size:11px;font-weight:700">B</text><circle cx="360.0" cy="190.0" r="13.0" style="fill:#0d1117;stroke:#ecebe6;stroke-width:2"/><text x="360.0" y="195.0" text-anchor="middle" style="fill:#ecebe6;font-size:13px;font-weight:700">g</text><path d="M335.0,228.0 L322.0,252.0 L348.0,252.0 Z" style="fill:#161b22;stroke:#41444b;stroke-width:1.2"/><text x="335.0" y="248.0" text-anchor="middle" style="fill:#8f8e96;font-size:11px;font-weight:700">C</text><path d="M385.0,228.0 L372.0,252.0 L398.0,252.0 Z" style="fill:#161b22;stroke:#41444b;stroke-width:1.2"/><text x="385.0" y="248.0" text-anchor="middle" style="fill:#8f8e96;font-size:11px;font-weight:700">D</text><text x="420.0" y="56.0" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:700">Zig-zag: x and p lean opposite ways</text><line x1="520.0" y1="102.0" x2="480.0" y2="128.0" style="stroke:#41444b;stroke-width:1.4"/><line x1="520.0" y1="102.0" x2="560.0" y2="128.0" style="stroke:#41444b;stroke-width:1.4"/><line x1="480.0" y1="152.0" x2="450.0" y2="178.0" style="stroke:#41444b;stroke-width:1.4"/><line x1="480.0" y1="152.0" x2="510.0" y2="178.0" style="stroke:#41444b;stroke-width:1.4"/><line x1="510.0" y1="202.0" x2="485.0" y2="228.0" style="stroke:#41444b;stroke-width:1.4"/><line x1="510.0" y1="202.0" x2="535.0" y2="228.0" style="stroke:#41444b;stroke-width:1.4"/><circle cx="520.0" cy="90.0" r="13.0" style="fill:#0d1117;stroke:#ecebe6;stroke-width:2"/><text x="520.0" y="95.0" text-anchor="middle" style="fill:#ecebe6;font-size:13px;font-weight:700">g</text><circle cx="480.0" cy="140.0" r="13.0" style="fill:#0d1117;stroke:#ecebe6;stroke-width:2"/><text x="480.0" y="145.0" text-anchor="middle" style="fill:#ecebe6;font-size:13px;font-weight:700">p</text><path d="M560.0,128.0 L547.0,152.0 L573.0,152.0 Z" style="fill:#161b22;stroke:#41444b;stroke-width:1.2"/><text x="560.0" y="148.0" text-anchor="middle" style="fill:#8f8e96;font-size:11px;font-weight:700">D</text><path d="M450.0,178.0 L437.0,202.0 L463.0,202.0 Z" style="fill:#161b22;stroke:#41444b;stroke-width:1.2"/><text x="450.0" y="198.0" text-anchor="middle" style="fill:#8f8e96;font-size:11px;font-weight:700">A</text><circle cx="510.0" cy="190.0" r="13.0" style="fill:#0d1117;stroke:#f0584d;stroke-width:2"/><text x="510.0" y="195.0" text-anchor="middle" style="fill:#f0584d;font-size:13px;font-weight:700">x</text><path d="M485.0,228.0 L472.0,252.0 L498.0,252.0 Z" style="fill:#161b22;stroke:#41444b;stroke-width:1.2"/><text x="485.0" y="248.0" text-anchor="middle" style="fill:#8f8e96;font-size:11px;font-weight:700">B</text><path d="M535.0,228.0 L522.0,252.0 L548.0,252.0 Z" style="fill:#161b22;stroke:#41444b;stroke-width:1.2"/><text x="535.0" y="248.0" text-anchor="middle" style="fill:#8f8e96;font-size:11px;font-weight:700">C</text><text x="605.0" y="175.0" text-anchor="middle" style="fill:#ecebe6;font-size:24px;font-weight:700">→</text><text x="605.0" y="198.0" text-anchor="middle" style="fill:#8f8e96;font-size:11px;font-weight:400">x up twice</text><line x1="700.0" y1="122.0" x2="660.0" y2="148.0" style="stroke:#41444b;stroke-width:1.4"/><line x1="700.0" y1="122.0" x2="740.0" y2="148.0" style="stroke:#41444b;stroke-width:1.4"/><line x1="660.0" y1="172.0" x2="635.0" y2="198.0" style="stroke:#41444b;stroke-width:1.4"/><line x1="660.0" y1="172.0" x2="685.0" y2="198.0" style="stroke:#41444b;stroke-width:1.4"/><line x1="740.0" y1="172.0" x2="715.0" y2="198.0" style="stroke:#41444b;stroke-width:1.4"/><line x1="740.0" y1="172.0" x2="765.0" y2="198.0" style="stroke:#41444b;stroke-width:1.4"/><circle cx="700.0" cy="110.0" r="13.0" style="fill:#0d1117;stroke:#f0584d;stroke-width:2"/><text x="700.0" y="115.0" text-anchor="middle" style="fill:#f0584d;font-size:13px;font-weight:700">x</text><circle cx="660.0" cy="160.0" r="13.0" style="fill:#0d1117;stroke:#ecebe6;stroke-width:2"/><text x="660.0" y="165.0" text-anchor="middle" style="fill:#ecebe6;font-size:13px;font-weight:700">p</text><circle cx="740.0" cy="160.0" r="13.0" style="fill:#0d1117;stroke:#ecebe6;stroke-width:2"/><text x="740.0" y="165.0" text-anchor="middle" style="fill:#ecebe6;font-size:13px;font-weight:700">g</text><path d="M635.0,198.0 L622.0,222.0 L648.0,222.0 Z" style="fill:#161b22;stroke:#41444b;stroke-width:1.2"/><text x="635.0" y="218.0" text-anchor="middle" style="fill:#8f8e96;font-size:11px;font-weight:700">A</text><path d="M685.0,198.0 L672.0,222.0 L698.0,222.0 Z" style="fill:#161b22;stroke:#41444b;stroke-width:1.2"/><text x="685.0" y="218.0" text-anchor="middle" style="fill:#8f8e96;font-size:11px;font-weight:700">B</text><path d="M715.0,198.0 L702.0,222.0 L728.0,222.0 Z" style="fill:#161b22;stroke:#41444b;stroke-width:1.2"/><text x="715.0" y="218.0" text-anchor="middle" style="fill:#8f8e96;font-size:11px;font-weight:700">C</text><path d="M765.0,198.0 L752.0,222.0 L778.0,222.0 Z" style="fill:#161b22;stroke:#41444b;stroke-width:1.2"/><text x="765.0" y="218.0" text-anchor="middle" style="fill:#8f8e96;font-size:11px;font-weight:700">D</text><text x="20.0" y="300.0" text-anchor="start" style="fill:#8f8e96;font-size:12px;font-weight:400">A, B, C, D stand for whole subtrees; their order from left to right never changes, so the tree stays a search tree.</text><text x="20.0" y="318.0" text-anchor="start" style="fill:#8f8e96;font-size:12px;font-weight:400">Zig-zig (p before x) is what makes splaying roughly halve the depth of every node on the path; rotating x up alone would not.</text></svg>
