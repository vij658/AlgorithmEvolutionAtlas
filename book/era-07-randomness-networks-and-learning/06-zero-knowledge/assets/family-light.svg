<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" role="img" aria-label="How zero-knowledge proofs combined older ideas, and where they led" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>How zero-knowledge proofs combined older ideas, and where they led</title><line x1="125.0" y1="106.0" x2="125.0" y2="180.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="125.0,180.0 121.3,171.8 128.7,171.8" style="fill:#55545a"/><line x1="437.0" y1="106.0" x2="198.5" y2="180.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="198.5,180.0 205.3,174.1 207.4,181.1" style="fill:#55545a"/><line x1="230.0" y1="223.0" x2="395.0" y2="223.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="395.0,223.0 386.8,226.7 386.8,219.3" style="fill:#55545a"/><line x1="573.5" y1="266.0" x2="833.0" y2="340.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="833.0,340.0 824.1,341.3 826.1,334.2" style="fill:#55545a"/><line x1="875.0" y1="106.0" x2="917.0" y2="340.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="917.0,340.0 911.9,332.6 919.2,331.3" style="fill:#55545a"/><line x1="426.5" y1="266.0" x2="167.0" y2="340.0" style="stroke:#55545a;stroke-width:1.5;stroke-dasharray:5 4"/><polygon points="167.0,340.0 173.9,334.2 175.9,341.3" style="fill:#55545a"/><line x1="500.0" y1="266.0" x2="500.0" y2="490.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="500.0,490.0 496.3,481.8 503.7,481.8" style="fill:#55545a"/><line x1="875.0" y1="426.0" x2="573.5" y2="490.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="573.5,490.0 580.8,484.7 582.3,491.9" style="fill:#55545a"/><rect x="20" y="20" width="210" height="86" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="32.0" y="43.7" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Proofs as certificates</text><text x="32.0" y="60.9" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">NP: a solution anyone can</text><text x="32.0" y="77.4" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">check</text><text x="32.0" y="93.9" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">Era 6, topic 8</text><rect x="395" y="20" width="210" height="86" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="407.0" y="51.9" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Randomness</text><text x="407.0" y="69.2" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">random questions a cheater</text><text x="407.0" y="85.7" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">cannot predict</text><rect x="770" y="20" width="210" height="86" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="782.0" y="51.9" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">One-way functions</text><text x="782.0" y="69.2" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">sealed boxes: commitments</text><text x="782.0" y="85.7" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">Era 6, topic 10</text><rect x="20" y="180" width="210" height="86" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="32.0" y="203.7" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Interactive proofs</text><text x="32.0" y="220.9" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">⊕ a conversation, convincing</text><text x="32.0" y="237.4" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">with high probability</text><text x="32.0" y="253.9" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">Goldwasser and others, 1985</text><rect x="395" y="180" width="210" height="86" style="fill:#ffffff;stroke:#d5352a;stroke-width:3"/><text x="407.0" y="203.7" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Zero knowledge</text><text x="407.0" y="220.9" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">⊕ a simulator could fake the</text><text x="407.0" y="237.4" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">conversation</text><text x="407.0" y="253.9" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">1985</text><rect x="770" y="340" width="210" height="86" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="782.0" y="363.7" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">All of NP</text><text x="782.0" y="380.9" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">⊕ commit to a 3-colouring,</text><text x="782.0" y="397.4" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">open one edge</text><text x="782.0" y="413.9" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">Goldreich and others, 1986</text><rect x="20" y="340" width="210" height="86" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="32.0" y="371.9" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">The Ali Baba cave</text><text x="32.0" y="389.2" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">a story for children</text><text x="32.0" y="405.7" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">Quisquater and others, 1990</text><rect x="395" y="490" width="210" height="86" style="fill:#ffffff;stroke:#1f5ba8;stroke-width:3"/><text x="407.0" y="513.6" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Today</text><text x="407.0" y="530.9" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">cryptographic protocols;</text><text x="407.0" y="547.4" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">private payments in</text><text x="407.0" y="563.9" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">cryptocurrencies (2016)</text><text x="20.0" y="615.0" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">Today: from the ACM&#x27;s 2013 Turing Award announcement and Wikipedia. Dashed: an explanation, not a new algorithm.</text></svg>
