<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 340" width="780" height="340" role="img" aria-label="One round of the zero-knowledge proof of graph isomorphism" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>One round of the zero-knowledge proof of graph isomorphism</title><text x="20.0" y="26.0" text-anchor="start" style="fill:#17171a;font-size:13px;font-weight:700">One round of the graph-isomorphism proof: the prover knows a renaming π with G₁ = π(G₀)</text><rect x="90.0" y="44.0" width="160.0" height="44.0" rx="3" style="fill:#ffffff;stroke:#17171a;stroke-width:1.8"/><text x="170.0" y="63.0" text-anchor="middle" style="fill:#17171a;font-size:14px;font-weight:700">Prover</text><text x="170.0" y="80.0" text-anchor="middle" style="fill:#7d7c84;font-size:11.5px;font-weight:400">knows π</text><line x1="170.0" y1="88.0" x2="170.0" y2="290.0" style="stroke:#c4c3bb;stroke-width:1.4;stroke-dasharray:5 4"/><rect x="530.0" y="44.0" width="160.0" height="44.0" rx="3" style="fill:#ffffff;stroke:#17171a;stroke-width:1.8"/><text x="610.0" y="63.0" text-anchor="middle" style="fill:#17171a;font-size:14px;font-weight:700">Verifier</text><text x="610.0" y="80.0" text-anchor="middle" style="fill:#7d7c84;font-size:11.5px;font-weight:400">knows only G₀ and G₁</text><line x1="610.0" y1="88.0" x2="610.0" y2="290.0" style="stroke:#c4c3bb;stroke-width:1.4;stroke-dasharray:5 4"/><line x1="170.0" y1="130.0" x2="600.0" y2="130.0" style="stroke:#17171a;stroke-width:2"/><path d="M610,130 L599,124.5 L599,135.5 Z" style="fill:#17171a"/><text x="390.0" y="121.0" text-anchor="middle" style="fill:#17171a;font-size:13px;font-weight:700">1. H = σ(G₀) for a fresh random σ</text><text x="390.0" y="148.0" text-anchor="middle" style="fill:#7d7c84;font-size:11.5px;font-weight:400">a random renaming of G₀: it looks like a random copy of either graph</text><line x1="610.0" y1="190.0" x2="180.0" y2="190.0" style="stroke:#1f5ba8;stroke-width:2"/><path d="M170,190 L181,184.5 L181,195.5 Z" style="fill:#1f5ba8"/><text x="390.0" y="181.0" text-anchor="middle" style="fill:#1f5ba8;font-size:13px;font-weight:700">2. a coin α: 0 or 1</text><text x="390.0" y="208.0" text-anchor="middle" style="fill:#7d7c84;font-size:11.5px;font-weight:400">&quot;show me how H comes from G_α&quot;</text><line x1="170.0" y1="250.0" x2="600.0" y2="250.0" style="stroke:#d5352a;stroke-width:2"/><path d="M610,250 L599,244.5 L599,255.5 Z" style="fill:#d5352a"/><text x="390.0" y="241.0" text-anchor="middle" style="fill:#d5352a;font-size:13px;font-weight:700">3. ρ = σ if α = 0, else σ ∘ π⁻¹</text><text x="390.0" y="268.0" text-anchor="middle" style="fill:#7d7c84;font-size:11.5px;font-weight:400">the verifier checks that ρ(G_α) = H</text><text x="20.0" y="312.0" text-anchor="start" style="fill:#7d7c84;font-size:12px;font-weight:400">A cheater with two different graphs can prepare H for only one α.</text><text x="20.0" y="330.0" text-anchor="start" style="fill:#7d7c84;font-size:12px;font-weight:400">In the program it was caught in 0.499 of single rounds, so k rounds leave it 1 chance in 2ᵏ.</text></svg>
