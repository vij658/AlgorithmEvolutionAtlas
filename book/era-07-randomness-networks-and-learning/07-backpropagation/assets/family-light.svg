<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" role="img" aria-label="How backpropagation combined older ideas, and where it led" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>How backpropagation combined older ideas, and where it led</title><line x1="125.0" y1="106.0" x2="426.5" y2="180.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="426.5,180.0 417.6,181.6 419.4,174.5" style="fill:#55545a"/><line x1="500.0" y1="106.0" x2="500.0" y2="180.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="500.0,180.0 496.3,171.8 503.7,171.8" style="fill:#55545a"/><line x1="875.0" y1="106.0" x2="875.0" y2="180.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="875.0,180.0 871.3,171.8 878.7,171.8" style="fill:#55545a"/><line x1="770.0" y1="223.0" x2="605.0" y2="223.0" style="stroke:#55545a;stroke-width:1.5;stroke-dasharray:5 4"/><polygon points="605.0,223.0 613.2,219.3 613.2,226.7" style="fill:#55545a"/><rect x="645.6" y="202.0" width="83.8" height="19" rx="3" style="fill:#ffffff"/><text x="687.5" y="215.0" text-anchor="middle" style="fill:#17171a;font-size:12.5px;font-weight:600">found again</text><line x1="426.5" y1="266.0" x2="125.0" y2="340.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="125.0,340.0 132.1,334.5 133.9,341.6" style="fill:#55545a"/><line x1="500.0" y1="266.0" x2="500.0" y2="490.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="500.0,490.0 496.3,481.8 503.7,481.8" style="fill:#55545a"/><rect x="20" y="20" width="210" height="86" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="32.0" y="43.7" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">The chain rule</text><text x="32.0" y="60.9" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">slopes of a chain of steps</text><text x="32.0" y="77.4" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">multiply</text><text x="32.0" y="93.9" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">calculus</text><rect x="395" y="20" width="210" height="86" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="407.0" y="43.7" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">The perceptron</text><text x="407.0" y="60.9" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">one layer of weights, nudged</text><text x="407.0" y="77.4" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">by errors</text><text x="407.0" y="93.9" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">Era 5, topic 9</text><rect x="770" y="20" width="210" height="86" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="782.0" y="43.7" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Reverse mode</text><text x="782.0" y="60.9" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">all the slopes of a program in</text><text x="782.0" y="77.4" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">one backward pass</text><text x="782.0" y="93.9" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">Linnainmaa, 1970</text><rect x="770" y="180" width="210" height="86" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="782.0" y="203.7" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Applied to networks</text><text x="782.0" y="220.9" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">⊕ the method for neural</text><text x="782.0" y="237.4" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">networks</text><text x="782.0" y="253.9" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">Werbos, 1974 and 1981</text><rect x="395" y="180" width="210" height="86" style="fill:#ffffff;stroke:#d5352a;stroke-width:3"/><text x="407.0" y="203.7" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Backpropagation</text><text x="407.0" y="220.9" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">⊕ hidden units learn their own</text><text x="407.0" y="237.4" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">features</text><text x="407.0" y="253.9" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">Rumelhart, Hinton, Williams, 1986</text><rect x="20" y="340" width="210" height="86" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="32.0" y="371.9" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Multi-layer networks</text><text x="32.0" y="389.2" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">hidden layers solve what one</text><text x="32.0" y="405.7" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">layer cannot, such as XOR</text><rect x="395" y="490" width="210" height="86" style="fill:#ffffff;stroke:#1f5ba8;stroke-width:3"/><text x="407.0" y="521.9" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Today</text><text x="407.0" y="539.1" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">&quot;triggered a boom in neural</text><text x="407.0" y="555.6" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">network research&quot;</text><text x="20.0" y="615.0" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">Today: Wikipedia on the 1986 paper&#x27;s effect. Dashed: the sources differ on who should be credited for what (see the evidence).</text></svg>
