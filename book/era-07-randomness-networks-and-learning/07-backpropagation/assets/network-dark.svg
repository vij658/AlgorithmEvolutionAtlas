<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 330" width="780" height="330" role="img" aria-label="A 2-2-1 network with forward and backward passes" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>A 2-2-1 network with forward and backward passes</title><text x="20.0" y="26.0" text-anchor="start" style="fill:#ecebe6;font-size:13px;font-weight:700">Forward: compute the output. Backward: pass the error&#x27;s slope back through every weight</text><line x1="136.0" y1="110.0" x2="354.0" y2="110.0" style="stroke:#ecebe6;stroke-width:1.6"/><path d="M354.0,110.0 L344.0,105.0 L344.0,115.0 Z" style="fill:#ecebe6"/><line x1="136.0" y1="110.0" x2="354.0" y2="230.0" style="stroke:#ecebe6;stroke-width:1.6"/><path d="M354.0,230.0 L344.0,229.8 L344.0,239.8 Z" style="fill:#ecebe6"/><line x1="136.0" y1="230.0" x2="354.0" y2="110.0" style="stroke:#ecebe6;stroke-width:1.6"/><path d="M354.0,110.0 L344.0,100.2 L344.0,110.2 Z" style="fill:#ecebe6"/><line x1="136.0" y1="230.0" x2="354.0" y2="230.0" style="stroke:#ecebe6;stroke-width:1.6"/><path d="M354.0,230.0 L344.0,225.0 L344.0,235.0 Z" style="fill:#ecebe6"/><line x1="406.0" y1="110.0" x2="614.0" y2="170.0" style="stroke:#ecebe6;stroke-width:1.6"/><path d="M614.0,170.0 L604.0,167.4 L604.0,177.4 Z" style="fill:#ecebe6"/><line x1="406.0" y1="230.0" x2="614.0" y2="170.0" style="stroke:#ecebe6;stroke-width:1.6"/><path d="M614.0,170.0 L604.0,162.6 L604.0,172.6 Z" style="fill:#ecebe6"/><path d="M614.0,154.0 Q510.0,94.0 406.0,94.0" style="fill:none;stroke:#f0584d;stroke-width:1.8;stroke-dasharray:6 4"/><path d="M406.0,94.0 L416.0,89.0 L416.0,99.0 Z" style="fill:#f0584d"/><path d="M614.0,154.0 Q510.0,154.0 406.0,214.0" style="fill:none;stroke:#f0584d;stroke-width:1.8;stroke-dasharray:6 4"/><path d="M406.0,214.0 L412.2,204.7 L417.2,213.3 Z" style="fill:#f0584d"/><path d="M354.0,94.0 Q245.0,64.0 136.0,94.0" style="fill:none;stroke:#f0584d;stroke-width:1.8;stroke-dasharray:6 4"/><path d="M136.0,94.0 L144.3,86.5 L147.0,96.2 Z" style="fill:#f0584d"/><path d="M354.0,214.0 Q245.0,184.0 136.0,214.0" style="fill:none;stroke:#f0584d;stroke-width:1.8;stroke-dasharray:6 4"/><path d="M136.0,214.0 L144.3,206.5 L147.0,216.2 Z" style="fill:#f0584d"/><circle cx="110.0" cy="110.0" r="26.0" style="fill:#0d1117;stroke:#ecebe6;stroke-width:2"/><text x="110.0" y="115.0" text-anchor="middle" style="fill:#ecebe6;font-size:15px;font-weight:700">x₁</text><circle cx="110.0" cy="230.0" r="26.0" style="fill:#0d1117;stroke:#ecebe6;stroke-width:2"/><text x="110.0" y="235.0" text-anchor="middle" style="fill:#ecebe6;font-size:15px;font-weight:700">x₂</text><circle cx="380.0" cy="110.0" r="26.0" style="fill:#0d1117;stroke:#ecebe6;stroke-width:2"/><text x="380.0" y="115.0" text-anchor="middle" style="fill:#ecebe6;font-size:15px;font-weight:700">h₁</text><circle cx="380.0" cy="230.0" r="26.0" style="fill:#0d1117;stroke:#ecebe6;stroke-width:2"/><text x="380.0" y="235.0" text-anchor="middle" style="fill:#ecebe6;font-size:15px;font-weight:700">h₂</text><circle cx="640.0" cy="170.0" r="26.0" style="fill:#0d1117;stroke:#f0584d;stroke-width:2"/><text x="640.0" y="175.0" text-anchor="middle" style="fill:#ecebe6;font-size:15px;font-weight:700">y</text><text x="110.0" y="285.0" text-anchor="middle" style="fill:#8f8e96;font-size:12px;font-weight:400">inputs</text><text x="380.0" y="285.0" text-anchor="middle" style="fill:#8f8e96;font-size:12px;font-weight:400">hidden units</text><text x="640.0" y="230.0" text-anchor="middle" style="fill:#8f8e96;font-size:12px;font-weight:400">output</text><text x="510.0" y="70.0" text-anchor="middle" style="fill:#f0584d;font-size:12.5px;font-weight:700">δ_y = (y − target) · y(1 − y)</text><text x="245.0" y="70.0" text-anchor="middle" style="fill:#f0584d;font-size:12.5px;font-weight:700">δ_h = δ_y · v_h · h(1 − h)</text><text x="20.0" y="320.0" text-anchor="start" style="fill:#8f8e96;font-size:12px;font-weight:400">Each weight&#x27;s slope is δ of the unit it feeds times