<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 416" width="960" height="416" role="img" aria-label="Each fix leaves a new pain: from every pair to a tree of summaries" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>Each fix leaves a new pain: from every pair to a tree of summaries</title><line x1="400.0" y1="66.0" x2="560.0" y2="66.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="560.0,66.0 551.8,69.7 551.8,62.3" style="fill:#b9b8b2"/><rect x="449.2" y="45.0" width="61.6" height="19" rx="3" style="fill:#0d1117"/><text x="480.0" y="58.0" text-anchor="middle" style="fill:#ecebe6;font-size:12.5px;font-weight:600">fixed by</text><line x1="750.0" y1="112.0" x2="750.0" y2="162.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="750.0,162.0 746.3,153.8 753.7,153.8" style="fill:#b9b8b2"/><rect x="757.0" y="129.0" width="175.9" height="19" rx="3" style="fill:#0d1117"/><text x="762.0" y="142.0" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">which leaves a new problem</text><line x1="560.0" y1="208.0" x2="400.0" y2="208.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="400.0,208.0 408.2,204.3 408.2,211.7" style="fill:#b9b8b2"/><rect x="449.2" y="187.0" width="61.6" height="19" rx="3" style="fill:#0d1117"/><text x="480.0" y="200.0" text-anchor="middle" style="fill:#ecebe6;font-size:12.5px;font-weight:600">fixed by</text><line x1="210.0" y1="254.0" x2="210.0" y2="304.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="210.0,304.0 206.3,295.8 213.7,295.8" style="fill:#b9b8b2"/><line x1="400.0" y1="350.0" x2="560.0" y2="350.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="560.0,350.0 551.8,353.7 551.8,346.3" style="fill:#b9b8b2"/><rect x="449.2" y="329.0" width="61.6" height="19" rx="3" style="fill:#0d1117"/><text x="480.0" y="342.0" text-anchor="middle" style="fill:#ecebe6;font-size:12.5px;font-weight:600">fixed by</text><rect x="20" y="20" width="380" height="92" style="fill:#0d1117;stroke:#f0584d;stroke-width:3"/><text x="32.0" y="53.5" text-anchor="start" style="fill:#8f8e96;font-size:11px;font-weight:700;letter-spacing:.08em">WHAT HURT</text><text x="32.0" y="69.5" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">Direct gravity takes N(N − 1) interactions: 9,999,900,000</text><text x="32.0" y="86.0" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">for 100,000 stars, every time step</text><rect x="560" y="20" width="380" height="92" style="fill:#0d1117;stroke:#5b8fe0;stroke-width:3"/><text x="572.0" y="45.2" text-anchor="start" style="fill:#8f8e96;font-size:11px;font-weight:700;letter-spacing:.08em">THE FIX</text><text x="572.0" y="61.3" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">A tree of cubes, distant cubes felt as one mass:</text><text x="572.0" y="77.8" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">147,046,262, 68 times fewer</text><text x="572.0" y="94.3" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">Barnes and Hut, 1986</text><rect x="560" y="162" width="380" height="92" style="fill:#0d1117;stroke:#f0584d;stroke-width:3"/><text x="572.0" y="195.5" text-anchor="start" style="fill:#8f8e96;font-size:11px;font-weight:700;letter-spacing:.08em">WHAT HURT</text><text x="572.0" y="211.5" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">An approximation has an error, and no single error suits</text><text x="572.0" y="228.0" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">every problem</text><rect x="20" y="162" width="380" height="92" style="fill:#0d1117;stroke:#5b8fe0;stroke-width:3"/><text x="32.0" y="187.2" text-anchor="start" style="fill:#8f8e96;font-size:11px;font-weight:700;letter-spacing:.08em">THE FIX</text><text x="32.0" y="203.3" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">One knob, θ: at θ = 0.5 the median force error was</text><text x="32.0" y="219.8" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">0.1735%; θ = 0 gives the exact sum</text><text x="32.0" y="236.3" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">the opening angle</text><rect x="20" y="304" width="380" height="92" style="fill:#0d1117;stroke:#f0584d;stroke-width:3"/><text x="32.0" y="345.7" text-anchor="start" style="fill:#8f8e96;font-size:11px;font-weight:700;letter-spacing:.08em">WHAT HURT</text><text x="32.0" y="361.8" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">Still N log N, and &quot;Good for low accuracy calculations&quot;</text><rect x="560" y="304" width="380" height="92" style="fill:#0d1117;stroke:#5b8fe0;stroke-width:3"/><text x="572.0" y="329.2" text-anchor="start" style="fill:#8f8e96;font-size:11px;font-weight:700;letter-spacing:.08em">THE FIX</text><text x="572.0" y="345.3" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">The fast multipole method: O(N), with more information</text><text x="572.0" y="361.8" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">per box for more accuracy</text><text x="572.0" y="378.3" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">Greengard and Rokhlin, 1987</text></svg>
