<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" role="img" aria-label="The Barnes-Hut opening criterion" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>The Barnes-Hut opening criterion</title><text x="20.0" y="26.0" text-anchor="start" style="fill:#17171a;font-size:13px;font-weight:700">The opening test: seen from the star, does the cube look small?</text><circle cx="110.0" cy="170.0" r="8.0" style="fill:#d5352a"/><text x="110.0" y="198.0" text-anchor="middle" style="fill:#d5352a;font-size:12px;font-weight:700">the star</text><rect x="490.0" y="80.0" width="140.0" height="140.0" rx="0" style="fill:#f4f3ee;stroke:#17171a;stroke-width:1.8"/><circle cx="520.0" cy="110.0" r="3.5" style="fill:#17171a"/><circle cx="545.0" cy="175.0" r="3.5" style="fill:#17171a"/><circle cx="590.0" cy="125.0" r="3.5" style="fill:#17171a"/><circle cx="600.0" cy="190.0" r="3.5" style="fill:#17171a"/><circle cx="530.0" cy="200.0" r="3.5" style="fill:#17171a"/><circle cx="575.0" cy="150.0" r="3.5" style="fill:#17171a"/><circle cx="610.0" cy="105.0" r="3.5" style="fill:#17171a"/><circle cx="567.1" cy="150.7" r="6.0" style="fill:#1f5ba8"/><text x="577.1" y="142.7" text-anchor="start" style="fill:#1f5ba8;font-size:12px;font-weight:700">centre of mass</text><line x1="120.0" y1="170.0" x2="559.1" y2="150.7" style="stroke:#c4c3bb;stroke-width:1.4;stroke-dasharray:5 4"/><text x="338.6" y="150.4" text-anchor="middle" style="fill:#17171a;font-size:15px;font-weight:700">d</text><line x1="490.0" y1="238.0" x2="630.0" y2="238.0" style="stroke:#17171a;stroke-width:1.4"/><line x1="490.0" y1="232.0" x2="490.0" y2="244.0" style="stroke:#17171a;stroke-width:1.4"/><line x1="630.0" y1="232.0" x2="630.0" y2="244.0" style="stroke:#17171a;stroke-width:1.4"/><text x="560.0" y="258.0" text-anchor="middle" style="fill:#17171a;font-size:15px;font-weight:700">s</text><text x="20.0" y="310.0" text-anchor="start" style="fill:#7d7c84;font-size:12px;font-weight:400">If s / d &lt; θ, the star feels the cube as one point with the cube&#x27;s total mass at its centre of mass.</text><text x="20.0" y="328.0" text-anchor="start" style="fill:#7d7c84;font-size:12px;font-weight:400">If not, the cube is opened and its eight smaller cubes are tested the same way. θ = 0 opens everything: the exact sum.</text></svg>
