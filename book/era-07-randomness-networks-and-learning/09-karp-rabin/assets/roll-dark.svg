<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 290" width="780" height="290" role="img" aria-label="Rolling a fingerprint one place to the right" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>Rolling a fingerprint one place to the right</title><text x="20.0" y="26.0" text-anchor="start" style="fill:#ecebe6;font-size:13px;font-weight:700">Rolling: the next window&#x27;s fingerprint from the last one, in a few steps</text><rect x="90.0" y="70.0" width="52.0" height="40.0" rx="3" style="fill:#0d1117;stroke:#41444b;stroke-width:1.2"/><text x="116.0" y="96.0" text-anchor="middle" style="fill:#ecebe6;font-size:16px;font-weight:700">G</text><rect x="146.0" y="70.0" width="52.0" height="40.0" rx="3" style="fill:#0d1117;stroke:#41444b;stroke-width:1.2"/><text x="172.0" y="96.0" text-anchor="middle" style="fill:#ecebe6;font-size:16px;font-weight:700">A</text><rect x="202.0" y="70.0" width="52.0" height="40.0" rx="3" style="fill:#0d1117;stroke:#41444b;stroke-width:1.2"/><text x="228.0" y="96.0" text-anchor="middle" style="fill:#ecebe6;font-size:16px;font-weight:700">T</text><rect x="258.0" y="70.0" width="52.0" height="40.0" rx="3" style="fill:#0d1117;stroke:#41444b;stroke-width:1.2"/><text x="284.0" y="96.0" text-anchor="middle" style="fill:#ecebe6;font-size:16px;font-weight:700">T</text><rect x="314.0" y="70.0" width="52.0" height="40.0" rx="3" style="fill:#0d1117;stroke:#41444b;stroke-width:1.2"/><text x="340.0" y="96.0" text-anchor="middle" style="fill:#ecebe6;font-size:16px;font-weight:700">A</text><rect x="370.0" y="70.0" width="52.0" height="40.0" rx="3" style="fill:#0d1117;stroke:#41444b;stroke-width:1.2"/><text x="396.0" y="96.0" text-anchor="middle" style="fill:#ecebe6;font-size:16px;font-weight:700">C</text><rect x="426.0" y="70.0" width="52.0" height="40.0" rx="3" style="fill:#0d1117;stroke:#41444b;stroke-width:1.2"/><text x="452.0" y="96.0" text-anchor="middle" style="fill:#ecebe6;font-size:16px;font-weight:700">A</text><rect x="482.0" y="70.0" width="52.0" height="40.0" rx="3" style="fill:#0d1117;stroke:#41444b;stroke-width:1.2"/><text x="508.0" y="96.0" text-anchor="middle" style="fill:#ecebe6;font-size:16px;font-weight:700">G</text><rect x="538.0" y="70.0" width="52.0" height="40.0" rx="3" style="fill:#0d1117;stroke:#41444b;stroke-width:1.2"/><text x="564.0" y="96.0" text-anchor="middle" style="fill:#ecebe6;font-size:16px;font-weight:700">C</text><line x1="146.0" y1="62.0" x2="422.0" y2="62.0" style="stroke:#5b8fe0;stroke-width:2.5"/><line x1="146.0" y1="62.0" x2="146.0" y2="70.0" style="stroke:#5b8fe0;stroke-width:2.5"/><line x1="422.0" y1="62.0" x2="422.0" y2="70.0" style="stroke:#5b8fe0;stroke-width:2.5"/><text x="284.0" y="54.0" text-anchor="middle" style="fill:#5b8fe0;font-size:12px;font-weight:700">window i</text><line x1="202.0" y1="118.0" x2="478.0" y2="118.0" style="stroke:#f0584d;stroke-width:2.5"/><line x1="202.0" y1="118.0" x2="202.0" y2="110.0" style="stroke:#f0584d;stroke-width:2.5"/><line x1="478.0" y1="118.0" x2="478.0" y2="110.0" style="stroke:#f0584d;stroke-width:2.5"/><text x="340.0" y="136.0" text-anchor="middle" style="fill:#f0584d;font-size:12px;font-weight:700">window i + 1</text><text x="90.0" y="180.0" text-anchor="start" style="fill:#ecebe6;font-size:13px;font-weight:700">1. Drop the first letter:</text><text x="330.0" y="180.0" text-anchor="start" style="fill:#f0584d;font-size:13.5px;font-weight:700">h − c_out · B^(m−1)</text><text x="90.0" y="202.0" text-anchor="start" style="fill:#ecebe6;font-size:13px;font-weight:700">2. Shift one place:</text><text x="330.0" y="202.0" text-anchor="start" style="fill:#f0584d;font-size:13.5px;font-weight:700">× B</text><text x="90.0" y="224.0" text-anchor="start" style="fill:#ecebe6;font-size:13px;font-weight:700">3. Bring in the new letter:</text><text x="330.0" y="224.0" text-anchor="start" style="fill:#f0584d;font-size:13.5px;font-weight:700">+ c_in</text><text x="90.0" y="246.0" text-anchor="start" style="fill:#ecebe6;font-size:13px;font-weight:700">4. Keep it small:</text><text x="330.0" y="246.0" text-anchor="start" style="fill:#f0584d;font-size:13.5px;font-weight:700">mod p</text><text x="20.0" y="282.0" text-anchor="start" style="fill:#8f8e96;font-size:12px;font-weight:400">B is the number of letters in the alphabet (4 for A, C, G, T); m is the pattern&#x27;s length; p is a prime chosen at random.</text></svg>
