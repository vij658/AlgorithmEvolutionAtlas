<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 416" width="960" height="416" role="img" aria-label="Each fix leaves a new pain: from factoring to periods to a machine not yet built" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>Each fix leaves a new pain: from factoring to periods to a machine not yet built</title><line x1="400.0" y1="66.0" x2="560.0" y2="66.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="560.0,66.0 551.8,69.7 551.8,62.3" style="fill:#b9b8b2"/><rect x="436.3" y="45.0" width="87.4" height="19" rx="3" style="fill:#0d1117"/><text x="480.0" y="58.0" text-anchor="middle" style="fill:#ecebe6;font-size:12.5px;font-weight:600">answered by</text><line x1="750.0" y1="112.0" x2="750.0" y2="162.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="750.0,162.0 746.3,153.8 753.7,153.8" style="fill:#b9b8b2"/><rect x="757.0" y="129.0" width="175.9" height="19" rx="3" style="fill:#0d1117"/><text x="762.0" y="142.0" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">which leaves a new problem</text><line x1="560.0" y1="208.0" x2="400.0" y2="208.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="400.0,208.0 408.2,204.3 408.2,211.7" style="fill:#b9b8b2"/><rect x="436.3" y="187.0" width="87.4" height="19" rx="3" style="fill:#0d1117"/><text x="480.0" y="200.0" text-anchor="middle" style="fill:#ecebe6;font-size:12.5px;font-weight:600">answered by</text><line x1="210.0" y1="254.0" x2="210.0" y2="304.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="210.0,304.0 206.3,295.8 213.7,295.8" style="fill:#b9b8b2"/><line x1="400.0" y1="350.0" x2="560.0" y2="350.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="560.0,350.0 551.8,353.7 551.8,346.3" style="fill:#b9b8b2"/><rect x="436.3" y="329.0" width="87.4" height="19" rx="3" style="fill:#0d1117"/><text x="480.0" y="342.0" text-anchor="middle" style="fill:#ecebe6;font-size:12.5px;font-weight:600">answered by</text><rect x="20" y="20" width="380" height="92" style="fill:#0d1117;stroke:#f0584d;stroke-width:3"/><text x="32.0" y="53.5" text-anchor="start" style="fill:#8f8e96;font-size:11px;font-weight:700;letter-spacing:.08em">WHAT HURT</text><text x="32.0" y="69.5" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">RSA&#x27;s security rests on factoring, and every known</text><text x="32.0" y="86.0" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">classical method takes superpolynomial time</text><rect x="560" y="20" width="380" height="92" style="fill:#0d1117;stroke:#5b8fe0;stroke-width:3"/><text x="572.0" y="45.2" text-anchor="start" style="fill:#8f8e96;font-size:11px;font-weight:700;letter-spacing:.08em">THE FIX</text><text x="572.0" y="61.3" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">Factoring reduces to finding a period: for every N</text><text x="572.0" y="77.8" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">tried, at least 50% of the choices of a split N</text><text x="572.0" y="94.3" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">the classical half of Shor&#x27;s algorithm</text><rect x="560" y="162" width="380" height="92" style="fill:#0d1117;stroke:#f0584d;stroke-width:3"/><text x="572.0" y="195.5" text-anchor="start" style="fill:#8f8e96;font-size:11px;font-weight:700;letter-spacing:.08em">WHAT HURT</text><text x="572.0" y="211.5" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">Finding the period is itself hard for an ordinary</text><text x="572.0" y="228.0" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">computer</text><rect x="20" y="162" width="380" height="92" style="fill:#0d1117;stroke:#5b8fe0;stroke-width:3"/><text x="32.0" y="187.2" text-anchor="start" style="fill:#8f8e96;font-size:11px;font-weight:700;letter-spacing:.08em">THE FIX</text><text x="32.0" y="203.3" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">A quantum Fourier transform piles the probability onto</text><text x="32.0" y="219.8" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">multiples of Q/r: 0.250 on each of 4 peaks for N = 15</text><text x="32.0" y="236.3" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">Shor, 1994</text><rect x="20" y="304" width="380" height="92" style="fill:#0d1117;stroke:#f0584d;stroke-width:3"/><text x="32.0" y="337.5" text-anchor="start" style="fill:#8f8e96;font-size:11px;font-weight:700;letter-spacing:.08em">WHAT HURT</text><text x="32.0" y="353.5" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">Simulating it classically needs 2^4,096 amplitudes for a</text><text x="32.0" y="370.0" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">2,048-bit N</text><rect x="560" y="304" width="380" height="92" style="fill:#0d1117;stroke:#5b8fe0;stroke-width:3"/><text x="572.0" y="329.2" text-anchor="start" style="fill:#8f8e96;font-size:11px;font-weight:700;letter-spacing:.08em">THE FIX</text><text x="572.0" y="345.3" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">Build the quantum computer: 15 was factored in 2001; a</text><text x="572.0" y="361.8" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">2025 estimate puts RSA-2048 under a million noisy qubits</text><text x="572.0" y="378.3" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">the step that remains</text></svg>
