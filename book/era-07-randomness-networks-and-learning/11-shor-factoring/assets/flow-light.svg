<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 250" width="780" height="250" role="img" aria-label="Shor&#x27;s algorithm as a pipeline" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>Shor&#x27;s algorithm as a pipeline</title><text x="20.0" y="26.0" text-anchor="start" style="fill:#17171a;font-size:13px;font-weight:700">Factoring N: only the middle step needs a quantum computer</text><rect x="20.0" y="70.0" width="160.0" height="96.0" rx="3" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="30.0" y="96.0" text-anchor="start" style="fill:#17171a;font-size:13px;font-weight:700">Pick a at random</text><text x="30.0" y="118.0" text-anchor="start" style="fill:#17171a;font-size:12px;font-weight:400">if gcd(a, N) &gt; 1,</text><text x="30.0" y="134.0" text-anchor="start" style="fill:#17171a;font-size:12px;font-weight:400">done</text><line x1="183.0" y1="118.0" x2="205.0" y2="118.0" style="stroke:#17171a;stroke-width:1.6"/><path d="M207,118 L198,113 L198,123 Z" style="fill:#17171a"/><rect x="210.0" y="70.0" width="160.0" height="96.0" rx="3" style="fill:#ffffff;stroke:#d5352a;stroke-width:2.2"/><text x="220.0" y="96.0" text-anchor="start" style="fill:#d5352a;font-size:13px;font-weight:700">Find the period r</text><text x="220.0" y="118.0" text-anchor="start" style="fill:#17171a;font-size:12px;font-weight:400">a^r ≡ 1 (mod N), by a</text><text x="220.0" y="134.0" text-anchor="start" style="fill:#17171a;font-size:12px;font-weight:400">quantum Fourier</text><text x="220.0" y="150.0" text-anchor="start" style="fill:#17171a;font-size:12px;font-weight:400">transform</text><line x1="373.0" y1="118.0" x2="395.0" y2="118.0" style="stroke:#17171a;stroke-width:1.6"/><path d="M397,118 L388,113 L388,123 Z" style="fill:#17171a"/><rect x="400.0" y="70.0" width="160.0" height="96.0" rx="3" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="410.0" y="96.0" text-anchor="start" style="fill:#17171a;font-size:13px;font-weight:700">If r is even, compute</text><text x="410.0" y="118.0" text-anchor="start" style="fill:#17171a;font-size:12px;font-weight:400">gcd(a^(r/2) − 1, N)</text><line x1="563.0" y1="118.0" x2="585.0" y2="118.0" style="stroke:#17171a;stroke-width:1.6"/><path d="M587,118 L578,113 L578,123 Z" style="fill:#17171a"/><rect x="590.0" y="70.0" width="160.0" height="96.0" rx="3" style="fill:#ffffff;stroke:#1f5ba8;stroke-width:2.2"/><text x="600.0" y="96.0" text-anchor="start" style="fill:#1f5ba8;font-size:13px;font-weight:700">A factor of N</text><text x="600.0" y="118.0" text-anchor="start" style="fill:#17171a;font-size:12px;font-weight:400">for at least half of</text><text x="600.0" y="134.0" text-anchor="start" style="fill:#17171a;font-size:12px;font-weight:400">all a</text><text x="290.0" y="190.0" text-anchor="middle" style="fill:#d5352a;font-size:12px;font-weight:700">quantum</text><text x="100.0" y="190.0" text-anchor="middle" style="fill:#7d7c84;font-size:12px;font-weight:400">classical</text><text x="480.0" y="190.0" text-anchor="middle" style="fill:#7d7c84;font-size:12px;font-weight:400">classical (Euclid, Era 1)</text><text x="20.0" y="240.0" text-anchor="start" style="fill:#7d7c84;font-size:12px;font-weight:400">If r is odd, or a^(r/2) ≡ −1 (mod N), pick another a and try again.</text></svg>
