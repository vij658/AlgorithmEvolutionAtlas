<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" role="img" aria-label="How the Burrows–Wheeler transform combined older ideas, and where it led" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>How the Burrows–Wheeler transform combined older ideas, and where it led</title><line x1="125.0" y1="106.0" x2="426.5" y2="180.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="426.5,180.0 417.6,181.6 419.4,174.5" style="fill:#b9b8b2"/><line x1="500.0" y1="106.0" x2="500.0" y2="180.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="500.0,180.0 496.3,171.8 503.7,171.8" style="fill:#b9b8b2"/><line x1="875.0" y1="106.0" x2="573.5" y2="180.0" style="stroke:#b9b8b2;stroke-width:1.5;stroke-dasharray:5 4"/><polygon points="573.5,180.0 580.6,174.5 582.4,181.6" style="fill:#b9b8b2"/><rect x="727.2" y="130.0" width="146.4" height="19" rx="3" style="fill:#0d1117"/><text x="732.2" y="143.0" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">what it competed with</text><line x1="426.5" y1="266.0" x2="125.0" y2="340.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="125.0,340.0 132.1,334.5 133.9,341.6" style="fill:#b9b8b2"/><line x1="573.5" y1="266.0" x2="875.0" y2="340.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="875.0,340.0 866.1,341.6 867.9,334.5" style="fill:#b9b8b2"/><line x1="875.0" y1="426.0" x2="573.5" y2="490.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="573.5,490.0 580.8,484.7 582.3,491.9" style="fill:#b9b8b2"/><rect x="20" y="20" width="210" height="86" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="32.0" y="51.9" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Sorting</text><text x="32.0" y="69.2" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">put the rotations in order</text><text x="32.0" y="85.7" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">Eras 4 and 5</text><rect x="395" y="20" width="210" height="86" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="407.0" y="51.9" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Move-to-front</text><text x="407.0" y="69.2" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">recent letters get small</text><text x="407.0" y="85.7" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">numbers</text><rect x="770" y="20" width="210" height="86" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="782.0" y="43.7" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Huffman and Lempel–Ziv</text><text x="782.0" y="60.9" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">short codes; pointers to</text><text x="782.0" y="77.4" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">earlier copies</text><text x="782.0" y="93.9" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">Eras 5 and 6</text><rect x="395" y="180" width="210" height="86" style="fill:#0d1117;stroke:#f0584d;stroke-width:3"/><text x="407.0" y="203.7" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Block sorting</text><text x="407.0" y="220.9" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">⊕ keep the last column: similar</text><text x="407.0" y="237.4" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">contexts side by side</text><text x="407.0" y="253.9" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">Wheeler 1983; report 1994</text><rect x="20" y="340" width="210" height="86" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="32.0" y="371.9" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">bzip2</text><text x="32.0" y="389.2" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">a widely used compressor</text><text x="32.0" y="405.7" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">built on it</text><rect x="770" y="340" width="210" height="86" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="782.0" y="363.7" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">The FM index</text><text x="782.0" y="380.9" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">⊕ count and find patterns</text><text x="782.0" y="397.4" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">from the last column</text><text x="782.0" y="413.9" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">Ferragina and Manzini, 2000</text><rect x="395" y="490" width="210" height="86" style="fill:#0d1117;stroke:#5b8fe0;stroke-width:3"/><text x="407.0" y="521.9" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Today</text><text x="407.0" y="539.1" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">Bowtie, BWA and SOAP2 align</text><text x="407.0" y="555.6" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">DNA reads to genomes</text><text x="20.0" y="615.0" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">Today: alignment programs Wikipedia names as using the transform. Dashed: the methods it was measured against.</text></svg>
