<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320" role="img" aria-label="Training error, test error and the bound against rounds" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>Training error, test error and the bound against rounds</title><text x="20.0" y="26.0" text-anchor="start" style="fill:#17171a;font-size:13px;font-weight:700">The circle: errors as rounds are added, with Freund and Schapire&#x27;s bound on the training error</text><line x1="70.0" y1="250.0" x2="720.0" y2="250.0" style="stroke:#c4c3bb;stroke-width:1.2"/><line x1="70.0" y1="250.0" x2="70.0" y2="50.0" style="stroke:#c4c3bb;stroke-width:1.2"/><text x="62.0" y="254.0" text-anchor="end" style="fill:#7d7c84;font-size:11.5px;font-weight:400">0%</text><line x1="66.0" y1="250.0" x2="70.0" y2="250.0" style="stroke:#c4c3bb;stroke-width:1.2"/><text x="62.0" y="204.0" text-anchor="end" style="fill:#7d7c84;font-size:11.5px;font-weight:400">25%</text><line x1="66.0" y1="200.0" x2="70.0" y2="200.0" style="stroke:#c4c3bb;stroke-width:1.2"/><text x="62.0" y="154.0" text-anchor="end" style="fill:#7d7c84;font-size:11.5px;font-weight:400">50%</text><line x1="66.0" y1="150.0" x2="70.0" y2="150.0" style="stroke:#c4c3bb;stroke-width:1.2"/><text x="62.0" y="104.0" text-anchor="end" style="fill:#7d7c84;font-size:11.5px;font-weight:400">75%</text><line x1="66.0" y1="100.0" x2="70.0" y2="100.0" style="stroke:#c4c3bb;stroke-width:1.2"/><text x="62.0" y="54.0" text-anchor="end" style="fill:#7d7c84;font-size:11.5px;font-weight:400">100%</text><line x1="66.0" y1="50.0" x2="70.0" y2="50.0" style="stroke:#c4c3bb;stroke-width:1.2"/><text x="70.0" y="268.0" text-anchor="middle" style="fill:#7d7c84;font-size:11.5px;font-weight:400">1</text><text x="142.5" y="268.0" text-anchor="middle" style="fill:#7d7c84;font-size:11.5px;font-weight:400">2</text><text x="238.3" y="268.0" text-anchor="middle" style="fill:#7d7c84;font-size:11.5px;font-weight:400">5</text><text x="310.8" y="268.0" text-anchor="middle" style="fill:#7d7c84;font-size:11.5px;font-weight:400">10</text><text x="383.3" y="268.0" text-anchor="middle" style="fill:#7d7c84;font-size:11.5px;font-weight:400">20</text><text x="479.2" y="268.0" text-anchor="middle" style="fill:#7d7c84;font-size:11.5px;font-weight:400">50</text><text x="551.7" y="268.0" text-anchor="middle" style="fill:#7d7c84;font-size:11.5px;font-weight:400">100</text><text x="624.2" y="268.0" text-anchor="middle" style="fill:#7d7c84;font-size:11.5px;font-weight:400">200</text><text x="720.0" y="268.0" text-anchor="middle" style="fill:#7d7c84;font-size:11.5px;font-weight:400">500</text><text x="395.0" y="290.0" text-anchor="middle" style="fill:#7d7c84;font-size:12px;font-weight:400">rounds (one stump each), on a log scale</text><path d="M70.0,54.2 L142.5,63.8 L238.3,87.4 L310.8,116.8 L383.3,154.6 L479.2,196.6 L551.7,220.0 L624.2,234.4 L720.0,244.4" style="fill:none;stroke:#7d7c84;stroke-width:2.2;stroke-dasharray:6 4"/><text x="316.8" y="106.8" text-anchor="start" style="fill:#7d7c84;font-size:12px;font-weight:700">bound</text><path d="M70.0,170.6 L142.5,167.2 L238.3,219.4 L310.8,221.0 L383.3,242.6 L479.2,244.2 L551.7,247.4 L624.2,249.0 L720.0,250.0" style="fill:none;stroke:#d5352a;stroke-width:2.2"/><text x="244.3" y="237.4" text-anchor="start" style="fill:#d5352a;font-size:12px;font-weight:700">training error</text><path d="M70.0,171.8 L142.5,162.4 L238.3,214.6 L310.8,219.6 L383.3,237.6 L479.2,240.8 L551.7,242.8 L624.2,244.2 L720.0,245.2" style="fill:none;stroke:#1f5ba8;stroke-width:2.2"/><text x="148.5" y="152.4" text-anchor="start" style="fill:#1f5ba8;font-size:12px;font-weight:700">test error</text></svg>
