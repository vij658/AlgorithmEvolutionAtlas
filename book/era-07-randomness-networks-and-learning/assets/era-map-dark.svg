<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 840" width="1000" height="840" role="img" aria-label="How the ideas of Era 7 combined: Randomness, Networks and Learning" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>How the ideas of Era 7 combined: Randomness, Networks and Learning</title><line x1="135.0" y1="96.0" x2="135.0" y2="200.0" style="stroke:#b9b8b2;stroke-width:1.5;stroke-dasharray:5 4"/><polygon points="135.0,200.0 131.3,191.8 138.7,191.8" style="fill:#b9b8b2"/><rect x="138.0" y="135.0" width="253.4" height="19" rx="3" style="fill:#0d1117"/><text x="143.0" y="148.0" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">lowering a cost: exact, then by chance</text><line x1="500.0" y1="96.0" x2="500.0" y2="200.0" style="stroke:#b9b8b2;stroke-width:1.5;stroke-dasharray:5 4"/><polygon points="500.0,200.0 496.3,191.8 503.7,191.8" style="fill:#b9b8b2"/><rect x="503.0" y="135.0" width="227.6" height="19" rx="3" style="fill:#0d1117"/><text x="508.0" y="148.0" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">a short hash stands for long data</text><line x1="865.0" y1="96.0" x2="865.0" y2="200.0" style="stroke:#b9b8b2;stroke-width:1.5;stroke-dasharray:5 4"/><polygon points="865.0,200.0 861.3,191.8 868.7,191.8" style="fill:#b9b8b2"/><rect x="641.8" y="135.0" width="220.2" height="19" rx="3" style="fill:#0d1117"/><text x="857.0" y="148.0" text-anchor="end" style="fill:#ecebe6;font-size:12.5px;font-weight:600">networks that survive bad parts</text><line x1="135.0" y1="276.0" x2="135.0" y2="380.0" style="stroke:#b9b8b2;stroke-width:1.5;stroke-dasharray:5 4"/><polygon points="135.0,380.0 131.3,371.8 138.7,371.8" style="fill:#b9b8b2"/><rect x="138.0" y="315.0" width="139.1" height="19" rx="3" style="fill:#0d1117"/><text x="143.0" y="328.0" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">both descend a cost</text><line x1="500.0" y1="276.0" x2="500.0" y2="380.0" style="stroke:#b9b8b2;stroke-width:1.5;stroke-dasharray:5 4"/><polygon points="500.0,380.0 496.3,371.8 503.7,371.8" style="fill:#b9b8b2"/><rect x="503.0" y="315.0" width="179.6" height="19" rx="3" style="fill:#0d1117"/><text x="508.0" y="328.0" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">both find patterns in text</text><line x1="865.0" y1="456.0" x2="865.0" y2="560.0" style="stroke:#b9b8b2;stroke-width:1.5;stroke-dasharray:5 4"/><polygon points="865.0,560.0 861.3,551.8 868.7,551.8" style="fill:#b9b8b2"/><rect x="689.8" y="495.0" width="172.2" height="19" rx="3" style="fill:#0d1117"/><text x="857.0" y="508.0" text-anchor="end" style="fill:#ecebe6;font-size:12.5px;font-weight:600">trees shaped by the data</text><line x1="135.0" y1="456.0" x2="135.0" y2="560.0" style="stroke:#b9b8b2;stroke-width:1.5;stroke-dasharray:5 4"/><polygon points="135.0,560.0 131.3,551.8 138.7,551.8" style="fill:#b9b8b2"/><rect x="138.0" y="495.0" width="168.6" height="19" rx="3" style="fill:#0d1117"/><text x="143.0" y="508.0" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">both learn from examples</text><line x1="500.0" y1="636.0" x2="500.0" y2="740.0" style="stroke:#b9b8b2;stroke-width:1.5;stroke-dasharray:5 4"/><polygon points="500.0,740.0 496.3,731.8 503.7,731.8" style="fill:#b9b8b2"/><rect x="503.0" y="675.0" width="246.0" height="19" rx="3" style="fill:#0d1117"/><text x="508.0" y="688.0" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">both turn on what is hard to compute</text><rect x="30" y="20" width="210" height="76" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="42.0" y="45.2" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">1. Linear Programming in</text><text x="42.0" y="65.0" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Polynomial Time</text><text x="42.0" y="82.3" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">1979–1984</text><rect x="395" y="20" width="210" height="76" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="407.0" y="55.2" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">2. Merkle&#x27;s Hash Trees</text><text x="407.0" y="72.4" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">1979</text><rect x="760" y="20" width="210" height="76" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="772.0" y="45.2" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">3. The Byzantine</text><text x="772.0" y="65.0" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Generals</text><text x="772.0" y="82.3" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">1980–1982</text><rect x="30" y="200" width="210" height="76" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="42.0" y="235.2" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">4. Simulated Annealing</text><text x="42.0" y="252.4" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">1983–1985</text><rect x="395" y="200" width="210" height="76" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="407.0" y="225.2" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">9. Karp–Rabin</text><text x="407.0" y="245.1" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Fingerprints</text><text x="407.0" y="262.3" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">1985–1987</text><rect x="760" y="200" width="210" height="76" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="772.0" y="225.2" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">10. TCP Congestion</text><text x="772.0" y="245.1" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Control</text><text x="772.0" y="262.3" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">1986–1989</text><rect x="30" y="380" width="210" height="76" style="fill:#0d1117;stroke:#f0584d;stroke-width:3"/><text x="42.0" y="415.2" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">7. Backpropagation</text><text x="42.0" y="432.4" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">1970–1986</text><rect x="395" y="380" width="210" height="76" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="407.0" y="405.2" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">12. The Burrows–Wheeler</text><text x="407.0" y="425.1" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Transform</text><text x="407.0" y="442.3" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">1983–1994</text><rect x="760" y="380" width="210" height="76" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="772.0" y="405.2" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">5. Splay Trees and</text><text x="772.0" y="425.1" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Amortized Analysis</text><text x="772.0" y="442.3" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">1985</text><rect x="30" y="560" width="210" height="76" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="42.0" y="595.1" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">13. AdaBoost</text><text x="42.0" y="612.4" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">1995–1997</text><rect x="395" y="560" width="210" height="76" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="407.0" y="585.2" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">6. Zero-Knowledge</text><text x="407.0" y="605.0" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Proofs</text><text x="407.0" y="622.3" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">1985–1986</text><rect x="760" y="560" width="210" height="76" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="772.0" y="585.2" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">8. The Barnes–Hut Tree</text><text x="772.0" y="605.0" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Code</text><text x="772.0" y="622.3" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">1986</text><rect x="395" y="740" width="210" height="76" style="fill:#0d1117;stroke:#f0584d;stroke-width:3"/><text x="407.0" y="765.2" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">11. Shor&#x27;s Factoring</text><text x="407.0" y="785.0" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Algorithm</text><text x="407.0" y="802.3" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">1994</text></svg>
