<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1586 116" width="1586" height="116" role="img" aria-label="Era 7: Randomness, Networks and Learning, from 1979 to 1995" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>Era 7: Randomness, Networks and Learning, from 1979 to 1995</title><line x1="34" y1="34" x2="1552" y2="34" style="stroke:#ecebe6;stroke-width:2"/><circle cx="64.0" cy="34" r="7" style="fill:#0d1117;stroke:#ecebe6;stroke-width:2"/><text x="64.0" y="64" text-anchor="middle" style="fill:#8f8e96;font-size:11.5px">1979–1984</text><text x="64.0" y="84" text-anchor="middle" style="fill:#ecebe6;font-size:12.5px;font-weight:400">Khachiyan and</text><text x="64.0" y="100" text-anchor="middle" style="fill:#ecebe6;font-size:12.5px;font-weight:400">Karmarkar</text><circle cx="185.5" cy="34" r="7" style="fill:#0d1117;stroke:#ecebe6;stroke-width:2"/><text x="185.5" y="64" text-anchor="middle" style="fill:#8f8e96;font-size:11.5px">1979</text><text x="185.5" y="84" text-anchor="middle" style="fill:#ecebe6;font-size:12.5px;font-weight:400">Merkle trees</text><circle cx="307.0" cy="34" r="7" style="fill:#0d1117;stroke:#ecebe6;stroke-width:2"/><text x="307.0" y="64" text-anchor="middle" style="fill:#8f8e96;font-size:11.5px">1980–1982</text><text x="307.0" y="84" text-anchor="middle" style="fill:#ecebe6;font-size:12.5px;font-weight:400">Byzantine</text><text x="307.0" y="100" text-anchor="middle" style="fill:#ecebe6;font-size:12.5px;font-weight:400">agreement</text><circle cx="428.5" cy="34" r="7" style="fill:#0d1117;stroke:#ecebe6;stroke-width:2"/><text x="428.5" y="64" text-anchor="middle" style="fill:#8f8e96;font-size:11.5px">1983–1985</text><text x="428.5" y="84" text-anchor="middle" style="fill:#ecebe6;font-size:12.5px;font-weight:400">Simulated annealing</text><circle cx="550.0" cy="34" r="7" style="fill:#0d1117;stroke:#ecebe6;stroke-width:2"/><text x="550.0" y="64" text-anchor="middle" style="fill:#8f8e96;font-size:11.5px">1985</text><text x="550.0" y="84" text-anchor="middle" style="fill:#ecebe6;font-size:12.5px;font-weight:400">Splay trees</text><circle cx="671.5" cy="34" r="7" style="fill:#0d1117;stroke:#ecebe6;stroke-width:2"/><text x="671.5" y="64" text-anchor="middle" style="fill:#8f8e96;font-size:11.5px">1985–1986</text><text x="671.5" y="84" text-anchor="middle" style="fill:#ecebe6;font-size:12.5px;font-weight:400">Zero knowledge</text><circle cx="793.0" cy="34" r="7" style="fill:#0d1117;stroke:#ecebe6;stroke-width:2"/><text x="793.0" y="64" text-anchor="middle" style="fill:#8f8e96;font-size:11.5px">1970–1986</text><text x="793.0" y="84" text-anchor="middle" style="fill:#ecebe6;font-size:12.5px;font-weight:400">Backpropagation</text><circle cx="914.5" cy="34" r="7" style="fill:#0d1117;stroke:#ecebe6;stroke-width:2"/><text x="914.5" y="64" text-anchor="middle" style="fill:#8f8e96;font-size:11.5px">1986</text><text x="914.5" y="84" text-anchor="middle" style="fill:#ecebe6;font-size:12.5px;font-weight:400">Barnes–Hut</text><circle cx="1036.0" cy="34" r="7" style="fill:#0d1117;stroke:#ecebe6;stroke-width:2"/><text x="1036.0" y="64" text-anchor="middle" style="fill:#8f8e96;font-size:11.5px">1985–1987</text><text x="1036.0" y="84" text-anchor="middle" style="fill:#ecebe6;font-size:12.5px;font-weight:400">Karp–Rabin</text><circle cx="1157.5" cy="34" r="7" style="fill:#0d1117;stroke:#ecebe6;stroke-width:2"/><text x="1157.5" y="64" text-anchor="middle" style="fill:#8f8e96;font-size:11.5px">1986–1989</text><text x="1157.5" y="84" text-anchor="middle" style="fill:#ecebe6;font-size:12.5px;font-weight:400">Congestion control</text><circle cx="1279.0" cy="34" r="7" style="fill:#0d1117;stroke:#ecebe6;stroke-width:2"/><text x="1279.0" y="64" text-anchor="middle" style="fill:#8f8e96;font-size:11.5px">1994</text><text x="1279.0" y="84" text-anchor="middle" style="fill:#ecebe6;font-size:12.5px;font-weight:400">Shor&#x27;s algorithm</text><circle cx="1400.5" cy="34" r="7" style="fill:#0d1117;stroke