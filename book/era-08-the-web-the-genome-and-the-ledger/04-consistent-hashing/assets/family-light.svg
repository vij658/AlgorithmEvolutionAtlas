<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" role="img" aria-label="How consistent hashing combined older ideas, and where it led" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>How consistent hashing combined older ideas, and where it led</title><line x1="125.0" y1="106.0" x2="426.5" y2="180.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="426.5,180.0 417.6,181.6 419.4,174.5" style="fill:#55545a"/><line x1="500.0" y1="106.0" x2="500.0" y2="180.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="500.0,180.0 496.3,171.8 503.7,171.8" style="fill:#55545a"/><line x1="875.0" y1="106.0" x2="573.5" y2="180.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="573.5,180.0 580.6,174.5 582.4,181.6" style="fill:#55545a"/><rect x="727.2" y="130.0" width="72.7" height="19" rx="3" style="fill:#ffffff"/><text x="732.2" y="143.0" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">a relative</text><line x1="426.5" y1="266.0" x2="125.0" y2="340.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="125.0,340.0 132.1,334.5 133.9,341.6" style="fill:#55545a"/><line x1="573.5" y1="266.0" x2="875.0" y2="340.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="875.0,340.0 866.1,341.6 867.9,334.5" style="fill:#55545a"/><line x1="875.0" y1="426.0" x2="605.0" y2="533.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="605.0,533.0 611.3,526.6 614.0,533.4" style="fill:#55545a"/><line x1="500.0" y1="266.0" x2="500.0" y2="490.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="500.0,490.0 496.3,481.8 503.7,481.8" style="fill:#55545a"/><rect x="20" y="20" width="210" height="86" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="32.0" y="43.7" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Hashing</text><text x="32.0" y="60.9" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">spread keys evenly over</text><text x="32.0" y="77.4" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">buckets</text><text x="32.0" y="93.9" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">Era 5</text><rect x="395" y="20" width="210" height="86" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="407.0" y="43.7" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Hot spots</text><text x="407.0" y="60.9" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">everyone asks one server at</text><text x="407.0" y="77.4" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">once</text><text x="407.0" y="93.9" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">comet impact, election night</text><rect x="770" y="20" width="210" height="86" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="782.0" y="43.7" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Rendezvous hashing</text><text x="782.0" y="60.9" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">highest hash(key, server)</text><text x="782.0" y="77.4" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">wins</text><text x="782.0" y="93.9" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">1996</text><rect x="395" y="180" width="210" height="86" style="fill:#ffffff;stroke:#d5352a;stroke-width:3"/><text x="407.0" y="203.7" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Consistent hashing</text><text x="407.0" y="220.9" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">⊕ keys and caches on one</text><text x="407.0" y="237.4" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">circle</text><text x="407.0" y="253.9" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">MIT, STOC 1997</text><rect x="20" y="340" width="210" height="86" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="32.0" y="363.7" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Akamai</text><text x="32.0" y="380.9" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">founded by two of the</text><text x="32.0" y="397.4" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">authors</text><text x="32.0" y="413.9" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">1998</text><rect x="770" y="340" width="210" height="86" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="782.0" y="363.7" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Chord</text><text x="782.0" y="380.9" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">⊕ fingers: find a key&#x27;s node in</text><text x="782.0" y="397.4" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">log N hops</text><text x="782.0" y="413.9" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">MIT, SIGCOMM 2001</text><rect x="395" y="490" width="210" height="86" style="fill:#ffffff;stroke:#1f5ba8;stroke-width:3"/><text x="407.0" y="521.9" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Today</text><text x="407.0" y="539.1" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">Dynamo, Cassandra and other</text><text x="407.0" y="555.6" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">stores</text><text x="20.0" y="615.0" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">Today: the users Wikipedia lists. Rendezvous hashing was designed in 1996 and is a more general relative.</text></svg>
