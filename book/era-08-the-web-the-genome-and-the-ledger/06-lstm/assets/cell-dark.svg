<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-label="The LSTM cell" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>The LSTM cell</title><text x="20.0" y="26.0" text-anchor="start" style="fill:#ecebe6;font-size:13px;font-weight:700">One LSTM cell at step t: the memory c runs along the top, changed only by × and +</text><text x="40.0" y="95.0" text-anchor="middle" style="fill:#ecebe6;font-size:15px;font-weight:700">cₜ₋₁</text><line x1="62.0" y1="90.0" x2="690.0" y2="90.0" style="stroke:#f0584d;stroke-width:3"/><text x="720.0" y="95.0" text-anchor="middle" style="fill:#ecebe6;font-size:15px;font-weight:700">cₜ</text><circle cx="230" cy="90" r="17" fill="#0d1117" stroke="#ecebe6" stroke-width="2"/><text x="230.0" y="97.0" text-anchor="middle" style="fill:#ecebe6;font-size:20px;font-weight:700">×</text><circle cx="420" cy="90" r="17" fill="#0d1117" stroke="#ecebe6" stroke-width="2"/><text x="420.0" y="97.0" text-anchor="middle" style="fill:#ecebe6;font-size:20px;font-weight:700">+</text><rect x="195.0" y="190.0" width="90.0" height="46.0" rx="0" style="fill:#0d1117;stroke:#5b8fe0;stroke-width:2"/><text x="240.0" y="211.0" text-anchor="middle" style="fill:#ecebe6;font-size:15px;font-weight:700">f</text><text x="240.0" y="228.0" text-anchor="middle" style="fill:#8f8e96;font-size:11px;font-weight:400">forget gate</text><text x="240.0" y="254.0" text-anchor="middle" style="fill:#8f8e96;font-size:11px;font-weight:400">keep (1) or forget (0)</text><rect x="315.0" y="190.0" width="90.0" height="46.0" rx="0" style="fill:#0d1117;stroke:#5b8fe0;stroke-width:2"/><text x="360.0" y="211.0" text-anchor="middle" style="fill:#ecebe6;font-size:15px;font-weight:700">i</text><text x="360.0" y="228.0" text-anchor="middle" style="fill:#8f8e96;font-size:11px;font-weight:400">input gate</text><text x="360.0" y="254.0" text-anchor="middle" style="fill:#8f8e96;font-size:11px;font-weight:400">let new content in</text><rect x="455.0" y="190.0" width="90.0" height="46.0" rx="0" style="fill:#0d1117;stroke:#d9a227;stroke-width:2"/><text x="500.0" y="211.0" text-anchor="middle" style="fill:#ecebe6;font-size:15px;font-weight:700">g</text><text x="500.0" y="228.0" text-anchor="middle" style="fill:#8f8e96;font-size:11px;font-weight:400">candidate</text><text x="500.0" y="254.0" text-anchor="middle" style="fill:#8f8e96;font-size:11px;font-weight:400">tanh: the new content</text><rect x="590.0" y="190.0" width="90.0" height="46.0" rx="0" style="fill:#0d1117;stroke:#5b8fe0;stroke-width:2"/><text x="635.0" y="211.0" text-anchor="middle" style="fill:#ecebe6;font-size:15px;font-weight:700">o</text><text x="635.0" y="228.0" text-anchor="middle" style="fill:#8f8e96;font-size:11px;font-weight:400">output gate</text><text x="635.0" y="254.0" text-anchor="middle" style="fill:#8f8e96;font-size:11px;font-weight:400">how much to show</text><path d="M240,190 L232,107" style="fill:none;stroke:#ecebe6;stroke-width:1.6"/><circle cx="420" cy="150" r="15" fill="#0d1117" stroke="#ecebe6" stroke-width="2"/><text x="420.0" y="156.0" text-anchor="middle" style="fill:#ecebe6;font-size:18px;font-weight:700">×</text><path d="M360,190 L408,160" style="fill:none;stroke:#ecebe6;stroke-width:1.6"/><path d="M500,190 L432,160" style="fill:none;stroke:#ecebe6;stroke-width:1.6"/><path d="M420,135 L420,107" style="fill:none;stroke:#ecebe6;stroke-width:1.6"/><path d="M620,90 L620,140" style="fill:none;stroke:#ecebe6;stroke-width:1.6"/><text x="632.0" y="125.0" text-anchor="start" style="fill:#8f8e96;font-size:11.5px;font-weight:400">tanh</text><circle cx="635" cy="160" r="15" fill="#0d1117" stroke="#ecebe6" stroke-width="2"/><text x="635.0" y="166.0" text-anchor="middle" style="fill:#ecebe6;font-size:18px;font-weight:700">×</text><path d="M635,190 L635,175" style="fill:none;stroke:#ecebe6;stroke-width:1.6"/><path d="M650,160 L710,160" style="fill:none;stroke:#ecebe6;stroke-width:1.6"/><text x="722.0" y="165.0" text-anchor="middle" style="fill:#ecebe6;font-size:15px;font-weight:700">hₜ</text><text x="20.0" y="290.0" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:400">Each gate is a sigmoid of the input and the previous output hₜ₋₁. cₜ = f × cₜ₋₁ + i × g ; hₜ = o × tanh(cₜ).</text><text x="20.0" y="310.0" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:400">While f ≈ 1 and i ≈ 0, cₜ = cₜ₋₁, and the error flowing back along the top line passes unchanged.</text></svg>
