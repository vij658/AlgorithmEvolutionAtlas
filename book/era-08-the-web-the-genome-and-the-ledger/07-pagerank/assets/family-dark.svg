<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" role="img" aria-label="How PageRank combined older ideas, and where it led" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>How PageRank combined older ideas, and where it led</title><line x1="125.0" y1="106.0" x2="426.5" y2="180.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="426.5,180.0 417.6,181.6 419.4,174.5" style="fill:#b9b8b2"/><line x1="500.0" y1="106.0" x2="500.0" y2="180.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="500.0,180.0 496.3,171.8 503.7,171.8" style="fill:#b9b8b2"/><rect x="503.0" y="130.0" width="65.3" height="19" rx="3" style="fill:#0d1117"/><text x="508.0" y="143.0" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">replaced</text><line x1="875.0" y1="106.0" x2="573.5" y2="180.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="573.5,180.0 580.6,174.5 582.4,181.6" style="fill:#b9b8b2"/><line x1="426.5" y1="266.0" x2="125.0" y2="340.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="125.0,340.0 132.1,334.5 133.9,341.6" style="fill:#b9b8b2"/><rect x="193.3" y="282.6" width="109.6" height="19" rx="3" style="fill:#0d1117"/><text x="297.9" y="295.6" text-anchor="end" style="fill:#ecebe6;font-size:12.5px;font-weight:600">a contemporary</text><line x1="573.5" y1="266.0" x2="875.0" y2="340.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="875.0,340.0 866.1,341.6 867.9,334.5" style="fill:#b9b8b2"/><line x1="500.0" y1="266.0" x2="500.0" y2="490.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="500.0,490.0 496.3,481.8 503.7,481.8" style="fill:#b9b8b2"/><rect x="20" y="20" width="210" height="86" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="32.0" y="43.7" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Markov chains</text><text x="32.0" y="60.9" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">a walk settles into fixed</text><text x="32.0" y="77.4" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">shares</text><text x="32.0" y="93.9" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">Era 4</text><rect x="395" y="20" width="210" height="86" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="407.0" y="51.9" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Keyword search</text><text x="407.0" y="69.2" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">matches words, returns junk</text><text x="407.0" y="85.7" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">the engines of 1998</text><rect x="770" y="20" width="210" height="86" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="782.0" y="43.7" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">The link graph</text><text x="782.0" y="60.9" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">518 million links among 24</text><text x="782.0" y="77.4" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">million pages</text><text x="782.0" y="93.9" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">Brin and Page, 1998</text><rect x="395" y="180" width="210" height="86" style="fill:#0d1117;stroke:#f0584d;stroke-width:3"/><text x="407.0" y="203.7" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">PageRank</text><text x="407.0" y="220.9" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">⊕ the random surfer, with</text><text x="407.0" y="237.4" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">damping 0.85</text><text x="407.0" y="253.9" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">Page and Brin, Stanford, 1998</text><rect x="20" y="340" width="210" height="86" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="32.0" y="363.7" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Hubs and authorities</text><text x="32.0" y="380.9" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">two scores, computed per</text><text x="32.0" y="397.4" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">query</text><text x="32.0" y="413.9" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">Kleinberg, 1999</text><rect x="770" y="340" width="210" height="86" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="782.0" y="363.7" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">The patent</text><text x="782.0" y="380.9" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">assigned to Stanford;</text><text x="782.0" y="397.4" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">licensed to Google</text><text x="782.0" y="413.9" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">granted 2001</text><rect x="395" y="490" width="210" height="86" style="fill:#0d1117;stroke:#5b8fe0;stroke-width:3"/><text x="407.0" y="530.1" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Google</text><text x="407.0" y="547.4" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">the search engine built on it</text><text x="20.0" y="615.0" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">HITS is a contemporary, not a descendant: Kleinberg&#x27;s paper appeared in 1999.</text></svg>
