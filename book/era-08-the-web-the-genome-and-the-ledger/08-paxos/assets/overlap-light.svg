<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" width="760" height="250" role="img" aria-label="Two overlapping majorities of three acceptors" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>Two overlapping majorities of three acceptors</title><text x="20.0" y="26.0" text-anchor="start" style="fill:#17171a;font-size:13px;font-weight:700">Why majorities: any two of them share an acceptor, who carries the earlier vote forward</text><rect x="135.0" y="110.0" width="110.0" height="60.0" rx="0" style="fill:#ffffff;stroke:#17171a;stroke-width:2"/><text x="190.0" y="136.0" text-anchor="middle" style="fill:#17171a;font-size:13px;font-weight:700">acceptor 1</text><text x="190.0" y="156.0" text-anchor="middle" style="fill:#d5352a;font-size:12px;font-weight:400">voted (1, A)</text><rect x="325.0" y="110.0" width="110.0" height="60.0" rx="0" style="fill:#ffffff;stroke:#17171a;stroke-width:2"/><text x="380.0" y="136.0" text-anchor="middle" style="fill:#17171a;font-size:13px;font-weight:700">acceptor 2</text><text x="380.0" y="156.0" text-anchor="middle" style="fill:#d5352a;font-size:12px;font-weight:400">voted (1, A)</text><rect x="515.0" y="110.0" width="110.0" height="60.0" rx="0" style="fill:#ffffff;stroke:#17171a;stroke-width:2"/><text x="570.0" y="136.0" text-anchor="middle" style="fill:#17171a;font-size:13px;font-weight:700">acceptor 3</text><text x="570.0" y="156.0" text-anchor="middle" style="fill:#d5352a;font-size:12px;font-weight:400"></text><rect x="120.0" y="92.0" width="330.0" height="96.0" rx="8" style="fill:none;stroke:#d5352a;stroke-width:2.2;stroke-dasharray:7 4"/><text x="130.0" y="84.0" text-anchor="start" style="fill:#d5352a;font-size:12.5px;font-weight:700">ballot 1&#x27;s majority: chose A</text><rect x="310.0" y="100.0" width="330.0" height="80.0" rx="8" style="fill:none;stroke:#1f5ba8;stroke-width:2.2;stroke-dasharray:3 3"/><text x="630.0" y="200.0" text-anchor="end" style="fill:#1f5ba8;font-size:12.5px;font-weight:700">ballot 2&#x27;s majority of promises</text><text x="20.0" y="228.0" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:400">Acceptor 2 is in both. Its promise to ballot 2 reports its vote (1, A), so ballot 2 must propose A again.</text></svg>
