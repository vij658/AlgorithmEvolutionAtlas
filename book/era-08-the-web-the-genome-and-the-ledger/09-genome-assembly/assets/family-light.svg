<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" role="img" aria-label="How de Bruijn assembly combined older ideas, and where it led" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>How de Bruijn assembly combined older ideas, and where it led</title><line x1="125.0" y1="106.0" x2="426.5" y2="180.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="426.5,180.0 417.6,181.6 419.4,174.5" style="fill:#55545a"/><line x1="500.0" y1="106.0" x2="500.0" y2="180.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="500.0,180.0 496.3,171.8 503.7,171.8" style="fill:#55545a"/><rect x="503.0" y="130.0" width="65.3" height="19" rx="3" style="fill:#ffffff"/><text x="508.0" y="143.0" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">replaced</text><line x1="875.0" y1="106.0" x2="573.5" y2="180.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="573.5,180.0 580.6,174.5 582.4,181.6" style="fill:#55545a"/><line x1="426.5" y1="266.0" x2="125.0" y2="340.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="125.0,340.0 132.1,334.5 133.9,341.6" style="fill:#55545a"/><line x1="573.5" y1="266.0" x2="875.0" y2="340.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="875.0,340.0 866.1,341.6 867.9,334.5" style="fill:#55545a"/><line x1="125.0" y1="426.0" x2="395.0" y2="533.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="395.0,533.0 386.0,533.4 388.7,526.6" style="fill:#55545a"/><line x1="875.0" y1="426.0" x2="605.0" y2="533.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="605.0,533.0 611.3,526.6 614.0,533.4" style="fill:#55545a"/><rect x="20" y="20" width="210" height="86" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="32.0" y="43.7" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Euler&#x27;s bridges</text><text x="32.0" y="60.9" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">a path using every bridge</text><text x="32.0" y="77.4" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">once</text><text x="32.0" y="93.9" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">Era 3</text><rect x="395" y="20" width="210" height="86" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="407.0" y="43.7" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Overlap assembly</text><text x="407.0" y="60.9" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">reads as points: a Hamiltonian</text><text x="407.0" y="77.4" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">path</text><text x="407.0" y="93.9" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">overlap–layout–consensus</text><rect x="770" y="20" width="210" height="86" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="782.0" y="51.9" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">k-tuples</text><text x="782.0" y="69.2" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">all short words of a sequence</text><text x="782.0" y="85.7" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">sequencing by hybridization</text><rect x="395" y="180" width="210" height="86" style="fill:#ffffff;stroke:#d5352a;stroke-width:3"/><text x="407.0" y="203.7" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Idury and Waterman</text><text x="407.0" y="220.9" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">⊕ words as arrows between</text><text x="407.0" y="237.4" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">halves</text><text x="407.0" y="253.9" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">USC, 1995</text><rect x="20" y="340" width="210" height="86" style="fill:#ffffff;stroke:#d5352a;stroke-width:3"/><text x="32.0" y="363.7" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">EULER</text><text x="32.0" y="380.9" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">⊕ Eulerian superpaths, error</text><text x="32.0" y="397.4" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">correction</text><text x="32.0" y="413.9" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">Pevzner, Tang, Waterman, 2001</text><rect x="770" y="340" width="210" height="86" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="782.0" y="363.7" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Velvet</text><text x="782.0" y="380.9" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">de Bruijn graphs for very</text><text x="782.0" y="397.4" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">short reads</text><text x="782.0" y="413.9" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">Zerbino and Birney, 2008</text><rect x="395" y="490" width="210" height="86" style="fill:#ffffff;stroke:#1f5ba8;stroke-width:3"/><text x="407.0" y="521.9" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Short-read assembly</text><text x="407.0" y="539.1" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">the method the short-read</text><text x="407.0" y="555.6" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">machines use</text><text x="20.0" y="615.0" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">Short-read assembly: Wikipedia says the de Bruijn approach is &quot;most widely applied to the short reads&quot;.</text></svg>
