<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 230" width="760" height="230" role="img" aria-label="Words of four letters as arrows between their halves" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>Words of four letters as arrows between their halves</title><text x="20.0" y="26.0" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:700">TGCTCGGAG, the start of the widget&#x27;s genome, cut into 4-letter words: each word is an arrow between its halves</text><rect x="20.0" y="90.0" width="64.0" height="40.0" rx="0" style="fill:#0d1117;stroke:#5b8fe0;stroke-width:2"/><text x="52.0" y="115.0" text-anchor="middle" style="fill:#ecebe6;font-size:14px;font-weight:700">TGC</text><line x1="86.0" y1="110.0" x2="108.0" y2="110.0" style="stroke:#ecebe6;stroke-width:1.6"/><path d="M106,105 L114,110 L106,115 z" style="fill:#ecebe6"/><text x="100.0" y="80.0" text-anchor="middle" style="fill:#f0584d;font-size:12.5px;font-weight:700">TGCT</text><rect x="117.0" y="90.0" width="64.0" height="40.0" rx="0" style="fill:#0d1117;stroke:#5b8fe0;stroke-width:2"/><text x="149.0" y="115.0" text-anchor="middle" style="fill:#ecebe6;font-size:14px;font-weight:700">GCT</text><line x1="183.0" y1="110.0" x2="205.0" y2="110.0" style="stroke:#ecebe6;stroke-width:1.6"/><path d="M203,105 L211,110 L203,115 z" style="fill:#ecebe6"/><text x="197.0" y="80.0" text-anchor="middle" style="fill:#f0584d;font-size:12.5px;font-weight:700">GCTC</text><rect x="214.0" y="90.0" width="64.0" height="40.0" rx="0" style="fill:#0d1117;stroke:#5b8fe0;stroke-width:2"/><text x="246.0" y="115.0" text-anchor="middle" style="fill:#ecebe6;font-size:14px;font-weight:700">CTC</text><line x1="280.0" y1="110.0" x2="302.0" y2="110.0" style="stroke:#ecebe6;stroke-width:1.6"/><path d="M300,105 L308,110 L300,115 z" style="fill:#ecebe6"/><text x="294.0" y="80.0" text-anchor="middle" style="fill:#f0584d;font-size:12.5px;font-weight:700">CTCG</text><rect x="311.0" y="90.0" width="64.0" height="40.0" rx="0" style="fill:#0d1117;stroke:#5b8fe0;stroke-width:2"/><text x="343.0" y="115.0" text-anchor="middle" style="fill:#ecebe6;font-size:14px;font-weight:700">TCG</text><line x1="377.0" y1="110.0" x2="399.0" y2="110.0" style="stroke:#ecebe6;stroke-width:1.6"/><path d="M397,105 L405,110 L397,115 z" style="fill:#ecebe6"/><text x="391.0" y="80.0" text-anchor="middle" style="fill:#f0584d;font-size:12.5px;font-weight:700">TCGG</text><rect x="408.0" y="90.0" width="64.0" height="40.0" rx="0" style="fill:#0d1117;stroke:#5b8fe0;stroke-width:2"/><text x="440.0" y="115.0" text-anchor="middle" style="fill:#ecebe6;font-size:14px;font-weight:700">CGG</text><line x1="474.0" y1="110.0" x2="496.0" y2="110.0" style="stroke:#ecebe6;stroke-width:1.6"/><path d="M494,105 L502,110 L494,115 z" style="fill:#ecebe6"/><text x="488.0" y="80.0" text-anchor="middle" style="fill:#f0584d;font-size:12.5px;font-weight:700">CGGA</text><rect x="505.0" y="90.0" width="64.0" height="40.0" rx="0" style="fill:#0d1117;stroke:#5b8fe0;stroke-width:2"/><text x="537.0" y="115.0" text-anchor="middle" style="fill:#ecebe6;font-size:14px;font-weight:700">GGA</text><line x1="571.0" y1="110.0" x2="593.0" y2="110.0" style="stroke:#ecebe6;stroke-width:1.6"/><path d="M591,105 L599,110 L591,115 z" style="fill:#ecebe6"/><text x="585.0" y="80.0" text-anchor="middle" style="fill:#f0584d;font-size:12.5px;font-weight:700">GGAG</text><rect x="602.0" y="90.0" width="64.0" height="40.0" rx="0" style="fill:#0d1117;stroke:#5b8fe0;stroke-width:2"/><text x="634.0" y="115.0" text-anchor="middle" style="fill:#ecebe6;font-size:14px;font-weight:700">GAG</text><text x="20.0" y="175.0" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:400">Red: the 4-letter words (arrows). Blue: the 3-letter halves (points). Reading the arrows in order spells the genome;</text><text x="20.0" y="195.0" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:400">with all of a genome&#x27;s words, the genome is a path that uses every arrow exactly once: an Eulerian path.</text></svg>
