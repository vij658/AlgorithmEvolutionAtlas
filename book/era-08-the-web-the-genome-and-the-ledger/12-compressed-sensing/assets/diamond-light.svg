<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-label="The smallest l1 diamond touches the line of solutions at a corner; the smallest circle does not" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>The smallest l1 diamond touches the line of solutions at a corner; the smallest circle does not</title><text x="30.0" y="26.0" text-anchor="start" style="fill:#17171a;font-size:14px;font-weight:700">smallest |x₁| + |x₂|</text><line x1="25.0" y1="200.0" x2="362.5" y2="200.0" style="stroke:#c4c3bb;stroke-width:1.2"/><line x1="190.0" y1="335.0" x2="190.0" y2="27.5" style="stroke:#c4c3bb;stroke-width:1.2"/><text x="362.5" y="216.0" text-anchor="end" style="fill:#7d7c84;font-size:12px;font-weight:400">x₁</text><text x="198.0" y="32.0" text-anchor="start" style="fill:#7d7c84;font-size:12px;font-weight:400">x₂</text><line x1="77.5" y1="35.0" x2="362.5" y2="149.0" style="stroke:#d5352a;stroke-width:2.2"/><path d="M310.0,200.0 L190.0,80.0 L70.0,200.0 L190.0,320.0 Z" style="fill:#1f5ba8;stroke:#1f5ba8;stroke-width:1.8;fill-opacity:0.15"/><circle cx="190.0" cy="80.0" r="6.0" style="fill:#17171a;stroke:#17171a;stroke-width:1"/><text x="202.0" y="70.0" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:700">(0.00, 0.80): x₁ is exactly 0</text><text x="410.0" y="26.0" text-anchor="start" style="fill:#17171a;font-size:14px;font-weight:700">smallest x₁² + x₂²</text><line x1="405.0" y1="200.0" x2="742.5" y2="200.0" style="stroke:#c4c3bb;stroke-width:1.2"/><line x1="570.0" y1="335.0" x2="570.0" y2="27.5" style="stroke:#c4c3bb;stroke-width:1.2"/><text x="742.5" y="216.0" text-anchor="end" style="fill:#7d7c84;font-size:12px;font-weight:400">x₁</text><text x="578.0" y="32.0" text-anchor="start" style="fill:#7d7c84;font-size:12px;font-weight:400">x₂</text><line x1="457.5" y1="35.0" x2="742.5" y2="149.0" style="stroke:#d5352a;stroke-width:2.2"/><circle cx="570.0" cy="200.0" r="111.4" style="fill:#1f5ba8;fill-opacity:0.15;stroke:#1f5ba8;stroke-width:1.8"/><circle cx="611.4" cy="96.6" r="6.0" style="fill:#17171a;stroke:#17171a;stroke-width:1"/><text x="566.4" y="148.6" text-anchor="middle" style="fill:#17171a;font-size:12.5px;font-weight:700">(0.28, 0.69): both non-zero</text><text x="20.0" y="372.0" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:400">Red: every (x₁, x₂) with x₁ + 2.5 x₂ = 2, one measurement of two unknowns. Blue: the smallest shape that touches it.</text><text x="20.0" y="392.0" text-anchor="start" style="fill:#7d7c84;font-size:12px;font-weight:400">A diamond&#x27;s corners lie on the axes, so it usually touches first at a corner, where a number is zero.</text></svg>
