<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" role="img" aria-label="How compressed sensing combined older ideas, and where it led" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>How compressed sensing combined older ideas, and where it led</title><line x1="125.0" y1="106.0" x2="426.5" y2="180.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="426.5,180.0 417.6,181.6 419.4,174.5" style="fill:#55545a"/><rect x="261.7" y="120.3" width="124.3" height="19" rx="3" style="fill:#ffffff"/><text x="266.7" y="133.3" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">far fewer samples</text><line x1="500.0" y1="106.0" x2="500.0" y2="180.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="500.0,180.0 496.3,171.8 503.7,171.8" style="fill:#55545a"/><line x1="875.0" y1="106.0" x2="573.5" y2="180.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="573.5,180.0 580.6,174.5 582.4,181.6" style="fill:#55545a"/><line x1="426.5" y1="266.0" x2="125.0" y2="340.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="125.0,340.0 132.1,334.5 133.9,341.6" style="fill:#55545a"/><line x1="573.5" y1="266.0" x2="875.0" y2="340.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="875.0,340.0 866.1,341.6 867.9,334.5" style="fill:#55545a"/><line x1="500.0" y1="266.0" x2="500.0" y2="490.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="500.0,490.0 496.3,481.8 503.7,481.8" style="fill:#55545a"/><rect x="20" y="20" width="210" height="86" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="32.0" y="43.7" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">The sampling theorem</text><text x="32.0" y="60.9" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">how often to measure to</text><text x="32.0" y="77.4" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">capture a signal</text><text x="32.0" y="93.9" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">Nyquist and Shannon</text><rect x="395" y="20" width="210" height="86" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="407.0" y="51.9" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">ℓ1 minimization</text><text x="407.0" y="69.2" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">seismology 1970s, LASSO 1996,</text><text x="407.0" y="85.7" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">basis pursuit 1998</text><rect x="770" y="20" width="210" height="86" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="782.0" y="51.9" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Linear programming</text><text x="782.0" y="69.2" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">interior-point methods</text><text x="782.0" y="85.7" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">Era 7, topic 1</text><rect x="395" y="180" width="210" height="86" style="fill:#ffffff;stroke:#d5352a;stroke-width:3"/><text x="407.0" y="211.9" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Compressed sensing</text><text x="407.0" y="229.2" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">⊕ random measurements</text><text x="407.0" y="245.7" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">Candès, Romberg, Tao, 2004</text><rect x="20" y="340" width="210" height="86" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="32.0" y="380.2" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Faster MRI</text><text x="32.0" y="397.4" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">shorter scans</text><rect x="770" y="340" width="210" height="86" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="782.0" y="380.2" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Single-pixel camera</text><text x="782.0" y="397.4" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">Rice University</text><rect x="395" y="490" width="210" height="86" style="fill:#ffffff;stroke:#1f5ba8;stroke-width:3"/><text x="407.0" y="513.6" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Could change</text><text x="407.0" y="530.9" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">conversion, optics, MRI,</text><text x="407.0" y="547.4" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">seismics</text><text x="407.0" y="563.9" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">Candès, Stanford talk, 2010</text><text x="20.0" y="615.0" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">Wikipedia: &quot;far fewer samples than required by the Nyquist–Shannon sampling theorem&quot;.</text></svg>
