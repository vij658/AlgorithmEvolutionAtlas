<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-label="Four blocks, each holding the previous block&#x27;s hash" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>Four blocks, each holding the previous block&#x27;s hash</title><defs><marker id="bk-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" style="fill:#ecebe6"/></marker></defs><rect x="20.0" y="40.0" width="150.0" height="150.0" rx="0" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.4"/><text x="30.0" y="60.0" text-anchor="start" style="fill:#ecebe6;font-size:13px;font-weight:700">block 1</text><rect x="28.0" y="69.0" width="134.0" height="28.0" rx="0" style="fill:#161b22;stroke:#41444b;stroke-width:0.8"/><text x="34.0" y="81.0" text-anchor="start" style="fill:#8f8e96;font-size:10px;font-weight:400">previous hash</text><text x="34.0" y="93.0" text-anchor="start" style="fill:#ecebe6;font-size:11px;font-weight:400">hash of block 0</text><rect x="28.0" y="103.0" width="134.0" height="28.0" rx="0" style="fill:#161b22;stroke:#41444b;stroke-width:0.8"/><text x="34.0" y="115.0" text-anchor="start" style="fill:#8f8e96;font-size:10px;font-weight:400">Merkle root</text><text x="34.0" y="127.0" text-anchor="start" style="fill:#ecebe6;font-size:11px;font-weight:400">of its payments</text><rect x="28.0" y="137.0" width="134.0" height="28.0" rx="0" style="fill:#161b22;stroke:#41444b;stroke-width:0.8"/><text x="34.0" y="149.0" text-anchor="start" style="fill:#8f8e96;font-size:10px;font-weight:400">nonce</text><text x="34.0" y="161.0" text-anchor="start" style="fill:#ecebe6;font-size:11px;font-weight:400">found by trying</text><line x1="170.0" y1="82.0" x2="202.0" y2="82.0" style="stroke:#ecebe6;stroke-width:1.6;marker-end:url(#bk-arrow)"/><rect x="206.0" y="40.0" width="150.0" height="150.0" rx="0" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.4"/><text x="216.0" y="60.0" text-anchor="start" style="fill:#ecebe6;font-size:13px;font-weight:700">block 2</text><rect x="214.0" y="69.0" width="134.0" height="28.0" rx="0" style="fill:#161b22;stroke:#41444b;stroke-width:0.8"/><text x="220.0" y="81.0" text-anchor="start" style="fill:#8f8e96;font-size:10px;font-weight:400">previous hash</text><text x="220.0" y="93.0" text-anchor="start" style="fill:#ecebe6;font-size:11px;font-weight:400">hash of block 1</text><rect x="214.0" y="103.0" width="134.0" height="28.0" rx="0" style="fill:#161b22;stroke:#41444b;stroke-width:0.8"/><text x="220.0" y="115.0" text-anchor="start" style="fill:#8f8e96;font-size:10px;font-weight:400">Merkle root</text><text x="220.0" y="127.0" text-anchor="start" style="fill:#ecebe6;font-size:11px;font-weight:400">of its payments</text><rect x="214.0" y="137.0" width="134.0" height="28.0" rx="0" style="fill:#161b22;stroke:#41444b;stroke-width:0.8"/><text x="220.0" y="149.0" text-anchor="start" style="fill:#8f8e96;font-size:10px;font-weight:400">nonce</text><text x="220.0" y="161.0" text-anchor="start" style="fill:#ecebe6;font-size:11px;font-weight:400">found by trying</text><line x1="356.0" y1="82.0" x2="388.0" y2="82.0" style="stroke:#ecebe6;stroke-width:1.6;marker-end:url(#bk-arrow)"/><rect x="392.0" y="40.0" width="150.0" height="150.0" rx="0" style="fill:#0d1117;stroke:#f0584d;stroke-width:1.8"/><text x="402.0" y="60.0" text-anchor="start" style="fill:#f0584d;font-size:13px;font-weight:700">block 3: changed</text><rect x="400.0" y="69.0" width="134.0" height="28.0" rx="0" style="fill:#161b22;stroke:#41444b;stroke-width:0.8"/><text x="406.0" y="81.0" text-anchor="start" style="fill:#8f8e96;font-size:10px;font-weight:400">previous hash</text><text x="406.0" y="93.0" text-anchor="start" style="fill:#ecebe6;font-size:11px;font-weight:400">hash of block 2</text><rect x="400.0" y="103.0" width="134.0" height="28.0" rx="0" style="fill:#161b22;stroke:#41444b;stroke-width:0.8"/><text x="406.0" y="115.0" text-anchor="start" style="fill:#8f8e96;font-size:10px;font-weight:400">Merkle root</text><text x="406.0" y="127.0" text-anchor="start" style="fill:#ecebe6;font-size:11px;font-weight:400">of its payments</text><rect x="400.0" y="137.0" width="134.0" height="28.0" rx="0" style="fill:#161b22;stroke:#41444b;stroke-width:0.8"/><text x="406.0" y="149.0" text-anchor="start" style="fill:#8f8e96;font-size:10px;font-weight:400">nonce</text><text x="406.0" y="161.0" text-anchor="start" style="fill:#ecebe6;font-size:11px;font-weight:400">found by trying</text><line x1="542.0" y1="82.0" x2="574.0" y2="82.0" style="stroke:#f0584d;stroke-width:1.6;stroke-dasharray:4 3"/><text x="560.0" y="74.0" text-anchor="middle" style="fill:#f0584d;font-size:14px;font-weight:700">✗</text><rect x="578.0" y="40.0" width="150.0" height="150.0" rx="0" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.4"/><text x="588.0" y="60.0" text-anchor="start" style="fill:#ecebe6;font-size:13px;font-weight:700">block 4</text><rect x="586.0" y="69.0" width="134.0" height="28.0" rx="0" style="fill:#161b22;stroke:#41444b;stroke-width:0.8"/><text x="592.0" y="81.0" text-anchor="start" style="fill:#8f8e96;font-size:10px;font-weight:400">previous hash</text><text x="592.0" y="93.0" text-anchor="start" style="fill:#ecebe6;font-size:11px;font-weight:400">hash of block 3</text><rect x="586.0" y="103.0" width="134.0" height="28.0" rx="0" style="fill:#161b22;stroke:#41444b;stroke-width:0.8"/><text x="592.0" y="115.0" text-anchor="start" style="fill:#8f8e96;font-size:10px;font-weight:400">Merkle root</text><text x="592.0" y="127.0" text-anchor="start" style="fill:#ecebe6;font-size:11px;font-weight:400">of its payments</text><rect x="586.0" y="137.0" width="134.0" height="28.0" rx="0" style="fill:#161b22;stroke:#41444b;stroke-width:0.8"/><text x="592.0" y="149.0" text-anchor="start" style="fill:#8f8e96;font-size:10px;font-weight:400">nonce</text><text x="592.0" y="161.0" text-anchor="start" style="fill:#ecebe6;font-size:11px;font-weight:400">found by trying</text><text x="20.0" y="26.0" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:700">Each block&#x27;s header holds the previous block&#x27;s hash; its own hash must start with enough zero bits.</text><text x="20.0" y="222.0" text-anchor="start" style="fill:#f0584d;font-size:12.5px;font-weight:700">Change one payment in block 3: its Merkle root changes, so its hash, so the next block&#x27;s link breaks.</text><text x="20.0" y="244.0" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:400">To repair the chain the attacker must re-mine block 3 and every block after it: in the program,</text><text x="20.0" y="264.0" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:400">10 blocks at 14 zero bits, re-mining blocks 3 to 9 took 83,758 tries (about 7 × 2^14 = 114,688),</text><text x="20.0" y="284.0" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:400">while the honest computers keep adding blocks to the real chain.</text></svg>
