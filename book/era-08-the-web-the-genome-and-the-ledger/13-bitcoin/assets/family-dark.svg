<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" role="img" aria-label="How Bitcoin combined older ideas, and where it led" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>How Bitcoin combined older ideas, and where it led</title><line x1="125.0" y1="106.0" x2="426.5" y2="180.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="426.5,180.0 417.6,181.6 419.4,174.5" style="fill:#b9b8b2"/><line x1="500.0" y1="106.0" x2="500.0" y2="180.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="500.0,180.0 496.3,171.8 503.7,171.8" style="fill:#b9b8b2"/><line x1="875.0" y1="106.0" x2="573.5" y2="180.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="573.5,180.0 580.6,174.5 582.4,181.6" style="fill:#b9b8b2"/><rect x="589.2" y="127.7" width="116.9" height="19" rx="3" style="fill:#0d1117"/><text x="701.2" y="140.7" text-anchor="end" style="fill:#ecebe6;font-size:12.5px;font-weight:600">among strangers</text><line x1="426.5" y1="266.0" x2="125.0" y2="340.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="125.0,340.0 132.1,334.5 133.9,341.6" style="fill:#b9b8b2"/><line x1="573.5" y1="266.0" x2="875.0" y2="340.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="875.0,340.0 866.1,341.6 867.9,334.5" style="fill:#b9b8b2"/><line x1="500.0" y1="266.0" x2="500.0" y2="490.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="500.0,490.0 496.3,481.8 503.7,481.8" style="fill:#b9b8b2"/><rect x="20" y="20" width="210" height="86" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="32.0" y="51.9" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Hashcash</text><text x="32.0" y="69.2" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">proof of work against spam</text><text x="32.0" y="85.7" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">Adam Back, 1997</text><rect x="395" y="20" width="210" height="86" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="407.0" y="51.9" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Merkle trees</text><text x="407.0" y="69.2" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">one hash seals many items</text><text x="407.0" y="85.7" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">Era 7, topic 2</text><rect x="770" y="20" width="210" height="86" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="782.0" y="51.9" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Byzantine agreement</text><text x="782.0" y="69.2" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">agreement despite traitors</text><text x="782.0" y="85.7" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">Era 7, topic 3</text><rect x="395" y="180" width="210" height="86" style="fill:#0d1117;stroke:#f0584d;stroke-width:3"/><text x="407.0" y="203.7" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Bitcoin</text><text x="407.0" y="220.9" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">⊕ the longest chain of work</text><text x="407.0" y="237.4" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">decides</text><text x="407.0" y="253.9" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">Nakamoto, 31 October 2008</text><rect x="20" y="340" width="210" height="86" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="32.0" y="380.2" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">The genesis block</text><text x="32.0" y="397.4" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">3 January 2009</text><rect x="770" y="340" width="210" height="86" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="782.0" y="371.9" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">The first transaction</text><text x="782.0" y="389.2" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">10 bitcoins to Hal Finney</text><text x="782.0" y="405.7" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">12 January 2009, block 170</text><rect x="395" y="490" width="210" height="86" style="fill:#0d1117;stroke:#5b8fe0;stroke-width:3"/><text x="407.0" y="521.9" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">A textbook subject</text><text x="407.0" y="539.1" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">Princeton University Press,</text><text x="407.0" y="555.6" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">2016</text><text x="20.0" y="615.0" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">The announcement: &quot;No mint or other trusted parties&quot;.</text></svg>
