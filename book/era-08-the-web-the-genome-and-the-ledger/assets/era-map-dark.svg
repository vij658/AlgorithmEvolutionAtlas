<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 840" width="1000" height="840" role="img" aria-label="How the ideas of Era 8 combined: The Web, the Genome and the Ledger" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>How the ideas of Era 8 combined: The Web, the Genome and the Ledger</title><line x1="135.0" y1="96.0" x2="135.0" y2="200.0" style="stroke:#b9b8b2;stroke-width:1.5;stroke-dasharray:5 4"/><polygon points="135.0,200.0 131.3,191.8 138.7,191.8" style="fill:#b9b8b2"/><rect x="138.0" y="135.0" width="168.6" height="19" rx="3" style="fill:#0d1117"/><text x="143.0" y="148.0" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">both learn from examples</text><line x1="500.0" y1="96.0" x2="500.0" y2="200.0" style="stroke:#b9b8b2;stroke-width:1.5;stroke-dasharray:5 4"/><polygon points="500.0,200.0 496.3,191.8 503.7,191.8" style="fill:#b9b8b2"/><rect x="503.0" y="135.0" width="135.4" height="19" rx="3" style="fill:#0d1117"/><text x="508.0" y="148.0" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">a convex relaxation</text><line x1="865.0" y1="96.0" x2="865.0" y2="200.0" style="stroke:#b9b8b2;stroke-width:1.5;stroke-dasharray:5 4"/><polygon points="865.0,200.0 861.3,191.8 868.7,191.8" style="fill:#b9b8b2"/><rect x="708.2" y="135.0" width="153.8" height="19" rx="3" style="fill:#0d1117"/><text x="857.0" y="148.0" text-anchor="end" style="fill:#ecebe6;font-size:12.5px;font-weight:600">small random summaries</text><line x1="865.0" y1="276.0" x2="865.0" y2="380.0" style="stroke:#b9b8b2;stroke-width:1.5;stroke-dasharray:5 4"/><polygon points="865.0,380.0 861.3,371.8 868.7,371.8" style="fill:#b9b8b2"/><rect x="660.2" y="315.0" width="201.8" height="19" rx="3" style="fill:#0d1117"/><text x="857.0" y="328.0" text-anchor="end" style="fill:#ecebe6;font-size:12.5px;font-weight:600">texts cut into k-letter words</text><line x1="135.0" y1="456.0" x2="135.0" y2="560.0" style="stroke:#b9b8b2;stroke-width:1.5;stroke-dasharray:5 4"/><polygon points="135.0,560.0 131.3,551.8 138.7,551.8" style="fill:#b9b8b2"/><rect x="138.0" y="495.0" width="146.4" height="19" rx="3" style="fill:#0d1117"/><text x="143.0" y="508.0" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">spread over machines</text><line x1="416.0" y1="456.0" x2="219.0" y2="560.0" style="stroke:#b9b8b2;stroke-width:1.5;stroke-dasharray:5 4"/><polygon points="219.0,560.0 224.6,552.9 228.0,559.4" style="fill:#b9b8b2"/><rect x="397.6" y="463.8" width="249.7" height="19" rx="3" style="fill:#0d1117"/><text x="402.6" y="476.8" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">PageRank in rounds of map and reduce</text><line x1="500.0" y1="636.0" x2="500.0" y2="740.0" style="stroke:#b9b8b2;stroke-width:1.5;stroke-dasharray:5 4"/><polygon points="500.0,740.0 496.3,731.8 503.7,731.8" style="fill:#b9b8b2"/><rect x="503.0" y="675.0" width="161.2" height="19" rx="3" style="fill:#0d1117"/><text x="508.0" y="688.0" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">agreeing on one history</text><rect x="30" y="20" width="210" height="76" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="42.0" y="45.2" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">1. Support Vector</text><text x="42.0" y="65.0" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Machines</text><text x="42.0" y="82.3" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">1992–1995</text><rect x="395" y="20" width="210" height="76" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="407.0" y="35.3" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">2. Approximation by</text><text x="407.0" y="55.1" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Semidefinite</text><text x="407.0" y="74.9" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Programming</text><text x="407.0" y="92.2" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">1994–1995</text><rect x="760" y="20" width="210" height="76" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="772.0" y="55.2" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">3. Streaming Sketches</text><text x="772.0" y="72.4" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">1996</text><rect x="30" y="200" width="210" height="76" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="42.0" y="225.2" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">6. Long Short-Term</text><text x="42.0" y="245.1" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Memory</text><text x="42.0" y="262.3" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">1997</text><rect x="395" y="200" width="210" height="76" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="407.0" y="235.2" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">12. Compressed Sensing</text><text x="407.0" y="252.4" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">2004–2006</text><rect x="760" y="200" width="210" height="76" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="772.0" y="215.4" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">5. MinHash and</text><text x="772.0" y="235.2" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Locality-Sensitive</text><text x="772.0" y="255.0" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Hashing</text><text x="772.0" y="272.2" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">1997–1998</text><rect x="30" y="380" width="210" height="76" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="42.0" y="415.2" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">4. Consistent Hashing</text><text x="42.0" y="432.4" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">1997</text><rect x="395" y="380" width="210" height="76" style="fill:#0d1117;stroke:#f0584d;stroke-width:3"/><text x="407.0" y="415.2" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">7. PageRank</text><text x="407.0" y="432.4" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">1998</text><rect x="760" y="380" width="210" height="76" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="772.0" y="405.2" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">9. Genome Assembly with</text><text x="772.0" y="425.1" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">de Bruijn Graphs</text><text x="772.0" y="442.3" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">1995–2001</text><rect x="30" y="560" width="210" height="76" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="42.0" y="595.1" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">11. MapReduce</text><text x="42.0" y="612.4" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">2004</text><rect x="395" y="560" width="210" height="76" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="407.0" y="595.1" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">8. Paxos</text><text x="407.0" y="612.4" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">1989–1998</text><rect x="760" y="560" width="210" height="76" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="772.0" y="595.1" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">10. PRIMES is in P</text><text x="772.0" y="612.4" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">2002</text><rect x="395" y="740" width="210" height="76" style="fill:#0d1117;stroke:#f0584d;stroke-width:3"/><text x="407.0" y="765.2" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">13. Bitcoin&#x27;s</text><text x="407.0" y="785.0" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Proof-of-Work Ledger</text><text x="407.0" y="802.3" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">2008</text></svg>
