<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" role="img" aria-label="How fully homomorphic encryption combined older ideas, and where it led" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>How fully homomorphic encryption combined older ideas, and where it led</title><line x1="125.0" y1="124.0" x2="426.5" y2="180.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="426.5,180.0 417.8,182.1 419.1,174.9" style="fill:#b9b8b2"/><line x1="500.0" y1="124.0" x2="500.0" y2="180.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="500.0,180.0 496.3,171.8 503.7,171.8" style="fill:#b9b8b2"/><rect x="503.0" y="139.0" width="69.0" height="19" rx="3" style="fill:#0d1117"/><text x="508.0" y="152.0" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">answered</text><line x1="875.0" y1="124.0" x2="573.5" y2="180.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="573.5,180.0 580.9,174.9 582.2,182.1" style="fill:#b9b8b2"/><line x1="426.5" y1="284.0" x2="125.0" y2="340.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="125.0,340.0 132.4,334.9 133.7,342.1" style="fill:#b9b8b2"/><line x1="573.5" y1="284.0" x2="875.0" y2="340.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="875.0,340.0 866.3,342.1 867.6,334.9" style="fill:#b9b8b2"/><line x1="500.0" y1="284.0" x2="500.0" y2="490.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="500.0,490.0 496.3,481.8 503.7,481.8" style="fill:#b9b8b2"/><rect x="503.0" y="374.0" width="72.7" height="19" rx="3" style="fill:#0d1117"/><text x="508.0" y="387.0" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">a relative</text><rect x="20" y="20" width="210" height="104" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="32.0" y="42.8" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Public-key</text><text x="32.0" y="62.5" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">cryptography</text><text x="32.0" y="79.8" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">RSA can multiply ciphertexts,</text><text x="32.0" y="96.3" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">not add them</text><text x="32.0" y="112.8" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">Era 6</text><rect x="395" y="20" width="210" height="104" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="407.0" y="60.9" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Privacy homomorphisms</text><text x="407.0" y="78.2" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">compute on encrypted data?</text><text x="407.0" y="94.7" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">Rivest, Adleman, Dertouzos, 1978</text><rect x="770" y="20" width="210" height="104" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="782.0" y="52.7" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Lattices and noise</text><text x="782.0" y="69.9" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">hard problems with small</text><text x="782.0" y="86.4" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">errors</text><text x="782.0" y="102.9" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">1990s–2005</text><rect x="395" y="180" width="210" height="104" style="fill:#0d1117;stroke:#f0584d;stroke-width:3"/><text x="407.0" y="202.8" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Fully homomorphic</text><text x="407.0" y="222.6" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">encryption</text><text x="407.0" y="239.8" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">⊕ bootstrapping: decrypt,</text><text x="407.0" y="256.3" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">encrypted</text><text x="407.0" y="272.8" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">Gentry, Stanford, 2009</text><rect x="20" y="340" width="210" height="104" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="32.0" y="372.7" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Over the integers</text><text x="32.0" y="389.9" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">c = pq + 2r + m</text><text x="32.0" y="406.4" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">van Dijk, Gentry, Halevi,</text><text x="32.0" y="422.9" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">Vaikuntanathan, 2010</text><rect x="770" y="340" width="210" height="104" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="782.0" y="389.2" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Later generations</text><text x="782.0" y="406.4" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">BGV 2011, GSW 2013, CKKS 2016</text><rect x="395" y="490" width="210" height="104" style="fill:#0d1117;stroke:#5b8fe0;stroke-width:3"/><text x="407.0" y="522.6" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">ML-KEM</text><text x="407.0" y="539.9" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">the same kind of noisy</text><text x="407.0" y="556.4" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">algebra, for key exchange</text><text x="407.0" y="572.9" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">topic 10</text><text x="20.0" y="615.0" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">ML-KEM (topic 10) does not compute on ciphertexts; it shares the idea of hiding a secret under small noise.</text></svg>
