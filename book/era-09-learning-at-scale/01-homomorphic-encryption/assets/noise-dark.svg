<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 304" width="760" height="304" role="img" aria-label="Noise growth under repeated multiplication" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>Noise growth under repeated multiplication</title><text x="20.0" y="26.0" text-anchor="start" style="fill:#ecebe6;font-size:13px;font-weight:700">Noise in bits after each level of multiplication (secret p of 512 bits)</text><text x="110.0" y="66.0" text-anchor="end" style="fill:#ecebe6;font-size:12px;font-weight:400">fresh</text><rect x="120.0" y="50.0" width="28.3" height="22.0" rx="0" style="fill:#5b8fe0"/><text x="154.3" y="66.0" text-anchor="start" style="fill:#ecebe6;font-size:12px;font-weight:400">25 bits</text><text x="110.0" y="100.0" text-anchor="end" style="fill:#ecebe6;font-size:12px;font-weight:400">depth 1</text><rect x="120.0" y="84.0" width="54.4" height="22.0" rx="0" style="fill:#5b8fe0"/><text x="180.4" y="100.0" text-anchor="start" style="fill:#ecebe6;font-size:12px;font-weight:400">48 bits</text><text x="110.0" y="134.0" text-anchor="end" style="fill:#ecebe6;font-size:12px;font-weight:400">depth 2</text><rect x="120.0" y="118.0" width="107.6" height="22.0" rx="0" style="fill:#5b8fe0"/><text x="233.6" y="134.0" text-anchor="start" style="fill:#ecebe6;font-size:12px;font-weight:400">95 bits</text><text x="110.0" y="168.0" text-anchor="end" style="fill:#ecebe6;font-size:12px;font-weight:400">depth 3</text><rect x="120.0" y="152.0" width="210.7" height="22.0" rx="0" style="fill:#5b8fe0"/><text x="336.7" y="168.0" text-anchor="start" style="fill:#ecebe6;font-size:12px;font-weight:400">186 bits</text><text x="110.0" y="202.0" text-anchor="end" style="fill:#ecebe6;font-size:12px;font-weight:400">depth 4</text><rect x="120.0" y="186.0" width="428.2" height="22.0" rx="0" style="fill:#5b8fe0"/><text x="554.2" y="202.0" text-anchor="start" style="fill:#ecebe6;font-size:12px;font-weight:400">378 bits</text><text x="110.0" y="236.0" text-anchor="end" style="fill:#ecebe6;font-size:12px;font-weight:400">depth 5</text><rect x="120.0" y="220.0" width="580.0" height="22.0" rx="0" style="fill:#f0584d"/><text x="706.0" y="236.0" text-anchor="start" style="fill:#f0584d;font-size:12px;font-weight:400">fails: wrapped past p/2</text><line x1="698.9" y1="40.0" x2="698.9" y2="254.0" style="stroke:#f0584d;stroke-width:2;stroke-dasharray:5 4"/><text x="698.9" y="272.0" text-anchor="end" style="fill:#f0584d;font-size:12px;font-weight:400">p/2: beyond this, decryption breaks</text></svg>
