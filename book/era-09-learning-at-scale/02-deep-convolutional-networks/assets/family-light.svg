<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="1000" height="660" role="img" aria-label="How AlexNet combined older ideas, and where it led" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>How AlexNet combined older ideas, and where it led</title><line x1="125.0" y1="124.0" x2="426.5" y2="190.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="426.5,190.0 417.7,191.8 419.3,184.7" style="fill:#55545a"/><line x1="500.0" y1="124.0" x2="500.0" y2="190.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="500.0,190.0 496.3,181.8 503.7,181.8" style="fill:#55545a"/><line x1="875.0" y1="124.0" x2="573.5" y2="190.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="573.5,190.0 580.7,184.7 582.3,191.8" style="fill:#55545a"/><line x1="426.5" y1="294.0" x2="125.0" y2="360.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="125.0,360.0 132.2,354.7 133.8,361.8" style="fill:#55545a"/><line x1="573.5" y1="294.0" x2="875.0" y2="360.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="875.0,360.0 866.2,361.8 867.8,354.7" style="fill:#55545a"/><line x1="500.0" y1="294.0" x2="500.0" y2="520.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="500.0,520.0 496.3,511.8 503.7,511.8" style="fill:#55545a"/><rect x="20" y="20" width="210" height="104" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="32.0" y="52.7" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Convolutional networks</text><text x="32.0" y="69.9" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">shared filters slide over the</text><text x="32.0" y="86.4" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">image</text><text x="32.0" y="102.9" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">Fukushima 1980; LeCun 1989</text><rect x="395" y="20" width="210" height="104" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="407.0" y="52.7" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Backpropagation</text><text x="407.0" y="69.9" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">gradients through every</text><text x="407.0" y="86.4" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">layer</text><text x="407.0" y="102.9" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">Era 7</text><rect x="770" y="20" width="210" height="104" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="782.0" y="52.7" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">GPUs and ImageNet</text><text x="782.0" y="69.9" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">graphics cards; a million</text><text x="782.0" y="86.4" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">labelled photos</text><text x="782.0" y="102.9" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">2000s</text><rect x="395" y="190" width="210" height="104" style="fill:#ffffff;stroke:#d5352a;stroke-width:3"/><text x="407.0" y="222.7" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">AlexNet</text><text x="407.0" y="239.9" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">⊕ ReLU, dropout, two GPUs</text><text x="407.0" y="256.4" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">Krizhevsky, Sutskever, Hinton,</text><text x="407.0" y="272.9" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">2012</text><rect x="20" y="360" width="210" height="104" style="fill:#ffffff;stroke:#1f5ba8;stroke-width:3"/><text x="32.0" y="400.9" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Residual networks</text><text x="32.0" y="418.2" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">hundreds of layers</text><text x="32.0" y="434.7" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">topic 7, 2015</text><rect x="770" y="360" width="210" height="104" style="fill:#ffffff;stroke:#1f5ba8;stroke-width:3"/><text x="782.0" y="400.9" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Adam</text><text x="782.0" y="418.2" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">steps that set themselves</text><text x="782.0" y="434.7" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">topic 5, 2014</text><rect x="395" y="520" width="210" height="104" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="407.0" y="542.8" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Deep learning</text><text x="407.0" y="562.5" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">everywhere</text><text x="407.0" y="579.8" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">speech, translation, Go,</text><text x="407.0" y="596.3" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">images from noise</text><text x="407.0" y="612.8" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">this era</text></svg>
