<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="1000" height="660" role="img" aria-label="How word2vec combined older ideas, and where it led" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>How word2vec combined older ideas, and where it led</title><line x1="125.0" y1="124.0" x2="426.5" y2="190.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="426.5,190.0 417.7,191.8 419.3,184.7" style="fill:#55545a"/><line x1="500.0" y1="124.0" x2="500.0" y2="190.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="500.0,190.0 496.3,181.8 503.7,181.8" style="fill:#55545a"/><line x1="875.0" y1="124.0" x2="573.5" y2="190.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="573.5,190.0 580.7,184.7 582.3,191.8" style="fill:#55545a"/><line x1="426.5" y1="294.0" x2="125.0" y2="360.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="125.0,360.0 132.2,354.7 133.8,361.8" style="fill:#55545a"/><line x1="573.5" y1="294.0" x2="875.0" y2="360.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="875.0,360.0 866.2,361.8 867.8,354.7" style="fill:#55545a"/><line x1="500.0" y1="294.0" x2="500.0" y2="520.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="500.0,520.0 496.3,511.8 503.7,511.8" style="fill:#55545a"/><rect x="20" y="20" width="210" height="104" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="32.0" y="42.8" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Distributional</text><text x="32.0" y="62.5" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">hypothesis</text><text x="32.0" y="79.8" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">a word is known by its</text><text x="32.0" y="96.3" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">company</text><text x="32.0" y="112.8" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">linguistics, 1950s</text><rect x="395" y="20" width="210" height="104" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="407.0" y="52.7" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Neural language models</text><text x="407.0" y="69.9" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">words as learned vectors,</text><text x="407.0" y="86.4" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">slow</text><text x="407.0" y="102.9" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">2000s</text><rect x="770" y="20" width="210" height="104" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="782.0" y="52.7" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Huffman&#x27;s codes</text><text x="782.0" y="69.9" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">a tree for the hierarchical</text><text x="782.0" y="86.4" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">softmax</text><text x="782.0" y="102.9" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">Era 5</text><rect x="395" y="190" width="210" height="104" style="fill:#ffffff;stroke:#d5352a;stroke-width:3"/><text x="407.0" y="214.4" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">word2vec</text><text x="407.0" y="231.7" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">⊕ shallow models, negative</text><text x="407.0" y="248.2" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">sampling, billions of words</text><text x="407.0" y="264.6" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">Mikolov and colleagues, Google,</text><text x="407.0" y="281.1" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">2013</text><rect x="20" y="360" width="210" height="104" style="fill:#ffffff;stroke:#1f5ba8;stroke-width:3"/><text x="32.0" y="400.9" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Subword tokens</text><text x="32.0" y="418.2" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">vectors for pieces of words</text><text x="32.0" y="434.7" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">topic 6, 2015</text><rect x="770" y="360" width="210" height="104" style="fill:#ffffff;stroke:#1f5ba8;stroke-width:3"/><text x="782.0" y="392.7" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">The Transformer</text><text x="782.0" y="409.9" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">every token starts as a</text><text x="782.0" y="426.4" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">vector</text><text x="782.0" y="442.9" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">topic 9, 2017</text><rect x="395" y="520" width="210" height="104" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="407.0" y="552.6" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Language models</text><text x="407.0" y="569.9" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">embeddings learned with</text><text x="407.0" y="586.4" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">everything else</text><text x="407.0" y="602.9" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">after 2017</text><text x="20.0" y="645.0" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">The distributional hypothesis is attributed to Firth; his text was not opened, so the box gives no quotation.</text></svg>
