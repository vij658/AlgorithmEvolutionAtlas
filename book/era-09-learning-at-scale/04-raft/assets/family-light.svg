<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" role="img" aria-label="How Raft combined older ideas, and where it led" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>How Raft combined older ideas, and where it led</title><line x1="165.0" y1="124.0" x2="412.5" y2="200.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="412.5,200.0 403.6,201.1 405.7,194.1" style="fill:#55545a"/><line x1="500.0" y1="124.0" x2="500.0" y2="200.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="500.0,200.0 496.3,191.8 503.7,191.8" style="fill:#55545a"/><line x1="835.0" y1="124.0" x2="587.5" y2="200.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="587.5,200.0 594.3,194.1 596.4,201.1" style="fill:#55545a"/><line x1="412.5" y1="304.0" x2="165.0" y2="380.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="165.0,380.0 171.8,374.1 173.9,381.1" style="fill:#55545a"/><line x1="587.5" y1="304.0" x2="835.0" y2="380.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="835.0,380.0 826.1,381.1 828.2,374.1" style="fill:#55545a"/><rect x="40" y="20" width="250" height="104" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="52.0" y="52.7" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Paxos</text><text x="52.0" y="69.9" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">agreement in spite of loss and</text><text x="52.0" y="86.4" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">crashes, hard to explain</text><text x="52.0" y="102.9" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">Era 8, topic 8</text><rect x="375" y="20" width="250" height="104" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="387.0" y="60.9" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Randomized timeouts</text><text x="387.0" y="78.2" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">break the symmetry between</text><text x="387.0" y="94.7" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">candidates</text><rect x="710" y="20" width="250" height="104" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="722.0" y="60.9" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Replicated log</text><text x="722.0" y="78.2" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">the same commands in the same</text><text x="722.0" y="94.7" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">order on every server</text><rect x="375" y="200" width="250" height="104" style="fill:#ffffff;stroke:#d5352a;stroke-width:3"/><text x="387.0" y="232.7" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Raft</text><text x="387.0" y="249.9" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">⊕ a strong leader, terms, and five</text><text x="387.0" y="266.4" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">safety rules</text><text x="387.0" y="282.9" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">Ongaro and Ousterhout, Stanford, 2014</text><rect x="40" y="380" width="250" height="104" style="fill:#ffffff;stroke:#1f5ba8;stroke-width:3"/><text x="52.0" y="412.7" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">A user study</text><text x="52.0" y="429.9" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">43 students, quizzes on Raft and</text><text x="52.0" y="446.4" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">Paxos</text><text x="52.0" y="462.9" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">the same paper</text><rect x="710" y="380" width="250" height="104" style="fill:#ffffff;stroke:#1f5ba8;stroke-width:3"/><text x="722.0" y="412.7" t