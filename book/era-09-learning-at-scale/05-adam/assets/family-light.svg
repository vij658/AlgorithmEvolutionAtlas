<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" role="img" aria-label="How Adam combined older ideas, and where it led" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>How Adam combined older ideas, and where it led</title><line x1="130.0" y1="124.0" x2="409.0" y2="200.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="409.0,200.0 400.1,201.4 402.0,194.3" style="fill:#55545a"/><line x1="375.0" y1="124.0" x2="468.4" y2="200.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="468.4,200.0 459.7,197.7 464.3,192.0" style="fill:#55545a"/><line x1="620.0" y1="124.0" x2="525.6" y2="200.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="525.6,200.0 529.7,192.0 534.3,197.7" style="fill:#55545a"/><line x1="865.0" y1="124.0" x2="585.0" y2="200.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="585.0,200.0 592.0,194.3 593.9,201.4" style="fill:#55545a"/><line x1="431.0" y1="304.0" x2="250.0" y2="380.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="250.0,380.0 256.2,373.4 259.0,380.2" style="fill:#55545a"/><line x1="563.0" y1="304.0" x2="745.0" y2="380.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="745.0,380.0 736.0,380.2 738.8,373.4" style="fill:#55545a"/><rect x="20" y="20" width="220" height="104" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="32.0" y="51.0" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Stochastic gradient</text><text x="32.0" y="70.8" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">descent</text><text x="32.0" y="88.0" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">step against a noisy gradient</text><text x="32.0" y="104.5" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">Robbins and Monro, 1951</text><rect x="265" y="20" width="220" height="104" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="277.0" y="52.7" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Momentum</text><text x="277.0" y="69.9" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">keep moving the way you were</text><text x="277.0" y="86.4" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">going</text><text x="277.0" y="102.9" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">backpropagation paper, 1986</text><rect x="510" y="20" width="220" height="104" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="522.0" y="52.7" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">AdaGrad</text><text x="522.0" y="69.9" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">divide by the size of all past</text><text x="522.0" y="86.4" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">gradients</text><text x="522.0" y="102.9" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">2011</text><rect x="755" y="20" width="220" height="104" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="767.0" y="52.7" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">RMSProp</text><text x="767.0" y="69.9" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">the same, forgetting the</text><text x="767.0" y="86.4" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">distant past</text><text x="767.0" y="102.9" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">a Coursera lecture</text><rect x="387" y="200" width="220" height="104" style="fill:#ffffff;stroke:#d5352a;stroke-width:3"/><text x="399.0" y="232.7" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Adam</text><text x="399.0" y="249.9" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">⊕ momentum, RMSProp and a</text><text x="399.0" y="266.4" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">correction for the zero start</text><text x="399.0" y="282.9" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">Kingma and Ba, 2014</text><rect x="140" y="380" width="220" height="104" style="fill:#ffffff;stroke:#1f5ba8;stroke-width:3"/><text x="152.0" y="420.9" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">AMSGrad</text><text x="152.0" y="438.2" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">keep the largest mean square</text><text x="152.0" y="454.7" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">so far</text><rect x="635" y="380" width="220" height="104" style="fill:#ffffff;stroke:#1f5ba8;stroke-width:3"/><text x="647.0" y="420.9" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Training large networks</text><text x="647.0" y="438.2" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">the Transformer (topic 9) and</text><text x="647.0" y="454.7" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">after</text></svg>
