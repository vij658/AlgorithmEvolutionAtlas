<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" role="img" aria-label="How subword units combined older ideas, and where they led" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>How subword units combined older ideas, and where they led</title><line x1="165.0" y1="124.0" x2="412.5" y2="200.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="412.5,200.0 403.6,201.1 405.7,194.1" style="fill:#55545a"/><line x1="500.0" y1="124.0" x2="500.0" y2="200.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="500.0,200.0 496.3,191.8 503.7,191.8" style="fill:#55545a"/><line x1="835.0" y1="124.0" x2="587.5" y2="200.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="587.5,200.0 594.3,194.1 596.4,201.1" style="fill:#55545a"/><line x1="412.5" y1="304.0" x2="165.0" y2="380.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="165.0,380.0 171.8,374.1 173.9,381.1" style="fill:#55545a"/><line x1="587.5" y1="304.0" x2="835.0" y2="380.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="835.0,380.0 826.1,381.1 828.2,374.1" style="fill:#55545a"/><rect x="40" y="20" width="250" height="104" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="52.0" y="52.7" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Gage&#x27;s byte-pair encoding</text><text x="52.0" y="69.9" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">replace the most frequent pair,</text><text x="52.0" y="86.4" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">again and again</text><text x="52.0" y="102.9" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">The C Users Journal, 1994</text><rect x="375" y="20" width="250" height="104" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="387.0" y="69.2" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Neural translation</text><text x="387.0" y="86.4" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">a fixed vocabulary of whole words</text><rect x="710" y="20" width="250" height="104" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="722.0" y="60.9" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Word vectors</text><text x="722.0" y="78.2" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">a row of numbers for every symbol</text><text x="722.0" y="94.7" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">topic 3, 2013</text><rect x="375" y="200" width="250" height="104" style="fill:#ffffff;stroke:#d5352a;stroke-width:3"/><text x="387.0" y="224.4" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Subword units</text><text x="387.0" y="241.7" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">⊕ merges learned on letters; any</text><text x="387.0" y="258.1" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">word can be spelled</text><text x="387.0" y="274.6" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">Sennrich, Haddow and Birch, Edinburgh,</text><text x="387.0" y="291.1" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">2015</text><rect x="40" y="380" width="250" height="104" style="fill:#ffffff;stroke:#1f5ba8;stroke-width:3"/><text x="52.0" y="429.2" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Byte-level BPE</text><text x="52.0" y="446.4" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">start from the 256 bytes of UTF-8</text><rect x="710" y="380" width="250" height="104" style="fill:#ffffff;stroke:#1f5ba8;stroke-width:3"/><text x="722.0" y="429.2" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Language-model tokens</text><text x="722.0" y="446.4" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">the Transformer&#x27;s input (topic 9)</text></svg>
