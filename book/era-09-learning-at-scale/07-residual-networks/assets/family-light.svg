<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" role="img" aria-label="How residual networks combined older ideas, and where they led" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>How residual networks combined older ideas, and where they led</title><line x1="165.0" y1="124.0" x2="412.5" y2="200.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="412.5,200.0 403.6,201.1 405.7,194.1" style="fill:#55545a"/><line x1="500.0" y1="124.0" x2="500.0" y2="200.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="500.0,200.0 496.3,191.8 503.7,191.8" style="fill:#55545a"/><line x1="835.0" y1="124.0" x2="587.5" y2="200.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="587.5,200.0 594.3,194.1 596.4,201.1" style="fill:#55545a"/><line x1="412.5" y1="304.0" x2="165.0" y2="380.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="165.0,380.0 171.8,374.1 173.9,381.1" style="fill:#55545a"/><line x1="587.5" y1="304.0" x2="835.0" y2="380.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="835.0,380.0 826.1,381.1 828.2,374.1" style="fill:#55545a"/><rect x="40" y="20" width="250" height="104" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="52.0" y="52.7" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Deep convolutional networks</text><text x="52.0" y="69.9" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">more layers, better results, up to a</text><text x="52.0" y="86.4" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">point</text><text x="52.0" y="102.9" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">topic 2, 2012</text><rect x="375" y="20" width="250" height="104" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="387.0" y="52.7" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">The LSTM&#x27;s cell state</text><text x="387.0" y="69.9" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">a path along which the signal is</text><text x="387.0" y="86.4" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">added to, not rewritten</text><text x="387.0" y="102.9" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">Era 8</text><rect x="710" y="20" width="250" height="104" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="722.0" y="52.7" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Highway networks</text><text x="722.0" y="69.9" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">gated shortcuts in a feed-forward</text><text x="722.0" y="86.4" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">network</text><text x="722.0" y="102.9" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">2015</text><rect x="375" y="200" width="250" height="104" style="fill:#ffffff;stroke:#d5352a;stroke-width:3"/><text x="387.0" y="232.7" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Residual networks</text><text x="387.0" y="249.9" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">⊕ identity shortcuts: y = F(x) + x</text><text x="387.0" y="266.4" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">He, Zhang, Ren and Sun, Microsoft</text><text x="387.0" y="282.9" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">Research, 2015</text><rect x="40" y="380" width="250" height="104" style="fill:#ffffff;stroke:#1f5ba8;stroke-width:3"/><text x="52.0" y="420.9" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">The Transformer</text><text x="52.0" y="438.2" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">residual connections throughout</text><text x="52.0" y="454.7" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">topic 9, 2017</text><rect x="710" y="380" width="250" height="104" style="fill:#ffffff;stroke:#1f5ba8;stroke-width:3"/><text x="722.0" y="429.2" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">AlphaGo Zero, AlphaFold</text><text x="722.0" y="446.4" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">deep residual networks at work</text></svg>
