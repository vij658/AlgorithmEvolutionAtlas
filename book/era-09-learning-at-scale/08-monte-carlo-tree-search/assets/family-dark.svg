<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" role="img" aria-label="How AlphaGo&#x27;s search combined older ideas, and where it led" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>How AlphaGo&#x27;s search combined older ideas, and where it led</title><line x1="130.0" y1="124.0" x2="298.0" y2="200.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="298.0,200.0 289.0,200.0 292.0,193.3" style="fill:#b9b8b2"/><line x1="375.0" y1="124.0" x2="375.0" y2="200.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="375.0,200.0 371.3,191.8 378.7,191.8" style="fill:#b9b8b2"/><line x1="620.0" y1="124.0" x2="452.0" y2="200.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="452.0,200.0 458.0,193.3 461.0,200.0" style="fill:#b9b8b2"/><line x1="485.0" y1="252.0" x2="630.0" y2="252.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="630.0,252.0 621.8,255.7 621.8,248.3" style="fill:#b9b8b2"/><line x1="865.0" y1="124.0" x2="784.0" y2="200.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="784.0,200.0 787.5,191.7 792.5,197.1" style="fill:#b9b8b2"/><line x1="740.0" y1="304.0" x2="740.0" y2="380.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="740.0,380.0 736.3,371.8 743.7,371.8" style="fill:#b9b8b2"/><rect x="20" y="20" width="220" height="104" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="32.0" y="60.9" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Game-tree search</text><text x="32.0" y="78.2" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">look ahead, score positions,</text><text x="32.0" y="94.7" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">back up the best</text><rect x="265" y="20" width="220" height="104" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="277.0" y="52.7" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Random playouts</text><text x="277.0" y="69.9" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">judge a position by playing it</text><text x="277.0" y="86.4" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">out at random</text><text x="277.0" y="102.9" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">Abramson, 1987; Brügmann, 1992</text><rect x="510" y="20" width="220" height="104" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="522.0" y="60.9" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">UCB1</text><text x="522.0" y="78.2" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">a bandit formula: win rate plus</text><text x="522.0" y="94.7" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">a bonus for few tries</text><rect x="755" y="20" width="220" height="104" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="767.0" y="60.9" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Deep networks</text><text x="767.0" y="78.2" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">learn to propose and to judge</text><text x="767.0" y="94.7" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">topics 2 and 7</text><rect x="265" y="200" width="220" height="104" style="fill:#0d1117;stroke:#f0584d;stroke-width:3"/><text x="277.0" y="224.4" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">MCTS and UCT</text><text x="277.0" y="241.7" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">⊕ a tree grown from playouts,</text><text x="277.0" y="258.1" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">guided by UCB1</text><text x="277.0" y="274.6" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">Coulom; Kocsis and Szepesvári,</text><text x="277.0" y="291.1" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">2006</text><rect x="630" y="200" width="220" height="104" style="fill:#0d1117;stroke:#f0584d;stroke-width:3"/><text x="642.0" y="232.7" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">AlphaGo</text><text x="642.0" y="249.9" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">⊕ policy and value networks</text><text x="642.0" y="266.4" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">inside the search</text><text x="642.0" y="282.9" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">DeepMind, 2016</text><rect x="630" y="380" width="220" height="104" style="fill:#0d1117;stroke:#5b8fe0;stroke-width:3"/><text x="642.0" y="412.7" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">AlphaZero</text><text x="642.0" y="429.9" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">no playouts: the value network</text><text x="642.0" y="446.4" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">judges</text><text x="642.0" y="462.9" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">2017</text><text x="20.0" y="505.0" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">Game-tree search means looking ahead move by move, as chess programs did; UCB1 comes from the study of multi-armed bandits.</text></svg>
