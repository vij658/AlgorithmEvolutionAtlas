<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" role="img" aria-label="How the Transformer combined older ideas, and where it led" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>How the Transformer combined older ideas, and where it led</title><line x1="130.0" y1="124.0" x2="409.0" y2="200.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="409.0,200.0 400.1,201.4 402.0,194.3" style="fill:#b9b8b2"/><line x1="375.0" y1="124.0" x2="468.4" y2="200.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="468.4,200.0 459.7,197.7 464.3,192.0" style="fill:#b9b8b2"/><line x1="620.0" y1="124.0" x2="525.6" y2="200.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="525.6,200.0 529.7,192.0 534.3,197.7" style="fill:#b9b8b2"/><line x1="865.0" y1="124.0" x2="585.0" y2="200.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="585.0,200.0 592.0,194.3 593.9,201.4" style="fill:#b9b8b2"/><line x1="431.0" y1="304.0" x2="250.0" y2="380.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="250.0,380.0 256.2,373.4 259.0,380.2" style="fill:#b9b8b2"/><line x1="563.0" y1="304.0" x2="745.0" y2="380.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="745.0,380.0 736.0,380.2 738.8,373.4" style="fill:#b9b8b2"/><rect x="20" y="20" width="220" height="104" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="32.0" y="60.9" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Recurrent networks</text><text x="32.0" y="78.2" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">read one word at a time</text><text x="32.0" y="94.7" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">Era 7; the LSTM, Era 8</text><rect x="265" y="20" width="220" height="104" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="277.0" y="60.9" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Attention for translation</text><text x="277.0" y="78.2" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">look back at every input word</text><text x="277.0" y="94.7" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">Bahdanau, Cho and Bengio, 2014</text><rect x="510" y="20" width="220" height="104" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="522.0" y="51.0" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Word vectors and</text><text x="522.0" y="70.8" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">subwords</text><text x="522.0" y="88.0" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">every token a learned vector</text><text x="522.0" y="104.5" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">topics 3 and 6</text><rect x="755" y="20" width="220" height="104" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="767.0" y="52.7" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Residual connections</text><text x="767.0" y="69.9" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">add each layer&#x27;s input to its</text><text x="767.0" y="86.4" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">output</text><text x="767.0" y="102.9" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">topic 7, 2015</text><rect x="387" y="200" width="220" height="104" style="fill:#0d1117;stroke:#f0584d;stroke-width:3"/><text x="399.0" y="224.4" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">The Transformer</text><text x="399.0" y="241.7" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">⊕ attention only, many heads,</text><text x="399.0" y="258.1" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">positions as sinusoids</text><text x="399.0" y="274.6" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">Vaswani and seven co-authors,</text><text x="399.0" y="291.1" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">Google, 2017</text><rect x="140" y="380" width="220" height="104" style="fill:#0d1117;stroke:#5b8fe0;stroke-width:3"/><text x="152.0" y="412.7" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">FlashAttention</text><text x="152.0" y="429.9" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">the same attention, computed</text><text x="152.0" y="446.4" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">in tiles</text><text x="152.0" y="462.9" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">topic 12, 2022</text><rect x="635" y="380" width="220" height="104" style="fill:#0d1117;stroke:#5b8fe0;stroke-width:3"/><text x="647.0" y="429.2" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Language models</text><text x="647.0" y="446.4" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">stacks of Transformer layers</text></svg>
