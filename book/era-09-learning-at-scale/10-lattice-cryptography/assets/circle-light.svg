<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" role="img" aria-label="How ML-KEM decryption reads bits, and how much noise it tolerates" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>How ML-KEM decryption reads bits, and how much noise it tolerates</title><text x="20.0" y="26.0" text-anchor="start" style="fill:#17171a;font-size:13px;font-weight:700">Decryption reads each coefficient of v − sᵀu on a circle of 3,329 steps</text><circle cx="200" cy="200" r="130" style="fill:none;stroke:#d9d8d1;stroke-width:2"/><circle cx="200.0" cy="70.0" r="7.0" style="fill:#1f5ba8"/><text x="214.0" y="64.0" text-anchor="start" style="fill:#17171a;font-size:13px;font-weight:700">0</text><circle cx="200.0" cy="330.0" r="7.0" style="fill:#d5352a"/><text x="214.0" y="348.0" text-anchor="start" style="fill:#17171a;font-size:13px;font-weight:700">q/2</text><line x1="312.0" y1="200.0" x2="348.0" y2="200.0" style="stroke:#17171a;stroke-width:2"/><line x1="88.0" y1="200.0" x2="52.0" y2="200.0" style="stroke:#17171a;stroke-width:2"/><text x="200.0" y="194.0" text-anchor="middle" style="fill:#7d7c84;font-size:12px;font-weight:400">reads 0 above,</text><text x="200.0" y="212.0" text-anchor="middle" style="fill:#7d7c84;font-size:12px;font-weight:400">1 below</text><text x="400.0" y="70.0" text-anchor="start" style="fill:#17171a;font-size:12px;font-weight:700">Largest noise seen, against the margin q/4 = 832</text><text x="400.0" y="105.0" text-anchor="start" style="fill:#17171a;font-size:12px;font-weight:400">ML-KEM-512</text><rect x="500.0" y="90.0" width="42.8" height="20.0" rx="2" style="fill:#1f5ba8"/><line x1="610.0" y1="86.0" x2="610.0" y2="114.0" style="stroke:#d5352a;stroke-width:2"/><text x="547.8" y="105.0" text-anchor="start" style="fill:#17171a;font-size:12px;font-weight:400">324</text><text x="400.0" y="145.0" text-anchor="start" style="fill:#17171a;font-size:12px;font-weight:400">ML-KEM-768</text><rect x="500.0" y="130.0" width="37.7" height="20.0" rx="2" style="fill:#1f5ba8"/><line x1="610.0" y1="126.0" x2="610.0" y2="154.0" style="stroke:#d5352a;stroke-width:2"/><text x="542.7" y="145.0" text-anchor="start" style="fill:#17171a;font-size:12px;font-weight:400">285</text><text x="400.0" y="185.0" text-anchor="start" style="fill:#17171a;font-size:12px;font-weight:400">ML-KEM-1024</text><rect x="500.0" y="170.0" width="34.5" height="20.0" rx="2" style="fill:#1f5ba8"/><line x1="610.0" y1="166.0" x2="610.0" y2="194.0" style="stroke:#d5352a;stroke-width:2"/><text x="539.5" y="185.0" text-anchor="start" style="fill:#17171a;font-size:12px;font-weight:400">261</text><text x="610.0" y="230.0" text-anchor="middle" style="fill:#d5352a;font-size:11px;font-weight:400">margin</text><text x="20.0" y="366.0" text-anchor="start" style="fill:#7d7c84;font-size:12px;font-weight:400">A 0 is sent as 0 and a 1 as about q/2; noise moves each coefficient along the circle. Past a quarter turn, the bit flips.</text></svg>
