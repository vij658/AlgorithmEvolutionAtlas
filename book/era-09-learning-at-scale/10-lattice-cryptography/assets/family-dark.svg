<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" role="img" aria-label="How ML-KEM combined older ideas, and where it led" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>How ML-KEM combined older ideas, and where it led</title><line x1="130.0" y1="124.0" x2="409.0" y2="200.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="409.0,200.0 400.1,201.4 402.0,194.3" style="fill:#b9b8b2"/><line x1="375.0" y1="124.0" x2="468.4" y2="200.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="468.4,200.0 459.7,197.7 464.3,192.0" style="fill:#b9b8b2"/><line x1="620.0" y1="124.0" x2="525.6" y2="200.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="525.6,200.0 529.7,192.0 534.3,197.7" style="fill:#b9b8b2"/><line x1="865.0" y1="124.0" x2="585.0" y2="200.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="585.0,200.0 592.0,194.3 593.9,201.4" style="fill:#b9b8b2"/><line x1="431.0" y1="304.0" x2="250.0" y2="380.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="250.0,380.0 256.2,373.4 259.0,380.2" style="fill:#b9b8b2"/><line x1="563.0" y1="304.0" x2="745.0" y2="380.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="745.0,380.0 736.0,380.2 738.8,373.4" style="fill:#b9b8b2"/><rect x="20" y="20" width="220" height="104" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="32.0" y="52.7" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Public-key cryptography</text><text x="32.0" y="69.9" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">anyone can lock, only the key</text><text x="32.0" y="86.4" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">holder can open</text><text x="32.0" y="102.9" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">Era 6, topic 10</text><rect x="265" y="20" width="220" height="104" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="277.0" y="52.7" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Shor&#x27;s algorithm</text><text x="277.0" y="69.9" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">a quantum computer would</text><text x="277.0" y="86.4" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">break RSA and Diffie–Hellman</text><text x="277.0" y="102.9" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">Era 7, topic 11</text><rect x="510" y="20" width="220" height="104" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="522.0" y="52.7" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Learning with errors</text><text x="522.0" y="69.9" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">linear equations nudged by</text><text x="522.0" y="86.4" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">small errors</text><text x="522.0" y="102.9" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">Regev, 2005</text><rect x="755" y="20" width="220" height="104" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="767.0" y="51.0" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">The fast Fourier</text><text x="767.0" y="70.8" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">transform</text><text x="767.0" y="88.0" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">and its modular cousin, the NTT</text><text x="767.0" y="104.5" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">Era 6, topic 1</text><rect x="387" y="200" width="220" height="104" style="fill:#0d1117;stroke:#f0584d;stroke-width:3"/><text x="399.0" y="232.7" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Kyber, then ML-KEM</text><text x="399.0" y="249.9" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">⊕ module LWE over polynomials,</text><text x="399.0" y="266.4" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">NTT arithmetic, compression</text><text x="399.0" y="282.9" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">submitted 2017; FIPS 203, 2024</text><rect x="140" y="380" width="220" height="104" style="fill:#0d1117;stroke:#5b8fe0;stroke-width:3"/><text x="152.0" y="412.7" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Signal&#x27;s PQXDH</text><text x="152.0" y="429.9" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">a Kyber-based protocol for</text><text x="152.0" y="446.4" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">messages</text><text x="152.0" y="462.9" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">2023</text><rect x="635" y="380" width="220" height="104" style="fill:#0d1117;stroke:#5b8fe0;stroke-width:3"/><text x="647.0" y="420.9" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Hybrid key exchange</text><text x="647.0" y="438.2" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">classical and post-quantum</text><text x="647.0" y="454.7" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">together</text></svg>
