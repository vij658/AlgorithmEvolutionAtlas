<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" role="img" aria-label="How diffusion models combined older ideas, and where they led" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>How diffusion models combined older ideas, and where they led</title><line x1="130.0" y1="124.0" x2="298.0" y2="200.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="298.0,200.0 289.0,200.0 292.0,193.3" style="fill:#b9b8b2"/><line x1="375.0" y1="124.0" x2="375.0" y2="200.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="375.0,200.0 371.3,191.8 378.7,191.8" style="fill:#b9b8b2"/><line x1="485.0" y1="252.0" x2="630.0" y2="252.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="630.0,252.0 621.8,255.7 621.8,248.3" style="fill:#b9b8b2"/><line x1="620.0" y1="124.0" x2="696.0" y2="200.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="696.0,200.0 687.6,196.8 692.8,191.6" style="fill:#b9b8b2"/><line x1="865.0" y1="124.0" x2="806.0" y2="200.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="806.0,200.0 808.1,191.3 813.9,195.8" style="fill:#b9b8b2"/><line x1="740.0" y1="304.0" x2="740.0" y2="380.0" style="stroke:#b9b8b2;stroke-width:1.5"/><polygon points="740.0,380.0 736.3,371.8 743.7,371.8" style="fill:#b9b8b2"/><rect x="20" y="20" width="220" height="104" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="32.0" y="42.8" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Nonequilibrium</text><text x="32.0" y="62.5" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">thermodynamics</text><text x="32.0" y="79.8" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">a process that slowly destroys</text><text x="32.0" y="96.3" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">structure</text><text x="32.0" y="112.8" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">physics</text><rect x="265" y="20" width="220" height="104" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="277.0" y="52.7" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Markov chains</text><text x="277.0" y="69.9" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">each step depends only on the</text><text x="277.0" y="86.4" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">last</text><text x="277.0" y="102.9" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">Era 4, topic 3</text><rect x="510" y="20" width="220" height="104" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="522.0" y="69.2" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Denoising score matching</text><text x="522.0" y="86.4" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">learn to undo small noise</text><rect x="755" y="20" width="220" height="104" style="fill:#0d1117;stroke:#ecebe6;stroke-width:1.5"/><text x="767.0" y="52.7" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Deep networks</text><text x="767.0" y="69.9" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">trained by gradient descent</text><text x="767.0" y="86.4" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">with Adam</text><text x="767.0" y="102.9" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">topics 2, 5, 7</text><rect x="265" y="200" width="220" height="104" style="fill:#0d1117;stroke:#f0584d;stroke-width:3"/><text x="277.0" y="224.4" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Diffusion models</text><text x="277.0" y="241.7" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">⊕ learn to reverse a fixed</text><text x="277.0" y="258.1" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">noising chain</text><text x="277.0" y="274.6" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">Sohl-Dickstein and colleagues,</text><text x="277.0" y="291.1" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">2015</text><rect x="630" y="200" width="220" height="104" style="fill:#0d1117;stroke:#f0584d;stroke-width:3"/><text x="642.0" y="232.7" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">DDPM</text><text x="642.0" y="249.9" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">⊕ predict the added noise;</text><text x="642.0" y="266.4" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">1,000 steps</text><text x="642.0" y="282.9" text-anchor="start" style="fill:#b9b8b2;font-size:12.5px;font-weight:400">Ho, Jain and Abbeel, Berkeley, 2020</text><rect x="630" y="380" width="220" height="104" style="fill:#0d1117;stroke:#5b8fe0;stroke-width:3"/><text x="642.0" y="411.0" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">Image and video</text><text x="642.0" y="430.8" text-anchor="start" style="fill:#ecebe6;font-size:15px;font-weight:700">generators</text><text x="642.0" y="448.1" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">the same idea at far larger</text><text x="642.0" y="464.6" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">scale</text></svg>
