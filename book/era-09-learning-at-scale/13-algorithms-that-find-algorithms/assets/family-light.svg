<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" role="img" aria-label="How algorithm discovery combined older ideas, and where it led" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>How algorithm discovery combined older ideas, and where it led</title><line x1="130.0" y1="136.0" x2="184.0" y2="200.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="184.0,200.0 175.9,196.1 181.5,191.4" style="fill:#55545a"/><line x1="375.0" y1="136.0" x2="316.0" y2="200.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="316.0,200.0 318.9,191.5 324.3,196.4" style="fill:#55545a"/><line x1="620.0" y1="136.0" x2="360.0" y2="258.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="360.0,258.0 365.9,251.2 369.0,257.8" style="fill:#55545a"/><line x1="250.0" y1="316.0" x2="387.0" y2="438.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="387.0,438.0 378.4,435.3 383.3,429.8" style="fill:#55545a"/><line x1="375.0" y1="136.0" x2="497.0" y2="380.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="497.0,380.0 490.0,374.3 496.6,371.0" style="fill:#55545a"/><line x1="865.0" y1="136.0" x2="745.0" y2="200.0" style="stroke:#55545a;stroke-width:1.5"/><polygon points="745.0,200.0 750.5,192.9 754.0,199.4" style="fill:#55545a"/><rect x="20" y="20" width="220" height="116" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="32.0" y="58.7" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Strassen&#x27;s algorithm</text><text x="32.0" y="75.9" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">2 × 2 matrices with 7</text><text x="32.0" y="92.4" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">multiplications</text><text x="32.0" y="108.9" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">Era 6, topic 5</text><rect x="265" y="20" width="220" height="116" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="277.0" y="66.9" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Tensor rank</text><text x="277.0" y="84.2" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">an algorithm is a sum of</text><text x="277.0" y="100.7" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">rank-one pieces</text><rect x="510" y="20" width="220" height="116" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="522.0" y="58.7" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">AlphaZero&#x27;s search</text><text x="522.0" y="75.9" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">tree search guided by</text><text x="522.0" y="92.4" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">networks</text><text x="522.0" y="108.9" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">topic 8</text><rect x="755" y="20" width="220" height="116" style="fill:#ffffff;stroke:#17171a;stroke-width:1.5"/><text x="767.0" y="66.9" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Language models</text><text x="767.0" y="84.2" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">programs written by a model</text><text x="767.0" y="100.7" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">topic 9 and after</text><rect x="140" y="200" width="220" height="116" style="fill:#ffffff;stroke:#d5352a;stroke-width:3"/><text x="152.0" y="238.7" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">AlphaTensor</text><text x="152.0" y="255.9" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">⊕ a game played on the tensor;</text><text x="152.0" y="272.4" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">47 for 4 × 4 mod 2</text><text x="152.0" y="288.9" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">DeepMind, October 2022</text><rect x="387" y="380" width="220" height="116" style="fill:#ffffff;stroke:#d5352a;stroke-width:3"/><text x="399.0" y="410.4" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">Flip graphs</text><text x="399.0" y="427.7" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">⊕ random walks that keep the</text><text x="399.0" y="444.2" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">sum; 47 again, 95 for 5 × 5</text><text x="399.0" y="460.7" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">Kauers and Moosbauer, Linz,</text><text x="399.0" y="477.2" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">December 2022</text><rect x="635" y="200" width="220" height="116" style="fill:#ffffff;stroke:#d5352a;stroke-width:3"/><text x="647.0" y="230.4" text-anchor="start" style="fill:#17171a;font-size:15px;font-weight:700">AlphaEvolve</text><text x="647.0" y="247.7" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">⊕ evolving programs, checked</text><text x="647.0" y="264.1" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">automatically; 48 for 4 × 4</text><text x="647.0" y="280.6" text-anchor="start" style="fill:#17171a;font-size:12.5px;font-weight:600">complex</text><text x="647.0" y="297.1" text-anchor="start" style="fill:#55545a;font-size:12.5px;font-weight:400">Google DeepMind, May 2025</text></svg>
