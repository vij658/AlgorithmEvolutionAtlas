<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-label="A seven-multiplication 2 × 2 algorithm" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>A seven-multiplication 2 × 2 algorithm</title><text x="20.0" y="26.0" text-anchor="start" style="fill:#17171a;font-size:13px;font-weight:700">Seven multiplications for 2 × 2 matrices (modulo 2), found by random flips from the schoolbook 8</text><text x="30.0" y="56.0" text-anchor="start" style="fill:#17171a;font-size:13px;font-weight:400">M1 = (A21)(B11 + B12 + B21 + B22) -&gt; C22</text><text x="30.0" y="86.0" text-anchor="start" style="fill:#17171a;font-size:13px;font-weight:400">M2 = (A11 + A12 + A21 + A22)(B11) -&gt; C11</text><text x="30.0" y="116.0" text-anchor="start" style="fill:#17171a;font-size:13px;font-weight:400">M3 = (A12 + A21 + A22)(B11 + B21 + B22) -&gt; C11 + C21 + C22</text><text x="30.0" y="146.0" text-anchor="start" style="fill:#17171a;font-size:13px;font-weight:400">M4 = (A12 + A22)(B11 + B21) -&gt; C21 + C22</text><text x="30.0" y="176.0" text-anchor="start" style="fill:#17171a;font-size:13px;font-weight:400">M5 = (A21 + A22)(B21 + B22) -&gt; C11 + C21</text><text x="30.0" y="206.0" text-anchor="start" style="fill:#17171a;font-size:13px;font-weight:400">M6 = (A12)(B22) -&gt; C11 + C21 + C12 + C22</text><text x="30.0" y="236.0" text-anchor="start" style="fill:#17171a;font-size:13px;font-weight:400">M7 = (A11)(B12) -&gt; C12</text><text x="20.0" y="288.0" text-anchor="start" style="fill:#7d7c84;font-size:12px;font-weight:400">Each line: one multiplication, and the entries of C it is added to.</text></svg>
