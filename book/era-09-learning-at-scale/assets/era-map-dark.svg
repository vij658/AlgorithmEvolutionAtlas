<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1020" width="1000" height="1020" role="img" aria-label="How the ideas of Era 9 combined: Learning at Scale" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>How the ideas of Era 9 combined: Learning at Scale</title><line x1="135.0" y1="96.0" x2="135.0" y2="200.0" style="stroke:#b9b8b2;stroke-width:1.5;stroke-dasharray:5 4"/><polygon points="135.0,200.0 131.3,191.8 138.7,191.8" style="fill:#b9b8b2"/><rect x="138.0" y="135.0" width="135.4" height="19" rx="3" style="fill:#0d1117"/><text x="143.0" y="148.0" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">noisy linear algebra</text><line x1="500.0" y1="96.0" x2="500.0" y2="200.0" style="stroke:#b9b8b2;stroke-width:1.5;stroke-dasharray:5 4"/><polygon points="500.0,200.0 496.3,191.8 503.7,191.8" style="fill:#b9b8b2"/><rect x="503.0" y="135.0" width="116.9" height="19" rx="3" style="fill:#0d1117"/><text x="508.0" y="148.0" text-anchor="start" style="fill:#ecebe6;font-size:12.5px;font-weight:600">deeper networks</text><line x1="865.0" y1="96.0" x2="865.0" y2="200.0" style="stroke:#b9b8b2;stroke-width:1.5;stroke-dasharray:5 4"/><polygon points="865.0,200.0 861.3,191.8 868.7,191.8" style="fill:#b9b8b2"/><rect x="704.5" y="135.0" width="157.5" height="19" rx="3" style="fill:#0d1117"/><text x="857.0" y="148.0" text-anchor="end" style="fill:#ecebe6;font-size:12.5px;font-weight:600">tokens become vectors</text><line x1="865.0" y1="276.0" x2="865.0" y2="380.0" style="stroke:#b9b8b2;stroke-width:1.5;stroke-dasharray:5 4"/><polygon points="865.0,380.0 861.3,371.8 868.7,371.8" style="fill:#b9b8b2"/><rect x="722.9" y="315.0" width="139.1" height="19" rx="3" style="fill:#0d1117"/><text x="857.0" y="328.0" text-anchor="end" style="fill:#ecebe6;font-size:12.5px;font-weight:600">each token a vector</text><line x1="605.0" y1="238.0" x2="791.5" y2="380.0" style="stroke:#b9b8b2;stroke-width:1.5;stroke-dasharray:5 4"/><polyg