# Synology: Container Manager -> Project -> Create, point it at this folder.
services:
  wallboard:
    build: .
    image: wallboard:latest
    container_name: wallboard
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - TZ=America/New_York          # your time zone (affects server logs only; screens use their own)
      - CRAWL_INTERVAL_MINUTES=60
    volumes:
      - /volume1/docker/wallboard:/data
    # If the container cannot write to /data, uncomment and use the IDs of your DSM
    # user (run `id` over SSH), e.g. 1026:100.
    # user: "1026:100"
